     y son 20px que hacen la diferencia entre entrar y no entrar. */
  .inv-nota{display:none}

  /* En 320x568, con los tres ítems ya elegidos, el inventario sube a 120px y
     no hay forma de que entre todo sin volverlo ilegible. Así que scrollea
     **la lista**, que es lo único que crece, y el título, los cupos y los dos
     botones quedan siempre a la vista, que es lo que hacía falta.
     El :has() lo limita a las pantallas que tienen lista; donde no esté
     soportado, la tarjeta se comporta como hasta ahora. */
  .card:has(.shop){display:flex;flex-direction:column}
  .card:has(.shop) .shop{flex:1 1 auto;min-height:0;overflow-y:auto}
  .logo-main{max-height:clamp(84px,20vh,140px)}
  .menu-op{padding:6px 10px}
  .mo-txt b{font-size:11.5px}
}

/* ================= LOS DESENLACES DEL QUE NO ENTRÓ =================
   Reemplazan los emoji de los carteles de tiro errado. Diez dibujos, uno por
   desenlace, repartidos por **frase** y no por carta —el reparto vive en
   `FALLOS`—, así el guante no puede volver a salir con AL TRAVESAÑO.

   Tres reglas los sostienen:

   1. **Se miden en `em`.** El SVG no trae tamaño propio: hereda el
      `font-size` que `.fi` ya tiene en cada breakpoint —42px en mobile, 58 en
      desktop—, así que el responsive que ya andaba sigue mandando y no hubo
      que tocar ninguna regla de tamaño.
   2. **Se dibujan con `currentColor`.** El cartel les presta su color: rojo
      cuando el que erró fuiste vos, verde cuando erró el rival. Un solo dibujo
      para los dos casos.
   3. **Corren una sola vez y quedan congelados en el impacto.** El cartel se
      va solo a los 2,5s; una animación en loop lo convertiría en un gif
      colgado. Con `forwards` el último fotograma es la foto del desenlace. */

.gf.fallo .fi .fx{display:block;width:1em;height:1em;margin:0 auto;overflow:visible}
.fx .fl{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.fx .fn{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
/* La pelota maciza y el decorado en línea: el ojo sigue a la pelota. */
.fx .pe{fill:currentColor;stroke:none}
.fx .ten{opacity:.42}
.fx .red{opacity:.28}
/* Tres vueltas y recién ahí se congela: una sola pasaba demasiado rápido
   para leerla. 1,15s x 3 = 3,45s, que es lo que dura el cartel. */
.fx > *{animation-duration:1.15s;animation-fill-mode:forwards;animation-iteration-count:3}

/* 1 · ATAJADA — la pelota entra y se clava en la palma. */
@keyframes fx-ataja-pel{
  0%  {transform:translate(17px,-15px);opacity:0}
  12% {opacity:1}
  55% {transform:translate(0,0)}
  68% {transform:translate(1.6px,1px)}
  100%{transform:translate(1.6px,1px)}
}
@keyframes fx-ataja-gu{
  0%,54%{transform:translate(0,0)}
  60%   {transform:translate(-2.6px,1.6px)}
  76%   {transform:translate(0,0)}
  100%  {transform:translate(0,0)}
}
@keyframes fx-chispa{
  0%,53%{opacity:0;transform:scale(.4)}
  60%   {opacity:1;transform:scale(1)}
  88%   {opacity:0;transform:scale(1.35)}
  100%  {opacity:0;transform:scale(1.35)}
}
.fx-atajada .pe{animation-name:fx-ataja-pel;animation-timing-function:cubic-bezier(.3,.7,.4,1)}
.fx-atajada .gu{animation-name:fx-ataja-gu;animation-timing-function:ease-out}
.fx-atajada .ch{animation-name:fx-chispa;animation-timing-function:ease-out;transform-origin:39px 8px}

/* 2 · DESCUELGUE — el centro baja y las dos manos se cierran. */
@keyframes fx-desc-pel{
  0%  {transform:translate(0,-26px);opacity:0}
  12% {opacity:1}
  58% {transform:translate(0,0)}
  100%{transform:translate(0,0)}
}
@keyframes fx-desc-i{0%,52%{transform:translate(-7px,0)}72%{transform:translate(0,0)}100%{transform:translate(0,0)}}
@keyframes fx-desc-d{0%,52%{transform:translate(7px,0)}72%{transform:translate(0,0)}100%{transform:translate(0,0)}}
.fx-descuelgue .pe{animation-name:fx-desc-pel;animation-timing-function:cubic-bezier(.35,.6,.4,1)}
.fx-descuelgue .gi{animation-name:fx-desc-i;animation-timing-function:cubic-bezier(.4,1.6,.5,1)}
.fx-descuelgue .gd{animation-name:fx-desc-d;animation-timing-function:cubic-bezier(.4,1.6,.5,1)}

/* 3 · AL PALO — vibra el palo y la pelota sale escupida. */
@keyframes fx-palo-pel{
  0%  {transform:translate(24px,6px);opacity:0}
  12% {opacity:1}
  48% {transform:translate(0,0)}
  56% {transform:translate(2px,0)}
  100%{transform:translate(20px,-12px)}
}
@keyframes fx-palo-vibra{
  0%,46%{transform:scaleX(1)}
  53%   {transform:scaleX(1.6)}
  70%   {transform:scaleX(1)}
  100%  {transform:scaleX(1)}
}
.fx-palo .pe{animation-name:fx-palo-pel;animation-timing-function:cubic-bezier(.25,.6,.4,1)}
.fx-palo .po{animation-name:fx-palo-vibra;animation-timing-function:ease-out;transform-origin:17px 24px}

/* 4 · AL TRAVESAÑO — sube, golpea y cae del lado de afuera. */
@keyframes fx-trav-pel{
  0%  {transform:translate(0,20px);opacity:0}
  12% {opacity:1}
  46% {transform:translate(0,0)}
  54% {transform:translate(0,1.6px)}
  100%{transform:translate(9px,19px)}
}
@keyframes fx-trav-vibra{
  0%,44%{transform:scaleY(1)}
  52%   {transform:scaleY(2)}
  70%   {transform:scaleY(1)}
  100%  {transform:scaleY(1)}
}
.fx-travesano .pe{animation-name:fx-trav-pel;animation-timing-function:cubic-bezier(.25,.55,.4,1)}
.fx-travesano .br{animation-name:fx-trav-vibra;animation-timing-function:ease-out;transform-origin:24px 15px}

/* 5 · AFUERA — la parábola por encima del arco. Es el desenlace de seis frases.
   Ojo con el sentido: acá la pelota **arranca corrida y termina en su
   coordenada del SVG**, al revés que las otras. Es que su posición de reposo
   tiene que ser la de afuera del arco: antes descansaba adentro, y aunque la
   animación se veía bien, el fotograma quieto decía «gol». Lo mismo se hizo
   con DESPEJE y LLEGA TARDE, para que los tres botines no queden idénticos
   cuando están detenidos. */
@keyframes fx-afuera{
  0%  {transform:translate(-27px,23px);opacity:0}
  10% {opacity:1}
  35% {transform:translate(-19px,2px)}
  65% {transform:translate(-11px,-7px)}
  100%{transform:translate(0,0)}
}
.fx-afuera .pe{animation-name:fx-afuera;animation-timing-function:cubic-bezier(.3,.5,.5,1)}

/* 6 · EN LA BARRERA — los tres saltan juntos y la pelota vuelve. */
@keyframes fx-barr-pel{
  0%  {transform:translate(23px,-9px);opacity:0}
  12% {opacity:1}
  46% {transform:translate(0,0)}
  54% {transform:translate(1px,0)}
  100%{transform:translate(17px,8px)}
}
@keyframes fx-barr-tiembla{
  0%,44%{transform:translate(0,0)}
  52%   {transform:translate(-1.8px,0)}
  62%   {transform:translate(1.1px,0)}
  76%   {transform:translate(0,0)}
  100%  {transform:translate(0,0)}
}
.fx-barrera .pe{animation-name:fx-barr-pel;animation-timing-function:cubic-bezier(.25,.6,.4,1)}
.fx-barrera .mu{animation-name:fx-barr-tiembla;animation-timing-function:ease-out}

/* 7 · DESPEJE — la pierna cruza y la manda lejos. */
@keyframes fx-desp-bota{
  0%,26%{transform:rotate(-38deg)}
  46%   {transform:rotate(16deg)}
  100%  {transform:rotate(-14deg)}
}
@keyframes fx-desp-pel{
  0%,38%{transform:translate(-16px,22px)}
  100%  {transform:translate(0,0)}
}
.fx-despeje .bo{animation-name:fx-desp-bota;animation-timing-function:cubic-bezier(.4,.1,.3,1);transform-origin:13px 33px}
.fx-despeje .pe{animation-name:fx-desp-pel;animation-timing-function:cubic-bezier(.15,.7,.4,1)}

/* 8 · LLEGA TARDE — la pelota cruza y la pierna entra atrás, sin tocarla. */
@keyframes fx-tarde-pel{
  0%  {transform:translate(-38px,0);opacity:0}
  14% {opacity:1}
  100%{transform:translate(0,0)}
}
@keyframes fx-tarde-bota{
  0%,42%{transform:translate(-14px,0) rotate(-14deg);opacity:0}
  56%   {opacity:1}
  100%  {transform:translate(0,0) rotate(10deg);opacity:1}
}
.fx-tarde .pe{animation-name:fx-tarde-pel;animation-timing-function:cubic-bezier(.2,.6,.5,1)}
.fx-tarde .bo{animation-name:fx-tarde-bota;animation-timing-function:cubic-bezier(.3,.5,.4,1);transform-origin:16px 34px}

/* 9 · LE PEGA MAL — se deforma en el impacto y sale bailando. */
@keyframes fx-mal-bota{
  0%,22%{transform:rotate(-30deg)}
  40%   {transform:rotate(12deg)}
  100%  {transform:rotate(-8deg)}
}
@keyframes fx-mal-pel{
  0%,32%{transform:translate(0,0) scale(1)}
  38%   {transform:translate(2px,0) scale(1.2,.8)}
  52%   {transform:translate(8px,-3px) scale(1)}
  66%   {transform:translate(13px,2px)}
  82%   {transform:translate(17px,-2px)}
  100%  {transform:translate(21px,3px)}
}
.fx-pegamal .bo{animation-name:fx-mal-bota;animation-timing-function:cubic-bezier(.4,.1,.3,1);transform-origin:12px 33px}
.fx-pegamal .pe{animation-name:fx-mal-pel;animation-timing-function:linear}

/* 10 · CABEZAZO AFUERA — cabecea y se le va por arriba del travesaño. */
@keyframes fx-cab-pel{
  0%  {transform:translate(11px,12px);opacity:0}
  12% {opacity:1}
  46% {transform:translate(0,0)}
  100%{transform:translate(14px,-17px)}
}
@keyframes fx-cab-nuca{
  0%,42%{transform:rotate(0)}
  56%   {transform:rotate(-11deg)}
  100%  {transform:rotate(-3deg)}
}
.fx-cabezazo .pe{animation-name:fx-cab-pel;animation-timing-function:cubic-bezier(.3,.6,.4,1)}
.fx-cabezazo .cb{animation-name:fx-cab-nuca;animation-timing-function:ease-out;transform-origin:16px 40px}

/* Sin animación, el dibujo queda en el fotograma del contacto: las
   coordenadas del SVG ya están puestas ahí, así que no hace falta nada más
   que apagarlas. */
@media (prefers-reduced-motion:reduce){
  .fx > *{animation:none !important}
}

/* ---- Y LA ÚNICA EXCEPCIÓN DE COLOR QUE QUEDABA ----
   La regla del juego es que el color se lee **desde tu lado**: verde lo que te
   conviene, rojo lo que no. La cumplían los cinco carteles de desenlace menos
   uno: gastar la racha llena y errar la situación de gol salía en gris, como
   si no hubiera pasado nada. Es el peor resultado posible de esa decisión
   —te comiste la racha entera y una jugada— así que va en rojo con el resto. */
.sit.resuelta.salvado.lado-favor{
  border-color:var(--red);box-shadow:0 0 60px rgba(255,59,82,.3);
}
.sit.resuelta.salvado.lado-favor .t{color:var(--red)}

/* ================= LOS DESENLACES, EN TODOS LOS CARTELES =================
   Los mismos diez dibujos del tiro errado pasan a los otros seis carteles que
   cierran una jugada: el mini juego, la situación de gol, el penal pateado, el
   penal de la ronda, el resumen de la tanda y el sorteo de la moneda. Con seis
   dibujos más —gol, gambeta, quite, copa y las dos caras de la moneda— quedan
   dieciséis para todo el juego, y ningún cartel de desenlace usa ya un emoji.

   GAMBETA y QUITE cubren los ocho finales del mini juego entre los dos, porque
   son **los dos finales posibles de cualquier uno contra uno**: la pelota pasa
   o se queda. Cuál te conviene depende de quién la tenía —la regla `adivinar`
   del juego— y eso ya lo dice el color del cartel. */

.sit .sit-ico .fx{display:block;width:1em;height:1em;margin:0 auto;overflow:visible}
.fx .rd{opacity:.5}
.fx .fg{opacity:.5}

/* 11 · GOL — entra y la red se infla. */
@keyframes fx-gol-pel{
  0%  {transform:translate(19px,11px);opacity:0}
  12% {opacity:1}
  52% {transform:translate(0,0)}
  62% {transform:translate(-1px,1.5px)}
  100%{transform:translate(0,0)}
}
@keyframes fx-gol-red{
  0%,50%{transform:scaleY(1);opacity:.5}
  60%   {transform:scaleY(2.2);opacity:1}
  82%   {transform:scaleY(1.2);opacity:.7}
  100%  {transform:scaleY(1);opacity:.5}
}
.fx-golazo .pe{animation-name:fx-gol-pel;animation-timing-function:cubic-bezier(.25,.6,.4,1)}
.fx-golazo .rd{animation-name:fx-gol-red;animation-timing-function:ease-out;transform-origin:24px 40px}

/* 12 · GAMBETA — la pelota lo pasa por afuera y él se va para el otro lado. */
@keyframes fx-gam-pel{
  0%  {transform:translate(-33px,21px);opacity:0}
  12% {opacity:1}
  40% {transform:translate(-23px,15px)}
  64% {transform:translate(-11px,17px)}
  84% {transform:translate(-3px,8px)}
  100%{transform:translate(0,0)}
}
@keyframes fx-gam-fig{
  0%,36%{transform:rotate(0)}
  62%   {transform:rotate(-9deg)}
  100%  {transform:rotate(-5deg)}
}
.fx-gambeta .pe{animation-name:fx-gam-pel;animation-timing-function:cubic-bezier(.3,.5,.4,1)}
.fx-gambeta .fg{animation-name:fx-gam-fig;animation-timing-function:ease-out;transform-origin:19px 41px}

/* 13 · QUITE — entra el botín, se la lleva y el otro queda vendido. */
@keyframes fx-qui-pel{
  0%,30%{transform:translate(20px,-4px)}
  100%  {transform:translate(0,0)}
}
@keyframes fx-qui-bota{
  0%,18%{transform:translate(-13px,0) rotate(-26deg)}
  48%   {transform:translate(2px,0) rotate(10deg)}
  100%  {transform:translate(0,0) rotate(-6deg)}
}
@keyframes fx-qui-fig{
  0%,42%{transform:rotate(0)}
  64%   {transform:rotate(10deg)}
  100%  {transform:rotate(6deg)}
}
.fx-quite .pe {animation-name:fx-qui-pel;animation-timing-function:cubic-bezier(.2,.7,.4,1)}
.fx-quite .bo {animation-name:fx-qui-bota;animation-timing-function:cubic-bezier(.4,.1,.3,1);transform-origin:12px 33px}
.fx-quite .fg {animation-name:fx-qui-fig;animation-timing-function:ease-out;transform-origin:33px 41px}

/* 14 · LA COPA — entra de golpe y le salta el destello. */
@keyframes fx-copa{
  0%  {transform:scale(.55) rotate(-9deg);opacity:0}
  34% {transform:scale(1.09) rotate(3deg);opacity:1}
  56% {transform:scale(.97) rotate(0)}
  100%{transform:scale(1) rotate(0);opacity:1}
}
@keyframes fx-brillo{
  0%,32%{opacity:0;transform:scale(.5)}
  52%   {opacity:1;transform:scale(1)}
  88%   {opacity:0;transform:scale(1.3)}
  100%  {opacity:0;transform:scale(1.3)}
}
.fx-copa .cp {animation-name:fx-copa;animation-timing-function:cubic-bezier(.3,1.5,.5,1);transform-origin:24px 41px}
.fx-copa .br2{animation-name:fx-brillo;animation-timing-function:ease-out;transform-origin:24px 8px}

/* 15 y 16 · LA MONEDA — gira de canto hasta frenar. Llena es CARA, anillo es
   SECA: los mismos dos discos que ya usaba el sorteo. */
@keyframes fx-moneda{
  0%  {transform:scaleX(1) translateY(-10px);opacity:0}
  10% {opacity:1}
  24% {transform:scaleX(.08) translateY(-6px)}
  38% {transform:scaleX(1) translateY(-2px)}
  50% {transform:scaleX(.08) translateY(-4px)}
  62% {transform:scaleX(1) translateY(0)}
  74% {transform:scaleX(.3) translateY(-1px)}
  86% {transform:scaleX(1) translateY(0)}
  100%{transform:scaleX(1) translateY(0)}
}
.fx-cara .mo,.fx-seca .mo{
  animation-name:fx-moneda;animation-timing-function:linear;transform-origin:24px 24px;
}

/* ================= EL DIBUJO MÁS GRANDE Y LA CONSECUENCIA MÁS FUERTE =======
   El dibujo se veía chico: era el tamaño heredado del emoji, que a 42px ya
   decía todo con la cara. Una escena con pelota, arco y guante necesita más
   lugar para leerse. Sube en los dos carteles, y como se mide en `em` alcanza
   con mover el `font-size` del contenedor.

   Y lo que costó la jugada —el aguante que perdés, la racha que ganás— sale
   del renglón gris y pasa a su propia chapa: es el dato por el que mirás el
   cartel, y estaba escrito más chico que todo lo demás. */
.gf.fallo .fi{font-size:58px;margin-bottom:6px}
.sit.resuelta .sit-ico{font-size:clamp(66px,15vw,88px);margin:6px 0 2px}

.ef-fin{
  display:inline-flex;align-items:center;gap:7px;
  font-family:var(--tit);font-weight:800;
  font-size:17px;letter-spacing:2.2px;text-indent:2.2px;text-transform:uppercase;
  color:var(--white);
  margin-top:11px;padding:6px 15px;border-radius:6px;
  border:1px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.06);
}
.ef-fin .ih,.ef-fin .ir{width:1.2em;height:1.2em;vertical-align:-.26em}
/* El mismo tratamiento para el «+1 racha» de la situación de gol, que hasta
   ahora era una línea dorada chiquita colgada del marcador. */
.sit .sit-extra{
  display:flex;align-items:center;justify-content:center;gap:7px;
  width:fit-content;margin:13px auto 0;
  font-family:var(--tit);font-weight:800;
  font-size:16px;letter-spacing:2px;text-indent:2px;
  color:var(--white);
  padding:5px 14px;border-radius:6px;
  border:1px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.06);
}

/* ---- Y EL DIBUJO TOMA EL COLOR DEL DESENLACE ----
   En el cartel de fallo salía solo, porque ahí el color vive en el contenedor.
   En estos otros el color está puesto en el título, así que el dibujo quedaba
   blanco al lado de un «¡TE SALVASTE!» verde. Se pone el color en la caja: no
   pisa nada, porque el rótulo, el marcador y la chapa ya tienen el suyo, y el
   único que lo hereda es el dibujo. */
.sit.resuelta.salvado,
.sit.mam.resuelta.salvado,
.sit.penal.resuelta.salvado{color:var(--green)}
.sit.resuelta.gol,
.sit.mam.resuelta.gol,
.sit.penal.resuelta.gol{color:var(--red)}
/* Del lado tuyo la lectura se da vuelta: tu gol es lo bueno y errarla, lo malo. */
.sit.resuelta.gol.lado-favor{color:var(--green)}
.sit.resuelta.salvado.lado-favor{color:var(--red)}

@media (min-width:1025px), (min-width:821px) and (orientation:landscape){
  .gf.fallo .fi{font-size:80px;margin-bottom:10px}
  .ef-fin{font-size:21px;padding:7px 18px;margin-top:14px}
  .sit .sit-extra{font-size:20px;padding:6px 17px;margin-top:14px}
}
@media (max-width:440px){
  .gf.fallo .fi{font-size:50px}
  .ef-fin{font-size:15px;padding:5px 12px;letter-spacing:1.6px}
  .sit .sit-extra{font-size:14.5px;padding:4px 11px}
}

/* ============ EL PIE DE LA CARTA, MÁS GRANDE EN DESKTOP ============
   Lo que dice qué te deja la carta —el efecto sobre los medidores, la chapa
   del MINI JUEGO y el porcentaje de gol— se leía chico justo donde más lugar
   hay. La razón: `.c-out` sí subía por tramo de ancho (11,5 → 12,5 → 13,5 →
   14,5) pero **`.efe` y la chapa se declaraban una sola vez** en el bloque
   base de desktop, así que en una pantalla de 1900px el renglón del efecto
   seguía en 11,5px mientras el de arriba estaba en 14,5. El pie terminaba
   siendo lo más chico de la carta, cuando es el dato con el que decidís.

   Ahora los tres suben juntos y por tramo. El techo se lo pone el nombre de
   la carta: el resultado queda **justo debajo** de él y el efecto debajo del
   resultado, que es el orden en que se lee una carta —qué es, qué puede pasar,
   qué te deja—. Emparejarlo con el título los volvía dos renglones del mismo
   peso, con la misma tipografía. Mobile no se toca. */
@media (min-width:1025px), (min-width:821px) and (orientation:landscape){
  .cell .c-out{font-size:14.4px}          /* el nombre va en 15 */
  .cell .c-out .efe{font-size:13.2px;margin-top:5px;padding-top:5px}
  .cell .c-out .mj-lb{font-size:10.8px;letter-spacing:2.2px;padding:3px 9px;margin-bottom:5px}
  .cell .c-out .mj-ico{font-size:12px}
}
/* La franja media, donde la mesa tiene menos ancho. */
@media (max-width:1300px) and (min-width:1025px){
  .cell .c-out{font-size:12.9px}          /* el nombre va en 13,6 */
  .cell .c-out .efe{font-size:11.9px;margin-top:4px;padding-top:4px}
  .cell .c-out .mj-lb{font-size:10px;letter-spacing:1.9px;padding:2px 8px}
  .cell .c-out .mj-ico{font-size:11px}
}
@media (min-width:1600px){
  .cell .c-out{font-size:15.6px}          /* el nombre va en 16,5 */
  .cell .c-out .efe{font-size:14.3px}
  .cell .c-out .mj-lb{font-size:11.6px;padding:3px 10px}
  .cell .c-out .mj-ico{font-size:13px}
}
@media (min-width:1900px){
  .cell .c-out{font-size:16.8px}          /* el nombre va en 18 */
  .cell .c-out .efe{font-size:15.4px}
  .cell .c-out .mj-lb{font-size:12.4px}
  .cell .c-out .mj-ico{font-size:14px}
}

/* ============ LOS DOS AVISOS DE RACHA, CON LA FOTO ARRIBA ============
   RACHA LLENA y TIEMPO DE DESCUENTO son el mismo momento contado dos veces
   —se te llenaron los cuatro rayos— y hasta ahora se anunciaban con un emoji
   de 50px sobre azul liso. Ninguno de los dos mostraba la racha que acabás de
   llenar, ni la ilustración que el juego ya tenía guardada para eso: la carta
   RACHA FULL, que vive en el mazo y no aparecía en ningún otro lado.

   Los dos pasan al molde del pop-up del mini juego: **la foto a sangre como
   cabecera, con el título encima del degradado**. No estrena un lenguaje
   nuevo — es el mismo que el jugador ya vio cuando le tocó un empate.

   La foto se sale del cartel usando `--apx`, que es el mismo padding que el
   aviso entra por los costados, así que no hay números que mantener a mano
   cuando el padding cambia de breakpoint.

   El alto va contra `vh` a propósito: en una notebook de 700px el cartel del
   descuento ya venía largo —trae marcador y dos opciones— y con una foto fija
   se pasaba de largo. Con `clamp(96px, 16vh, 170px)` la foto cede primero. */
.aviso.con-foto{padding-top:0}
.aviso .a-foto{
  position:relative;overflow:hidden;
  margin:0 calc(var(--apx) * -1) 12px;
}
.aviso .a-foto img{
  display:block;width:100%;height:auto;
  max-height:clamp(96px, 16vh, 170px);object-fit:cover;
}
.aviso .a-foto::after{
  content:'';position:absolute;inset:auto 0 0;height:74%;
  background:linear-gradient(180deg,transparent,rgba(0,8,31,.5) 38%,rgba(0,8,31,.97));
}
.aviso .a-foto .a-t{
  position:absolute;left:10px;right:10px;bottom:5px;z-index:2;
  margin:0;text-shadow:0 3px 18px rgba(0,0,0,.85);
}

/* Los cuatro rayos, encendidos y latiendo escalonado. */
.aviso .a-rayos{
  display:flex;justify-content:center;align-items:flex-end;gap:9px;margin-top:2px;
}
.aviso .a-rayos img,.aviso .a-rayos .ir{
  width:30px;height:38px;object-fit:contain;
  filter:drop-shadow(0 0 9px rgba(245,200,66,.6));
  animation:avisoRayo 1.5s ease-in-out infinite;
}
@keyframes avisoRayo{
  0%,100%{opacity:1;transform:translateY(0)}
  50%    {opacity:.6;transform:translateY(-3px)}
}
@media (prefers-reduced-motion:reduce){
  .aviso .a-rayos img,.aviso .a-rayos .ir{animation:none}
}

@media (min-width:1025px), (min-width:821px) and (orientation:landscape){
  .aviso .a-foto{margin-bottom:14px}
  .aviso .a-foto .a-t{bottom:7px;left:14px;right:14px}
  .aviso .a-rayos{gap:11px}
  .aviso .a-rayos img,.aviso .a-rayos .ir{width:38px;height:48px}
}
@media (max-width:440px){
  .aviso .a-rayos{gap:7px}
  .aviso .a-rayos img,.aviso .a-rayos .ir{width:25px;height:32px}
}

/* ---- Y QUE LOS DOS ENTREN EN PANTALLAS BAJAS ----
   La foto suma alto, y el del descuento ya venía siendo el más largo de los
   avisos: trae marcador y dos opciones. En un 360x640 se pasaba 36px del hueco
   que deja el overlay, y como `.sit-flash` centra sin scrollear, lo que sobra
   no se corta: **queda fuera de alcance**. En desktop no pasaba porque ahí el
   aviso ya tenía su `max-height:88vh`.

   Van las dos cosas: un tope de alto también en mobile —la red de contención,
   por si algún texto crece— y una compactación por alto de pantalla, que es la
   que hace que no haga falta usar la red. */
@media (max-width:1024px) and (orientation:portrait), (max-width:820px){
  .aviso{max-height:calc(100dvh - 78px);overflow-y:auto}
}

@media (max-width:820px) and (max-height:680px){
  /* El overlay de los carteles cede margen, como ya lo hace el de las tarjetas. */
  .sit-flash{padding:10px 12px 40px}
  .aviso{--apy:16px; --apx:20px; max-height:calc(100dvh - 54px)}
  .aviso .a-foto{margin-bottom:8px}
  .aviso .a-rayos{gap:6px;margin-top:0}
  .aviso .a-rayos img,.aviso .a-rayos .ir{width:22px;height:28px}
  .aviso .a-s{font-size:11px;margin-top:6px;line-height:1.42}
  .aviso .a-t + .a-s + .e-marc{font-size:clamp(30px,8vw,40px);margin-top:6px}
  .aviso .a-ops{gap:7px;margin-top:11px}
  .aviso .a-op{padding:8px 7px}
  .aviso .a-op .oi{font-size:19px}
  .aviso .a-op .on{font-size:13px;margin-top:2px}
  .aviso .a-op .od{font-size:9.8px;margin-top:4px;line-height:1.35}
  .aviso .a-op.solo{padding:11px 11px}
  .aviso .a-op.solo .oi{font-size:26px}
  .aviso .a-op.solo .on{font-size:15px;margin-top:3px}
  .aviso .a-op.solo .od{font-size:10.4px;margin-top:5px}
  .aviso .cta{font-size:14px;padding:9px;margin-top:8px;letter-spacing:2px}
}

/* ============ LA FICHA DE POSIBILIDAD DE GOL, CON LAS CARTAS ============
   Las cinco casillas mostraban un emoji de 16px y un porcentaje de 9 adentro
   de una caja de 157x47 en desktop: sobraba lugar y faltaba el dato básico
   —de qué jugada era ese porcentaje—. Ahora cada casilla lleva la ilustración
   de su propia carta, la misma que sale en la mesa, con el nombre debajo.

   La foto va contra `vh` como en los avisos, para que en una pantalla baja
   ceda ella antes que el resto de la ficha. */
.fg-art{
  position:relative;display:block;border-radius:4px;overflow:hidden;
  border:1px solid rgba(255,255,255,.09);
}
.fg-art img{display:block;width:100%;height:clamp(30px, 5.2vh, 44px);object-fit:cover}
.fg-art::after{
  content:'';position:absolute;inset:auto 0 0;height:62%;
  background:linear-gradient(180deg,transparent,rgba(0,8,31,.88));
}
/* La chapa del mini juego: la misma del tablero, apoyada sobre la foto. */
.fg-art .mj-lb{
  position:absolute;left:50%;bottom:3px;transform:translateX(-50%);z-index:2;
  margin:0;font-size:7.6px;letter-spacing:1.2px;padding:1px 5px;gap:3px;
}
.fg-art .mj-ico{font-size:8.6px}

.fg-cnm{
  display:block;font-family:var(--tit);font-weight:800;
  font-size:9px;letter-spacing:.2px;line-height:1.06;
  color:#fff;margin-top:4px;text-transform:uppercase;
  overflow-wrap:break-word;hyphens:auto;
}
.fg-mini.seguro .fg-cnm{color:#c9f5d6}
.fg-mini.mj .fg-cnm{color:#fbe9b0}

/* La casilla ya no necesita tanto aire propio: lo pone la foto. */
.fg-mini{padding:5px 4px 6px}
.fg-pct{margin-top:3px}

/* La aclaración de que las cinco pesan igual. Sin esto se lee que la JUGADA
   CLARA es la rara, cuando sale tanto como las otras cuatro. */
.fg-esp em{
  display:block;font-style:normal;font-family:var(--txt);font-weight:500;
  font-size:9.4px;letter-spacing:.4px;text-transform:none;
  color:var(--fi-suave);margin-top:1px;
}

@media (min-width:1025px), (min-width:821px) and (orientation:landscape){
  .fg-art img{height:clamp(40px, 7vh, 62px)}
  .fg-art .mj-lb{font-size:9px;letter-spacing:1.8px;padding:2px 7px;bottom:4px}
  .fg-art .mj-ico{font-size:10px}
  .fg-cnm{font-size:13px;letter-spacing:.5px;margin-top:5px}
  .fg-mini{padding:6px 5px 7px}
  .fg-esp em{font-size:10.5px;display:inline;margin-left:6px}
  .fg-esp em::before{content:'· '}
}
@media (max-width:440px){
  .fg-art img{height:clamp(26px, 4.4vh, 34px)}
  .fg-cnm{font-size:8px;margin-top:3px}
  .fg-art .mj-lb{font-size:6.4px;letter-spacing:.6px;padding:0 4px;gap:2px}
  .fg-art .mj-ico{font-size:7.4px}
  .fg-mini{padding:4px 3px 5px}
}

/* ============ EL CARTEL DE LA FUNDIDA ============
   Quedarte sin aguante es el único castigo permanente del juego —perdés un
   corazón de máximo para todo el campeonato— y pasaba en una línea de relato.
   Ahora tiene cartel, y adentro va también el sorteo de la llegada del rival,
   que hasta acá aparecía ya resuelta sin decir de dónde salía.

   Reusa las casillas de la ficha de racha llena (`.fg-mini`) y su mismo
   cursor de sorteo: es el mismo gesto de los dos lados, en rojo. */
.sit.fundida{border-color:var(--red);box-shadow:0 0 60px rgba(255,59,82,.3)}
.sit.fundida .t{color:var(--red)}
.sit.fundida .sit-tag{color:rgba(255,59,82,.75)}

/* Los corazones que quedan, y el que se fue tachado. */
.fu-hearts{display:flex;justify-content:center;align-items:center;gap:9px;margin:12px 0 4px}
.fu-hearts img,.fu-hearts .ih{width:32px;height:32px}
.fu-ida{position:relative;display:inline-flex;opacity:.28;filter:grayscale(.7)}
.fu-ida::after{
  content:'';position:absolute;left:-4px;right:-4px;top:50%;height:2px;
  background:var(--red);transform:rotate(-20deg);border-radius:2px;
}

.fu-linea{height:1px;background:var(--line);margin:15px -14px}
.fu-ahora{
  font-family:var(--txt);font-weight:700;font-size:11.5px;letter-spacing:2.2px;
  text-transform:uppercase;color:var(--red);margin-bottom:11px;line-height:1.6;
}
.fu-ahora b{font-family:var(--tit);font-weight:800;font-size:1.35em;letter-spacing:.5px}
.fu-ahora em{
  display:block;font-style:normal;font-weight:500;font-size:9.6px;
  letter-spacing:.4px;text-transform:none;color:var(--dim2);margin-top:1px;
}

/* Las casillas, del lado del rival: rojo donde la tuya va celeste. */
.sit.fundida .fg-minis{margin-top:0}
.sit.fundida .fg-mini{border-color:rgba(255,59,82,.28)}
.sit.fundida .fg-pct{color:var(--red)}
.sit.fundida .fg-cnm{color:#fff}
.sit.fundida .fg-mini.foco{border-color:rgba(255,255,255,.92);box-shadow:0 0 0 2px rgba(255,255,255,.5)}
.sit.fundida .fg-mini.gana{
  border-color:var(--red) !important;
  box-shadow:0 0 0 3px var(--red), 0 0 28px rgba(255,59,82,.5) !important;
}
.sit.fundida .fg-mini.gana .fg-pct{color:var(--red) !important}

.sit.fundida .cta{
  margin-top:15px;
  background:linear-gradient(160deg, rgba(58,10,18,.9), rgba(0,12,40,.96));
  border-color:var(--red);color:var(--red);
}
.sit.fundida .cta:disabled{opacity:.4;cursor:default;letter-spacing:4px}

/* El cartel es alto: cinco casillas con foto, más los corazones. Se le pone
   tope y scroll propio también en mobile, igual que a los avisos. */
@media (max-width:1024px) and (orientation:portrait), (max-width:820px){
  .sit.fundida{max-height:calc(100dvh - 78px);overflow-y:auto}
}
@media (max-width:820px) and (max-height:680px){
  .sit.fundida{max-height:calc(100dvh - 54px);padding:16px 14px}
  .fu-hearts{gap:6px;margin:8px 0 2px}
  .fu-hearts img,.fu-hearts .ih{width:24px;height:24px}
  .fu-linea{margin:10px -10px}
  .fu-ahora{font-size:10px;letter-spacing:1.6px;margin-bottom:8px}
  .fu-ahora em{font-size:8.6px}
  .sit.fundida .cta{margin-top:10px;font-size:14px;padding:9px}
}
@media (min-width:1025px), (min-width:821px) and (orientation:landscape){
  .fu-hearts{gap:11px;margin:14px 0 6px}
  .fu-hearts img,.fu-hearts .ih{width:40px;height:40px}
  .fu-ahora{font-size:14px;letter-spacing:2.6px;margin-bottom:14px}
  .fu-ahora em{font-size:11.5px;display:inline;margin-left:7px}
  .fu-ahora em::before{content:'· '}
  .fu-linea{margin:18px -18px}
}

/* ================= LA PANTALLA DEL CLUB, EN VITRINA =================
   Era un formulario: el escudo chico a la izquierda y a la derecha una lista
   con cinco formas y **dos filas de nueve colores** —dieciocho botones a la
   vez—. Es el único momento en que el jugador crea algo suyo y se veía como
   un trámite.

   Ahora el escudo va al centro y grande, sobre una peana con luz. Debajo, la
   tira de formas con cada silueta dibujada **en los colores elegidos**, y una
   sola fila de nueve con un interruptor de cuál se está pintando: la mitad de
   botones en pantalla y el doble de tamaño cada uno.

   Todo centrado: en una columna sola, alinear a la izquierda dejaba los
   rótulos colgando de un lado y el escudo en el otro. */
.card-club{text-align:center}
.card-club .club-top{justify-content:center;gap:10px}

.club-vitrina{position:relative;padding:10px 0 0;margin-top:2px}
.club-vitrina::before{
  content:'';position:absolute;left:50%;top:-6px;width:230px;height:230px;
  transform:translateX(-50%);border-radius:50%;pointer-events:none;
  background:radial-gradient(circle, rgba(245,200,66,.2), transparent 62%);
}
.club-vitrina .crear-prev{position:relative}
.club-vitrina .escudo{margin:0 auto;filter:drop-shadow(0 10px 26px rgba(0,0,0,.75))}
.club-peana{
  width:150px;height:10px;margin:6px auto 0;border-radius:50%;
  background:radial-gradient(ellipse, rgba(245,200,66,.3), transparent 70%);
}

.card-club input{text-align:center}
.card-club .crear-lb{text-align:center;margin:10px 0 6px}

/* La tira de formas: se desliza si no entra, y cada silueta lleva los colores
   que el jugador eligió. */
.club-tira{
  display:flex;justify-content:center;gap:7px;
  overflow-x:auto;padding:2px 2px 4px;scrollbar-width:thin;
}
.club-tira::-webkit-scrollbar{height:5px}
.club-tira::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
.club-tira .op-esc{flex:0 0 auto;border-radius:8px;border-width:2px;padding:6px 8px}

/* El interruptor de qué color se está pintando. */
.club-sw{display:flex;justify-content:center;gap:8px;margin-bottom:9px}
.sw-b{
  display:flex;align-items:center;gap:8px;cursor:pointer;
  border:2px solid var(--line);border-radius:8px;background:rgba(0,12,40,.7);
  padding:6px 13px 6px 8px;transition:border-color .15s,color .15s;
  font-family:var(--tit);font-weight:800;font-size:11.5px;letter-spacing:1.8px;
  color:var(--dim);text-transform:uppercase;
}
.sw-b i{width:22px;height:22px;border-radius:4px;display:block;border:1px solid rgba(255,255,255,.25)}
.sw-b.on{border-color:var(--gold);color:var(--gold)}

/* Una sola fila de nueve, centrada y con los cuadrados más grandes: antes
   había dos filas de estos mismos botones a 26px. */
.card-club .col-fila{justify-content:center;gap:7px}
.card-club .op-col{width:34px;height:34px;border-radius:7px;border-width:2px;padding:3px}
.card-club .op-col span{border-radius:4px}
.card-club .op-col.sel{box-shadow:0 0 0 2px rgba(245,200,66,.35)}

.card-club .op-azar{margin-top:12px;border-radius:7px}

@media (max-width:700px){
  .club-vitrina::before{width:170px;height:170px}
  .club-peana{width:112px}
  .card-club .crear-lb{margin:8px 0 5px}
  .club-tira{gap:5px;justify-content:flex-start}
  .club-tira .op-esc{padding:5px 6px}
  .club-sw{gap:6px;margin-bottom:7px}
  .sw-b{font-size:10.5px;letter-spacing:1.4px;padding:5px 10px 5px 6px;gap:6px}
  .sw-b i{width:18px;height:18px}
  .card-club .col-fila{display:grid;grid-template-columns:repeat(9,1fr);gap:5px}
  .card-club .op-col{width:100%;height:auto;aspect-ratio:1;border-radius:6px}
}
@media (max-width:820px) and (max-height:680px){
  .club-vitrina{padding-top:4px}
  .club-vitrina::before{width:130px;height:130px}
  .club-peana{height:7px;margin-top:4px}
  .card-club .crear-lb{margin:6px 0 4px}
  .club-tira{gap:4px}
  .club-sw{margin-bottom:6px}
  .card-club .op-azar{margin-top:8px;padding:8px}
}

/* En pantallas de 620px de alto o menos —un 320x568— el escudo de 150px se
   comía 180 de alto y los dos botones quedaban 43px abajo del corte. Se mide
   contra `vh`: cede el escudo, que es lo que más ocupa, antes que los
   controles. El `width:auto` es lo que deja mandar al alto, porque el SVG
   trae los dos como atributos. */
@media (max-width:820px) and (max-height:620px){
  .club-vitrina .escudo{width:auto !important;height:clamp(92px, 19vh, 120px) !important}
  .club-vitrina::before{width:104px;height:104px}
  .club-peana{width:86px;height:6px}
  .card-club .op-col{border-radius:5px}
  .club-tira .op-esc{padding:4px 5px}
}

/* Y lo mismo en desktop bajo. Una notebook de 1280x700 tiene ancho de sobra
   pero 700px de alto: la vitrina en una columna medía 681 contra 628 de hueco
   y los dos botones quedaban afuera. Los tramos de arriba son `max-width:820`
   y no la alcanzaban. */
/* El tope va acá abajo y con las dos clases porque `.card` vuelve a declarar
   `max-height:calc(100vh - 28px)` más adelante, con la misma especificidad y
   más tarde: ganaba él y la tarjeta sobresalía del hueco del overlay, que
   terminaba scrolleando el fondo. */
.card.card-club{max-height:100%}

@media (min-width:821px) and (max-height:800px){
  .card-club{padding:14px 20px 14px;gap:8px}
  .club-vitrina{padding-top:2px}
  .club-vitrina .escudo{width:auto !important;height:clamp(100px, 17vh, 150px) !important}
  .club-vitrina::before{width:142px;height:142px}
  .club-peana{width:96px;height:7px;margin-top:3px}
  .card-club .crear-lb{margin:6px 0 5px}
  .club-sw{margin-bottom:7px}
  .card-club .op-azar{margin-top:7px;padding:7px}
}
/* Y un escalón más para el landscape muy bajo —un 1024x640—, donde con lo de
   arriba todavía sobraban 11px. */
@media (min-width:821px) and (max-height:660px){
  .card-club{padding:12px 18px 12px;gap:6px}
  .club-vitrina .escudo{height:clamp(92px, 15vh, 120px) !important}
  .club-vitrina::before{width:120px;height:120px}
  .club-peana{width:84px;margin-top:2px}
  .card-club .crear-lb{margin:5px 0 4px}
}

/* ================= EL ARCO DE LOS PENALES =================
   Reemplaza los dos emoji que se movían adentro de una caja. Ahora el arco se
   dibuja —palos, travesaño, red y línea del área— y se apunta **tocando
   adentro**: las tres zonas son los botones.

   Tres cosas lo sostienen:

   1. **Las zonas laten.** Un arco dibujado sin nada más se lee como
      decoración; el latido escalonado en celeste dice que hay que tocarlo.
   2. **El arquero lleva los colores del equipo que ataja** —camiseta y
      guantes salen del escudo— y se balancea mientras decidís, para que no
      parezca una estatua esperando.
   3. **La pelota está dibujada con el mismo trazo** que el arco: círculo,
      pentágono y costuras, en vez del emoji de antes, que era el único
      elemento con otro estilo. */
.parco{
  display:block;width:100%;margin:12px 0 2px;overflow:visible;
}
.pp-post{fill:none;stroke:#e8eef8;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.pp-red{fill:none;stroke:rgba(232,238,248,.2);stroke-width:1}
.pp-piso{fill:none;stroke:rgba(232,238,248,.28);stroke-width:2;stroke-dasharray:4 6}
.pp-cost{fill:none;stroke:#16181d;stroke-width:.9;stroke-linecap:round}

/* Las tres zonas: laten hasta que se dispara. */
.pp-zona{
  fill:var(--fi-luz);fill-opacity:.05;
  stroke:var(--fi-luz);stroke-width:1.5;stroke-opacity:.35;
  cursor:pointer;transition:fill-opacity .15s, stroke-opacity .15s;
  animation:zonaLate 1.7s ease-in-out infinite;
}
@keyframes zonaLate{
  0%,100%{stroke-opacity:.3;fill-opacity:.04}
  50%    {stroke-opacity:1;fill-opacity:.16}
}
.pp-zona:hover{fill-opacity:.2;stroke-opacity:1;animation:none}
.pp-zona.off{pointer-events:none;animation:none;stroke-opacity:.12;fill-opacity:0}
.pp-zona.sel{
  animation:none;stroke:var(--gold);stroke-opacity:1;stroke-width:2.5;
  fill:var(--gold);fill-opacity:.16;
}

/* El arquero: vaivén mientras decidís, vuelo cuando disparás. */
.pp-arq{
  transition:transform .44s cubic-bezier(.3,1.1,.4,1);
  filter:drop-shadow(0 3px 7px rgba(0,0,0,.55));
}
.pp-arq.idle{animation:arqVaiven 1.8s ease-in-out infinite}
@keyframes arqVaiven{
  0%,100%{transform:translateX(-7px) rotate(-3deg)}
  50%    {transform:translateX(7px) rotate(3deg)}
}

.pp-pel{
  transition:transform .46s cubic-bezier(.25,.7,.4,1);
  filter:drop-shadow(0 2px 5px rgba(0,0,0,.6));
}

/* La red se infla en verde cuando entra. */
.pp-gol{fill:none;stroke:var(--green);stroke-width:4;opacity:0}
.pp-gol.on{animation:ppRed .55s ease-out}
@keyframes ppRed{
  0%  {opacity:0}
  30% {opacity:1}
  100%{opacity:0}
}

.pp-hint{
  font-family:var(--txt);font-weight:600;font-size:10px;letter-spacing:2px;
  text-transform:uppercase;color:var(--dim2);margin-top:4px;
}

@media (min-width:1025px), (min-width:821px) and (orientation:landscape){
  .parco{margin:14px 0 4px}
  .pp-hint{font-size:11.5px;letter-spacing:2.6px;margin-top:6px}
}
@media (prefers-reduced-motion:reduce){
  .pp-zona,.pp-arq.idle{animation:none}
  .pp-zona{stroke-opacity:.8;fill-opacity:.12}
}

/* ================= LA PIZARRA DE LA TANDA =================
   Reemplaza la línea de ⚽ y ✖ de 13px. Los cinco huecos de cada equipo están
   siempre, así se ve **cuántos quedan**: en una tanda eso es la mitad de la
   información. El que se está por patear late en dorado. */
.pizarra{display:grid;gap:5px;margin:10px 0 2px}
.pz-f{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:9px;
  border:1px solid var(--line);border-radius:7px;background:rgba(0,12,40,.6);
  padding:5px 9px;transition:border-color .2s, background .2s;
}
.pz-f.turno{border-color:var(--gold);background:rgba(245,200,66,.09)}
.pz-nm{
  font-family:var(--tit);font-weight:800;font-size:12.5px;letter-spacing:.6px;
  color:var(--white);max-width:11ch;text-transform:uppercase;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.pz-tiros{display:flex;gap:5px;justify-content:center}
.pz-t{
  width:15px;height:15px;border-radius:50%;
  border:1.5px solid var(--line2, #1e3f7d);background:rgba(0,8,31,.7);
  display:flex;align-items:center;justify-content:center;
  transition:background .22s, border-color .22s, box-shadow .22s;
}
.pz-t.gol{background:var(--green);border-color:var(--green);box-shadow:0 0 9px rgba(61,220,107,.55)}
.pz-t.fallo{background:transparent;border-color:var(--red)}
.pz-t.fallo::after{
  content:'';width:7px;height:1.6px;background:var(--red);
  transform:rotate(-45deg);border-radius:2px;
}
.pz-t.ahora{border-color:var(--gold);animation:pzLate 1.1s ease-in-out infinite}
@keyframes pzLate{
  0%,100%{box-shadow:0 0 0 0 rgba(245,200,66,.6)}
  50%    {box-shadow:0 0 0 4px rgba(245,200,66,0)}
}
.pz-n{
  font-family:var(--tit);font-weight:800;font-size:17px;color:var(--gold);
  min-width:14px;text-align:right;font-variant-numeric:tabular-nums;
}

@media (min-width:1025px), (min-width:821px) and (orientation:landscape){
  .pizarra{gap:6px;margin:12px 0 4px}
  .pz-f{padding:7px 12px;gap:12px}
  .pz-nm{font-size:15px}
  .pz-tiros{gap:7px}
  .pz-t{width:19px;height:19px;border-width:2px}
  .pz-t.fallo::after{width:9px;height:2px}
  .pz-n{font-size:21px;min-width:18px}
}
@media (max-width:440px){
  .pz-f{padding:4px 7px;gap:6px}
  .pz-nm{font-size:10.5px;max-width:8ch}
  .pz-tiros{gap:4px}
  .pz-t{width:12px;height:12px;border-width:1.2px}
  .pz-t.fallo::after{width:6px;height:1.4px}
  .pz-n{font-size:14px;min-width:12px}
}
@media (prefers-reduced-motion:reduce){ .pz-t.ahora{animation:none} }

<!-- ══════════ LOS ÍCONOS DE LOS ÍTEMS ══════════
     Dibujados en vez de emoji, por dos razones: en mobile con cuatro ítems el
     ícono es lo único que sobrevive —el nombre no entra— así que pasa a ser lo
     que identifica cada cosa, y los emoji genéricos (una silla, un bíceps) no
     dicen nada de un partido.

     Van como sprite: se definen una vez y cada uso es un `<use>`, así que
     agregar un ítem no agrega peso. Toman el color del texto con
     `currentColor`, menos los acentos que sí tienen que ser verde o rojo. -->

   Flujo paralelo al campeonato, sin tocarlo. Mesa **compartido** de 16
   cartas: 8 turnos cada uno, alternando, hasta agotarlo. Lo que hace distinto
   al modo es justamente eso — la carta que te sirve se la puede llevar el
   otro antes de que te toque.

   Queda afuera el reloj de 90 minutos y las cartas trabadas: existen para
   meter presión en un solitario, y acá la presión la pone el rival.

   Las cartas se leen **relativas a quien juega**: si al J2 le sale ARQUERO es
   su ataque, y el gol va a su marcador. */
const DUELO = {
  TURNOS: 16,          // 8 por cabeza
  ENTRETIEMPO: 8,      // el mercado va justo a la mitad
  PLATA_TOPE: 90,      // más generoso que el campeonato: son pocos partidos
  PLATA_CARTAS: 4,
  /* Los stats se reparten a mano y **no hay escalado rival**: las cartas de
     duelo valen 2, 3, 4 o 5 al azar, siempre. Por eso cada punto se siente —
     con cartas parejas, subir de 3 a 4 pasa de ganar el 37% de los duelos a
     ganar el 62%. */
  STAT_BASE: 1,        // con lo que arranca cada stat
  PUNTOS_INICIO: 3,    // a repartir al crear el equipo
  PUNTOS_ET: 2,        // más, en el entretiempo
  STAT_MAX: 5,
  VAL_MIN: 2, VAL_MAX: 5
};

/* Un jugador del 1v1. Los dos arrancan idénticos: lo que decide es cómo elegís. */
function nuevoJugador(club, escudo){
  return {
    club, escudo,
    goles:0, dinero:0,
    atk:DUELO.STAT_BASE, def:DUELO.STAT_BASE,
    aguante:AGUANTE_BASE, aguanteMax:AGUANTE_BASE,
    racha:0, amarillas:0, fundidas:0,
    items: Object.assign({}, ITEMS_INICIALES)
  };
}

/* Una clave puede ser un **alias** de otra: `penalC: '@penal'` reusa la imagen
   sin repetir los 8 KB de base64. Sirve cuando la jugada es la misma vista
   desde el otro lado.

   CÓRNER RIVAL era el ejemplo de este comentario y dejó de serlo: ahora tiene
   ilustración propia. Un córner tuyo y uno del rival son jugadas opuestas, y
   compartir imagen las hacía indistinguibles en la mesa. Siguen como alias
   PENAL RIVAL, LIBRE RIVAL y AUTOGOL RIVAL. */
const ARTSRC = k => {
  let v = ART[k];
  if(v && v[0] === '@') v = ART[v.slice(1)];
  return v ? 'data:image/webp;base64,' + v : null;
};

/* Devuelve la imagen si existe, y si no el emoji. Así se puede ir migrando de a
   poco: la carta que todavía no tiene arte sigue mostrando su emoji. */
function icono(clave, emoji, cls){
  const src = ARTSRC(clave);
  return src
    ? '<img class="ico-art' + (cls ? ' ' + cls : '') + '" src="' + src + '" alt="">'
    : '<span class="ico-emoji' + (cls ? ' ' + cls : '') + '">' + emoji + '</span>';
}

/* La ilustración de una carta, para el fondo de la mesa y el pop-up. */
function artCarta(tipo){ return ARTSRC(tipo); }

/* ---------------- el escudo ----------------
   Cuatro formas, cada una con su propio patrón para que se distingan de lejos,
   y seis paletas de dos colores. El escudo lleva la inicial del club y aparece
   en la marquesina y en todos los marcadores. */
/* Cinco siluetas tomadas de escudos reales, no formas genéricas:

     ESPAÑOL   el escudo de La Liga: hombros rectos y punta redondeada
     INGLÉS    más ancho arriba, curva suave hacia la base
     ITALIANO  hombros altos, cintura marcada y punta larga
     REDONDO   el círculo de los clubes alemanes y sudamericanos
     BANDERÍN  vertical, con la base en pico, tipo pennant

   Todas sobre el mismo viewBox de 100x120, así el patrón interior calza igual
   en las cinco. */
/* Cinco siluetas tomadas de escudos reales:

     CLÁSICO    hombros rectos y punta redondeada — el más común
     INGLÉS     esquinas suaves arriba, base ancha
     ITALIANO   cintura marcada y punta larga
     BANDERÍN   vertical angosto con punta en V, típico argentino
     OVALADO    la elipse de los clubes europeos

   Todas sobre el mismo viewBox de 100x120, así el patrón interior calza igual
   en las cinco. */
const ESCUDOS = [
  { id:'clasico', nm:'CLÁSICO',
    d:'M50 4 L94 17 V57 C94 84 76 104 50 116 C24 104 6 84 6 57 V17 Z' },
  { id:'ingles', nm:'INGLÉS',
    d:'M8 6 C8 4 10 3 12 3 H88 C90 3 92 4 92 6 V54 C92 84 74 104 50 117 C26 104 8 84 8 54 Z' },
  { id:'italiano', nm:'ITALIANO',
    d:'M50 3 L93 15 C93 38 91 54 86 68 C79 90 66 106 50 117 C34 106 21 90 14 68 C9 54 7 38 7 15 Z' },
  { id:'banderin', nm:'BANDERÍN',
    d:'M16 4 H84 C86 4 88 6 88 8 V82 L50 117 L12 82 V8 C12 6 14 4 16 4 Z' },
  { id:'ovalado', nm:'OVALADO',
    d:'M50 3 C74 3 92 25 92 60 C92 95 74 117 50 117 C26 117 8 95 8 60 C8 25 26 3 50 3 Z' }
];

/* Nueve colores sueltos: se combinan los dos que uno quiera, en vez de elegir
   entre paletas armadas. Son 9 x 9 = 81 combinaciones contra las 6 de antes. */
const COLORES = [
  { nm:'BLANCO',   hex:'#f2f4f8' },
  { nm:'NEGRO',    hex:'#16181d' },
  { nm:'ROJO',     hex:'#d61f34' },
  { nm:'AMARILLO', hex:'#f5c842' },
  { nm:'AZUL',     hex:'#1b4fa8' },
  { nm:'VERDE',    hex:'#1f9b4d' },
  { nm:'VIOLETA',  hex:'#7b3fb5' },
  { nm:'NARANJA',  hex:'#ef7215' },
  { nm:'ROSA',     hex:'#e8559b' }
];


/* El patrón interno depende de la forma: mitades, franja, sólido o diagonal.
   Se dibuja recortado contra la silueta con un clipPath. */
/* Sin letra en el medio: el escudo se lee por su forma y sus dos colores, y
   la inicial competía justo con las formas que traen franja —el banderín y el
   inglés la partían al medio—. El nombre del club ya está al lado en todos los
   lugares donde aparece el escudo. */
function escudoSVG(size, forma, c1, c2){
  const F = ESCUDOS[forma % ESCUDOS.length];
  const A = COLORES[c1 % COLORES.length].hex;
  const B = COLORES[c2 % COLORES.length].hex;
  const cid = 'esc' + forma + c1 + c2 + Math.random().toString(36).slice(2, 7);

  /* Cada forma trae su propio patrón: a 26px en el selector la silueta sola no
     alcanza para distinguir cinco opciones. */
  let dentro = '';
  if(F.id === 'espanol')       dentro = '<rect x="50" y="0" width="50" height="120" fill="' + B + '"/>';
  else if(F.id === 'ingles')   dentro = '<path d="M0 44 H100 V74 H0 Z" fill="' + B + '"/>';
  else if(F.id === 'italiano') dentro = '<path d="M0 120 L120 0 L120 40 L38 120 Z" fill="' + B + '"/>';
  else if(F.id === 'banderin') dentro = '<path d="M0 0 H34 V120 H0 Z M66 0 H100 V120 H66 Z" fill="' + B + '"/>';
  else                         dentro = '<rect x="0" y="44" width="100" height="32" fill="' + B + '"/>';

  return '<svg class="escudo" viewBox="0 0 100 120" width="' + size + '" height="' + Math.round(size * 1.2) + '">' +
    '<defs><clipPath id="' + cid + '"><path d="' + F.d + '"/></clipPath></defs>' +
    '<g clip-path="url(#' + cid + ')">' +
      '<rect width="100" height="120" fill="' + A + '"/>' + dentro +
    '</g>' +
    '<path d="' + F.d + '" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="4"/>' +
    '<path d="' + F.d + '" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="1.5"/>' +
  '</svg>';
}


/* El rival estrena escudo en cada partido. Se evita la paleta del jugador para
   que los dos escudos del marcador no se confundan. */
function escudoRivalNuevo(){
  /* Dos colores distintos entre sí, y el de fondo distinto al tuyo: en el
     marcador los dos escudos van uno al lado del otro. */
  let c1 = rnd(COLORES.length);
  if(c1 === G.escudo.c1) c1 = (c1 + 1 + rnd(COLORES.length - 1)) % COLORES.length;
  let c2 = rnd(COLORES.length);
  if(c2 === c1) c2 = (c2 + 1 + rnd(COLORES.length - 1)) % COLORES.length;
  return { forma: rnd(ESCUDOS.length), c1, c2 };
}


function escudoDe(e, size){
  return escudoSVG(size, e.forma, e.c1, e.c2);
}

/* Una fila de colores. `sel` es el elegido y `pre` el prefijo del data-attr,
   para poder tener dos filas (fondo y detalle) sin que se pisen. */
/* ---- 1v1: el panel de un jugador ----
   Todo lo suyo en un bloque: escudo, medidores, stats, plata e ítems. Los dos
   se ven a la vez —local a la izquierda, visitante a la derecha— y el que tiene
   el turno se resalta. Sin esto había que adivinar con cuánto venía el otro. */
function panelJugador(i){
  const j = G.J[i], suTurno = G.turno === i;
  const goles = j.goles;
  const cor = n => '<span class="' + (n ? '' : 'off') + '"><i class="ih"></i></span>';
  const ray = n => '<span class="' + (n ? 'ray-on' : 'ray-off') + '"><i class="ir"></i></span>';

  let hearts = '', rachas = '';
  for(let k = 0; k < j.aguanteMax; k++) hearts += cor(k < j.aguante);
  for(let k = 0; k < RACHA_MAX; k++)    rachas += ray(k < j.racha);

  const items = Object.keys(ITEMS).filter(k => (j.items[k] || 0) > 0);

  return '<div class="jp' + (suTurno ? ' turno' : '') + '">' +
    '<div class="jp-top">' +
      '<span class="jp-esc">' + escudoDe(j.escudo, 30) + '</span>' +
      '<span class="jp-nm">' + j.club + '</span>' +
      '<span class="jp-gol">' + goles + '</span>' +
    '</div>' +
    (suTurno ? '<div class="jp-turno">SU TURNO</div>' : '') +
    '<div class="jp-med">' +
      '<span class="jp-lb"><i class="ih"></i></span><span class="jp-hearts">' + hearts + '</span>' +
    '</div>' +
    '<div class="jp-med">' +
      '<span class="jp-lb"><i class="ir"></i></span><span class="jp-racha">' + rachas + '</span>' +
    '</div>' +
    '<div class="jp-stats">' +
      '<span class="jp-st r"><b>' + j.atk + '</b>ATAQUE</span>' +
      '<span class="jp-st b"><b>' + j.def + '</b>DEFENSA</span>' +
      '<span class="jp-plata">' + plata(j.dinero) + '</span>' +
    '</div>' +
    '<div class="jp-items">' +
      (items.length
        ? items.map(k => '<span class="jp-it" title="' + ITEMS[k].nm + '">' + ITEMS[k].ico +
            '<b>' + j.items[k] + '</b></span>').join('')
        : '<span class="jp-sinit">sin ítems</span>') +
    '</div>' +
    (j.amarillas ? '<div class="jp-am">🟨 amarilla · la próxima es roja</div>' : '') +
  '</div>';
}

function filaColores(sel, pre){
  return COLORES.map((c, i) =>
    '<button class="op-col' + (i === sel ? ' sel' : '') + '" data-' + pre + '="' + i + '" title="' + c.nm + '">' +
      '<span style="background:' + c.hex + '"></span></button>').join('');
}

function miEscudo(size){
  return escudoDe(G.escudo, size);
}

/* Arranca un partido de la serie. El mesa es uno solo y se agota entre los
   dos; los jugadores llegan con lo que les quedó del partido anterior salvo
   aguante y racha, que se reinician como en el campeonato. */
function duelNuevoPartido(){
  G.serie.partido++;
  const ultimo = G.serie.partido === G.serie.alMejorDe;

  G.J.forEach(j => {
    j.goles = 0;
    j.aguante = AGUANTE_BASE; j.aguanteMax = AGUANTE_BASE;
    j.racha = 0; j.amarillas = 0; j.fundidas = 0;
    for(const k in ITEMS_INICIALES) if(!(j.items[k] > 0)) j.items[k] = ITEMS_INICIALES[k];
  });

  /* El nivel sube con el partido, y en el último **no hay plata**: no queda
     mercado donde gastarla. */
  G.duelNivel = Math.min(5, 1 + G.serie.partido);
  G.duelSinPlata = ultimo && G.serie.alMejorDe > 1;

  G.turnosJugados = 0;
  G.phase = 'match';
  G.busy = false; G.targeting = false;
  G.grid = buildGrid(G.duelNivel);
  G.grid.forEach(row => row.forEach(c => { if(c) c.lock = false; }));
  if(G.duelSinPlata) duelSacarPlata();

  $('log').innerHTML = '';
  G.turno = 0;
  cargarTurno();
  render();

  /* El árbitro tira la moneda: el que la gana saca. Canta el visitante, como en
     la cancha. */
  G.busy = true;
  moneda(G.J, 1, G.serie.alMejorDe > 1 ? 'PARTIDO ' + G.serie.partido : 'EL SORTEO', '¿CARA O SECA?')
    .then(gana => {
      G.turno = gana;
      cargarTurno();
      say('🏟 ' + (G.serie.alMejorDe > 1 ? 'Partido ' + G.serie.partido + ' de ' + G.serie.alMejorDe + '. ' : '') +
          G.J[0].club + ' vs ' + G.J[1].club + '. Saca ' + G.J[gana].club + '.', 'big');
      G.duelSaco = gana;
      G.busy = false;
      render();
    });
}

/* En el último partido de la serie no hay dónde gastar: las cartas de plata
   se cambian por otras que sí sirvan en la cancha. */
function duelSacarPlata(){
  const util = ['cooling','ola','hinchada'];
  G.grid.forEach((row, r) => row.forEach((cell, c) => {
    if(['fama','publicidad','sponsor'].includes(cell.type))
      G.grid[r][c] = makeCellDe(util[rnd(util.length)], G.duelNivel);
  }));
}

/* Quién está jugando ahora. En el campeonato siempre sos vos. */
function J(){ return G.modo === 'duelo' ? G.J[G.turno] : null; }
function rivalJ(){ return G.modo === 'duelo' ? G.J[1 - G.turno] : null; }

/* ---------------- el sorteo ----------------
   El árbitro tira la moneda: uno canta y el otro espera. Se usa al empezar el
   partido —define quién saca— y antes de los penales —quién patea primero.
   Devuelve el índice del que ganó el sorteo. */
function moneda(eqs, canta, titulo, bajada){
  return new Promise(resolve => {
    const wrap = document.createElement('div');
    wrap.className = 'sit-flash';
    wrap.innerHTML =
      '<div class="sit moneda">' +
        '<div class="sit-tag">' + titulo + '</div>' +
        '<div class="mon-arb">🧑‍⚖️</div>' +
        '<div class="t">' + eqs[canta].club + '</div>' +
        '<div class="s">' + bajada + '</div>' +
        '<div class="palos">' +
          '<button class="palo" data-cara="1"><span class="pi">🌕</span><span class="pn">CARA</span></button>' +
          '<button class="palo" data-cara="0"><span class="pi">🌑</span><span class="pn">SECA</span></button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(wrap);

    wrap.querySelectorAll('.palo').forEach(btn => {
      btn.onclick = async () => {
        const canto = +btn.dataset.cara;
        const salio = chance(.5) ? 1 : 0;
        const acerto = canto === salio;
        const gana = acerto ? canta : 1 - canta;

        wrap.querySelectorAll('.palo').forEach(b => {
          b.disabled = true;
          if(+b.dataset.cara === canto) b.classList.add('elegido');
        });
        const arb = wrap.querySelector('.mon-arb');
        arb.classList.add('girando');
        await wait(1100);

        const box = wrap.querySelector('.sit.moneda');
        box.className = 'sit moneda resuelta';
        box.innerHTML =
          '<div class="sit-tag">SALIÓ ' + (salio ? 'CARA' : 'SECA') + '</div>' +
          '<div class="sit-ico">' + icoDesenlace(salio ? 'cara' : 'seca') + '</div>' +
          '<div class="t">' + eqs[gana].club + '</div>' +
          '<div class="s">' + (acerto ? 'ACERTÓ EL SORTEO' : 'SE LO LLEVA IGUAL') + '</div>';
        await esperarOClick(wrap, ESPERA_FIN);
        resolve(gana);
      };
    });
  });
}

/* Cuántos duelos gana un stat contra cartas planas de 2 a 5. El empate cuenta
   mitad, porque se resuelve en el mano a mano al 50%. Se muestra al repartir:
   sin el número, elegir entre 3/2 y 2/3 es a ciegas. */
function duelosPct(stat){
  const n = DUELO.VAL_MAX - DUELO.VAL_MIN + 1;
  let gana = 0;
  for(let v = DUELO.VAL_MIN; v <= DUELO.VAL_MAX; v++){
    if(stat > v) gana += 1;
    else if(stat === v) gana += 0.5;
  }
  return Math.round(gana / n * 100);
}

/* El repartidor de puntos: barras de ATAQUE y DEFENSA con + y -, el resto de
   puntos disponibles y el % de duelos que gana cada stat. */
function repartoHTML(atk, def, quedan, pre){
  const barra = (lb, val, cls, k) =>
    '<div class="rep-fila">' +
      '<span class="rep-lb ' + cls + '">' + lb + '</span>' +
      '<button class="rep-b" data-' + pre + '="-' + k + '"' +
        (val <= DUELO.STAT_BASE ? ' disabled' : '') + '>−</button>' +
      '<span class="rep-val ' + cls + '">' + val + '</span>' +
      '<button class="rep-b" data-' + pre + '="+' + k + '"' +
        (!quedan || val >= DUELO.STAT_MAX ? ' disabled' : '') + '>+</button>' +
      '<span class="rep-pct">gana el <b>' + duelosPct(val) + '%</b> de sus duelos</span>' +
    '</div>';
  return '<div class="reparto">' +
    barra('⚔ ATAQUE', atk, 'r', 'atk') +
    barra('🛡 DEFENSA', def, 'b', 'def') +
    '<div class="rep-quedan">' + (quedan
      ? 'Te quedan <b>' + quedan + '</b> ' + (quedan === 1 ? 'punto' : 'puntos')
      : '<span class="ok">Repartidos los ' + (pre === 'et' ? DUELO.PUNTOS_ET : DUELO.PUNTOS_INICIO) + '</span>') +
    '</div>' +
  '</div>';
}

// pools por nivel: [tipo, peso, valorMin, valorMax]
/* Los duelos suben de exigencia en las tres últimas rondas. Los valores van
   como lista explícita para poder sesgarlos:

     CLASIF   ATK 1-3      DEF 1-2       arrancás ganando
     OCTAVOS  ATK 2-4      DEF 1-3

   El DELANTERO RIVAL va en **1 fijo** en esas dos primeras rondas. Es la carta
   más cara de perder —su mano a mano es gol en contra— y con DEFENSA 1 de base

/* Espera `ms` **o** un toque, lo que pase primero. El tiempo asegura que el
   cartel se llegue a leer; el toque deja adelantarlo al que ya lo leyó.

   El click se habilita 200ms después de aparecer: sin ese respiro, el mismo
   toque con el que resolviste la jugada anterior cerraba este cartel. */
function esperarOClick(wrap, ms){
  return new Promise(res => {
    let listo = false;
    const cerrar = () => {
      if(listo) return;
      listo = true;
      clearTimeout(t);
      wrap.removeEventListener('click', cerrar);
      /* Se desvanece y recién ahí se saca: sin esto desaparecía de golpe. */
      wrap.classList.add('saliendo');
      setTimeout(() => { wrap.remove(); res(); }, 220);
    };
    const t = setTimeout(cerrar, ms);
    wrap.style.cursor = 'pointer';
    wrap.classList.add('clickeable');
    wrap.style.pointerEvents = 'auto';
    setTimeout(() => { if(!listo) wrap.addEventListener('click', cerrar); }, 200);
  });
}

/* ---- 1v1: G es siempre "el que está jugando ahora" ----
   En vez de cambiar las ~77 referencias a G.aguante, G.racha y compañía, se
   **copia** el estado del jugador de turno dentro de G antes de jugar y se
   devuelve después. Toda la resolución de cartas —duelos, goles, tarjetas,
   ítems, medidores— funciona sin una línea distinta.

   Los goles son el caso curioso: G.gU es "los del que juega" y G.gC "los del
   otro", así que se dan vuelta en cada turno. */
const CAMPOS_J = ['aguante','aguanteMax','racha','amarillas','fundidas','atk','def','dinero','items','club','escudo'];

function cargarTurno(){
  if(G.modo !== 'duelo') return;
  const j = G.J[G.turno];
  CAMPOS_J.forEach(k => { G[k] = j[k]; });
  G.gU = j.goles;
  G.gC = G.J[1 - G.turno].goles;
}

function guardarTurno(){
  if(G.modo !== 'duelo') return;
  const j = G.J[G.turno];
  CAMPOS_J.forEach(k => { j[k] = G[k]; });
  /* Los goles NO se copian acá: `scoreU` y `scoreC` los escriben en el jugador
     en el mismo momento del gol. Copiarlos también al cerrar el turno los
     duplicaba —y si el turno ya había cambiado, se los asignaba al equipo
     equivocado. */
}

function say(text, cls){
  const log = $('log');
  const p = document.createElement('p');
  if(cls) p.className = cls;
  /* innerHTML y no textContent: los relatos llevan el rayo y el corazón como
     etiquetas, y `textContent` las escapaba mostrando el markup en el relato. */
  p.innerHTML = text;
  // lo último arriba: en una columna lateral el jugador mira el borde de
  // arriba, no persigue el scroll hacia abajo
  log.prepend(p);
  log.scrollTop = 0;
  while(log.children.length > 60) log.removeChild(log.lastChild);
}

function pick(pool){
  const total = pool.reduce((s,e) => s + e[1], 0);
  let r = Math.random() * total;
  for(const e of pool){ r -= e[1]; if(r <= 0) return e; }
  return pool[0];
}

/* Los rivales se ajustan a lo que fichaste.
   Si subiste el ataque, los defensores y arqueros suben con vos; si subiste la
   defensa, suben los delanteros y mediocampistas. Pero suben a la MITAD de tu
   ritmo (ESCALA_RIVAL), así que fichar siempre te deja mejor parado que antes:
   te acerca al rival sin volverlo un trámite. */
/* El partido son 90 minutos repartidos en 9 jugadas: cada línea que elegís se
   come 10 del reloj. G.reloj sigue contando JUGADAS; los minutos son la cara
   visible de lo mismo. */
const MIN_POR_TURNO = 10;

/* Cuánto dura el cartel de gol en pantalla; tiene que coincidir con la
   animación `golpop` del CSS (.gf). Nada se muestra encima hasta que termine:
   el gol es el momento del partido y no se pisa con otro cartel.

   `ESPERA_GOL` le suma un margen para cubrir el borrado del elemento. Estuvo en
   1250 contra una animación de 1500 y el aviso de racha llena salía 250ms antes
   de tiempo, tapando el final del gol. */
const ESPERA_SIT = 2500;   // lo que queda un cartel de situación
/* Los carteles de **desenlace** —los que dicen qué pasó y traen el dibujo
   animado— duran más: el dibujo da tres vueltas de 1,15s y recién ahí queda
   congelado en el fotograma final. Con 2,5s se cortaba a mitad de la
   segunda. Se puede saltear con un toque, como todos. */
const ESPERA_FIN = 3500;
const ESPERA_GOL_POP = 3000;   // el gol dura un poco más: es el momento del partido
const DURA_GOL   = 1500;
const ESPERA_GOL = DURA_GOL + 120;

const BASE_ATK = 2, BASE_DEF = 1;
const ESCALA_RIVAL = 0.5;
const escalada = stat => Math.floor(Math.max(0, stat) * ESCALA_RIVAL);

function makeCell(lvl){
  const e = pick(POOLS[lvl]);
  const cell = { type:e[0] };
  if(e.length > 2){
    const T = TYPES[e[0]];
    /* El valor puede venir como rango `min,max` (uniforme) o como **lista
       explícita** `[2,3,3,4]`, que permite sesgar: ahí el 3 sale el doble que
       el 2 o el 4. Hace falta para que la dificultad de los duelos suba en las
       rondas finales sin saltos bruscos. */
    let v = Array.isArray(e[2]) ? e[2][rnd(e[2].length)] : e[2] + rnd(e[3] - e[2] + 1);
    /* 1v1: el valor del duelo es plano (2 a 5), sin escalar contra nadie — el
       mesa es compartido y escalarlo por los stats de uno sería injusto. */
    if(G.modo === 'duelo' && T.stat){
      cell.val = DUELO.VAL_MIN + rnd(DUELO.VAL_MAX - DUELO.VAL_MIN + 1);
    } else if(T.dana){
      /* CALAMBRE y LESIÓN tienen daño fijo —1 y 2— y no escalan con nada: son
         lo que son, y así se sabe de memoria lo que cuesta cada una sin leer el
         número.

         El resto de las cartas que lastiman sí pega más fuerte a medida que
         avanza el campeonato y cuanto mejor es tu equipo. Techo en 3 para que
         un solo golpe nunca vacíe el aguante entero. */
      cell.dmg = (e[0] === 'calambre' || e[0] === 'lesion')
        ? v
        : Math.min(3, v + escalada((G.atk - BASE_ATK + G.def - BASE_DEF) / 2));
    } else if(T.stat === 'atk'){
      cell.val = v + escalada(G.atk - BASE_ATK);
    } else if(T.stat === 'def'){
      cell.val = v + escalada(G.def - BASE_DEF);
      /* El DELANTERO RIVAL no pasa de 1 en las dos primeras rondas. Es la carta
         más cara del tablero —perder su mano a mano es gol en contra— y con el
         escalado por stats llegaba a 3 aunque el pool dijera 1, así que el
         arranque se volvía duro justo donde tiene que ser accesible. */
      if(e[0] === 'delantero' && lvl <= 2) cell.val = Math.min(cell.val, 1);
    } else {
      cell.val = v;
    }
  }
  return cell;
}

/* Crea una carta de un tipo dado, con los valores que le correspondan en ese
   nivel. Lo usa la garantía de situaciones de gol. */
function makeCellDe(tipo, lvl){
  const e = POOLS[lvl].find(x => x[0] === tipo);
  const cell = { type: tipo };
  if(e && e.length > 2){
    const T = TYPES[tipo];
    const v = Array.isArray(e[2]) ? e[2][rnd(e[2].length)] : e[2] + rnd(e[3] - e[2] + 1);
    // mismo tratamiento que makeCell: daño con techo, duelos con escalado rival
    /* En el 1v1 el valor del duelo es plano —2 a 5 al azar— porque la mesa es
       compartido: escalarlo contra los stats de uno lo volvería injusto para el
       otro. Y sin escalado, cada punto que repartiste se nota. */
    if(G.modo === 'duelo' && T.stat)
                                 cell.val = DUELO.VAL_MIN + rnd(DUELO.VAL_MAX - DUELO.VAL_MIN + 1);
    else if(T.dana)              cell.dmg = (tipo === 'calambre' || tipo === 'lesion')
                                   ? v
                                   : Math.min(3, v + escalada((G.atk - BASE_ATK + G.def - BASE_DEF) / 2));
    else if(T.stat === 'atk')    cell.val = v + escalada(G.atk - BASE_ATK);
    else if(T.stat === 'def'){
      cell.val = v + escalada(G.def - BASE_DEF);
      // mismo techo que en makeCell: el arranque tiene que ser accesible
      if(tipo === 'delantero' && lvl <= 2) cell.val = Math.min(cell.val, 1);
    }
    else                         cell.val = v;
  }
  return cell;
}

function buildGrid(lvl){
  const grid = [];
  for(let r=0;r<4;r++){
    const row = [];
    for(let c=0;c<4;c++) row.push(makeCell(lvl));
    grid.push(row);
  }
  // garantía de jugabilidad: al menos 4 cartas que no te lastimen
  const isSafe = cell => predict(cell).tone !== 'bad';
  let safe = grid.flat().filter(isSafe).length;
  let guard = 0;
  while(safe < 4 && guard++ < 60){
    const r = rnd(4), c = rnd(4);
    if(isSafe(grid[r][c])) continue;
    grid[r][c] = { type: chance(.5) ? 'hinchada' : 'fama' };
    safe++;
  }

  /* Todo partido tiene que poder terminar en gol para los dos lados. Sin esto,
     el sorteo podía dar una mesa sin una sola situación a favor —o sin
     ninguna en contra, que era el caso de la primera ronda— y el partido se
     resolvía solo por duelos. Se garantiza al menos una de cada lado. */
  const FAVOR  = ['penal','pasegol','corner','libre'];
  const CONTRA = ['penalC','pasegolC','cornerC','libreC'];
  [FAVOR, CONTRA].forEach(grupo => {
    if(grid.flat().some(cell => grupo.includes(cell.type))) return;
    // se pisa una carta anodina, nunca un duelo ni algo que ya define el gol
    const anodinas = [], resto = [];
    grid.forEach((row, r) => row.forEach((cell, c) => {
      if(FAVOR.includes(cell.type) || CONTRA.includes(cell.type)) return;  // no pisar la garantía del otro lado
      if(['offside','fama','publicidad','hinchada','calambre'].includes(cell.type)) anodinas.push([r, c]);
      else resto.push([r, c]);
    }));
    const pool = anodinas.length ? anodinas : resto;
    if(!pool.length) return;
    const [r, c] = pool[rnd(pool.length)];
    grid[r][c] = makeCellDe(grupo[rnd(grupo.length)], lvl);
  });

  /* ---- Tarjetas ----
     Amarillas: **0 o exactamente 2**. Una sola es una carta inofensiva
     disfrazada de amenaza —la amarilla solo duele de a dos, porque la segunda
     es roja— y tres serían una trampa imposible de esquivar.

     Rojas: **hasta 2**, pero **solo 1 si hay amarillas**. Un mesa con dos
     amarillas ya trae su propia forma de terminar expulsado; sumarle dos rojas
     encima es apilar castigos sobre la misma idea. */
  const pos = t => {
    const out = [];
    grid.forEach((row, r) => row.forEach((cell, c) => { if(cell.type === t) out.push([r, c]); }));
    return out;
  };
  const anodinas = () => {
    const out = [];
    grid.forEach((row, r) => row.forEach((cell, c) => {
      if(['offside','calambre','hinchada','fama','cooling','publicidad'].includes(cell.type)) out.push([r, c]);
    }));
    return out;
  };

  // 1) las amarillas van de a dos, o no van
  let am = pos('amarilla');
  if(am.length === 1){
    const libres = anodinas();
    if(libres.length){
      const [r, c] = libres[rnd(libres.length)];
      grid[r][c] = { type:'amarilla' };
    } else {
      grid[am[0][0]][am[0][1]] = makeCellDe('calambre', lvl);   // no hay compañera: no va
    }
  } else if(am.length > 2){
    am.slice(2).forEach(([r, c]) => { grid[r][c] = makeCellDe('calambre', lvl); });
  }

  // 2) las rojas: dos como mucho, y una sola si la mesa ya trae amarillas
  const hayAmarillas = pos('amarilla').length > 0;
  const topeRojas = hayAmarillas ? 1 : 2;
  const rj = pos('roja');
  if(rj.length > topeRojas){
    rj.slice(topeRojas).forEach(([r, c]) => { grid[r][c] = makeCellDe('calambre', lvl); });
  }


  /* ---- Techos de concentración ----
     Dos grupos de cartas se acumulaban demasiado en un misma mesa:
     los goles directos (hasta 14% de mesas con 3 o más) y los penales
     (hasta 25% con 3 o más). Un mesa con tres penales concentra tanta
     probabilidad de gol que deja de parecerse a un partido.

     El sobrante no desaparece: se convierte en una carta de **porcentaje del
     mismo lado**, así el volumen de situaciones se mantiene y lo único que baja
     es el gol garantizado. Y si quedan dos y las dos son a favor, una pasa al
     rival: el regalo no puede ser solo tuyo. */
  const techo = (favor, contra, reemplazoFav, reemplazoCon) => {
    const pos = tipos => {
      const out = [];
      grid.forEach((row, r) => row.forEach((cell, c) => { if(tipos.includes(cell.type)) out.push([r, c]); }));
      return out;
    };
    // 1) nunca más de dos en total
    let vueltas = 0;
    while(pos(favor.concat(contra)).length > 2 && vueltas++ < 20){
      // se saca primero de las de favor, que son las que más se acumulan
      const sobra = pos(favor).length ? pos(favor) : pos(contra);
      const [r, c] = sobra[rnd(sobra.length)];
      const esFav = favor.includes(grid[r][c].type);
      const rmp = esFav ? reemplazoFav : reemplazoCon;
      grid[r][c] = makeCellDe(rmp[rnd(rmp.length)], lvl);
    }
    // 2) si quedan dos y las dos son a favor, una pasa al rival
    if(pos(favor).length === 2 && pos(contra).length === 0){
      const [r, c] = pos(favor)[rnd(2)];
      grid[r][c] = makeCellDe(contra[rnd(contra.length)], lvl);
    }
  };

  techo(['jugada','autogol'], ['contra','encontra'],
        ['pasegol','corner','libre'], ['pasegolC','cornerC','libreC']);
  techo(['penal'], ['penalC'],
        ['pasegol','corner','libre'], ['pasegolC','cornerC','libreC']);

  /* Cuántos duelos trae la mesa: siempre **3 o 4**, sorteado. Sin esto el
     sorteo daba entre 0 y 8 según el nivel —6,4 de promedio en la primera
     ronda y 4,3 en la final, con un 15% de mesas con dos o menos— y los
     stats pintaban mucho o nada según la suerte del reparto.

     Fijarlo aplana esa curva: el plantel importa parecido en todas las rondas,
     y ningún partido se juega sin duelos ni se llena de ellos. */
  const DUELOS = ['defensor','arquero','medio','delantero'];
  /* Siempre **4 duelos**, y nunca todos del mismo lado: como mucho 3+1, y si no
     2+2. Con 3+0 —uno de cada cinco mesas antes de esta regla— uno de tus dos
     stats no se usaba en todo el partido. */
  const objetivo = 4;
  const D_FAV = ['defensor','arquero'];      // los resuelve tu ATAQUE
  const D_CON = ['medio','delantero'];       // los resuelve tu DEFENSA
  const posDe = filtro => {
    const out = [];
    grid.forEach((row, r) => row.forEach((cell, c) => { if(filtro(cell)) out.push([r, c]); }));
    return out;
  };

  let hay = posDe(cell => DUELOS.includes(cell.type));
  let vueltas = 0;

  // sobran: los de más pasan a cartas anodinas
  /* El sobrante se reparte entre cartas que sí hacen algo. Antes iba mitad y
     mitad con OFFSIDE, y como en la primera ronda sobran casi tres duelos, eso
     llenaba la mesa de cartas muertas. */
  /* La hinchada aparece una sola vez en la lista: repetida acá era la carta que
     más se reponía y por eso su porcentaje no bajaba aunque se le bajara el
     peso en el pool. */
  const relleno = ['hinchada','cooling','fama','publicidad','offside','cooling','ola'];
  while(hay.length > objetivo && vueltas++ < 40){
    const [r, c] = hay[rnd(hay.length)];
    grid[r][c] = makeCellDe(relleno[rnd(relleno.length)], lvl);
    hay = posDe(cell => DUELOS.includes(cell.type));
  }

  /* Faltan: se pisan cartas anodinas. Nunca las de gol —romperían la garantía
     de que todo mesa pueda terminar en gol para los dos— ni las tarjetas,
     que tienen su propia regla de convivencia. Si no quedan anodinas, se
     recurre a cualquier otra que no sea de esos dos grupos. */
  const GFAV = ['penal','pasegol','corner','libre'], GCON = ['penalC','pasegolC','cornerC','libreC'];
  const tarjetas = ['amarilla','roja'];
  const directos = ['jugada','autogol','contra','encontra'];
  const pisables = ['offside','hinchada','fama','publicidad','cooling','calambre'];
  while(hay.length < objetivo && vueltas++ < 40){
    let libres = posDe(cell => pisables.includes(cell.type));

    /* Último recurso: si no quedan anodinas —pasa cuando el techo de goles
       directos convirtió varias en cartas de porcentaje— se puede pisar una
       de porcentaje, siempre que sobre otra de ese mismo lado para no romper la
       garantía de que la mesa pueda terminar en gol para los dos. */
    if(!libres.length){
      const fav = posDe(cell => GFAV.includes(cell.type));
      const con = posDe(cell => GCON.includes(cell.type));
      libres = (fav.length > 1 ? fav : []).concat(con.length > 1 ? con : []);
    }
    if(!libres.length) libres = posDe(cell => directos.includes(cell.type));
    // el último recurso también respeta la garantía: nunca la única de un lado
    if(!libres.length) libres = posDe(cell =>
      !tarjetas.includes(cell.type) && !DUELOS.includes(cell.type) &&
      !(GFAV.includes(cell.type) && posDe(x => GFAV.includes(x.type)).length <= 1) &&
      !(GCON.includes(cell.type) && posDe(x => GCON.includes(x.type)).length <= 1));
    if(!libres.length) break;

    const [r, c] = libres[rnd(libres.length)];
    grid[r][c] = makeCellDe(DUELOS[rnd(DUELOS.length)], lvl);
    hay = posDe(cell => DUELOS.includes(cell.type));
  }

  /* Equilibrio de lados: si los cuatro quedaron del mismo lado, uno se pasa al
     otro. No se toca nada más — la cantidad ya está fijada arriba. */
  const posTipos = tipos => {
    const out = [];
    grid.forEach((row, r) => row.forEach((cell, c) => { if(tipos.includes(cell.type)) out.push([r, c]); }));
    return out;
  };
  for(let i = 0; i < 4; i++){
    const fav = posTipos(D_FAV), con = posTipos(D_CON);
    if(fav.length && con.length) break;                 // ya hay de los dos
    if(!fav.length && !con.length) break;               // no hay duelos: nada que equilibrar
    const sobra = fav.length ? fav : con;
    const faltan = fav.length ? D_CON : D_FAV;
    const [r, c] = sobra[rnd(sobra.length)];
    grid[r][c] = makeCellDe(faltan[rnd(faltan.length)], lvl);
  }



  /* ---- La plata de la mesa ----
     Como mucho **3 cartas** y **€30M en total**, repartidos en valores
     redondos: 5, 10, 15, 20 o 30. Antes eran rangos sueltos (€8-16M, €35-60M)
     que podían apilarse hasta €300M en una mesa, contra ítems que cuestan
     entre 10 y 40 — la plata dejaba de ser una decisión.

     El tipo de carta se elige según el monto, así el ícono dice cuánto vale
     sin leer el número: FAMA lo chico, PUBLICIDAD lo medio, SPONSOR el premio
     gordo. */
  /* En la FINAL la plata casi no sirve: no hay mercado después. Queda **una
     sola carta y siempre de FAMA**, que vale por el ⚡ que da, no por los
     euros. El SPONSOR —que es plata pura, sin racha— no aparece. */
  const esFinal = lvl === 5 && G.modo !== 'duelo';
  const enDuelo = G.modo === 'duelo';
  const TOPE_PLATA = enDuelo ? DUELO.PLATA_TOPE : 50;
  const MAX_CARTAS_PLATA = esFinal ? 1 : (enDuelo ? DUELO.PLATA_CARTAS : 4);
  const tipoPorMonto = m => m >= 30 ? 'sponsor' : m >= 15 ? 'publicidad' : 'fama';

  const posPlata = () => {
    const out = [];
    grid.forEach((row, r) => row.forEach((cell, c) => {
      if(['fama','publicidad','sponsor'].includes(cell.type)) out.push([r, c]);
    }));
    return out;
  };

  let plataPos = posPlata();

  // las que sobran del tope de tres pasan a cartas sin plata
  if(plataPos.length > MAX_CARTAS_PLATA){
    const util = ['hinchada','cooling','offside'];   // el techo de ayuda corre después
    plataPos.slice(MAX_CARTAS_PLATA).forEach(([r, c]) => {
      grid[r][c] = makeCellDe(util[rnd(util.length)], lvl);
    });
    plataPos = posPlata();
  }

  /* Los repartos posibles, uno por cantidad de cartas. Tabla explícita en vez
     de repartir al azar: así los montos son siempre 5/10/15/20/30 exactos y la
     mezcla se elige a mano en vez de salir sesgada por el algoritmo. */
  const REPARTOS = {
    1: [[5], [10], [15], [20], [30], [10], [15], [20]],
    2: [[5,5], [10,5], [15,5], [20,5], [10,10], [15,10], [20,10], [15,15], [30,10], [20,20], [30,20]],
    3: [[5,5,5], [10,5,5], [15,5,5], [10,10,5], [20,5,5], [10,10,10], [15,10,5], [20,15,10], [30,10,10], [20,20,10]],
    4: [[5,5,5,5], [10,5,5,5], [15,5,5,5], [10,10,5,5], [20,5,5,5], [10,10,10,5], [15,10,10,5], [20,10,10,5], [15,15,10,10], [20,15,10,5]]
  };
  if(plataPos.length){
    /* La final: una sola carta, nunca SPONSOR, y **al doble** —10 o 20— porque
       si sale una sola en todo el partido, que valga la pena jugarla. */
    /* El 1v1 es más generoso: son uno o tres partidos y un solo mercado, así que
       la plata tiene que alcanzar para algo. */
    const montos = esFinal
      ? [chance(.5) ? 10 : 20]
      : enDuelo
        ? plataPos.map(() => [10, 15, 20, 30][rnd(4)])
        : (REPARTOS[plataPos.length] || REPARTOS[3])[rnd((REPARTOS[plataPos.length] || REPARTOS[3]).length)];
    plataPos.forEach(([r, c], i) => {
      const m = montos[i] || 5;
      grid[r][c] = { type: tipoPorMonto(m), euros: m };
    });
  }

  /* OFFSIDE: dos como mucho, y esto va **al final** porque el ajuste de duelos
     también genera offside al repartir el sobrante. No es una carta
     inofensiva: te come una de las nueve jugadas sin darte nada, que es un
     castigo encubierto sin números en el cartel. */
  const sobranOff = [];
  grid.forEach((row, r) => row.forEach((cell, c) => { if(cell.type === 'offside') sobranOff.push([r, c]); }));
  if(sobranOff.length > 2){
    /* Se convierten en CALAMBRE o LESIÓN: son los únicos tipos sin techo propio.
       Mandarlos a plata o a hinchada rompería los topes que ya corrieron —esta
       cadena de reemplazos se pisa sola si uno no mira el orden. */
    const util = ['calambre','lesion'];
    sobranOff.slice(2).forEach(([r, c]) => { grid[r][c] = makeCellDe(util[rnd(util.length)], lvl); });
  }
  /* ---- Techo de las cartas que reponen aguante ----
     HINCHADA y COOLING BREAK, cinco como mucho. Va **al final de todo** porque
     media docena de ajustes anteriores —el relleno de duelos, el techo del
     offside, el de la plata— las usan como reemplazo, y puesto antes cualquiera
     de ellos lo rompía.

     El sobrante pasa a CALAMBRE, que es el único tipo sin techo propio: mandarlo
     a otra carta con tope reabriría la misma cadena. Y tiene sentido de juego:
     una mesa que curaba de más pasa a castigar un poco. */
  /* ---- Máximo 3 HINCHADA por mesa ----
     Da +1 ❤ sin condiciones y es la carta de ayuda más común: con cuatro juntas
     el aguante deja de ser un recurso escaso y las decisiones pierden peso.
     El sobrante pasa a COOLING BREAK, que hace lo mismo pero cuenta aparte, o
     a un castigo si la ayuda ya llegó a su techo. */
  const MAX_HINCHADA = 3;
