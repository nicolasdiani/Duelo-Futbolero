  const hinchadas = [];
  grid.forEach((row, r) => row.forEach((cell, c) => {
    if(cell.type === 'hinchada') hinchadas.push([r, c]);
  }));
  if(hinchadas.length > MAX_HINCHADA){
    hinchadas.slice(MAX_HINCHADA).forEach(([r, c], i) => {
      grid[r][c] = makeCellDe(i === 0 ? 'cooling' : 'calambre', lvl);
    });
  }

  const MAX_AYUDA = 5;
  const ayudaPos = [];
  grid.forEach((row, r) => row.forEach((cell, c) => {
    if(['hinchada','cooling'].includes(cell.type)) ayudaPos.push([r, c]);
  }));
  if(ayudaPos.length > MAX_AYUDA){
    ayudaPos.slice(MAX_AYUDA).forEach(([r, c]) => { grid[r][c] = makeCellDe('calambre', lvl); });
  }

  /* ---- Equilibrio de cartas de gol ----
     Dos reglas, las dos verificadas al final del armado:

       · **máximo 5 por lado** — una mesa con 7 en contra es un partido
         perdido antes de elegir la primera fila
       · **si un lado llega a 5, el otro tiene al menos 2** — para que un
         mesa cargado hacia un lado siga teniendo respuesta

     El sorteo llegaba a 10 de un lado y a 0 del otro. */
  const GOL_FAV = ['jugada','autogol','penal','pasegol','corner','libre'];
  const GOL_CON = ['contra','encontra','penalC','pasegolC','cornerC','libreC'];
  const MAX_GOL_LADO = 5, MIN_SI_TOPE = 2;

  /* Lo que sobra pasa a cartas sin tope propio, para no reabrir la cadena de
     reemplazos que ya se resolvió más arriba. */
  const RELLENO = ['calambre','lesion','ola'];

  [GOL_FAV, GOL_CON].forEach(lado => {
    const pos = posDe(c => lado.includes(c.type));
    if(pos.length > MAX_GOL_LADO){
      pos.slice(MAX_GOL_LADO).forEach(([r, c]) => {
        grid[r][c] = makeCellDe(RELLENO[rnd(RELLENO.length)], lvl);
      });
    }
  });

  /* Si un lado quedó en el tope y el otro tiene menos de dos, se le suman
     cartas al lado flaco tomándolas del relleno. */
  [[GOL_FAV, GOL_CON], [GOL_CON, GOL_FAV]].forEach(([lleno, flaco]) => {
    if(posDe(c => lleno.includes(c.type)).length < MAX_GOL_LADO) return;
    while(posDe(c => flaco.includes(c.type)).length < MIN_SI_TOPE){
      const libres = posDe(c => ['hinchada','cooling','ola','offside','calambre','lesion','noche'].includes(c.type));
      if(!libres.length) break;
      const [r, c] = libres[rnd(libres.length)];
      grid[r][c] = makeCellDe(flaco[rnd(flaco.length)], lvl);
    }
  });

  /* ---- Un solo CAÑO por mesa ----
     Da +2 de racha sin condiciones, que es lo mismo que la OLA: dos en la misma
     mesa te regalan la posibilidad de gol sin haber ganado un duelo. */
  const canos = posDe(c => c.type === 'cano');
  if(canos.length > 1){
    /* El sobrante pasa a CALAMBRE o LESIÓN, no a HINCHADA: esa tiene su propio
       techo y este bloque corre después, así que lo rompía. */
    const libres = ['calambre','lesion'];
    canos.slice(1).forEach(([r, c]) => { grid[r][c] = makeCellDe(libres[rnd(libres.length)], lvl); });
  }

  /* ---- Los duelos, siempre 2 y 2 ----
     Antes bastaba con que hubiera al menos uno de cada lado, así que una mesa
     podía traer 3 de ataque y 1 de defensa. Eso hace que el refuerzo que
     elegiste importe por azar y no por decisión: con 2 y 2 fijos, subir ataque
     o defensa vale exactamente lo mismo en todas las mesas. */
  for(let i = 0; i < 6; i++){
    const fav = posDe(c => D_FAV.includes(c.type));
    const con = posDe(c => D_CON.includes(c.type));
    if(fav.length === 2 && con.length === 2) break;
    if(fav.length > 2){
      const [r, c] = fav[rnd(fav.length)];
      grid[r][c] = makeCellDe(D_CON[rnd(D_CON.length)], lvl);
    } else if(con.length > 2){
      const [r, c] = con[rnd(con.length)];
      grid[r][c] = makeCellDe(D_FAV[rnd(D_FAV.length)], lvl);
    } else break;
  }

  /* ---- Garantía de dinero, al final de todo ----
     Fuera de la final **siempre hay al menos una carta de dinero**. Sin esto,
     un 19% de los mesas no traía ninguna y una mala racha de sorteos te
     dejaba sin plata para el mercado, que es donde se arma el equipo.

     Va acá, después de todos los techos, porque puesta antes los ajustes
     posteriores la pisaban: quedaba un 1% de mesas sin plata igual.

     La final no entra: ahí la plata no compra nada, así que puede traer o no
     traer y queda librada al azar. */
  if(!posPlata().length && !esFinal){
    const libres = [];
    grid.forEach((row, r) => row.forEach((cell, c) => {
      // se cambia una carta de relleno, nunca un gol, un duelo ni una tarjeta
      if(['hinchada','cooling','ola','offside','calambre'].includes(cell.type)) libres.push([r, c]);
    }));
    /* Si no quedó ninguna de relleno, se usa cualquiera que no sea un gol, un
       duelo ni una tarjeta: esas tres tienen garantías propias y romperlas para
       meter plata saldría más caro de lo que vale. */
    if(!libres.length){
      const intocables = ['jugada','autogol','penal','pasegol','corner','libre',
                          'contra','encontra','penalC','pasegolC','cornerC','libreC',
                          'defensor','arquero','medio','delantero',
                          'amarilla','roja'];
      grid.forEach((row, r) => row.forEach((cell, c) => {
        if(!intocables.includes(cell.type)) libres.push([r, c]);
      }));
    }
    /* Último recurso: una mesa puede llegar acá con las 16 cartas ocupadas
       por goles, duelos y tarjetas. Ahí se saca **un gol que esté repetido**,
       dejando siempre al menos uno de cada lado. */
    if(!libres.length){
      const FAV = ['jugada','autogol','penal','pasegol','corner','libre'];
      const CON = ['contra','encontra','penalC','pasegolC','cornerC','libreC'];
      [FAV, CON].forEach(lado => {
        if(libres.length) return;
        const pos = [];
        grid.forEach((row, r) => row.forEach((cell, c) => {
          if(lado.includes(cell.type)) pos.push([r, c]);
        }));
        // hace falta que sobren de verdad: con 3 o más, sacar una deja 2
        if(pos.length > 2) libres.push(pos[rnd(pos.length)]);
      });
    }
    if(libres.length){
      const [r, c] = libres[rnd(libres.length)];
      grid[r][c] = makeCellDe('fama', lvl);
      grid[r][c].euros = chance(.5) ? 5 : 10;
    }
  }

  /* ---- Ninguna fila con las 4 cartas haciendo lo mismo ----
     Elegís la fila, no la carta. Si las cuatro hacen lo mismo, la elección
     deja de tener sentido: da igual cuál te toque. Pasaba en el 1% de los
     mesas, y las de gol eran las más frecuentes.

     Se resuelve **intercambiando** con otra fila en vez de reemplazando: así
     la mesa conserva exactamente las mismas cartas y ninguna garantía
     global —los 4 duelos, el tope de plata, el equilibrio de goles— se toca.

     Va al final de todo porque los ajustes anteriores crean cartas nuevas:
     el equilibrio de goles convierte lo que sobra en CALAMBRE o LESIÓN, y así
     armaba filas de cuatro castigos después de que este bloque ya había
     pasado. */
  const FAMILIA = {
    jugada:'golF', autogol:'golF', penal:'golF', pasegol:'golF', corner:'golF', libre:'golF',
    contra:'golC', encontra:'golC', penalC:'golC', pasegolC:'golC', cornerC:'golC', libreC:'golC',
    defensor:'duelo', arquero:'duelo', medio:'duelo', delantero:'duelo',
    fama:'plata', publicidad:'plata', sponsor:'plata',
    hinchada:'aguante', cooling:'aguante',
    ola:'racha', noche:'racha', cano:'racha',
    calambre:'castigo', lesion:'castigo', amarilla:'castigo', roja:'castigo'
  };
  const fam = cell => FAMILIA[cell.type] || cell.type;

  for(let intento = 0; intento < 8; intento++){
    let toco = false;
    grid.forEach((row, r) => {
      const cuenta = {};
      row.forEach(c => { cuenta[fam(c)] = (cuenta[fam(c)] || 0) + 1; });
      const repetida = Object.keys(cuenta).find(k => cuenta[k] === 4);
      if(!repetida) return;

      // se busca en otra fila una carta de familia distinta para cambiarla
      for(let r2 = 0; r2 < grid.length && !toco; r2++){
        if(r2 === r) continue;
        for(let c2 = 0; c2 < grid[r2].length && !toco; c2++){
          if(fam(grid[r2][c2]) === repetida) continue;
          // que el intercambio no deje a la otra fila con cuatro iguales
          const otras = grid[r2].filter((_, i) => i !== c2);
          if(otras.every(x => fam(x) === repetida)) continue;
          const c1 = rnd(row.length);
          const tmp = grid[r][c1];
          grid[r][c1] = grid[r2][c2];
          grid[r2][c2] = tmp;
          toco = true;
        }
      }
    });
    if(!toco) break;
  }

  return grid;
}

/* ---------------- predicción del resultado ----------------
   Esto es el corazón de la interfaz: el jugador ve QUÉ le haría cada carta
   antes de elegir la fila. La suerte está en cuál te toca, no en qué hace.  */
/* Lo que cuesta perder un duelo: **la diferencia**. Si el defensor vale 4 y tu
   ataque es 2, te pasa por encima por 2 y eso son 2 de aguante. Perder por poco
   duele poco; que te pasen por arriba duele de verdad.

   Techo en 3, igual que el resto del daño: ningún golpe solo puede vaciarte el
   aguante entero de una. En las tres primeras rondas la diferencia es siempre 1,
   así que esto no cambia nada del arranque — se nota recién en semifinal y
   final, donde los rivales empiezan a sacarte dos y tres cuerpos. */
/* Resuelve un duelo. Con tu stat por encima o por debajo, se resuelve solo;
   **empatado**, se juega el uno contra uno. */
async function resolverDuelo(cell, mio){
  if(mio > cell.val)  return true;
  if(mio < cell.val)  return false;
  return await manoAMano(cell.type, mio, cell.val);
}

/* La diferencia manda en los cuatro duelos y de los dos lados, sin excepciones:
   ganar carga racha, perder gasta aguante, y cuánto depende **de por cuánto**.
   Perder contra un arquero de 3 teniendo ataque 2 cuesta 1, no 2.

   Rango 1-3 de los dos lados. Hubo una versión con piso de 2 para el arquero y
   el delantero —los dos que deciden el marcador— y se sacó: rompía la única
   regla que el jugador puede deducir mirando los números del cartel. */
/* El mano a mano de los duelos que definen el marcador vale **doble**: con
   stats iguales, errarle al arquero cuesta 2 ❤ y cortar al delantero da 2 ⚡.
   Es el momento más caro de la mesa y se juega a cara o cruz — que pese como
   los demás sería no distinguirlo.

   Fuera del empate manda la diferencia, como en los otros dos duelos. */
function costoDuelo(cell){
  const mio = TYPES[cell.type].stat === 'atk' ? ATK() : DEF();
  if(cell.type === 'arquero' && mio === cell.val) return 2;
  return clamp(cell.val - mio, 1, 3);
}

/* El espejo exacto: ganarle por dos cuerpos a un defensor levanta al equipo el
   doble que ganarle raspando, igual que perder por dos duele el doble. */
function premioDuelo(cell){
  const mio = TYPES[cell.type].stat === 'atk' ? ATK() : DEF();
  /* El empate del DELANTERO RIVAL paga **3 de racha**: perderlo es gol en
     contra, el peor resultado de la mesa, así que el premio tiene que estar a
     la altura del riesgo. Con 2 el 50/50 no compensaba y la carta era solo un
     peligro.

     Con 3 alcanza para la columna, que cuesta 3: ganarlo te habilita el ataque
     dirigido en la misma jugada. */
  if(cell.type === 'delantero' && mio === cell.val) return 3;
  return clamp(mio - cell.val, 1, 3);
}

/* El cartel de un duelo tiene tres estados, no dos: ganado, perdido, y el
   empate, que ahora es un uno contra uno al 50%. El empate se avisa antes de
   elegir la fila — es información que cambia la decisión. */
function duelo(cell, mio, gana, pierde, empate, premio){
  if(mio > cell.val)
    return { label: gana + '<span class="efe"><span class="ra">+' + (premio || premioDuelo(cell)) + ' <i class="ir"></i></span></span>', tone:'good' };
  if(mio < cell.val)
    return { label: pierde, tone:'bad' };
  /* El empate dice **qué se juega**, no solo que es 50/50. En el arquero y el
     delantero lo que está en el aire es el marcador, y eso cambia por completo
     si conviene meterse en esa fila.

     En el empate solo el DELANTERO RIVAL lleva naranja: es el único donde
     perder significa **gol en contra**. Los otros tres van en amarillo.

     El arquero estuvo un tiempo en verde porque ganarlo es GOL TUYO, pero se
     volvió atrás: en el resto de la mesa el verde significa **te suma**, sin
     condiciones. Acá se puede ganar el gol y también perder **2 ❤**, el
     castigo más caro de todos los duelos. Un 50/50 no puede verse igual que
     una carta segura. */
  /* El cartel lleva **el nombre del mini juego que va a salir**, no un `50/50`
     genérico. Es el mismo título que aparece al abrirse el pop-up, así las dos
     pantallas se conectan; y como los cuatro son 50/50 siempre, el número era
     redundante una vez que aprendés que mini juego = moneda al aire. Lo que sí
     cambia entre uno y otro es qué se juega, y eso está en la línea de abajo. */
  const mj = (MANOAMANO[cell.type] || {}).tit || 'MINI JUEGO';
  /* Encima del nombre va **MINI JUEGO**: el nombre solo (LA MARCA, EL CRUCE) no
     alcanzaba para saber que hay que hacer algo, y esa es la diferencia con las
     demás cartas —acá no se resuelve solo, elegís un lado. */
  const etiqueta = '<span class="mj-lb"><i class="mj-ico">🎮</i>MINI JUEGO</span>' +
                   '<span class="mj">' + mj + '</span>';

  const caro = cell.type === 'delantero';
  return { label: etiqueta + '<span class="efe">' + empate + '</span>', tone: caro ? 'hot' : 'risk' };
}

function predict(cell){
  if(!cell) return { label:'', tone:'neutral' };
  const t = cell.type;

  // Todo lo que carga la racha se marca con ⚡ en dorado, el mismo color del
  // medidor. El resto del cartel conserva su tono (verde, rojo, dorado), así
  // que de un vistazo se ve qué te da racha aunque la carta sea mala.
  const R = ' <span class="ra">+<i class="ir"></i></span>';

  if(t === 'defensor')  return duelo(cell, ATK(), 'PASA', '-' + costoDuelo(cell) + ' <i class="ih"></i>',
                                     '<span class="ra">+' + premioDuelo(cell) + ' <i class="ir"></i></span> o <b>-' + costoDuelo(cell) + ' <i class="ih"></i></b>');
  if(t === 'arquero')   return duelo(cell, ATK(), 'GOL',  '-' + costoDuelo(cell) + ' <i class="ih"></i>',
                                     '<span class="esgol">⚽ GOL</span> o <b>-' + costoDuelo(cell) + ' <i class="ih"></i></b>');
  if(t === 'medio')     return duelo(cell, DEF(), 'ROBO', '-' + costoDuelo(cell) + ' <i class="ih"></i>',
                                     '<span class="ra">+' + premioDuelo(cell) + ' <i class="ir"></i></span> o <b>-' + costoDuelo(cell) + ' <i class="ih"></i></b>');
  if(t === 'delantero') return duelo(cell, DEF(), 'CORTE',
                                     'GOL RIVAL<span class="efe"><b>-' + costoDuelo(cell) + ' <i class="ih"></i></b></span>',
                                     '<span class="ra">+' + premioDuelo(cell) + ' <i class="ir"></i></span> o <b>⚽ GOL RIVAL</b>');
  if(t === 'jugada')    return { label:'GOL' + R, tone:'good' };
  if(t === 'autogol')   return { label:'GOL' + R, tone:'good' };
  if(t === 'contra')    return { label:'GOL RIVAL<span class="efe"><b>-1 <i class="ir"></i></b></span>', tone:'bad' };
  if(t === 'encontra')  return { label:'GOL RIVAL<span class="efe"><b>-1 <i class="ir"></i></b></span>', tone:'bad' };
  if(t === 'penal')     return { label:'50% GOL<span class="efe"><span class="ra">+1 <i class="ir"></i></span> o <b>-1 <i class="ih"></i></b></span>', tone:'gol' };
  if(t === 'pasegol')   return { label:'40% GOL<span class="efe"><span class="ra">+1 <i class="ir"></i></span> o <b>-1 <i class="ih"></i></b></span>', tone:'gol' };
  if(t === 'libre')     return { label:'35% GOL<span class="efe"><span class="ra">+1 <i class="ir"></i></span> o <b>-1 <i class="ih"></i></b></span>', tone:'gol' };
  if(t === 'corner')    return { label:'30% GOL<span class="efe"><span class="ra">+1 <i class="ir"></i></span> o <b>-1 <i class="ih"></i></b></span>', tone:'gol' };
  if(t === 'penalC')    return { label:'50% RIVAL<span class="efe"><b>-1 <i class="ir"></i></b> o <span class="ra">+1 <i class="ir"></i></span></span>', tone:'bad' };
  if(t === 'pasegolC')  return { label:'40% RIVAL<span class="efe"><b>-1 <i class="ir"></i></b> o <span class="ra">+1 <i class="ir"></i></span></span>', tone:'bad' };
  if(t === 'cornerC')   return { label:'30% RIVAL<span class="efe"><b>-1 <i class="ir"></i></b> o <span class="ra">+1 <i class="ir"></i></span></span>', tone:'bad' };
  if(t === 'libreC')    return { label:'35% RIVAL<span class="efe"><b>-1 <i class="ir"></i></b> o <span class="ra">+1 <i class="ir"></i></span></span>', tone:'bad' };
  if(t === 'hinchada')  return { label:'+1 <i class="ih"></i>', tone:'good' };
  if(t === 'cano')      return { label:'<span class="ra">+2 <i class="ir"></i></span>', tone:'good' };
  if(t === 'ola')       return { label:'<span class="ra">+2 <i class="ir"></i></span>', tone:'good' };
  if(t === 'noche')     return { label:'<span class="ra">RACHA LLENA</span>', tone:'good' };
  if(t === 'cooling')   return { label:'+1 <i class="ih"></i>', tone:'good' };
  if(t === 'calambre')  return { label:'-' + (cell.dmg || 1) + ' <i class="ih"></i>', tone:'bad' };
  if(t === 'fama')      return { label:'+' + plata(cell.euros) + '<span class="efe"><span class="ra">+1 <i class="ir"></i></span></span>', tone:'coin' };
  if(t === 'publicidad')return { label:'+' + plata(cell.euros) + '<span class="efe"><span class="ra">+1 <i class="ir"></i></span></span>', tone:'coin' };
  if(t === 'sponsor')   return { label:'+' + plata(cell.euros) + '', tone:'coin' };
  // La amarilla siempre resta aguante, no es un riesgo: va en rojo como todo
  // lo que lastima. El dorado se reserva para lo que puede salir bien o mal.
  if(t === 'amarilla')  return G.amarillas >= 1 ? { label:'¡ROJA! -3 <i class="ih"></i>', tone:'bad' } : { label:'-1 <i class="ih"></i><span class="efe">la 2ª es roja</span>', tone:'bad' };
  if(t === 'roja')      return { label:'-3 <i class="ih"></i><span class="efe"><b>-1 <i class="ih"></i> de máximo</b></span>', tone:'bad' };
  if(t === 'lesion')    return { label:'-' + (cell.dmg || 2) + ' <i class="ih"></i>', tone:'bad' };
  if(t === 'offside')   return { label:'NADA', tone:'neutral' };
  return { label:'', tone:'neutral' };
}


/* ---------------- render ---------------- */
function render(){
  const R = RONDAS[G.ronda];
  /* En el 1v1 los paneles laterales muestran a los dos jugadores enteros; en el
     campeonato, los del modo de siempre. */
  const duelo = G.modo === 'duelo' && G.J.length === 2;
  ['jugL','jugV'].forEach((id, i) => {
    const el = $(id);
    if(!el) return;
    el.style.display = duelo ? 'block' : 'none';
    if(duelo) el.innerHTML = panelJugador(i);
  });
  ['panelItems','panelEquipo','panelPlantel'].forEach(id => {
    const el = $(id);
    if(el) el.style.display = duelo ? 'none' : '';
  });

  /* Las copas de la racha actual. Solo aparecen si hay al menos una: el que
     todavía no ganó ninguna no necesita un hueco vacío recordándoselo. */
  const copasBox = $('mqCopas');
  if(copasBox){
    const n = G.modo === 'duelo' ? 0 : G.copas;
    copasBox.style.display = n ? 'flex' : 'none';
    if(n) copasBox.innerHTML =
      '<span class="mqc-ico">' + '🏆'.repeat(Math.min(n, 4)) + '</span>' +
      (n > 4 ? '<span class="mqc-x">x' + n + '</span>' : '') +
      '<span class="mqc-lb">' + (n === 1 ? 'CAMPEONATO' : 'CAMPEONATOS') + '</span>';
  }

  $('roundName').textContent = G.modo === 'duelo'
    ? (G.serie.alMejorDe > 1 ? 'PARTIDO ' + G.serie.partido + ' · ' : '') +
      'JUEGA ' + G.J[G.turno].club
    : R.name;
  /* En el 1v1 la marquesina muestra a los dos jugadores en su lado fijo —el J1
     siempre a la izquierda— y se marca de quién es el turno, no quién es "el
     jugador": los dos lo son. */
  if(G.modo === 'duelo'){
    const [a, b] = G.J;
    $('nomU').textContent = a.club;
    $('nomC').textContent = b.club;
    $('escU').innerHTML = escudoDe(a.escudo, 26);
    $('escC').innerHTML = escudoDe(b.escudo, 26);
    $('m-score').classList.toggle('turno-0', G.turno === 0);
    $('m-score').classList.toggle('turno-1', G.turno === 1);
  } else {
    $('nomU').textContent = G.club;
    $('nomC').textContent = R.rival;
    $('escU').innerHTML = miEscudo(26);
    $('escC').innerHTML = escudoDe(G.escudoRival, 26);
  }
  if(G.modo === 'duelo'){
    /* Los goles se leen del jugador: `scoreU`/`scoreC` los escriben ahí en el
       mismo momento del gol, así que no dependen de cuándo cierra el turno. */
    $('gU').textContent = G.J[0].goles;
    $('gC').textContent = G.J[1].goles;
  } else {
    $('gU').textContent = G.gU;
    $('gC').textContent = G.gC;
  }
  renderCronometro();
  $('dinero').textContent = plata(G.dinero);

  $('atk').textContent = ATK();
  $('def').textContent = DEF();

  const artA = ARTSRC('ico_aguante');
  let h = '';
  for(let i=0;i<G.aguanteMax;i++){
    const on = i < G.aguante;
    h += artA
      ? '<img class="med-art ' + (on ? 'on' : 'off') + '" src="' + artA + '" alt="">'
      : '<span class="' + (on ? 'heart-on' : 'heart-off') + '"><i class="ih"></i></span>';
  }
  $('hearts').innerHTML = h;
  // con un solo corazón el medidor late: es el aviso de que el próximo golpe funde
  $('hearts').classList.toggle('ultimo', G.aguante === 1);

  const artR = ARTSRC('ico_racha');
  let rr = '';
  for(let i=0;i<G.rachaMax;i++){
    const on = i < G.racha;
    rr += artR
      ? '<img class="med-art ' + (on ? 'on' : 'off') + '" src="' + artR + '" alt="">'
      : '<span class="' + (on ? 'ray-on' : 'ray-off') + '"><i class="ir"></i></span>';
  }
  $('racha').innerHTML = rr;
  // la racha llena se queda marcada hasta que la gastes
  $('m-racha').classList.toggle('lista', G.racha >= G.rachaMax && G.phase === 'match');

  // La amarilla acumulada se muestra en el panel del equipo, no perdida en una
  // línea de texto: cambia el valor de una carta entera de la mesa y hay que
  // tenerla presente al elegir.
  const conAmarilla = G.amarillas > 0 && G.phase === 'match';
  $('m-amarilla').style.display = conAmarilla ? 'flex' : 'none';
  $('cards').innerHTML = conAmarilla ? '🟨 amarilla acumulada' : '';

  renderBoard();
  renderItems();
}

function renderBoard(){
  const board = $('board');
  board.innerHTML = '';

  G.grid.forEach((row, r) => {
    const libres = row.filter(x => x && !x.lock).length;
    const rowEl = document.createElement('div');
    rowEl.className = 'row';
    const usable = libres > 0 && !G.busy && !G.targeting;

    const pickBtn = document.createElement('button');
    pickBtn.className = 'row-pick';
    pickBtn.disabled = !usable;
    pickBtn.innerHTML = '<span class="pk">F' + (r+1) + '</span>' +
                        '<span class="pc">' + (libres ? Math.round(100/libres) + '%' : '—') + '</span>';
    rowEl.appendChild(pickBtn);

    const cells = document.createElement('div');
    cells.className = 'cells';
    row.forEach((cell, c) => cells.appendChild(makeCellEl(cell, r, c)));
    rowEl.appendChild(cells);

    // toda la fila se resalta y se elige: el botón y las cartas por igual
    if(usable){
      const marcar = on => {
        rowEl.classList.toggle('hl', on);
        pickBtn.classList.toggle('activo', on);   // el botón se enciende igual
      };
      rowEl.onmouseenter = () => { if(!G.armed) marcar(true); };
      rowEl.onmouseleave = () => { if(!isArmed('row', r)) marcar(false); };
      rowEl.onclick = () => tapLine('row', r);
      rowEl.style.cursor = 'pointer';
    }
    if(isArmed('row', r)){ rowEl.classList.add('hl'); pickBtn.classList.add('activo'); }

    board.appendChild(rowEl);
  });

  // selección por columna: solo con la racha llena
  const colBar = $('colPicks');
  const rachaReady = G.racha >= G.rachaMax;          // habilita la situación de gol
  const colReady   = G.racha >= COSTO_COLUMNA;      // habilita las columnas
  const libre = !G.busy && !G.targeting;

  /* Las dos salidas de la racha se muestran SIEMPRE, apagadas mientras no las
     tengas. Escondiéndolas, un jugador nuevo no se enteraba de que existían
     hasta la primera vez que llenaba la racha —y eso puede tardar partidos—.
     Apagadas y con el contador a la vista, se entiende desde el minuto 0 qué
     hay que juntar y para qué sirve. */
  const banner = $('golBanner');
  banner.style.display = 'flex';
  banner.disabled = !rachaReady || !libre;
  banner.classList.toggle('lista', rachaReady);
  banner.querySelector('.gb-s').innerHTML = rachaReady
    ? 'Cambiás la racha por una llegada clara · 51% de gol · gasta una jugada'
    : 'Necesitás la racha llena (' + G.rachaMax + ' <i class="ir"></i>) · 51% de gol · gasta una jugada';
  banner.querySelector('.gb-go').innerHTML = rachaReady
    ? 'USAR'
    : '<i class="ir"></i> ' + G.racha + '/' + G.rachaMax;
  /* El toque abre la ficha con las cinco posibilidades, no cobra directo: la
     racha llena es el recurso más caro del partido y conviene saber qué puede
     salir antes de gastarla. */
  banner.onclick = (ev) => { ev.stopPropagation(); abrirFichaGol(banner); };

  colBar.style.display = 'flex';
  colBar.classList.toggle('lista', colReady);
  {
    colBar.innerHTML = '';
    for(let c=0;c<4;c++){
      const alive = jugables('col', c).length;
      const usable = colReady && alive > 0 && libre;
      const b = document.createElement('button');
      b.className = 'col-pick';
      b.disabled = !usable;
      /* innerHTML y no textContent: el rayo va como etiqueta y `textContent`
         la escaparía, mostrando el markup en pantalla. */
      b.innerHTML = 'C' + (c+1) + (alive ? ' · ' + Math.round(100/alive) + '%' : '') +
                    '  −' + COSTO_COLUMNA + '<i class="ir"></i>';
      b.onmouseenter = () => { if(usable && !G.armed) markCol(c, true); };
      b.onmouseleave = () => { if(!isArmed('col', c)) markCol(c, false); };
      b.onclick = () => tapLine('col', c);
      colBar.appendChild(b);
    }
  }
  if(G.armed && G.armed.kind === 'col') markCol(G.armed.idx, true);

  // mientras la racha esté cargada, la línea de ayuda lo recuerda
  if(!G.busy && !G.targeting && !G.armed && G.phase === 'match'){
    $('hint').innerHTML = rachaReady
      ? '<i class="ir"></i> <b>Racha llena.</b> Seguí con una FILA, o gastala en la <b>situación de gol</b> o una <b>columna</b>.'
      : 'Elegí una FILA. El azar decide qué carta te toca.';
  }
}

/* Con el dedo no hay hover, así que la selección es en dos tiempos: el primer
   toque resalta la línea entera, el segundo la confirma. Con mouse el click
   elige directo — obligar a dos clicks ahí sería una molestia.

   No preguntamos "¿es un celular?" sino "¿con qué me acaban de tocar?": el
   media query de hover miente en tablets, en notebooks con pantalla táctil y
   en los emuladores. El pointerType del evento real nunca se equivoca. */
let ULTIMO_PUNTERO = 'mouse';
document.addEventListener('pointerdown', e => {
  ULTIMO_PUNTERO = e.pointerType || 'mouse';
}, true);

function isArmed(kind, idx){
  return !!G.armed && G.armed.kind === kind && G.armed.idx === idx;
}

function tapLine(kind, idx){
  if(G.busy || G.targeting) return;
  /* Siempre en dos pasos, con dedo o con mouse: el primer toque **resalta** la
     línea —los colores dicen qué te hace cada carta— y el segundo largo el
     sorteo. Antes con mouse iba directo, así que el resaltado no se llegaba a
     leer y el sorteo arrancaba antes de decidir. */
  if(isArmed(kind, idx)){
    G.armed = null;
    return chooseLine(kind, idx);
  }
  G.armed = { kind, idx };
  /* Acá va el nombre corto, que es el que dice el botón: 'tocá otra vez F2' se
     corresponde con lo que el jugador está mirando. En el relato, en cambio,
     los nombres van largos porque son frases. */
  $('hint').innerHTML = 'Tocá otra vez ' + (kind === 'row' ? 'F' : 'C') +
                        (idx + 1) + ' para <b>confirmar</b>.';
  render();
}

function makeCellEl(cell, r, c){
  const el = document.createElement('div');
  el.className = 'cell';
  el.dataset.r = r; el.dataset.c = c;
  if(!cell){ el.classList.add('empty'); return el; }

  const T = TYPES[cell.type];
  const p = predict(cell);
  if(cell.lock) el.classList.add('lock');   // se sigue viendo, pero no puede salir
  /* La carta se lee de arriba abajo: qué es, contra qué te medís, y qué te
     deja. El valor del duelo va arriba a la derecha con su etiqueta —ATAQUE o
     DEFENSA— porque es lo primero que hay que comparar con tus stats; el
     efecto va abajo, separado por una línea, porque es la consecuencia. */
  const esAtk = T.stat === 'atk';
  if(!cell.val) el.classList.add('sin-val');   // sin duelo, el título va centrado

  /* El tono ya lo calcula `predict`: bueno, malo, riesgo o plata. Se guarda como
     clase para que al resaltar la fila cada carta se pinte según lo que te
     hace, en vez de todas del mismo color. En los duelos el tono depende de tus
     stats —ganás verde, perdés rojo, empatás amarillo—, así que el resaltado
     también te dice cómo venís. */
  el.classList.add('tono-' + (p.tone === 'coin' ? 'good' : p.tone));
  el.innerHTML =
    '<div class="c-top">' +
      '<span class="c-nm">' + T.nm + '</span>' +
      (cell.val ? '<span class="c-val ' + (esAtk ? 'r' : 'b') + '">' + cell.val + '</span>' : '') +
    '</div>' +
    '<div class="c-ico">' + (artCarta(cell.type)
        ? '<img class="c-art" src="' + artCarta(cell.type) + '" alt="">'
        : T.ico) + '</div>' +
    '<div class="c-out ' + p.tone + '">' + p.label + '</div>';

  if(G.targeting === 'revision' && cell.lock){
    el.classList.add('target', 'destrabable');
    el.onclick = () => useVarOn(r, c);
  }
  return el;
}

function markCol(c, on){
  document.querySelectorAll('.cell').forEach(el => {
    if(Number(el.dataset.c) === c) el.classList.toggle('colhl', on);
  });
  // el botón de la columna se enciende junto con sus cartas, igual que el de fila
  document.querySelectorAll('.col-pick').forEach((b, i) => {
    if(i === c) b.classList.toggle('activo', on);
  });
}

function renderItems(){
  const bar = $('itemBar');
  bar.innerHTML = '';
  const owned = Object.keys(ITEMS).filter(k => G.items[k] > 0);
  if(!owned.length){
    /* Corto a propósito: en mobile la columna de ítems es angosta y el texto
       largo la ensanchaba, empujando al resto de la fila. Dónde se compran ya
       lo explica el tutorial y el propio mercado. */
    bar.innerHTML = '<span class="no-items">SIN ÍTEMS</span>';
    return;
  }
  owned.forEach(k => {
    const I = ITEMS[k];
    const b = document.createElement('button');
    const inutil = G.phase === 'match' ? itemInutil(k) : null;
    b.className = 'item' + (G.targeting === k ? ' apuntando' : '') + (inutil ? ' inutil' : '');
    // el ítem con el que estás apuntando queda habilitado: ese click lo cancela
    b.disabled = G.busy || G.phase !== 'match' || (G.targeting && G.targeting !== k);
    if(inutil) b.title = inutil;
    // la descripción va a la vista, no escondida en un title que en celular
    // no existe: si no se lee lo que hace, el ítem no se usa
    b.innerHTML =
      '<span class="ii">' + icoItem(k) + '</span>' +
      '<span class="itx">' +
        /* En la caja va el nombre corto: son 69px de ancho y «GRITO DEL DT»
           entraba como «GRITO DE…». El nombre entero se lee en la ficha, que
           es donde se decide si usarlo. */
        '<span class="inm">' + (I.corto || I.nm) + '<span class="iq">x' + G.items[k] + '</span></span>' +
        '<span class="ief">' + I.efecto + '</span>' +
        '<span class="idesc">' + I.desc + '</span>' +
      '</span>';
    /* El toque abre la ficha del ítem en vez de usarlo directo: así se lee qué
       hace antes de gastarlo. Desde ahí se confirma con USAR. */
    b.onclick = (ev) => { ev.stopPropagation(); abrirItem(k, b); };
    bar.appendChild(b);
  });
}

/* ---------------- ítems en partido ---------------- */
/* ¿Este ítem hace algo ahora mismo? Devuelve null si sirve, o el motivo por el
   que no. Antes solo el VAR se fijaba, y los otros tres se gastaban igual con
   el medidor lleno — perdías el ítem a cambio de nada. */
function itemInutil(k){
  if(k === 'revision'){
    const hayTrabas = G.grid.some(row => row.some(cell => cell && cell.lock));
    return hayTrabas ? null : 'No hay ninguna carta trabada para revisar.';
  }
  if(k === 'suplentes'){
    return G.aguante < G.aguanteMax ? null : 'El aguante ya está completo.';
  }
  if(k === 'grito'){
    return G.racha < G.rachaMax ? null : 'La racha ya está llena.';
  }
  if(k === 'refuerzo'){
    // sirve si hay aguante que reponer o máximo que recuperar
    const sube = G.aguante < G.aguanteMax || G.aguanteMax < AGUANTE_BASE;
    return sube ? null : 'El equipo ya está entero: aguante y máximo al tope.';
  }
  return null;
}

/* ---------------- la ficha de la posibilidad de gol ----------------
   Las cinco cartas que pueden salir, con su chance de aparecer y de terminar en
   gol. Antes se cobraba la racha a ciegas: el cartel decía «51% de gol» pero no
   de dónde salía ese número.

   Usa la misma franja anclada que los ítems, para que sea el mismo gesto. */
function abrirFichaGol(btn){
  if(G.busy) return;
  if(G.racha < G.rachaMax) return;          // sin la racha llena no hay nada que ver

  const banner = document.getElementById('golBanner');
  if(!banner || !banner.parentNode) return cobrarRacha();
  const fila = banner.parentNode;
  fila.style.position = 'relative';

  /* La ficha es una sola, pero **se muda** al contenedor que la abre: si se
     quedara donde nació, la de gol aparecería colgada del panel de ítems. */
  let f = document.querySelector('.item-ficha');
  if(!f){
    f = document.createElement('div');
    f.className = 'item-ficha';
  }
  /* **Justo debajo del banner**, no al final de la columna.
     Ser hermana del cartel no alcanzaba: como el cartel no es un ancestro
     posicionado, el `top:100%` de la ficha se medía contra `.wrap` y la
     desplegaba abajo de toda la página. Se envuelve el cartel en un ancla
     posicionada y la ficha vive adentro, así el 100% es el alto del cartel. */
  let ancla = banner.parentNode;
  if(!ancla.classList.contains('gol-ancla')){
    const nueva = document.createElement('div');
    nueva.className = 'gol-ancla';
    ancla.insertBefore(nueva, banner);
    nueva.appendChild(banner);
    ancla = nueva;
  }
  if(f.parentNode !== ancla) ancla.appendChild(f);

  const yaEstaba = btn.classList.contains('abierto');
  cerrarFichaItem();
  if(yaEstaba) return;
  btn.classList.add('abierto');

  const total = SIT_FAVOR.reduce((a, x) => a + x.peso, 0);
  const esperado = Math.round(SIT_FAVOR.reduce((a, x) => a + x.peso * x.p, 0) / total * 100);

  f.classList.add('ficha-gol');
  /* Cada casilla muestra **la ilustración de su propia carta**, la misma que
     se ve en la mesa. Antes iban cinco emoji: para saber cuál era cuál había
     que acordarse de que 🚩 es el córner y 🚧 el tiro libre. Con la foto la
     reconocés porque ya la viste salir, y de paso se usa el ancho que sobraba
     —157px por casilla en desktop, con un emoji de 16 adentro—.

     El nombre va debajo, que es lo que de verdad faltaba: hoy la ficha te
     mostraba un porcentaje sin decirte de qué jugada era.

     Y la chapa del mini juego pasa a ser **la misma del tablero**, no un 🎮 de
     8px flotando en el borde. */
  f.innerHTML =
    '<div class="fg-top">' +
      '<span class="fg-nm">⚽ POSIBILIDAD DE GOL</span>' +
      '<span class="fg-esp">' + esperado + '% de gol' +
        '<em>una de las cinco, al azar</em></span>' +
    '</div>' +
    '<div class="fg-minis">' +
      SIT_FAVOR.map(x => {
        const mj = x.key === 'penal';        // el penal se patea, no se sortea
        const art = artCarta(x.key);
        const chapa = mj ? '<span class="mj-lb"><i class="mj-ico">🎮</i>MINI JUEGO</span>' : '';
        return '<div class="fg-mini' + (x.p === 1 ? ' seguro' : '') + (mj ? ' mj' : '') + '">' +
          (art
            ? '<span class="fg-art"><img src="' + art + '" alt="">' + chapa + '</span>'
            : '<span class="fg-ico">' + x.ico + '</span>' + chapa) +
          '<span class="fg-cnm">' + x.nm + '</span>' +
          '<span class="fg-pct">' + (x.p === 1 ? 'GOL' : Math.round(x.p * 100) + '% GOL') + '</span>' +
        '</div>';
      }).join('') +
    '</div>' +
    '<div class="if-btns">' +
      '<button class="if-btn" id="fgUsar">USAR LA RACHA</button>' +
      '<button class="if-btn alt" id="fgVolver">VOLVER</button>' +
    '</div>';

  requestAnimationFrame(() => f.classList.add('on'));
  document.getElementById('fgUsar').onclick = async (ev) => {
    ev.stopPropagation();
    const elegida = await sorteoGol(f);   // el sorteo, a la vista
    cerrarFichaItem();
    cobrarRacha(elegida);                 // y se resuelve **esa** misma
  };
  document.getElementById('fgVolver').onclick = (ev) => { ev.stopPropagation(); cerrarFichaItem(); };
  f.onclick = (ev) => ev.stopPropagation();
}

/* El sorteo de la posibilidad de gol: **el mismo cursor que la mesa**. Recorre
   las cinco opciones frenando como una ruleta y para en la que salió.

   Antes se eliminaban de a una. Se cambió para que los dos sorteos del juego se
   sientan igual: es el mismo azar, así que merece el mismo gesto.

   El resultado ya está decidido cuando esto corre —lo sortea `situacionGol`—
   así que la animación no lo cambia; solo lo cuenta. */
async function sorteoGol(ficha, lista){
  const L = lista || SIT_FAVOR;          // el mazo del rival usa el mismo cursor
  const minis = [...ficha.querySelectorAll('.fg-mini')];
  if(minis.length < 2) return null;

  ficha.querySelectorAll('.if-btn').forEach(b => b.disabled = true);

  /* Se sortea **acá** y se devuelve, para que el partido resuelva exactamente
     la carta que el jugador vio ganar. */
  const fin = pick(L.map((x, i) => [i, x.peso]))[0];
  let esp = 85, i = 0;
  const vueltas = minis.length * 3 + fin;
  for(let n = 0; n <= vueltas; n++){
    minis.forEach(m => m.classList.remove('foco'));
    i = n % minis.length;
    minis[i].classList.add('foco');
    await wait(esp);
    if(n > vueltas - 6) esp += 48;
  }

  minis.forEach(m => m.classList.remove('foco'));
  minis.forEach((m, k) => m.classList.add(k === fin ? 'gana' : 'fuera'));
  await wait(560);
  return L[fin];
}

/* ---------------- la ficha del ítem ----------------
   Una franja al pie de la fila de acción con lo que hace el ítem y los dos
   botones. Antes el toque lo usaba directo: había que acordarse de memoria qué
   hacía cada uno, o gastarlo para enterarse.

   Va anclada a la fila y no centrada en la pantalla, así el juego sigue a la
   vista mientras decidís. */
function cerrarFichaItem(){
  const f = document.querySelector('.item-ficha');
  if(f){ f.classList.remove('on'); f.classList.remove('ficha-gol'); }
  document.querySelectorAll('.gol-banner.abierto').forEach(b => b.classList.remove('abierto'));
  document.querySelectorAll('.item.abierto').forEach(b => b.classList.remove('abierto'));
}

function abrirFicha(k, btn){
  const I = ITEMS[k];
  if(!I) return;

  /* Se ancla **al ítem mismo**, para salir a su derecha con el pico apuntándolo.
     El botón necesita `position:relative` para ser el marco de referencia. */
  const fila = btn;
  btn.style.position = 'relative';

  /* La ficha es una sola, pero **se muda** al contenedor que la abre: si se
     quedara donde nació, la de gol aparecería colgada del panel de ítems. */
  let f = document.querySelector('.item-ficha');
  if(!f){
    f = document.createElement('div');
    f.className = 'item-ficha';
  }
  if(f.parentNode !== fila) fila.appendChild(f);

  /* En mobile la ficha se ancla a la pantalla, no al botón: el CSS la pone en
     `position:fixed` y necesita de acá lo único que no puede saber solo —dónde
     está el ítem—. `--fy` la baja justo debajo del ítem y `--fx` para el pico
     en su centro, que es lo que mantiene el vínculo con el que la abrió.

     Se calcula siempre, aunque en desktop el CSS lo ignore: cuesta nada y evita
     que una rotación de pantalla deje la ficha con la posición de la anterior. */
  const r = btn.getBoundingClientRect();
  const barra = (document.querySelector('.item-list') || btn).getBoundingClientRect();
  f.style.setProperty('--fy', Math.round(barra.bottom + 8) + 'px');
  f.style.setProperty('--fx', Math.round(r.left + r.width / 2 - 10) + 'px');

  const yaEstaba = btn.classList.contains('abierto');
  cerrarFichaItem();
  if(yaEstaba) return;              // el segundo toque cierra
  btn.classList.add('abierto');

  /* Si el ítem no sirve ahora, la ficha lo dice y no ofrece usarlo. */
  const porQueNo = itemInutil(k);

  f.innerHTML =
    '<div class="if-txt">' +
      '<div class="if-nm">' + icoItem(k) + ' ' + I.nm +
        '<span class="if-ef">' + I.efecto + '</span></div>' +
      '<div class="if-desc">' + (porQueNo || I.desc) + '</div>' +
    '</div>' +
    '<div class="if-btns">' +
      (porQueNo ? '' : '<button class="if-btn" id="ifUsar">USAR</button>') +
      '<button class="if-btn alt" id="ifVolver">' + (porQueNo ? 'ENTENDIDO' : 'VOLVER') + '</button>' +
    '</div>';

  requestAnimationFrame(() => f.classList.add('on'));

  const usar = document.getElementById('ifUsar');
  if(usar) usar.onclick = (ev) => { ev.stopPropagation(); cerrarFichaItem(); useItem(k); };
  document.getElementById('ifVolver').onclick = (ev) => { ev.stopPropagation(); cerrarFichaItem(); };
  f.onclick = (ev) => ev.stopPropagation();
}

/* Con el ítem apuntando —el VAR, que espera que toques una carta— el toque
   cancela en vez de abrir la ficha. */
function abrirItem(k, btn){
  if(G.busy) return;
  if(G.targeting){ useItem(k); return; }
  abrirFicha(k, btn);
}

document.addEventListener('click', e => {
  if(!e.target.closest('.item, .item-ficha, .gol-banner')) cerrarFichaItem();

  /* **Un click afuera desarma la línea.** La fila o columna elegida quedaba
     resaltada hasta que confirmabas o elegías otra: no había forma de
     arrepentirse tocando en cualquier otro lado, que es lo primero que uno
     intenta. Ahora el resaltado se va como se va cualquier menú abierto.

     Se descarta el click sobre la mesa misma —`.row` y `.col-pick`— porque ese
     lo maneja `tapLine`, que es el que confirma o mueve la selección. */
  if(G.armed && !e.target.closest('.row, .col-pick')){
    G.armed = null;
    const h = $('hint');
    if(h) h.textContent = 'Elegí una FILA. El azar decide qué carta te toca.';
    render();
  }
});

async function useItem(k){
  if(G.busy) return;

  /* Si ya estás apuntando con este mismo ítem, el segundo toque cancela. Antes
     seleccionarlo te obligaba a gastarlo: no había forma de arrepentirse. */
  if(G.targeting === k){ cancelarApuntado(); return; }
  if(G.targeting) return;      // ya estás apuntando con otro

  /* Un solo control para los cuatro: si no hace nada, no se gasta. */
  const motivo = itemInutil(k);
  if(motivo){
    say(ITEMS[k].ico + ' ' + motivo, 'bad');
    return;
  }

  if(k === 'revision'){
    G.targeting = 'revision';
    $('hint').innerHTML = '<b>VAR:</b> tocá la carta 🔒 que querés que revisen. <em>Tocá el ítem otra vez (o Esc) para cancelar.</em>';
    render();
    return;
  }

  /* El mismo resaltado que dejan las cartas: al volver, el medidor que subió
     late en verde. Sin esto el ítem se gastaba y el único rastro era la línea
     del relato — había que buscar a mano si había cambiado el aguante o la
     racha. Se toma la foto acá, después de los controles y antes de tocar
     nada, así incluye lo que haga cada rama. */
  const antes = snapshot();

  G.items[k]--;
  if(G.items[k] <= 0) delete G.items[k];

  if(k === 'refuerzo'){
    /* El único que devuelve máximo perdido, y lo devuelve **para toda la
       corrida**: si solo subiera el del partido, al siguiente lo perderías de
       nuevo y el ítem no serviría para revertir el desgaste de encadenar. */
    const recupera = G.aguanteMax < AGUANTE_BASE;
    if(recupera){
      G.aguanteMax++;
      G.maxCampeonato = Math.max(G.maxCampeonato, G.aguanteMax);
    }
    G.aguante = clamp(G.aguante + 2, 0, G.aguanteMax);
    say('💪 Segundo aire: el equipo saca fuerzas de donde no hay. +2 aguante' +
        (recupera ? ' y recuperás un <i class="ih"></i> de máximo (ahora ' + G.aguanteMax + ').' : '.'), 'good');
  } else if(k === 'suplentes'){
    G.aguante = clamp(G.aguante + 1, 0, G.aguanteMax);
    say('🪑 Entran los suplentes con las piernas frescas. +1 aguante.', 'good');
  } else if(k === 'grito'){
    say('📢 El DT grita desde la línea y el equipo levanta. +1 de racha.', 'good');
    G.busy = true;              // el pop-up bloquea la mesa mientras resuelve
    render();
    await sumarRacha(1);
    G.busy = false;
  }
  render();
  pulseCambios(antes);
}

/* El VAR revisa una jugada anulada y la habilita: la carta trabada vuelve al
   sorteo: normalmente esa carta buena que te trabaron y no llegaste a jugar.
   (La clave interna es `revision` y no `var` porque `var` es palabra reservada
   de JavaScript; el nombre que ve el jugador es VAR.) */
/* Sale del modo apuntar sin gastar nada. Lo llaman el segundo toque sobre el
   ítem y la tecla Escape. */
function cancelarApuntado(){
  if(!G.targeting) return;
  G.targeting = false;
  say('↩ Cancelás la jugada. El ítem sigue en tu poder.', 'good');
  $('hint').textContent = 'Elegí una FILA. El azar decide qué carta te toca.';
  render();
}

function useVarOn(r, c){
  const cell = G.grid[r][c];
  if(!cell || !cell.lock) return;
  cell.lock = false;
  G.items.revision--;
  if(G.items.revision <= 0) delete G.items.revision;
  G.targeting = false;
  $('hint').textContent = 'Elegí una FILA. El azar decide qué carta te toca.';
  say('📺 Revisa el VAR: habilitan ' + TYPES[cell.type].nm + ' y vuelve a jugarse.', 'good');
  render();
}

/* ---------------- elegir línea ---------------- */
async function chooseLine(kind, idx){
  if(G.busy || G.targeting) return;
  G.armed = null;
  $('hint').textContent = 'Elegí una FILA. El azar decide qué carta te toca.';
  G.busy = true;

  let coords = jugables(kind, idx);
  if(kind === 'col'){
    G.racha = clamp(G.racha - COSTO_COLUMNA, 0, G.rachaMax);
    say('<i class="ir"></i> Gastás ' + COSTO_COLUMNA + ' de racha para atacar por la columna ' + (idx+1) +
        '. Te quedan ' + G.racha + '.', 'big');
    G.ultimaFila = null;          // la columna no cuenta para la repetición
  } else {
    /* Repetir fila dos veces seguidas la marca: en la jugada siguiente se traba
       una carta de ESA fila, sí o sí. Quedarse en la fila cómoda tiene que
       costar algo, si no la mecánica de trabas se esquiva eligiendo siempre la
       misma. */
    if(G.ultimaFila === idx){
      G.marcarFila = idx;
      say('👀 Te repetís en la fila ' + (idx+1) + '. El rival te la va a cerrar.', 'bad');
    }
    G.ultimaFila = idx;
  }
  if(!coords.length){ G.busy = false; return; }

  const [r, c] = coords[rnd(coords.length)];
  render();
  await sorteoVisual(coords, r, c);
  await resolveCell(r, c, kind === 'row' ? idx : null);

  await finDeJugada();
}

/* ---------------- el sorteo, a la vista ----------------
   Un cursor blanco recorre las cartas jugables **a la vista** y va frenando
   como una ruleta, hasta parar en la que salió.

   Las cartas no se dan vuelta: el jugador ya leyó los colores al resaltar la
   fila y sigue queriendo ver qué puede tocarle mientras el cursor corre.
   Taparlas le sacaba justo ese momento de tensión.

   Antes la carta aparecía resuelta sin más y el azar quedaba invisible, que es
   el corazón del juego. */
async function sorteoVisual(coords, rFin, cFin){
  if(coords.length < 2) return;

  const els = coords.map(([r, c]) => document.querySelector(
    '.cell[data-r="' + r + '"][data-c="' + c + '"]'));
  if(els.some(e => !e)) return;

  const iFin = coords.findIndex(([r, c]) => r === rFin && c === cFin);
  if(iFin < 0) return;

  // el cursor arranca a 85ms y frena sobre el final
  let esp = 85, i = 0;
  const vueltas = els.length * 3 + iFin;
  for(let n = 0; n <= vueltas; n++){
    els.forEach(el => el.classList.remove('foco'));
    i = n % els.length;
    els[i].classList.add('foco');
    await wait(esp);
    if(n > vueltas - 6) esp += 48;
  }

  // la elegida se queda marcada y las otras se apagan
  els.forEach(el => el.classList.remove('foco'));
  els.forEach((el, k) => el.classList.add(k === iFin ? 'elegida' : 'apagada'));
  await wait(430);
  els.forEach(el => el.classList.remove('elegida', 'apagada'));
}

/* Cierre de jugada: gasta los 10 minutos y decide si el partido sigue.
   Lo comparten elegir una línea y cobrar la racha — las dos cosas cuestan
   exactamente lo mismo, una jugada. */
async function finDeJugada(){
  if(G.modo === 'duelo') return finDeJugadaDuelo();
  G.reloj--;
  trabarUna();
  render();
  const rel = $('m-reloj');
  if(rel){ rel.classList.add('pulse-down'); setTimeout(() => rel.classList.remove('pulse-down'), 1000); }
  await wait(400);

  if(G.reloj <= 0){
    // Se acabaron los 90, pero si llegaste con la racha llena te queda el
    // descuento: la última pelota del partido.
    if(G.racha >= G.rachaMax) await descuento();
    G.busy = false;
    return endMatch();
  }

  // red de seguridad: si por lo que sea no queda ninguna carta jugable,
  // se pita el final en vez de dejar la mesa muerto
  const hayJugada = [0,1,2,3].some(r => jugables('row', r).length > 0);
  if(!hayJugada){
    say('📣 Ya no queda nada para jugar. El árbitro termina el partido.', 'big');
    G.busy = false;
    return endMatch();
  }

  G.busy = false;
  render();
}

/* Entretiempo: los dos pasan por el mercado, uno después del otro. Se usa el
   mismo showMarket del campeonato — G ya es el jugador de turno. */
function duelEntretiempo(){
  G.phase = 'market';
  G.duelStatsET = {};
  duelPintarTienda(0, true);
}

/* Se separa para poder redibujarla tras cada compra sin perder de quién es el
   turno ni reiniciar lo comprado. */
function duelPintarTienda(quien, primera){
  const abrir = () => {
    G.turno = quien;
    cargarTurno();
    if(primera) G.compras = {};
    G._tiendaQuien = quien;
    openCard(
      '<div class="tag">ENTRETIEMPO</div>' +
      '<h1>' + G.J[quien].club + '</h1>' +
      '<div class="duel-local">' +
        '<span class="dl-esc">' + escudoDe(G.J[quien].escudo, 30) + '</span>' +
        '<span class="dl-nm">' + plata(G.J[quien].dinero) + '</span>' +
        '<span class="dl-lb">PARA GASTAR</span>' +
      '</div>' +
      '<p>Sumá <b>' + DUELO.PUNTOS_ET + ' puntos</b> al plantel y comprá lo que necesites. Todo queda para el segundo tiempo.</p>' +
      '<div id="repET"></div>' +
      tiendaHTML() +
      inventarioHTML() +
      '<button class="cta" id="etBtn">' + (quien === 0 ? 'LISTO · PASA EL OTRO' : 'AL SEGUNDO TIEMPO') + '</button>',
      'card-final'
    );
    engancharTienda();

    /* Los +2 del entretiempo. Se guardan al toque para que sobrevivan al
       redibujado que hace cada compra. */
    const pintarRep = () => {
      const j = G.J[quien];
      const usados = (j.atk + j.def) - (G.duelStatsET[quien] || 0);
      $('repET').innerHTML = repartoHTML(j.atk, j.def, DUELO.PUNTOS_ET - usados, 'et');
      document.querySelectorAll('[data-et]').forEach(b => b.onclick = () => {
        const dl = b.dataset.et[0] === '+' ? 1 : -1;
        if(b.dataset.et.slice(1) === 'atk') j.atk += dl; else j.def += dl;
        cargarTurno();
        pintarRep();
      });
      $('etBtn').disabled = usados < DUELO.PUNTOS_ET;
    };
    if(G.duelStatsET[quien] === undefined) G.duelStatsET[quien] = G.J[quien].atk + G.J[quien].def;
    pintarRep();

    $('etBtn').onclick = () => {
      guardarTurno();
      if(quien === 0){ return duelPintarTienda(1, true); }
      closeCard();
      G.phase = 'match';
      G.turno = 1 - (G.duelSaco || 0);   // el segundo tiempo lo abre el que no sacó
      cargarTurno();
      say('🔄 Segundo tiempo. Empieza ' + G.J[G.turno].club + '.', 'big');
      render();
    };
  };
  abrir();
}

/* Resultado de un partido de la serie: marcador, cómo va la serie y qué sigue. */
function duelResultado(ganador, cerroSerie){
  G.phase = cerroSerie ? 'won' : 'match';
  const [a, b] = G.J;
  const serie = G.serie.alMejorDe > 1;

  openCard(
    /* Verde si ganó el local, rojo si ganó el visitante: el pop-up se lee desde
       el lado del que armó la partida, igual que el marcador. */
    '<div class="final-tit ' + (ganador === 0 ? 'gano' : 'perdio') + '">' +
      (cerroSerie ? 'GANÓ' : 'PARTIDO ' + G.serie.partido) + '</div>' +
    '<div class="final-sub">' + G.J[ganador].club + (cerroSerie ? '' : ' se lleva este') + '</div>' +
    '<div class="marcador"><div class="m-fila">' +
      '<span class="m-eq mio"><span class="m-esc">' + escudoDe(a.escudo, 34) + '</span>' + a.club + '</span>' +
      '<span class="m-res">' + a.goles + '<span class="m-sep">-</span>' + b.goles + '</span>' +
      '<span class="m-eq suyo"><span class="m-esc">' + escudoDe(b.escudo, 34) + '</span>' + b.club + '</span>' +
    '</div></div>' +
    (serie ? '<div class="serie">' +
      '<div class="serie-lb">LA SERIE</div>' +
      '<div class="serie-n">' + G.serie.ganados[0] + ' <span>-</span> ' + G.serie.ganados[1] + '</div>' +
      '<div class="serie-t">al mejor de ' + G.serie.alMejorDe + '</div>' +
    '</div>' : '') +
    (cerroSerie
      ? '<button class="cta" id="duelOtra">JUGAR OTRA VEZ</button>' +
        '<button class="cta alt" id="duelMenu">VOLVER AL INICIO</button>'
      : '<button class="cta" id="duelSigue">JUGAR EL PARTIDO ' + (G.serie.partido + 1) + '</button>'),
    'card-final'
  );

  if(cerroSerie){
    /* Volver a jugar pasa de nuevo por el reparto de puntos: si no, los dos
       arrancaban en 1/1 sin que nadie eligiera nada. */
    $('duelOtra').onclick = () => {
      G.serie = { alMejorDe:G.serie.alMejorDe, ganados:[0,0], partido:0 };
      G.club = a.club;
      G.escudo = Object.assign({}, a.escudo);
      G.escudoRival = Object.assign({}, b.escudo);
      G.duelClub2 = b.club;
      showDuelLocal();
    };
    $('duelMenu').onclick = () => { closeCard(); G.modo = 'campeonato'; showStart(); };
  } else {
    $('duelSigue').onclick = () => { closeCard(); duelNuevoPartido(); };
  }
}

function duelRedibujarTienda(){ duelPintarTienda(G._tiendaQuien || 0, false); }

/* Fin del partido: se compara el marcador, se anota en la serie y se sigue o se
   corta. Los empates en el 1v1 se definen por penales, como en el campeonato. */
async function duelFinDePartido(){
  guardarTurno();
  const [a, b] = G.J;
  let ganador;
  if(a.goles === b.goles){
    ganador = await duelPenales();
  } else {
    ganador = a.goles > b.goles ? 0 : 1;
  }
  G.serie.ganados[ganador]++;
  G.J[ganador].ultimoGano = true;

  const meta = Math.ceil(G.serie.alMejorDe / 2);
  const cerro = G.serie.ganados[ganador] >= meta;
  duelResultado(ganador, cerro);
}

/* ---------------- serie de penales ----------------
   Como en la cancha: **cinco cada uno**, alternando, y el que va perdiendo por
   más de los que le quedan ya no puede alcanzar — ahí se corta. Si terminan las
   cinco empatados, sigue de **a uno por cabeza** hasta que uno convierta y el
   otro no.

   El que patea elige el palo; el arquero vuela al azar. */
async function duelPenales(){
  return serieDePenales(G.J, -1);
}

/* La tanda, para los dos modos. `eqs` son los dos equipos y `auto` el índice
   del que patea solo (el rival de la máquina en el campeonato); -1 si los dos
   eligen palo, como en el 1v1. */
async function serieDePenales(eqs, auto){
  say('🥅 Empate. Se define por penales.', 'big');
  /* El que gana la moneda patea primero. `moneda` devuelve el índice del
     ganador, así que se usa tal cual. */
  const primero = await moneda(eqs, auto === 0 ? 1 : 0, 'PENALES', 'EL QUE GANA PATEA PRIMERO');
  say('🥅 Patea primero ' + eqs[primero].club + '.', 'big');

  const tiros = [[], []];                    // true = gol
  const gol = i => tiros[i].filter(Boolean).length;

  /* ¿Ya está decidido? Con t tiros jugados de 5, al que le faltan no le alcanza
     si la diferencia supera lo que le queda por patear. */
  const cerrado = () => {
    const [a, b] = [gol(0), gol(1)];
    const faltan = i => Math.max(0, 5 - tiros[i].length);
    if(tiros[0].length >= 5 && tiros[1].length >= 5) return a !== b;
    return a - b > faltan(1) || b - a > faltan(0);
  };

  let n = 0;
  while(true){
    const quien = n % 2 === 0 ? primero : 1 - primero;
    const ronda = Math.floor(n / 2) + 1;
    const muerte = ronda > 5;
    /* `auto` marca al equipo de la máquina: cuando le toca patear a él, vos
       atajás. En el 1v1 (`auto` = -1) siempre patea el que tiene el turno. */
    const conv = await penalUno(eqs, quien, tiros, ronda, muerte, primero, quien !== auto);
    tiros[quien].push(conv);
    n++;

    if(!muerte && cerrado()) break;
    // muerte súbita: se corta cuando los dos patearon la misma cantidad y difieren
    if(muerte && n % 2 === 0 && gol(0) !== gol(1)) break;
    if(n > 40) break;                        // red de seguridad
  }

  const ganador = gol(0) > gol(1) ? 0 : 1;
  say('🥅 Penales ' + gol(0) + '-' + gol(1) + ': gana ' + eqs[ganador].club + '.', 'big');
  await mostrarPenales(eqs, tiros, ganador, primero);
  return ganador;
}

/* Un penal de la serie, con la mesa de la tanda a la vista. */
/* Un penal de la tanda. Tiene **dos modos**:

     patear  · elegís el palo; el arquero rival vuela al azar.
               Gol si NO coinciden.
     atajar  · elegís adónde vuela **tu arquero**; el rival tira al azar.
               Atajada si coinciden.

   La probabilidad es la misma en los dos (1 de 3 al arquero, 2 de 3 al que
   patea), pero atajar deja de ser algo que te pasa y pasa a ser algo que
   jugás. Antes el penal del rival se resolvía solo y vos mirabas.

   `yoPateo` decide el modo: en el 1v1 patea el que tiene el turno; en el
   campeonato pateás vos y atajás cuando patea la máquina. */
/* ---------------- EL ARCO DE LOS PENALES ----------------
   Antes eran dos emoji —un guante y una pelota— moviéndose adentro de una caja
   con borde. Ahora el arco se dibuja: palos, travesaño, red y línea del área, y
   **se apunta tocando adentro**, no con tres botones de flecha.

   Las tres zonas laten en celeste, escalonadas, para que se vea que hay que
   tocarlas: sin eso un arco dibujado se lee como decoración.

   El arquero lleva **los colores del escudo del equipo que ataja** —el rival
   cuando pateás vos, el tuyo cuando atajás— y se balancea mientras decidís. Al
   disparar se corta el vaivén y vuela al palo que adivinó.

   Los tres lugares donde hay penales —la tanda de la final, el penal
   definitorio de una ronda y la serie del menú— usan este mismo arco. El
   definitorio tenía su propio dibujo y sus propios botones. */
const PENAL_Z = [ {x:48, y:60}, {x:100, y:60}, {x:152, y:60} ];

function arcoPenalHTML(esc){
  const A = COLORES[((esc && esc.c1) || 0) % COLORES.length].hex;   // camiseta
  const B = COLORES[((esc && esc.c2) || 0) % COLORES.length].hex;   // guantes

  let red = '';
  for(let x = 26; x <= 174; x += 12) red += '<path class="pp-red" d="M' + x + ' 22 V98"/>';
  for(let y = 30; y <= 96; y += 12) red += '<path class="pp-red" d="M22 ' + y + ' H178"/>';

  const zonas = [22, 74, 126].map((x, i) =>
    '<rect class="pp-zona" data-z="' + i + '" x="' + x + '" y="22" width="52" height="76" rx="3" ' +
    'style="animation-delay:' + (i * 260) + 'ms"/>').join('');

  return '<svg class="parco" viewBox="0 0 200 120" aria-label="Arco">' +
    '<g class="pp-redg">' + red + '</g>' +
    '<path class="pp-post" d="M22 100 V22 H178 V100"/>' +
    '<path class="pp-piso" d="M8 103 H192"/>' +
    '<path class="pp-gol" d="M22 100 V22 H178 V100"/>' +
    /* El arquero, con los colores del que ataja. */
    '<g class="pp-arq idle">' +
      '<circle cx="100" cy="56" r="8" fill="#f0c9a0" stroke="rgba(0,0,0,.35)" stroke-width="1"/>' +
      '<path d="M91 66 h18 v24 h-18 z" fill="' + A + '" stroke="rgba(0,0,0,.35)" stroke-width="1"/>' +
      '<path d="M93 90 h6 v10 h-6 z M101 90 h6 v10 h-6 z" fill="' + B + '" stroke="rgba(0,0,0,.3)" stroke-width="1"/>' +
      '<path d="M91 68 h-6 v-7 h6 z M109 68 h6 v-7 h-6 z" fill="' + A + '" stroke="rgba(0,0,0,.3)" stroke-width="1"/>' +
      '<rect x="76" y="55" width="12" height="12" rx="3.5" fill="' + B + '" stroke="rgba(0,0,0,.4)" stroke-width="1"/>' +
      '<rect x="112" y="55" width="12" height="12" rx="3.5" fill="' + B + '" stroke="rgba(0,0,0,.4)" stroke-width="1"/>' +
    '</g>' +
    /* La pelota, dibujada con el mismo trazo que el arco. */
    '<g class="pp-pel">' +
      '<circle cx="100" cy="112" r="7" fill="#f2f4f8" stroke="rgba(0,0,0,.45)" stroke-width="1"/>' +
      '<path d="M100 107.4 l4.4 3.2 -1.7 5.2 h-5.4 l-1.7 -5.2 z" fill="#16181d"/>' +
      '<path class="pp-cost" d="M100 104.8 v2.6 M104.4 110.6 l2.5 -.8 M102.7 115.8 l1.6 2.2 ' +
        'M97.3 115.8 l-1.6 2.2 M95.6 110.6 l-2.5 -.8"/>' +
    '</g>' +
    zonas +
  '</svg>';
}

/* La animación del tiro: sale el arquero, después la pelota. En ese orden a
   propósito —se ve el duelo— y no al revés. */
async function animarPenal(wrap, mio, suyo){
  const svg = wrap.querySelector('.parco');
  if(!svg) return;
  const atajado = mio === suyo;
  svg.querySelectorAll('.pp-zona').forEach((z, i) => {
    z.classList.add('off');
    if(i === mio) z.classList.add('sel');
  });
  const arq = svg.querySelector('.pp-arq'), pel = svg.querySelector('.pp-pel');
  arq.classList.remove('idle');
  const ca = PENAL_Z[suyo], cp = PENAL_Z[mio];
  arq.style.transform = 'translate(' + (ca.x - 100) + 'px,' + (ca.y - 62) + 'px)' +
                        ' rotate(' + ((ca.x - 100) * .17) + 'deg)';
  await wait(130);
  pel.style.transform = 'translate(' + (cp.x - 100) + 'px,' + (cp.y - 112) + 'px)' +
                        (atajado ? ' scale(.8)' : '');
  await wait(520);
  if(!atajado) svg.querySelector('.pp-gol').classList.add('on');
  await wait(300);
}

/* Cinco por equipo, como en la cancha. En muerte súbita la pizarra sigue
   mostrando cinco huecos: lo que importa ahí es el tiro en curso. */
const TANDA_TIROS = 5;

function penalUno(eqs, quien, tiros, ronda, muerte, primero, yoPateo){
  return new Promise(resolve => {
    /* `ronda: 0` es un penal **suelto** —el de la posibilidad de gol dentro del
       partido—, no uno de la tanda. Ahí no va ni el «1 DE 5» ni el tablero de
       la serie: no hay serie. */
    const suelto = !ronda;
    const wrap = document.createElement('div');
    wrap.className = 'sit-flash';
    wrap.innerHTML =
      '<div class="sit penal">' +
        '<div class="sit-tag">' +
          (suelto ? 'POSIBILIDAD DE GOL' : muerte ? 'MUERTE SÚBITA' : 'PENAL ' + ronda + ' DE 5') +
        '</div>' +
        '<div class="t">' + (suelto ? '🎯 PENAL'
                                    : yoPateo ? 'PATEA ' + eqs[quien].club : 'ATAJÁS VOS') + '</div>' +
        (suelto ? '' : tandaHTML(eqs, tiros, primero, quien)) +
        arcoPenalHTML(eqs[1 - quien].escudo) +
        '<div class="s">' + (yoPateo ? '¿A QUÉ PALO LA MANDÁS?' : '¿A QUÉ PALO VOLÁS?') + '</div>' +
        '<div class="pp-hint">tocá adentro del arco</div>' +
      '</div>';
    document.body.appendChild(wrap);

    let tirado = false;
    wrap.querySelectorAll('.pp-zona').forEach(btn => {
      btn.onclick = async () => {
        if(tirado) return; tirado = true;
        const mio = +btn.dataset.z, suyo = rnd(3);
        /* Pateando: el palo es tuyo y el arquero adivina.
           Atajando: el palo es el de tu arquero y el rival elige adónde tira. */
        const paloPelota = yoPateo ? mio : suyo;
        const paloArquero = yoPateo ? suyo : mio;
        const atajado = paloPelota === paloArquero;
        const conv = !atajado;                      // convierte el que patea

        await animarPenal(wrap, paloPelota, paloArquero);

        /* El cartel se lee siempre desde tu lado: verde lo que te conviene,
           rojo lo que no. Pateando, gol es verde; atajando, gol es rojo. */
        const bueno = yoPateo ? conv : atajado;
        const box = wrap.querySelector('.sit.penal');
        box.className = 'sit penal resuelta ' + (bueno ? 'salvado' : 'gol');
        box.innerHTML =
          '<div class="sit-tag">' +
            (suelto ? 'EL PENAL' : yoPateo ? 'PATEÓ ' + eqs[quien].club : 'ATAJA ' + eqs[1 - quien].club) +
          '</div>' +
          '<div class="sit-ico">' + icoDesenlace(atajado ? 'atajada' : 'golazo') + '</div>' +
          '<div class="t">' +
            (yoPateo ? (conv ? '¡GOL!' : 'ATAJADO')
                     : (atajado ? '¡ATAJADA!' : 'GOL RIVAL')) +
          '</div>' +
          '<div class="s">' +
            (yoPateo ? (conv ? 'Adentro' : 'Voló y la sacó')
                     : (atajado ? 'La adivinaste' : 'Fue del otro lado')) +
          '</div>';
        await esperarOClick(wrap, ESPERA_FIN);
        resolve(conv);
      };
    });
  });
}

/* El mesa de la tanda: un punto por tiro, verde si entró. */
/* El mesa de la tanda. Los equipos van **siempre en el mismo orden** —el 0
   arriba— sin importar quién patea primero: si el orden cambiara según el
   sorteo, el marcador se leería invertido justo cuando el rival gana la moneda.
   Al que le toca patear se le marca la flecha. */
function tandaHTML(eqs, tiros, primero, turnoDe){
  /* **Los cinco tiros, siempre a la vista.** Antes se dibujaba un ⚽ o una ✖
     por tiro *ya pateado*: no se veía cuántos quedaban, que en una tanda es la
     mitad de la información —«le queda uno y va perdiendo» es todo el drama—.

     Ahora van los cinco huecos de cada equipo desde el primer tiro: verde el
     que entró, tachado el que erró, vacío el que falta, y el que se está por
     patear late en dorado. */
  const fila = i => {
    const huecos = [];
    for(let k = 0; k < TANDA_TIROS; k++){
      const t = tiros[i][k];
      const cls = t === true ? ' gol'
                : t === false ? ' fallo'
                : (turnoDe === i && k === tiros[i].length ? ' ahora' : '');
      huecos.push('<span class="pz-t' + cls + '"></span>');
    }
    return '<div class="pz-f' + (turnoDe === i ? ' turno' : '') + '">' +
      '<span class="pz-nm">' + (turnoDe === i ? '▸ ' : '') + eqs[i].club + '</span>' +
      '<span class="pz-tiros">' + huecos.join('') + '</span>' +
      '<b class="pz-n">' + tiros[i].filter(t => t === true).length + '</b>' +
    '</div>';
  };
  return '<div class="pizarra">' + fila(0) + fila(1) + '</div>';
}

/* El resumen final de la tanda, antes de volver al resultado del partido. */
function mostrarPenales(eqs, tiros, ganador, primero){
  return new Promise(resolve => {
    const wrap = document.createElement('div');
    wrap.className = 'sit-flash';
    wrap.innerHTML =
      '<div class="sit penal resuelta salvado">' +
        '<div class="sit-tag">DEFINIDO EN LOS PENALES</div>' +
        '<div class="sit-ico">' + icoDesenlace('copa') + '</div>' +
        '<div class="t">' + eqs[ganador].club + '</div>' +
        tandaHTML(eqs, tiros, primero, -1) +
      '</div>';
    document.body.appendChild(wrap);
    esperarOClick(wrap, ESPERA_FIN).then(resolve);
  });
}

/* Fin de jugada en el 1v1: no hay reloj que correr ni cartas que trabar. Lo
   que hay es **cambio de turno** —y el entretiempo justo a la mitad. */
async function finDeJugadaDuelo(){
  guardarTurno();
  G.turnosJugados++;
  render();
  await wait(400);

  const quedan = G.grid.flat().some(c => c && !c.lock);
  if(G.turnosJugados >= DUELO.TURNOS || !quedan){
    G.busy = false;
    return duelFinDePartido();
  }

  if(G.turnosJugados === DUELO.ENTRETIEMPO){
    G.busy = false;
    return duelEntretiempo();
  }

  G.turno = 1 - G.turno;
  cargarTurno();
  say('🔄 Turno de ' + G.J[G.turno].club + '.', 'big');
  G.busy = false;
  render();
}

/* Tiempo de descuento: la racha quedó llena justo cuando se terminaba el
   partido. Cobrarla ahora es la última chance de cambiar el marcador;
   guardarla la lleva entera al próximo partido —pero solo si ganás este. */
function descuento(){
  // el mismo promedio que el aviso de racha llena, calculado y no escrito
  const esperadoFavor = Math.round(
    SIT_FAVOR.reduce((a, x) => a + x.peso * x.p, 0) /
    SIT_FAVOR.reduce((a, x) => a + x.peso, 0) * 100);

  const empata = G.gU === G.gC, pierde = G.gU < G.gC;
  // la nota cambia según cómo vayas: es lo que decide entre las dos opciones
  const nota = pierde
    ? { txt:'Vas perdiendo. Si no la jugás ahora, no hay próximo partido.', cls:'urge' }
    : empata
      ? { txt:'Están empatados. Si no entra, se define por penales.', cls:'urge' }
      : { txt:'Vas ganando. Guardarla te la deja entera para el próximo partido.', cls:'' };

  return new Promise(resolve => {
    const wrap = document.createElement('div');
    wrap.className = 'sit-flash';
    wrap.innerHTML =
      /* Mismo esqueleto que el aviso de racha llena: ícono, título, subtítulo,
         opciones y nota al pie. Lo que cambia es que acá hay que elegir, así
         que las dos tarjetas son botones y el marcador va grande — es el dato
         que decide. */
      '<div class="aviso con-foto">' +
        fotoRacha('TIEMPO DE DESCUENTO') +
        rayosLlenos() +
        '<div class="a-s">SE ACABARON LOS 90 CON LA RACHA LLENA</div>' +
        '<div class="e-marc">' + G.gU + ' <span>-</span> ' + G.gC + '</div>' +
        '<div class="a-ops">' +
          '<button class="a-op btn gol" id="dJugar">' +
            '<div class="oi">⚽</div><div class="on">JUGARLA</div>' +
            '<div class="od">Una última situación de gol al ' + esperadoFavor + '%, antes del pitazo. Gasta la racha entera.</div>' +
          '</button>' +
          '<button class="a-op btn col" id="dGuardar">' +
            '<div class="oi">🎒</div><div class="on">GUARDARLA</div>' +
            '<div class="od">Te la llevás cargada al próximo partido, lista para usar desde la primera jugada.</div>' +
          '</button>' +
        '</div>' +
        '<div class="a-s ' + nota.cls + '">' + nota.txt + '</div>' +
      '</div>';
    document.body.appendChild(wrap);

    wrap.querySelector('#dJugar').onclick = async () => {
      wrap.remove();
      G.racha = 0;
      say('⏱ Última pelota del partido.', 'big');
      render();
      await situacionGol('favor');
      resolve();
    };
    wrap.querySelector('#dGuardar').onclick = () => {
      wrap.remove();
      say('🎒 Te guardás la racha para el próximo partido.', 'good');
      resolve();
    };
  });
}

/* Cobrar la racha: la cambiás por una situación de gol y se vacía entera.
   Es la alternativa a la columna, no un extra — por eso también gasta una
   jugada. La decisión es cuál de las dos te sirve más con la mesa que
   tenés delante. */
async function cobrarRacha(yaElegida){
  if(G.busy || G.targeting || G.racha < G.rachaMax) return;
  G.busy = true;
  G.armed = null;
  G.racha = 0;
  say('<i class="ir"></i> Cambiás la racha por una llegada clara.', 'big');
  render();
  await situacionGol('favor', yaElegida);
  await finDeJugada();
}

/* Minuto en el que se juega la carta. G.reloj todavía no se descontó cuando
   sale el cartel, así que la jugada en curso es la que cierra ese bloque. */
function minutoActual(){
  const total = RONDAS[G.ronda].reloj;
  return (total - G.reloj + 1) * MIN_POR_TURNO;
}

/* ---------------- el cronómetro ----------------
   Un reloj redondo que se llena por porciones, una por jugada. Arranca vacío
   en 0' y se completa a los 90'. Se lee al revés que el contador anterior:
   antes mostraba lo que faltaba, ahora muestra lo que ya se jugó, que es como
   se mira un partido.

   Las dos últimas porciones —los tramos que llevan a 80' y 90'— salen amarilla
   y roja. Es el aviso de que quedan dos jugadas y después es pitazo final. */
function renderCronometro(){
  /* En el 1v1 el reloj no cuenta jugadas que te quedan sino **turnos jugados
     entre los dos**: 8 cada uno, 16 porciones. Los 90 minutos se reparten entre
     esas 16, así que cada turno vale 5,6 minutos en vez de 10. */
  const duelo   = G.modo === 'duelo';
  const total   = duelo ? DUELO.TURNOS : RONDAS[G.ronda].reloj;
  const jugadas = duelo ? G.turnosJugados : total - G.reloj;
  const minuto  = duelo ? Math.round(jugadas * 90 / DUELO.TURNOS) : jugadas * MIN_POR_TURNO;
  const quedan  = total - jugadas;

  /* Radio menor que 50 - grosor/2, si no el trazo se corta contra el borde del
     viewBox: con stroke 15 el anillo ocupa de r-7.5 a r+7.5. */
  const R = 38, CX = 50, CY = 50;
  /* El aire entre porciones se achica cuando hay muchas: con 16 (el 1v1) un
     hueco de 3,2° se come casi un quinto de cada una. */
  const hueco = total > 12 ? 1.6 : 3.2;
  const paso  = 360 / total;
  let svg = '';

  for(let i = 0; i < total; i++){
    const desde = -90 + i * paso + hueco / 2;
    const hasta = -90 + (i + 1) * paso - hueco / 2;
    const p1 = polar(CX, CY, R, desde), p2 = polar(CX, CY, R, hasta);
    const arco = 'M ' + p1.x + ' ' + p1.y + ' A ' + R + ' ' + R + ' 0 0 1 ' + p2.x + ' ' + p2.y;

    // las porciones se pintan según sean pasado, las dos últimas, o futuro
    let cls = 'cro-off';
    if(i < jugadas){
      cls = 'cro-on';
      if(i === total - 2) cls = 'cro-aviso';
      if(i === total - 1) cls = 'cro-final';
    }
    svg += '<path d="' + arco + '" class="' + cls + '" />';
  }
  $('cronoSvg').innerHTML = svg;

  $('reloj').textContent = minuto;
  const box = $('m-reloj');
  box.classList.toggle('urgente', quedan === 2);
  box.classList.toggle('ultima',  quedan === 1);
}

/* Punto sobre la circunferencia, para armar los arcos del cronómetro. */
function polar(cx, cy, r, grados){
  const rad = grados * Math.PI / 180;
  return { x: +(cx + r * Math.cos(rad)).toFixed(2), y: +(cy + r * Math.sin(rad)).toFixed(2) };
}
