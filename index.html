    0 14px 44px rgba(0,0,0,.7),
    0 0 34px var(--fi-halo);
  opacity:0;pointer-events:none;
  transition:opacity .18s, transform .18s;
}
.item-ficha.on{opacity:1;transform:translateY(-50%);pointer-events:auto}

/* El pico que apunta al ítem. */
.item-ficha::before{
  content:'';position:absolute;right:100%;top:50%;margin-top:-7px;
  border:7px solid transparent;border-right-color:var(--fi-luz);
}

.if-txt{min-width:0}
.if-nm{
  font-family:var(--tit);font-weight:800;font-size:12.5px;letter-spacing:.8px;
  display:flex;align-items:center;gap:7px;flex-wrap:wrap;color:#fff;
}
.if-ef{font-size:.94em;color:var(--fi-luz)}
.if-ef b{color:var(--fi-luz);font-weight:800}
.if-desc{
  font-family:var(--txt);font-size:11.5px;color:var(--fi-suave);
  line-height:1.35;margin-top:3px;
}
.if-btns{display:flex;gap:6px}
.if-btn{
  flex:1;padding:8px 10px;border-radius:6px;cursor:pointer;
  font-family:var(--tit);font-weight:800;font-size:10.5px;letter-spacing:1.5px;
  background:linear-gradient(160deg, var(--fi-btn-a), var(--fi-btn-b));
  border:2px solid var(--fi-luz);color:var(--fi-claro);
  transition:transform .12s, box-shadow .15s;
}
.if-btn:hover{transform:translateY(-1px);box-shadow:0 0 0 1px var(--fi-luz)}
.if-btn.alt{
  border-color:var(--fi-borde-suave);color:var(--fi-suave);
  background:linear-gradient(160deg, var(--fi-btn-a), var(--fi-btn-b));
}
.if-btn.alt:hover{border-color:var(--fi-luz);color:var(--fi-claro);box-shadow:none}
.item-ficha .if-btn:disabled{opacity:.4;cursor:default;transform:none;box-shadow:none}

/* El ítem abierto se marca en el mismo lila. */
.item.abierto{
  border-color:var(--fi-luz) !important;
  box-shadow:0 0 0 1px var(--fi-luz), 0 0 18px var(--fi-halo);
}

/* ---- EN MOBILE, LA FICHA SE ANCLA A LA PANTALLA ----
   La ficha vive **adentro del botón del ítem** para que el pico lo apunte. Con
   `left:0;right:0` eso funcionaba cuando el ítem era ancho, pero desde que son
   cuatro huecos fijos el botón mide 69px: la ficha heredaba ese ancho y salía
   angosta y altísima, tapando media mesa.

   Con `position:fixed` deja de depender del ancho del botón: ocupa la pantalla
   menos un margen y nunca puede quedar cortada por el borde. Además escapa de
   todo contexto de apilamiento, así que no hay forma de que algo la tape.

   La posición vertical no puede salir del CSS —depende de dónde esté el ítem—
   así que el JS la pasa en `--fy`, y la horizontal del pico en `--fx`, que es
   lo que mantiene el vínculo con el ítem que la abrió. */
@media (max-width:1024px) and (orientation:portrait), (max-width:820px){
  .item-ficha{
    position:fixed;z-index:300;
    top:var(--fy, 140px);left:10px;right:10px;
    width:auto;max-width:none;
    transform:translateY(-5px);
  }
  /* Ocupando el ancho de la pantalla hay lugar de sobra: el nombre entra en
     una línea, la descripción en una o dos, y los botones se pueden tocar. */
  .item-ficha:not(.ficha-gol){padding:13px 15px;gap:10px}
  .item-ficha:not(.ficha-gol) .if-nm{font-size:13.5px;gap:8px}
  .item-ficha:not(.ficha-gol) .if-desc{font-size:12.5px;margin-top:4px}
  .item-ficha:not(.ficha-gol) .if-btns{gap:8px}
  .item-ficha:not(.ficha-gol) .if-btn{
    padding:12px 10px;font-size:11.5px;letter-spacing:1.8px;
  }
  .item-ficha.on{transform:none}
  /* El pico se para bajo el ítem, no bajo la esquina de la ficha. */
  .item-ficha::before{
    right:auto;left:var(--fx, 24px);top:auto;bottom:100%;
    margin:0 0 0 -7px;
    border-color:transparent;border-bottom-color:var(--fi-luz);
  }
}

/* ---- LA FICHA DE LA POSIBILIDAD DE GOL ----
   Mismo lenguaje que la ficha de ítem —violeta grafito, filo lila y halo
   difuminado— pero **se despliega hacia abajo**, porque el cartel de gol ocupa
   todo el ancho y no tiene costado libre. */
.item-ficha.ficha-gol{
  position:absolute;top:calc(100% + 9px);left:0;right:0;
  width:auto;transform:translateY(-5px);
  display:block;
  background:linear-gradient(160deg, var(--fi-fondo-a), var(--fi-fondo-b));
  border:1px solid var(--fi-borde);
  border-left:3px solid var(--fi-luz);
  box-shadow:
    0 0 0 1px rgba(0,0,0,.5),
    0 14px 44px rgba(0,0,0,.7),
    0 0 34px var(--fi-halo);
}
.item-ficha.ficha-gol.on{transform:none}
/* El pico apunta hacia arriba, al cartel. */
.item-ficha.ficha-gol::before{
  right:auto;left:22px;top:auto;bottom:100%;margin:0;
  border-color:transparent;border-bottom-color:var(--fi-luz);
}

.fg-top{
  display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  margin-bottom:9px;
}
.fg-nm{font-family:var(--tit);font-weight:800;font-size:12px;letter-spacing:.8px;color:#fff}
.fg-esp{font-family:var(--tit);font-weight:800;font-size:12.5px;color:var(--fi-luz)}

.fg-minis{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.fg-mini{
  position:relative;text-align:center;padding:6px 2px;
  border:1px solid var(--fi-borde-suave);border-radius:6px;
  background:var(--fi-mini);
  transition:transform .14s, box-shadow .14s, border-color .14s, opacity .3s;
}
/* La que entra siempre, y la que se juega. */
.fg-mini.seguro{border-color:#7de08f;background:rgba(61,220,107,.12)}
.fg-mini.mj{border-color:var(--gold)}
.fg-mj{
  position:absolute;top:-6px;left:50%;transform:translateX(-50%);
  background:var(--gold);border-radius:3px;padding:0 3px;font-size:8px;line-height:1.35;
}
.fg-ico{display:block;font-size:16px;line-height:1}
.fg-pct{
  display:block;font-family:var(--tit);font-weight:800;
  font-size:9.2px;color:var(--fi-luz);margin-top:3px;
}
.fg-mini.seguro .fg-pct{color:#7de08f}
.fg-mini.mj .fg-pct{color:var(--gold)}

/* El cursor del sorteo, sobre el violeta. */
.fg-mini.foco{
  border-color:rgba(255,255,255,.92);
  box-shadow:0 0 0 2px rgba(255,255,255,.5);
  transform:translateY(-3px) scale(1.05);z-index:3;
}
.fg-mini.gana{
  border-color:var(--fi-claro) !important;
  box-shadow:0 0 0 3px var(--fi-luz), 0 0 26px var(--fi-halo);
  transform:translateY(-5px) scale(1.1);z-index:4;
}
.fg-mini.fuera{opacity:.28}

/* Los botones, centrados y del ancho de su texto. */
.item-ficha.ficha-gol .if-btns{
  display:flex;justify-content:center;gap:7px;margin-top:11px;
}
.item-ficha.ficha-gol .if-btn{flex:0 1 auto;min-width:112px}

.gol-banner.abierto{
  border-color:var(--fi-luz) !important;
  box-shadow:0 0 0 1px var(--fi-luz), 0 0 18px var(--fi-halo);
}

@media (max-width:400px){
  .fg-pct{font-size:8.4px}
  .fg-ico{font-size:13px}
  .item-ficha.ficha-gol .if-btn{min-width:0;flex:1}
}

/* ---- EL SORTEO POR ELIMINACIÓN ----
   Las que no salieron se apagan de a una; la que queda se enciende. */
.fg-mini{transition:transform .14s, box-shadow .14s, border-color .14s, opacity .3s, filter .3s}
.fg-mini.foco{
  border-color:rgba(255,255,255,.92);
  box-shadow:0 0 0 2px rgba(255,255,255,.5);
  transform:translateY(-3px) scale(1.05);z-index:3;
}
/* Las que no salieron se apagan cuando el cursor frena, no antes. */
.fg-mini.fuera{opacity:.3}
.fg-mini.gana{
  border-color:var(--green) !important;
  box-shadow:0 0 0 3px var(--green), 0 0 28px rgba(61,220,107,.5);
  transform:translateY(-5px) scale(1.1);z-index:4;
}
.fg-mini.gana .fg-pct{color:var(--green) !important}
.gol-banner.abierto{box-shadow:0 0 0 2px var(--green)}

@media (max-width:400px){
  .fg-pct{font-size:8.4px}
  .fg-sale{font-size:7.6px}
  .fg-ico{font-size:13px}
}

/* El ítem abierto se marca, porque la ficha no tiene pico que lo señale. */
.item.abierto{
  border-color:var(--gold) !important;
  box-shadow:0 0 0 1px var(--gold);
}

/* En teléfonos angostos se afloja un poco, pero no se vuelve a la ficha
   apretada de antes: sigue ocupando el ancho de la pantalla. */
@media (max-width:440px){
  .item-ficha{grid-template-columns:minmax(0,1fr)}
  .item-ficha:not(.ficha-gol){padding:12px 13px;gap:9px}
  .if-btns{grid-column:1;justify-content:stretch}
  .item-ficha:not(.ficha-gol) .if-nm{font-size:12.5px}
  .item-ficha:not(.ficha-gol) .if-desc{font-size:11.5px}
  .item-ficha:not(.ficha-gol) .if-btn{flex:1;padding:11px 8px;font-size:11px}
  .item-ficha.ficha-gol{padding:8px 9px;gap:8px}
  .item-ficha.ficha-gol .if-btn{padding:6px 8px;font-size:10px}
  .item-ficha.ficha-gol .if-desc{font-size:11px}
}

/* ---------- EL SORTEO A LA VISTA ----------
   El cursor va en **blanco semitransparente**: el dorado ya está en el filo de
   las cartas y en los tonos del resaltado, y un cursor dorado se perdía encima.
   El blanco no compite con ningún tono y se lee sobre los cuatro. */
.board .cell{transition:transform .14s, box-shadow .14s, border-color .14s, opacity .3s}

.board .cell.foco{
  border-color:rgba(255,255,255,.92) !important;
  box-shadow:0 0 0 2px rgba(255,255,255,.5), 0 0 26px rgba(255,255,255,.28) !important;
  background-color:rgba(255,255,255,.05);
  transform:translateY(-4px) scale(1.03);
  z-index:3;
}
.board .cell.elegida{
  border-color:rgba(255,255,255,1) !important;
  box-shadow:0 0 0 3px rgba(255,255,255,.75), 0 0 34px rgba(255,255,255,.4) !important;
  transform:translateY(-7px) scale(1.06);
  z-index:4;
}
.board .cell.apagada{opacity:.3}

/* ---------- LA ETIQUETA DEL MINI JUEGO ----------
   Las dos líneas iban sin estilo y salían pegadas: «MINI JUEGODEFENDER». Ahora
   cada una es un bloque y la etiqueta se distingue del nombre. */
.c-out .mj-lb, .p-out .mj-lb{
  display:flex;align-items:center;justify-content:center;gap:4px;
  font-family:var(--txt);font-weight:700;
  font-size:9.5px;letter-spacing:2px;text-indent:2px;
  color:var(--black);background:var(--gold);
  border-radius:3px;padding:2px 7px;
  width:fit-content;margin:0 auto 4px;
  text-transform:uppercase;
}
.mj-ico{font-style:normal;font-size:11px;line-height:1}

/* El nombre del mini juego, debajo de la etiqueta. */
.c-out .mj, .p-out .mj{
  display:block;font-family:var(--tit);font-weight:800;
  font-size:1.02em;letter-spacing:.6px;line-height:1.15;
}
.p-out .mj-lb{font-size:10.5px;letter-spacing:2.5px;padding:3px 9px;margin-bottom:5px}
.p-out .mj{font-size:1.1em;letter-spacing:1px}

/* En las cartas más chicas la etiqueta se achica pero no desaparece: es lo que
   avisa que hay que hacer algo. */
@media (max-width:440px){
  .c-out .mj-lb{font-size:8.4px;letter-spacing:1.4px;padding:1px 5px;gap:3px}
  .mj-ico{font-size:9.5px}
}

/* ---------- ÍCONOS (imagen o emoji) ---------- */
/* La imagen ocupa exactamente el lugar que ocupaba el emoji, así el layout no
   cambia cuando se reemplaza uno por otro. */
.ico-art{display:block;width:1em;height:1em;object-fit:contain}
.ico-emoji{display:block;line-height:1}

/* La ilustración de la carta: ocupa todo el espacio del ícono, recortada.
   Va con opacidad para que el cartel de abajo siga legible. */
.cell .c-ico{padding:0;overflow:hidden;position:relative}
.c-art{
  width:100%;height:100%;object-fit:cover;display:block;
  border-radius:3px;opacity:.92;
}
.cell:hover .c-art,.row.hl .cell .c-art,.cell.colhl .c-art{opacity:1}
.cell.lock .c-art{opacity:.3;filter:grayscale(.7)}

/* Los medidores: el medallón en chico. Apagado = gris y translúcido. */
.med-art{
  /* Casi el doble que antes (19px): el aguante y la racha son lo que más se
     mira durante el partido y a ese tamaño se leen de reojo. */
  display:inline-block;width:34px;height:34px;object-fit:contain;
  vertical-align:middle;transition:filter .2s,opacity .2s;
}
.med-art.off{filter:grayscale(1) brightness(.6);opacity:.35}
.med-art.on{filter:drop-shadow(0 0 5px rgba(255,255,255,.35))}
.racha-track .med-art,.hearts .med-art{margin-right:2px}
/* En el medidor, el rayo va más angosto que el corazón por la misma razón. */
.racha-track .med-art{width:26px}

/* ---------- CÓMO SE JUEGA ---------- */
.reglas{margin-top:16px;text-align:left}
.regla{
  display:flex;gap:11px;align-items:flex-start;
  border-top:1px solid var(--line);padding:11px 0;
}
.regla:first-child{border-top:none;padding-top:4px}
.rg-ico{
  flex:0 0 30px;font-size:21px;line-height:1.1;text-align:center;
}
.rg-txt{
  flex:1;font-family:var(--txt);font-size:11.8px;line-height:1.55;
  color:var(--dim);letter-spacing:.2px;
}
.rg-txt b{color:var(--white);font-weight:700}
.rg-txt b.ef-ag{color:var(--red)}
.rg-txt b.ef-var{color:var(--blue)}
.rg-txt b.ef-plata{color:var(--coin)}

/* El "?" que reabre las reglas durante el partido. */
.hint-ayuda{
  flex:0 0 auto;width:20px;height:20px;border-radius:50%;
  font-family:var(--tit);font-weight:800;font-size:12px;line-height:1;
  background:transparent;border:1px solid var(--line);color:var(--dim2);
  cursor:pointer;transition:border-color .15s,color .15s;
}
.hint-ayuda:hover{border-color:var(--gold);color:var(--gold)}

/* ---------- AVISO BETA ---------- */
/* La etiqueta del botón: chiquita, en el borde, para que se vea sin gritar. */
.beta{
  display:inline-block;margin-left:8px;vertical-align:middle;
  font-family:var(--txt);font-weight:700;font-size:8.5px;letter-spacing:1.5px;
  color:var(--black);background:var(--gold);
  padding:2px 5px;border-radius:2px;
}
.beta-ico{font-size:44px;line-height:1;margin-bottom:4px}
.beta-caja{
  border:1px solid var(--line);background:var(--panel2);
  padding:12px 14px;margin-top:16px;text-align:left;
}
.beta-lb{
  font-family:var(--txt);font-size:9px;letter-spacing:2.5px;
  color:var(--dim);margin-bottom:8px;
}
.beta-list{margin:0;padding-left:16px;list-style:none}
.beta-list li{
  font-family:var(--txt);font-size:11.5px;line-height:1.5;
  color:var(--dim);margin-bottom:5px;position:relative;
}
.beta-list li::before{
  content:'·';position:absolute;left:-13px;color:var(--gold);font-size:15px;line-height:1.1;
}
.beta-list b{color:var(--white)}

/* ---------- FOOTER ----------
   Barra fija abajo, centrada. 26px de alto y fondo semitransparente para que
   esté siempre a mano sin pelearle espacio al mesa. El body reserva ese
   alto, así el contenido nunca queda tapado. */
.ft{
  position:fixed;left:0;right:0;bottom:0;z-index:300;
  display:flex;align-items:center;justify-content:center;
  gap:8px;flex-wrap:wrap;
  padding:6px 12px;
  background:rgba(5,10,20,.92);border-top:1px solid var(--line);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.ft a{
  display:inline-flex;align-items:center;gap:5px;
  font-family:var(--txt);font-size:10.5px;letter-spacing:.5px;
  color:var(--dim);text-decoration:none;transition:color .15s;
}
.ft a:hover{color:var(--gold)}
.ft .fi{font-size:12px}
.ft .fsep{color:var(--line);font-size:10px}
body{padding-bottom:36px}
@media (max-width:380px){
  .ft{gap:2px 10px}
  .ft .fsep{display:none}
}


/* ================= REBRANDING DEL MINI JUEGO (v92-v93) =================
   Va al final a propósito: pisa las reglas anteriores del mini juego sin
   borrarlas. La primera vez este bloque se insertó cortando por índices y se
   llevó puestas 425 reglas del resto del juego. */

/* ---------- EL MINI JUEGO ----------
   Mismo lenguaje que el menú: azul profundo con filo del color de la carta,
   tipografía de títulos y botones que se encienden al pasar. */
.sit.mam, .sit.penal{
  border-width:2px;border-radius:10px;
  padding:22px 24px 20px;
  max-width:420px;width:92vw;
}
.sit.mam .t, .sit.penal .t{
  font-family:var(--tit);font-weight:800;
  font-size:clamp(24px,5.5vw,32px);line-height:1;
  letter-spacing:2.5px;text-indent:2.5px;text-transform:uppercase;
  margin:2px 0 4px;
}
.sit.mam .s, .sit.penal .s{
  font-family:var(--txt);font-weight:600;
  font-size:11px;letter-spacing:2.5px;text-indent:2.5px;color:var(--dim);

/* ---------- EL MINI JUEGO: LAS DOS FIGURAS ---------- */
/* Al resolverse, el que gana crece y el que pierde se apaga. */
.mam-cancha.gano .mam-yo{animation:crece .5s cubic-bezier(.3,1.4,.5,1) both}
.mam-cancha.gano .mam-rival{animation:apaga .5s ease-out both}
.mam-cancha.perdio .mam-rival{animation:crece .5s cubic-bezier(.3,1.4,.5,1) both}
.mam-cancha.perdio .mam-yo{animation:apaga .5s ease-out both}
@keyframes crece{
  0%  {transform:translateX(-50%) scale(1)}
  55% {transform:translateX(-50%) scale(1.45)}
  100%{transform:translateX(-50%) scale(1.25)}
}
@keyframes apaga{
  to{opacity:.28;filter:grayscale(1) drop-shadow(0 2px 5px rgba(0,0,0,.5))}
}
/* El destello del choque. Vivía con el arco viejo de los penales; cuando ese
   se fue, esta animación se quedó sin definición y el anillo del mini juego
   aparecía quieto. */
@keyframes paro{
  from{transform:scale(.35);opacity:1}
  to  {transform:scale(1.9);opacity:0}
}

/* El choque cuando los dos van al mismo lado. */
.mam-cancha.choque::after{
  content:'';position:absolute;left:var(--cx,50%);top:50%;
  width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;
  border:3px solid var(--gold);
  animation:paro .6s cubic-bezier(.2,.8,.3,1) both;
}

/* La ilustración de la carta, como cabecera. */
.mam-art{
  position:relative;margin:-10px -14px 12px;border-radius:7px;overflow:hidden;
  border:1px solid var(--line);
}
.mam-art img{display:block;width:100%;height:auto;max-height:118px;object-fit:cover}
.mam-art::after{
  content:'';position:absolute;inset:auto 0 0;height:58%;
  background:linear-gradient(180deg,transparent,rgba(0,8,31,.93));
}

/* El marcador del duelo, con los colores del tablero. */
.sit .p-emp{
  display:flex;align-items:center;justify-content:center;gap:10px;
  font-family:var(--txt);font-size:10.5px;letter-spacing:1.5px;
  color:var(--dim);margin-bottom:8px;text-transform:uppercase;
}

.p-emp .pe-riv b{color:var(--white)}
.p-emp .pe-vs{color:var(--dim2);font-size:9px}

/* La cancha: más alta, con las dos figuras grandes. */
/* Compartía estas reglas con el arco viejo de los penales, que ya no existe. */
.mam-cancha{
  position:relative;height:104px;margin:14px 0 6px;
  border:1px solid var(--line);border-radius:8px;overflow:hidden;
  background:
    repeating-linear-gradient(90deg,
      rgba(0,33,118,.5), rgba(0,33,118,.5) 24px,
      rgba(0,20,66,.5) 24px, rgba(0,20,66,.5) 48px);

.mam-cancha::before{
  content:'';position:absolute;left:0;right:0;top:50%;height:1px;
  background:rgba(255,255,255,.16);
}
.mam-cancha .mam-rival,.mam-cancha .mam-yo{
  position:absolute;left:50%;transform:translateX(-50%);
  transition:left .5s cubic-bezier(.3,1.3,.5,1),transform .5s cubic-bezier(.3,1.3,.5,1);
  filter:drop-shadow(0 3px 8px rgba(0,0,0,.65));
}

/* ---------- LOS CARTELES, MÁS GRANDES EN DESKTOP ----------
   Los dos nacieron con un ancho fijo pensado para que entraran en un celular
   —400px y 430px— y en un monitor quedaban perdidos en el medio de la pantalla.

   El ancho va en `clamp` y no en un número fijo: se ata al viewport, así que
   crece en un monitor grande y se queda quieto en un portátil, sin necesidad de
   un breakpoint por cada tamaño.

   La ilustración se mide en `vh` a propósito. Lo escaso en 16:9 es el alto, así
   que atarla al alto real de la ventana es lo que impide que en un portátil de

@media (min-width:1025px), (min-width:821px) and (orientation:landscape){

  .play .p-go{font-size:12.5px;letter-spacing:4.5px;margin-top:15px}

    max-height:88vh;overflow-y:auto;

  .sit .sit-tag{font-size:13px;margin-bottom:17px}

/* ================================================================
   Este bloque va **al final a propósito**: los media queries de mobile que
   están más arriba fijan alturas de carta (132px, 118px, 106px…) y, al venir
   después, pisaban el reparto por alto de pantalla y la mesa desbordaba.
   En CSS gana la última regla, así que acá manda.
   ================================================================ */

/* ================= TODO EN UNA PANTALLA =================
   Desde tablet en portrait para abajo, el partido entra sin scroll: se usa la
   altura de la ventana como presupuesto y la mesa se queda con lo que sobra.

   El orden vertical sigue lo que se mira antes de decidir:

        marcador + reloj + medidores    ← el estado, en una barra
        ítems  ·  posibilidad de gol    ← lo que se puede usar
        LA MESA                         ← lo que hay que leer
        columnas
        ▸ relato (plegado)              ← se lee después, no antes
*/


/* ---- DESKTOP: el partido también entra en una pantalla ----
   Con la ventana baja —un portátil de 1366x768, o una ventana no maximizada—
   la mesa se comprimía y había que scrollear. Ahora el alto de la ventana es el
   presupuesto y la mesa se queda con lo que sobra, igual que en mobile. */



/* ══════════════════════════════════════════════════════════════════════
   RESPONSIVE — UN SOLO SISTEMA
   
   Reemplaza a catorce media queries que se pisaban entre sí. La idea es que
   **la altura de la ventana es el presupuesto** y la mesa se queda con lo que
   sobra, en vez de fijar píxeles por cada ancho de pantalla.

   Todo sale de tres variables:

     --gap    el aire entre bloques
     --carta  el alto de cada carta (4 filas)
     --cro    el diámetro del anillo del reloj

   El orden vertical es siempre el mismo, de arriba a abajo:

     marcador + reloj + medidores    el estado
     ítems · posibilidad de gol      lo que se puede usar
     LA MESA                         lo que hay que leer
     columnas
     ▸ relato (plegado)              se lee después
   ══════════════════════════════════════════════════════════════════════ */

:root{
  --gap:10px;
  --carta:126px;
  --cro:80px;
  /* Ancho del boton de fila. Las columnas se corren exactamente esto mas el
     gap, asi que vive en una variable: eran cuatro anchos y cuatro paddings
     mantenidos por separado, y se desincronizaron. */
  --fpick:52px;
}

/* ---------- LA MESA ---------- */
/* ---------- LA MESA: CUATRO FILAS IGUALES ----------
   Las cuatro filas miden **exactamente lo mismo**, sin importar qué cartas les
   toquen. Antes las que traían mini juego pedían más alto —una línea más— y esa
   fila crecía, así que la mesa quedaba despareja de una jugada a otra.

   `grid` con `repeat(4, 1fr)` reparte el alto en cuatro partes iguales y las
   cartas se estiran a lo que les toca. El contenido que no entra se recorta,
   que es preferible a una mesa que salta. */
.board{
  display:grid;grid-template-rows:repeat(4, 1fr);
  gap:var(--gap);align-content:stretch;
}
.row{display:flex;gap:var(--gap);align-items:stretch;min-height:0}
/* `--carta` es el **piso** de la fila, no su alto exacto: con `1fr` las cuatro
   se reparten lo que sobra por igual, y este mínimo garantiza que la carta se
   siga leyendo aunque la pantalla sea muy baja. */
.board{grid-auto-rows:minmax(var(--carta), 1fr)}
/* Cuando la mesa tiene alto propio, las filas se reparten ese alto y el mínimo
   queda solo como piso de legibilidad. */
.board:not([style]){grid-auto-rows:minmax(var(--carta), 1fr)}
.row .cell{min-height:0;overflow:hidden}
.row-pick{align-self:stretch}

/* ══════════ MOBILE Y TABLET PORTRAIT ══════════ */
/* Mobile: pantallas angostas **o** en vertical. Una tablet en landscape mide
   más de 1024 de ancho pero también puede medir justo 1024 — el criterio real
   es la forma de la pantalla, no solo el ancho. */
@media (max-width:1024px) and (orientation:portrait), (max-width:820px){
  :root{--gap:5px; --carta:76px; --cro:42px; --fpick:28px}

  /* `dvh` y no `vh`: en el celular la barra del navegador se suma y resta al
     alto de la ventana, y `100vh` mide la pantalla **completa** —incluidas esas
     barras—, así que la última fila quedaba debajo del borde. `100dvh` mide lo
     que se ve de verdad.

     Con el alto fijado, la mesa toma lo que sobra en vez de calcularse por
     `vh`: así entra exacto en cualquier pantalla, con barras o sin ellas. */
  html{height:100%}
  body{
    /* **`height` y no solo `min-height`.** Con solo un mínimo el body no tiene
       techo: crece con el contenido, y entonces el `flex:1` de la cancha
       reparte un alto mayor que la pantalla. Así la mesa nunca se veía obligada
       a achicarse y lo de abajo quedaba fuera de vista.

       Antes se intentó `overflow:hidden`, que cortaba el contenido sin manera
       de llegar a él. Esto es distinto: la mesa **cede** —su fila es
       `minmax(0,1fr)`— así que nada se corta, todo entra. El `auto` queda de
       red por si alguna pantalla es tan baja que ni las filas fijas entran.

       Los menús no dependen de esto: son overlays fijos con scroll propio. */
    height:100dvh;
    display:flex;flex-direction:column;
    padding:5px;gap:5px;overflow-x:hidden;overflow-y:auto;
  }
  /* **El eslabón que hacía que nada se achicara.** La marquesina y la cancha no
     son hijas del body: cuelgan de `.wrap`. Y `.wrap` traía `min-height:auto`,
     que en un ítem flex significa *no puedo achicarme por debajo de mi
     contenido*. Con ese piso, el techo del body no servía de nada: `.wrap`
     crecía, la cancha crecía con él, la mesa nunca cedía y el hint y el PLANTEL
     terminaban fuera de la pantalla.

     Con `min-height:0` la cadena queda libre y el alto se reparte de verdad:
     body → wrap → cancha → la fila de la mesa. */
  .wrap{flex:1 1 0;min-height:0}
  .marquesina{flex:0 0 auto}
  .cancha{flex:1;min-height:0}
  .board-zona{flex:1;min-height:0;display:flex;flex-direction:column}
  .board{flex:1;min-height:0}
  .fila-cols,.board-hint,.fila-accion{flex:0 0 auto}

  /* ---- LA BARRA ----

        CLASIF      🛡        🛡      ╭──╮
                  LOCAL 2-1 VISIT    │70│
                                     ╰──╯

     Los números al centro con el guion, y cada equipo a su lado con el escudo
     **arriba** del nombre. El escudo va chico para que la barra no crezca. */
  .marquesina{
    display:grid;grid-template-columns:auto minmax(0,1fr) auto;
    align-items:center;gap:7px;padding:4px 8px;
  }
  .mq-izq{justify-self:start;gap:4px}
  .mq-ronda{font-size:9px;letter-spacing:1px}
  .mq-copas{transform:scale(.75);transform-origin:left center}

  .mq-score{justify-self:center;display:flex;align-items:center;gap:9px;min-width:0}
  .mq-eq{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;max-width:9ch}
  .mq-esc{width:17px;height:17px;flex:0 0 auto}
  .mq-esc svg{width:100%;height:100%}
  .mq-nom{
    font-size:8.4px;letter-spacing:.3px;line-height:1;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;
  }
  .mq-cifras{display:flex;align-items:baseline;gap:3px;flex:0 0 auto}
  .mq-n{font-size:24px;line-height:1}
  .mq-sep{font-size:15px;color:var(--dim2)}
  .mq-reloj{justify-self:end}

  /* ---- LOS PANELES, ACOMODADOS CON GRID ----

     Los paneles quedan donde los pone el HTML; acá se les asigna su lugar con
     `grid-area`. Así rotar la tablet solo cambia qué media query aplica, sin
     tocar el DOM.

     ┌────────────┬──────────┬─────────┐
     │ ÍTEMS      │ ❤ ⚡ €   │ ATK/DEF │
     ├────────────┴──────────┴─────────┤
     │       POSIBILIDAD DE GOL         │
     ├──────────────────────────────────┤
     │            LA MESA               │
     └──────────────────────────────────┘
  */
  .cancha{
    display:grid;
    /* Los ítems se estiran, el PLANTEL pide lo suyo y queda pegado a la derecha. */
    grid-template-columns:minmax(0,1fr) auto;
    /* **La fila de la mesa toma todo lo que sobra** (`minmax(0,1fr)`) y las
       demás piden lo suyo (`auto`). El `0` del minmax es lo que permite que la
       mesa se achique: sin él la fila nunca baja de su contenido, la página
       crece más que la pantalla y lo de abajo —el hint y el PLANTEL— queda
       fuera de vista.

       El relato no tiene fila propia: es un botón flotante. */
    grid-template-rows:auto auto auto minmax(0,1fr) auto;
    grid-template-areas:
      "meds   stats"
      "items  stats"
      "gol    gol"
      "mesa   mesa"
      "hint   hint";
    gap:5px 6px;align-items:center;
    flex:1;min-height:0;
  }
  .lado,.centro,.fila-accion,.fa-izq,.fa-meds{display:contents}

  /* El `backdrop-filter` que hereda del panel **crea un contexto de
     apilamiento**, y ahí adentro quedaba encerrado el `z-index:200` de la
     ficha: hacia afuera el panel competía como un `auto` cualquiera y la mesa,
     que viene después en el DOM, le ganaba. Acá encima es inútil, porque el
     panel va sin fondo y estaría difuminando algo que no existe.

     El `z-index` va acompañado de `position:relative` a propósito: sobre un
     elemento estático se ignora, que es justo lo que le pasaba a `.lado` en
     mobile. */
  #panelItems{
    grid-area:items;min-width:0;padding:0;background:none;border:none;
    backdrop-filter:none;-webkit-backdrop-filter:none;
    position:relative;z-index:20;
  }
  #panelPlantel{grid-area:stats;justify-self:end}
  /* El ancla envuelve al cartel, así que el hijo del grid pasa a ser ella.
     Se nombran las dos: antes de que el jugador abra la ficha por primera vez
     el cartel todavía está suelto, sin envolver. */
  .gol-banner,.gol-ancla{grid-area:gol}
  .board-zona{
    grid-area:mesa;min-height:0;align-self:stretch;
    display:flex;flex-direction:column;
  }
  .board{flex:1;min-height:0}
  .board-hint{grid-area:hint}

  /* ---- LA LÍNEA DE MEDIDORES ----
     Aguante, racha y dinero en un solo renglón, arriba de los ítems. El aviso
     de amarilla aparece solo a veces, así que la línea puede envolver en vez de
     desbordar. */
  #panelEquipo{
    grid-area:meds;min-width:0;
    padding:0;border:none;background:none;
    /* `space-between` y no solo un `gap`: los tres medidores se reparten todo
       el ancho de la franja en vez de amontonarse a la izquierda dejando un
       hueco muerto antes del PLANTEL. El `gap` queda como piso, para que si
       aparece el aviso de amarilla y la línea envuelve no se peguen. */
    display:flex;flex-wrap:wrap;align-items:center;
    justify-content:space-between;gap:4px 10px;
  }
  #panelEquipo .panel-tit{display:none}
  #m-aguante,#m-racha,#m-dinero{
    padding:0;border:none;background:none;
    display:flex;align-items:center;flex:0 0 auto;
  }
  .rec-lb{display:none}
  .hearts,.racha-track{display:grid;grid-template-columns:repeat(4,26px);
                       justify-items:center;align-items:center;gap:0}
  .med-art{width:24px;height:24px}
  .racha-track .med-art{width:20px;height:24px}

  #panelItems .panel-tit{display:none}
  /* ---- LOS ÍTEMS, UNA SOLA LÍNEA ----
     Antes, con tres ítems o más, la lista pasaba a dos filas y le comía alto a
     la mesa. Ahora van siempre en un renglón: `1fr` reparte el ancho en partes
     iguales y el `minmax(0,…)` es lo que les permite achicarse — sin ese cero
     ninguna columna baja de su contenido y con cuatro ítems la fila desbordaba
     hacia el costado. */
  /* ---- LOS ÍTEMS: CUATRO HUECOS FIJOS ----
     `repeat(4, …)` y no `grid-auto-flow:column`: con el flujo automático la
     caja cambiaba de ancho según cuántos ítems tuvieras —dos ocupaban media
     pantalla cada uno— y el panel se reacomodaba con cada compra. Con cuatro
     columnas declaradas, cada ítem mide siempre lo mismo y los que faltan
     dejan su lugar vacío, que además dice cuántos podés llevar.

     El `minmax(0, …)` es lo que permite que se achiquen: sin ese cero ninguna
     columna baja del ancho de su contenido y la fila desborda. */
  .item-list{
    display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
    grid-auto-rows:auto;gap:3px;
  }
  .item{
    display:flex;align-items:center;gap:4px;padding:3px 5px;border-radius:5px;
    min-width:0;                      /* deja que el nombre se recorte, no que empuje */
  }
  .item .ii{font-size:13px;flex:0 0 auto}
  /* El nombre arriba y el efecto abajo, en columna: en una sola línea el
     nombre le comía el ancho al efecto, que es el dato que se mira. */
  .item .itx{min-width:0;display:flex;flex-direction:column;gap:0;line-height:1.06}
  .item .idesc{display:none}
  .item .inm{
    display:block;font-family:var(--tit);font-weight:800;
    font-size:8.4px;letter-spacing:.2px;color:var(--white);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .item .inm .iq{display:none}        /* la cantidad no entra en 89px */
  /* El tope de 30px venía de cuando los ítems eran angostos y de ancho libre.
     Ahora cada uno es una columna fija, así que el efecto usa lo que hay y, si
     no entra, corta con puntos suspensivos en vez de partir la palabra al
     medio —«DESTRA»— como hacía antes. */
  .item .ief{
    font-size:9.4px;font-weight:800;margin-top:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;
  }
  .no-items{font-size:9px;grid-column:1/-1}

  .gol-banner{width:100%;min-width:0;padding:6px 9px;gap:7px;justify-content:center;max-width:none}
  .gol-banner .gb-s{display:none}
  .gol-banner .gb-ico{font-size:16px}
  .gol-banner .gb-t{font-size:9.4px;letter-spacing:.3px;line-height:1.1}
  .gol-banner .gb-go{padding:3px 8px;font-size:9.4px;flex:0 0 auto}

  #panelPlantel{display:flex;flex-direction:column;gap:3px;padding:0;background:none;border:none}
  #panelPlantel .panel-tit{display:none}
  #panelPlantel .stat{
    display:flex;flex-direction:row;align-items:center;gap:4px;
    padding:2px 6px;border-radius:5px;
    background:linear-gradient(160deg,rgba(0,22,72,.95),rgba(0,8,31,.96));
    border:1px solid var(--line);
  }
  #panelPlantel .stat .n{font-size:15px;line-height:1}
  #panelPlantel .stat-txt{font-size:0;line-height:1}
  #panelPlantel .stat-txt b{font-size:7px;letter-spacing:.3px;display:block;color:var(--dim)}
  #panelPlantel .stat.atk .n{color:var(--red)}
  #panelPlantel .stat.def .n{color:var(--blue)}

  #m-dinero{padding:0;border:none;background:none;display:flex;align-items:center}
  #m-dinero .rec-val{font-family:var(--tit);font-weight:800;font-size:17px;letter-spacing:.3px;color:var(--coin)}

  /* ---- LA MESA ----
     Acá vivía un `.cancha{display:flex;flex-direction:column}` que pisaba el
     grid de arriba —misma especificidad, ganaba por venir después— y dejaba
     todo el mapa de áreas inerte. Con la cancha en flex los paneles caían en
     orden del DOM, así que el PLANTEL, que es lo último del HTML, terminaba
     abajo de la mesa y fuera de la pantalla. */
  .lado{position:static}

  /* La fila, angosta: el % en chico deja más ancho para las cartas. */
  .row-pick{padding:2px 0}
  .row-pick .pk{font-size:12px;letter-spacing:0}
  .row-pick .pp{font-size:7.5px;letter-spacing:0}
  .col-picks{gap:var(--gap)}
  /* La columna se lee igual que la fila: mismo peso de texto y alto parecido.
     Antes iba en 9,5px contra los 12px de la fila y parecía secundaria, cuando
     las dos son la misma decisión. */
  .col-pick{
    padding:5px 3px;font-size:11.5px;letter-spacing:.3px;
    font-family:var(--tit);font-weight:800;
  }

  .cell{padding:4px 3px 3px}
  .cell .c-nm{font-size:12.6px;min-height:0;letter-spacing:0;line-height:1.02}
  .cell .c-out{font-size:9.2px;padding-top:2px}
  .cell .c-out .efe{font-size:8.6px;margin-top:2px;padding-top:2px}
  .cell .c-out .mj-lb{font-size:7.2px;letter-spacing:.8px;padding:1px 4px;margin-bottom:1px}
  .cell .c-val{font-size:13px;min-width:20px;padding:0 3px}
  .ih,.ir{width:1.3em;height:1.3em;vertical-align:-.34em}
  .ir{width:1.1em;height:1.45em;vertical-align:-.4em}

  .board-hint{font-size:9px;padding:0}

  /* ---- EL RELATO, EN UN BOTÓN FLOTANTE ----
     Ocupaba una franja fija arriba de la mesa. Ahora vive detrás de un botón
     abajo a la derecha y se abre como panel sobre el juego. */
  .panel-log{
    position:fixed;left:0;right:0;bottom:0;z-index:120;
    max-height:0;overflow:hidden;padding:0;margin:0;border-radius:12px 12px 0 0;
    transition:max-height .28s ease;
    background:linear-gradient(180deg,rgba(0,18,58,.98),rgba(0,8,31,.99));
    border-top:2px solid var(--gold);
  }
  .panel-log.abierto{max-height:56vh;box-shadow:0 -12px 40px rgba(0,0,0,.6)}
  .panel-log .panel-tit{
    display:flex;justify-content:space-between;align-items:center;
    cursor:pointer;padding:11px 14px;margin:0;font-size:11px;
  }
  .panel-log .panel-tit::after{content:'✕';color:var(--dim2);font-size:13px}
  .panel-log .log{max-height:46vh;padding:0 14px 14px;font-size:11.5px}

  /* El botón flotante que lo abre. */
  .log-fab{
    position:fixed;right:10px;bottom:10px;z-index:110;
    width:44px;height:44px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:19px;cursor:pointer;
    background:linear-gradient(160deg,rgba(0,28,88,.97),rgba(0,10,36,.98));
    border:2px solid var(--gold);
    box-shadow:0 4px 18px rgba(0,0,0,.55);
  }
  .log-fab.hay::after{
    content:'';position:absolute;top:4px;right:4px;
    width:9px;height:9px;border-radius:50%;background:var(--green);
    border:2px solid var(--black);
  }
  .panel-log.abierto ~ .log-fab, body:has(.panel-log.abierto) .log-fab{display:none}
}

/* ══════════ MOBILE CHICO ══════════ */
@media (max-width:440px){
  :root{--gap:5px; --carta:clamp(80px, 13vh, 128px); --cro:50px; --fpick:38px}
  body{padding:5px;gap:5px}
  .mq-nom{max-width:8ch;font-size:8.6px}
  .mq-n{font-size:21px}
  .med-art{width:22px;height:22px}
  .cell{padding:5px 4px 4px}
  .cell .c-nm{font-size:11.2px}
  .cell .c-out{font-size:9.6px}
  .cell .c-out .efe{font-size:9px}
  /* En teléfonos chicos el nombre se queda, solo que más apretado: es lo que
     distingue un ítem de otro cuando tenés los cuatro y los efectos se parecen.
     Antes se ocultaba y quedaban cuatro cajas casi iguales. */
  .item .inm{font-size:7.8px;letter-spacing:0}
  .item .ief{font-size:8.8px}
  .item .ii{font-size:12px}
  .item{padding:3px 4px;gap:3px}
  .gol-banner .gb-t{font-size:9.5px}
}

/* ══════════ MOBILE LANDSCAPE ══════════
   Acostado sobra ancho y falta alto: la mesa va al costado del panel. */
@media (max-height:560px) and (orientation:landscape){
  :root{--gap:5px; --carta:clamp(62px, 19vh, 110px); --cro:44px}
  body{padding:5px;gap:5px}
  .cancha{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:6px;align-items:start}
  .lado,.centro{display:contents}
  .board-zona{grid-column:1;grid-row:1 / span 5}
  .col-picks{grid-column:1}
  /* A la derecha, en vertical: lo que se usa arriba y el relato abajo. */
  #panelItems{grid-column:2;flex-direction:column}
  #panelItems .item-list{flex-direction:column}
  .gol-banner,.gol-ancla{grid-column:2;max-width:none;margin:0}
  #panelPlantel{grid-column:2;margin:0;justify-content:space-between}
  #panelPlantel .stat{flex:1}
  .panel-log{grid-column:2}
  /* Acostado el reloj también va arriba a la derecha. */
  .mq-reloj{margin-left:auto}
  .marquesina{padding:5px 9px}
  .cell .c-nm{font-size:10.4px}
  .cell .c-out{font-size:9px}
}

/* ══════════ DESKTOP ══════════
   Se mantiene el grid de tres columnas; solo cambia el alto de la carta según
   el alto de la ventana, para que entre sin scroll en portátiles bajos. */
/* ══════════════════════════════════════════════════════════════════════
   DESKTOP Y TABLET LANDSCAPE  ·  1025px en adelante

   Layout de la v41, que es el que mejor se veía: **la página fluye**. No se
   fuerza el alto de nada; el contenido manda y el navegador scrollea si hace
   falta. Las columnas laterales quedan pegajosas para que los ítems y el
   estado no se vayan de vista al bajar.

     ┌──────────┬────────────────────────┬──────────┐
     │ TU EQUIPO│  la marquesina          │ PLANTEL  │
     │ ❤ ⚡ €   │  ─────────────────      │ ATK DEF  │
     │ ÍTEMS    │  LA MESA (4x4)          │ RELATO   │
     │ ⚽ GOL    │  columnas               │          │
     └──────────┴────────────────────────┴──────────┘

   Nada de acá toca mobile: mobile vive en `max-width` y esto en `min-width`.
   ══════════════════════════════════════════════════════════════════════ */
/* Desktop y **tablet en landscape**: cualquier pantalla ancha, aunque no llegue
   a 1025px de ancho. Una tablet acostada tiene la misma forma que un monitor. */
@media (min-width:1025px), (min-width:821px) and (orientation:landscape){
  :root{--gap:6px; --cro:78px; --fpick:62px}

  /* Se deshace el alto fijo que usa mobile: acá la página fluye. */
  html{height:auto}
  body{
    height:auto;min-height:100vh;overflow:visible;
    display:flex;justify-content:center;padding:14px;gap:0;
  }
  .wrap{width:100%;max-width:1320px;display:flex;flex-direction:column;gap:12px}

  /* La fila de acción se disuelve: cada panel vuelve a su columna. */
  .fila-accion,.fa-izq,.fa-meds{display:contents}

  .cancha{
    display:grid;grid-template-columns:245px minmax(0,1fr) 215px;
    gap:12px;align-items:start;
  }
  .lado{display:flex;flex-direction:column;gap:12px;position:sticky;top:14px}
  .centro{display:flex;flex-direction:column;gap:10px;min-width:0}

  /* La mesa, sin alturas forzadas: cada carta pide lo suyo. */
  .board{display:flex;flex-direction:column;gap:6px;grid-auto-rows:auto}
  .row{display:flex;gap:6px;align-items:stretch}
  .row .cell{min-height:126px;overflow:visible}

  /* **El resaltado, un punto más grueso acá.** Son los mismos 2px que en mobile,
     pero la carta de desktop mide 215px de alto contra 136: el mismo borde pesa
     menos sobre una superficie más grande y el resaltado se leía flojo. Con 3px
     recupera la presencia que tiene en el celular sin llegar a su peso relativo,
     que a este tamaño encerraría la carta.

     No corre nada de lugar: el `box-sizing:border-box` global hace que el borde
     crezca hacia adentro. */
  .row.hl .cell:not(.empty):not(.lock),
  .cell.colhl:not(.empty):not(.lock){ border-width:3px }

  /* Los paneles laterales, con sus etiquetas completas. */
  #panelEquipo,#panelPlantel,#panelItems{display:flex;flex-direction:column;gap:9px}
  .item-list{display:flex;flex-direction:column;gap:6px}
  .item{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:7px;width:100%}
  .item .ii{font-size:21px;flex:0 0 auto}
  .item .itx{display:flex;flex-direction:column;gap:1px;min-width:0}
  .item .inm{display:block;font-size:11.5px;letter-spacing:.6px}
  .item .ief{font-size:13px;max-width:none;overflow:visible}
  .item .idesc{display:block;font-size:10.5px;color:var(--dim2);line-height:1.25}

  .gol-banner{width:100%;padding:11px 13px;gap:11px;max-width:none;margin:0}
  .gol-banner .gb-s{display:block;font-size:10.5px;line-height:1.3}
  .gol-banner .gb-ico{font-size:26px}
  .gol-banner .gb-t{font-size:12.5px;letter-spacing:1px}
  .gol-banner .gb-go{padding:6px 12px;font-size:11.5px}

  /* Los medidores vuelven a su panel, con etiqueta. */
  .rec-lb{display:block}
  .med-art{width:23px;height:23px}
  .racha-track .med-art{width:19px;height:24px}
  .hearts,.racha-track{display:flex;flex-wrap:wrap;gap:3px}

  /* ---- PLANTEL ----
     El número grande a la izquierda, y a su lado el nombre del stat con la
     explicación debajo. Los dos textos alineados sobre la misma vertical. */
  #panelPlantel .stat{
    display:flex;flex-direction:row;align-items:center;gap:12px;
    padding:11px 13px;border-radius:8px;
    background:linear-gradient(160deg,rgba(0,22,72,.95),rgba(0,8,31,.96));
    border:1px solid var(--line);
    transition:border-color .15s;
  }
  #panelPlantel .stat.atk{border-left:3px solid var(--red)}
  #panelPlantel .stat.def{border-left:3px solid var(--blue)}
  #panelPlantel .stat .n{
    font-family:var(--tit);font-weight:800;font-size:34px;line-height:.9;
    flex:0 0 auto;min-width:30px;text-align:center;
  }
  #panelPlantel .stat-txt{
    display:flex;flex-direction:column;gap:2px;min-width:0;font-size:inherit;
  }
  #panelPlantel .stat-txt b{
    display:block;font-family:var(--tit);font-weight:800;
    font-size:13px;letter-spacing:1.4px;line-height:1;
  }
  /* La explicación va como texto suelto dentro del span, así que se le da
     tamaño al contenedor y el <b> lleva el suyo propio. */
  #panelPlantel .stat-txt{font-size:10.5px;color:var(--dim);line-height:1.25}
  #panelPlantel .stat.atk b{color:var(--red)}
  #panelPlantel .stat.def b{color:var(--blue)}

  .row-pick{align-self:stretch}
  .row-pick .pk{font-size:19px}
  .row-pick .pc{font-size:14px}
  .col-picks{gap:6px}
  .col-pick{padding:7px 4px;font-size:13px;letter-spacing:.5px}

  .cell{padding:8px 7px 7px}
  .cell .c-nm{font-size:15px}
  .cell .c-out{font-size:12.5px}
  .cell .c-out .efe{font-size:11.5px}
  .cell .c-out .mj-lb{font-size:9px;padding:2px 7px}

  /* El relato, abierto en su panel. */
  .log-fab{display:none}
  .panel-log{
    position:static;max-height:none;padding:0;
    display:flex;flex-direction:column;
    border-radius:8px;border:1px solid var(--line);
  }
  .panel-log .panel-tit{cursor:default;padding:10px 12px 6px}
  .panel-log .panel-tit::after{content:''}
  .panel-log .log{max-height:clamp(150px, 26vh, 340px);padding:0 12px 10px;font-size:12.5px}

  /* Las fichas salen al costado del ítem y debajo del cartel de gol, con su
     propia paleta y su halo. No hace falta nada acá: las reglas de arriba ya
     valen para los dos layouts.

     Antes este bloque las volvía `position:static` con `display:none`, que era
     lo correcto cuando fluían dentro del panel — pero al pasar a flotar dejó de
     serlo y **le ganaba a la regla de la ficha de gol**, que quedaba invisible. */
}

/* La franja media: menos ancho para los paneles, la mesa manda. */
@media (max-width:1300px) and (min-width:1025px){
  .cancha{grid-template-columns:210px minmax(0,1fr) 190px;gap:10px}
  .row .cell{min-height:118px}
  .cell .c-nm{font-size:13.6px}
  .cell .c-out{font-size:11.5px}
  :root{--fpick:54px}
}

@media (min-width:1600px){
  :root{--cro:92px}
  .wrap{max-width:1480px}
  .cancha{grid-template-columns:265px minmax(0,1fr) 235px;gap:14px}
  .row .cell{min-height:150px}
  .cell .c-nm{font-size:16.5px}
  .cell .c-out{font-size:13.5px}
}

@media (min-width:1900px){
  .wrap{max-width:1640px}
  .cancha{grid-template-columns:290px minmax(0,1fr) 260px}
  .row .cell{min-height:170px}
  .cell .c-nm{font-size:18px}
  .cell .c-out{font-size:14.5px}
  .med-art{width:27px;height:27px}
}




/* ══════════ LAS TARJETAS DEL JUEGO EN MOBILE ══════════
   Mercado, refuerzo, tutorial y creación de club: todo entra sin scroll de
   página. Si el contenido es más alto que la ventana, scrollea **la tarjeta**,
   nunca el fondo. */
.card{max-height:calc(100vh - 28px);overflow-y:auto}

@media (max-width:700px){

/* ================= LOS POP-UPS DE ACCIÓN, AL TAMAÑO DEL DESKTOP =================
   `.play` y `.sit` ya se habían agrandado, pero el resto seguía chico y el
   juego mostraba dos escalas distintas según qué te tocara. Los que faltaban:

   - **el mini juego y el penal** (`.sit.mam`, `.sit.penal`): su regla propia
     es más específica que la de `.sit`, así que el `max-width` grande del
     bloque de desktop nunca les llegaba y quedaban clavados en 420px;
   - **los avisos** (`.aviso`): racha llena, tiempo de descuento, empate y
     fin de partido, que no tenían ninguna regla de desktop;
   - **el cartel de gol con arte y el de tiro errado**, por la misma razón.

   Va al final de la hoja a propósito: `.gf.con-art` está definido después del
   bloque de desktop viejo, así que ahí adentro no habría servido de nada.

   Todos comparten el mismo ancho —`clamp(480px, 42vw, 700px)`, la familia de
   los que ya estaban— y el mismo tope de alto, así que ninguno se sale de la
   pantalla por más texto que traiga. */
@media (min-width:1025px), (min-width:821px) and (orientation:landscape){

  /* ---- MINI JUEGO Y PENAL ---- */
  .sit.mam, .sit.penal{
    max-width:clamp(480px, 42vw, 700px);width:100%;
    padding:32px 36px 30px;border-radius:12px;
    max-height:88vh;overflow-y:auto;
  }
  .sit.mam .sit-tag, .sit.penal .sit-tag{font-size:12.5px;letter-spacing:3.5px}
  .sit.mam .t, .sit.penal .t{font-size:clamp(34px, 3.2vw, 50px);margin:4px 0 6px}
  .sit.mam .s, .sit.penal .s{font-size:14px;letter-spacing:3px;margin-top:14px}
  .mam-art{margin:-12px -16px 16px}
  .mam-art img{max-height:clamp(150px, 19vh, 250px)}
  .sit .p-emp{font-size:14px;gap:12px;margin-bottom:14px}
  .p-emp b{font-size:23px}
  .p-emp .pe-vs{font-size:11.5px}
  .mam-cancha{height:clamp(100px, 12vh, 132px);margin:18px 0 6px}
  .mam-cancha .mam-rival{font-size:42px;top:10px}
  .mam-cancha .mam-yo{font-size:31px;bottom:8px}
  .sit.mam .palo{padding:18px 12px}
  .sit.mam .palo .pn{font-size:16px;letter-spacing:1px}

  /* ---- AVISOS: RACHA LLENA, DESCUENTO, EMPATE, FIN ---- */
  .aviso{
    max-width:clamp(480px, 42vw, 700px);
    --apx:40px; --apy:34px;
    max-height:88vh;overflow-y:auto;
  }
  .aviso .a-ico{font-size:66px}
  .aviso .a-t{font-size:clamp(38px, 3.6vw, 58px);letter-spacing:2.5px}
  .aviso .a-s{font-size:15px;letter-spacing:2.5px;margin-top:13px}
  .aviso .a-ops{gap:13px;margin-top:22px}
  .aviso .a-op{padding:17px 13px}
  .aviso .a-op .oi{font-size:33px}
  .aviso .a-op .on{font-size:20px;letter-spacing:1.5px;margin-top:4px}
  .aviso .a-op .od{font-size:13.2px;margin-top:8px;line-height:1.5}
  .aviso .a-op.solo{padding:22px 20px}
  .aviso .a-op.solo .oi{font-size:46px}
  .aviso .a-op.solo .on{font-size:25px;letter-spacing:2px;margin-top:6px}
  .aviso .a-op.solo .od{font-size:14.2px;margin-top:10px}
  .aviso .e-tit{font-size:clamp(52px, 5vw, 82px)}
  .aviso .e-marc{font-size:clamp(66px, 6.4vw, 104px);margin-top:9px}
  /* El marcador chico —el que va debajo del título, en el descuento— sube en
     la misma proporción, pero sigue siendo el chico de los dos. */
  .aviso .a-t + .a-s + .e-marc{font-size:clamp(46px, 4.2vw, 66px);margin-top:11px}
  .aviso .e-sub{font-size:14.5px;margin-top:10px}
  .aviso .e-aviso{font-size:24px;letter-spacing:2.5px;margin-top:17px}

  /* ---- CARTELES DE GOL ---- */
  .gf.con-art{max-width:clamp(480px, 40vw, 660px);width:100%}
  .gf.con-art .gf-txt{padding:22px 28px 24px}
  .gf.con-art .t{font-size:clamp(40px, 3.6vw, 58px)}
  .gf.con-art .s{font-size:14px;letter-spacing:3.5px}
  .gf.fallo{max-width:clamp(430px, 34vw, 560px);padding:26px 40px}
  .gf.fallo .fi{font-size:58px;margin-bottom:8px}
  .gf.fallo .t{font-size:clamp(32px, 2.9vw, 46px)}
  .gf.fallo .s{font-size:14px;margin-top:11px}
}

/* ============ EL BOTÓN DEL RELATO, ABAJO A LA IZQUIERDA (MOBILE) ============
   Estaba abajo a la **derecha** y se apoyaba sobre la última fila: tapaba el
   efecto de la carta de la esquina —22px de la carta quedaban debajo—.

   Se muda al rincón izquierdo, que es el único tramo libre de la barra de
   abajo: los dos links van centrados, así que de x=0 a ~100px no hay nada.
   Como el botón es más alto que esa barra, el body reserva lo que sobresale
   —y solo eso— para que no llegue a ninguna carta. Cuesta 17px de mesa, no
   los 40 que costaría reservarlo entero.

   Va al final de la hoja porque el bloque de "mobile chico" vuelve a declarar
   `body{padding:5px}` y pisaría la reserva.

   El `z-index` tiene que superar el de la barra de abajo (300), que si no lo
   tapa con su fondo. */
@media (max-width:1024px) and (orientation:portrait), (max-width:820px){
  :root{--fab:40px}
  body{padding-bottom:22px}
  .log-fab{
    left:7px;right:auto;bottom:4px;
    width:var(--fab);height:var(--fab);
    font-size:17px;z-index:310;
  }
  /* La línea de ayuda arranca después del botón, no debajo. */
  .board-hint{padding-left:calc(var(--fab) + 10px)}
  /* Y los créditos se centran en lo que queda, para que en pantallas de
     320px el botón no se le monte al primer link. */
  .ft{padding-left:calc(var(--fab) + 12px)}
}

/* ================= NI FOCO NI DESTELLO AL TOCAR =================
   Android pinta un rectángulo celeste encima de lo que tocás
   —`-webkit-tap-highlight-color`, que por defecto es rgba(51,181,229,.4)— y
   además el botón se queda con el foco puesto cuando el toque termina. En un
   juego que se juega a dedazos las dos cosas se leen igual: "esto quedó
   seleccionado", cuando en realidad la acción ya pasó.

   El anillo se conserva para `:focus-visible`, que es quien navega con
   teclado: ahí sí hace falta saber dónde está parado. */
html,button,a,[role="button"],input,select,textarea{-webkit-tap-highlight-color:transparent}
:focus:not(:focus-visible){outline:none}

/* ---- Y EL HOVER NO SE QUEDA PEGADO ----
   En touch el `:hover` se pega al último elemento tocado hasta que tocás otra
   cosa, así que el botón que acabás de apretar queda encendido como si
   siguiera elegido. `(hover:none)` es la pregunta correcta —la hace el
   dispositivo, no el ancho— así que un teléfono los apaga y una tablet con
   mouse los conserva.

   `.elegido` y `:disabled` quedan afuera a propósito: esos sí son estado real
   del juego, no un resto del dedo. */
@media (hover:none){
  /* Primero el relieve, que es lo que más se nota: ni salto ni resplandor. */
  .palo:hover, .cta:hover, .menu-op:hover, .shop-item:hover, .pick-stat:hover,
  .if-btn:hover, .aviso .a-op.btn:hover, .gol-banner.lista:hover,
  .op-col:hover, .cell.target:hover{transform:none;box-shadow:none}
  .item:hover:not(:disabled){left:0}

  /* Y después el color, cada uno a su base. Los estados de verdad
     —`.principal`, `.elegido`, `:disabled`— quedan afuera con `:not()`,
     porque esos sí los tiene que seguir mostrando. */
  .palo:hover:not(:disabled):not(.elegido),
  .sit .palo:hover:not(:disabled):not(.elegido),
  .sit.mam .palo:hover:not(:disabled):not(.elegido),
  .sit.mam.tono-good .palo:hover:not(:disabled):not(.elegido),
  .sit.mam.tono-hot .palo:hover:not(:disabled):not(.elegido),
  .sit.mam.tono-risk .palo:hover:not(:disabled):not(.elegido),
  .sit.penal .palo:hover:not(:disabled):not(.elegido){
    border-color:var(--line);background:var(--panel2);
  }
  .aviso .a-op.btn.gol:hover,
  .aviso .a-op.btn.col:hover{background:var(--panel2)}
  .if-btn.alt:hover{border-color:var(--fi-borde-suave);color:var(--fi-suave)}
  /* El fondo del CTA solo para el dorado: el `.alt` y el `.ghost` tienen
     el suyo y pisárselo los dejaría del color equivocado. */
  .cta:hover:not(.alt):not(.ghost){
    background:linear-gradient(160deg, rgba(38,32,4,.92), rgba(0,12,40,.96));
  }
  .cta.alt:hover{border-color:var(--line);color:var(--dim)}
  .cta.ghost:hover{color:var(--dim);border-color:var(--line)}
  .cta.chica.alt:hover{background:transparent}
  .menu-op:hover:not(.principal){border-color:var(--line)}
  .shop-item:hover:not(:disabled){border-color:var(--line)}
  .pick-stat.atk:hover,.pick-stat.def:hover{border-color:var(--line);background:var(--panel2)}
  .item:hover:not(:disabled){border-color:var(--line);background:var(--panel2)}
  .item.abierto:hover,.item.apuntando:hover{border-color:var(--gold)}
  .item.apuntando:hover{background:#1e1a0c}
  .hint-ayuda:hover{border-color:var(--line);color:var(--dim)}
  .row-pick:hover:not(:disabled),
  .col-picks.lista .col-pick:hover:not(:disabled){transform:none}
}

/* ================= LAS PANTALLAS ENTRAN SIN SCROLL =================
   La compactación de las tarjetas estaba atada al **ancho** (≤700px), pero lo
   que las desborda es el **alto**: en un 360x640 las reglas medían 720px de
   contenido contra 616 de hueco y el botón de EMPEZAR quedaba 37px abajo del
   corte. Un teléfono angosto y alto entraba; uno angosto y bajo, no.

   Así que va por alto, en dos escalones, y toca lo que de verdad ocupa
   lugar: el aire de la tarjeta, el título, y el ritmo vertical de las listas
   —las seis reglas y los cuatro ítems del vestuario— que es donde se juntan
   los cien píxeles que sobran. */
/* Antes que nada: la tarjeta se mide contra el hueco real del overlay —su
   alto menos el padding, que es el que reserva la franja del footer—. Con
   `calc(100dvh - 20px)` podía crecer 56px más de lo que entra, y el último
   botón terminaba detrás de la barra de créditos aunque la tarjeta "entrara".
   Un porcentaje se resuelve contra el contenedor, así que no hay número que
   mantener sincronizado con el padding. */
@media (max-width:820px){
  .card{max-height:100%}
}

  /* Las reglas: seis renglones, es la pantalla más larga del juego. */

  .regla:first-child{padding-top:2px}
  .rg-ico{font-size:16px;flex:0 0 21px}

  /* El refuerzo entre partidos. */
  .pick-stat{padding:8px 10px;margin-bottom:6px;gap:8px}
  .ps-ico{font-size:17px}
  .ps-nm{font-size:13.5px}
