<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DUELO FUTBOLERO — Estrategia y Suerte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Archivo:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Azul de competición europea, tomado del marcador de referencia (#001648):
     más profundo y saturado que el anterior, con blanco puro encima. */
  --black:#00081f;
  --panel:#001034;
  --panel2:#001648;
  --line:#12336e;
  --white:#ffffff;
  --dim:#93aede;
  --dim2:#5878ab;
  --azul:#0b3a8f;
  --azul2:#1657c4;
  --red:#ff3b52;
  --blue:#4d9bf0;
  --green:#3ddc6b;
  --gold:#f5c842;
  /* Naranja quemado: el empate que puede costarte el marcador. Entre el
     amarillo del riesgo común y el rojo de la derrota segura. */
  --naranja:#e87414;
  /* El dinero va en **verde**, el mismo del GOL. Antes era un dorado que se
     confundía con el amarillo de la racha, y las dos cosas aparecen juntas en
     la misma línea de la fila de acción. */
  --coin:#3ddc6b;
  --danger:#c31026;
  --cesped:#1d5c33;
  --cesped2:#1a5230;
  --cal:rgba(255,255,255,.5);

  /* ---- LAS FICHAS ----
     La ficha del ítem y la de la posibilidad de gol son el mismo objeto: se
     abren igual, se cierran igual y dicen lo mismo. Antes compartían estilo por
     coincidencia —los mismos violetas escritos a mano en veintipico de lugares—
     así que tocar una dejaba a la otra distinta. Ahora salen de acá.

     El violeta venía de otra paleta y competía con el dorado. Este celeste sale
     del azul de la cancha, así que la ficha se lee como parte de la transmisión
     y no como un cartel pegado encima.

     El mismo tono marca en la mesa las cartas con porcentaje de gol. Empezó más
     lavado —#9ed8ee, 70% de saturación— y se emparentaba con el gris azulado de
     las que no hacen nada, como OFFSIDE: hues cercanos, 197 contra 217, sobre un
     fondo azul. Con 85% de saturación se separan sin salirse de la familia. */
  --fi-luz:#5ecdf2;                    /* el filo, el pico y los bordes */
  --fi-claro:#f2f8fa;                  /* el texto que hay que leer */
  --fi-suave:#afc8d6;                  /* la bajada, un escalón abajo */
  --fi-fondo-a:rgba(10,38,70,.985);
  --fi-fondo-b:rgba(4,18,40,.99);
  --fi-borde:rgba(94,205,242,.5);
  --fi-borde-suave:rgba(94,205,242,.28);
  --fi-halo:rgba(90,180,230,.32);
  --fi-btn-a:rgba(16,58,104,.95);
  --fi-btn-b:rgba(6,24,52,.96);
  --fi-mini:rgba(8,28,56,.75);

  --tit:'Saira Condensed',system-ui,sans-serif;
  --txt:'Archivo',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}

/* El fondo es la cancha: césped rayado, círculo central y los dos arcos.
   Todo con gradientes, sin una sola imagen. */
body{
  color:var(--white);
  font-family:var(--txt);
  min-height:100vh;
  display:flex;justify-content:center;
  padding:14px;
  /* La foto del estadio, ya desenfocada y oscurecida al embeberla, con un velo
     azul encima para que la UI se lea sin competirle. */
  /* La foto se ve, pero con un velo que baja hacia los bordes: al centro se
     reconoce el estadio y en los extremos el azul cierra la composición. */
  background:
    radial-gradient(ellipse 120% 90% at 50% 38%, rgba(0,8,31,.18) 0%, rgba(0,8,31,.72) 62%, rgba(0,8,31,.94) 100%),
    var(--fondo-cancha, none) center/cover no-repeat,
    var(--black);
  background-attachment:fixed;
}

/* Las áreas grandes y los arcos, dibujados encima del césped. */
body::before,body::after{
  content:'';position:fixed;left:50%;transform:translateX(-50%);
  width:min(340px,54vw);border:2px solid var(--cal);
  pointer-events:none;z-index:0;
}
body::before{top:3%;height:88px;border-top:none}
body::after{bottom:3%;height:88px;border-bottom:none}

.wrap{width:100%;max-width:1320px;display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}

/* Dos protecciones para pantallas extremas:
   · nada puede desbordar el ancho y provocar scroll horizontal
   · las ilustraciones y los medallones nunca escalan más allá de su resolución */
*{max-width:100%}
html,body{overflow-x:hidden}
img{height:auto}
/* Las que van **a sangre**: se salen del padding de su tarjeta con márgenes
   negativos, y el `max-width:100%` de arriba se los anulaba —quedaban del
   ancho del contenido y pegadas a la izquierda, con el hueco del padding
   visible a la derecha—. Es el mismo caso que `.c-art`: no desbordan la
   pantalla, llenan su propia tarjeta. */
.c-art,.a-foto,.mam-art{max-width:none}

/* ---------- LA MARQUESINA: el partido, arriba y al medio ---------- */
.marquesina{
  background:linear-gradient(180deg,rgba(0,20,66,.95),rgba(0,8,31,.96));
  backdrop-filter:blur(8px);
  border:1px solid var(--line);border-top:3px solid var(--gold);
  /* El marcador es lo que hay que leer, así que se queda con el ancho libre.
     Antes la ronda y el reloj tomaban 1fr cada uno y le comían el lugar a los
     nombres de los equipos. */
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;
  gap:16px;padding:11px 18px;
  box-shadow:0 10px 40px rgba(0,0,0,.55);
}
.mq-izq{display:flex;flex-direction:column;gap:5px;align-items:flex-start;min-width:0}
/* Las copas ganadas en la racha, arriba de la instancia. */
.mq-copas{
  display:flex;align-items:center;gap:5px;
  border:1px solid var(--gold);background:rgba(245,200,66,.1);
  padding:2px 7px;border-radius:3px;
}
.mqc-ico{font-size:13px;line-height:1.2;letter-spacing:1px}
.mqc-x{font-family:var(--tit);font-weight:800;font-size:12px;color:var(--gold)}
.mqc-lb{
  font-family:var(--txt);font-size:8px;letter-spacing:1.8px;
  color:var(--gold);white-space:nowrap;
}
.mq-ronda{
  font-family:var(--tit);font-weight:800;font-size:15px;
  letter-spacing:4px;color:var(--gold);text-transform:uppercase;
}
.mq-partido{text-align:center}
/* El marcador: tu equipo a la izquierda, el rival a la derecha, con el nombre
   pegado a su propio número. Sacamos la línea de "vs" de arriba — con los
   nombres al lado de cada gol, decir quién juega contra quién era repetirlo. */
.mq-score{
  display:flex;align-items:center;justify-content:center;gap:10px;
  font-family:var(--tit);font-weight:800;line-height:1;
}
.mq-lado{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.mq-lado.mio{justify-content:flex-end}
.mq-lado.suyo{justify-content:flex-start}
.mq-nom{
  font-family:var(--txt);font-weight:600;
  font-size:clamp(10px,1.9vw,14px);letter-spacing:1.2px;
  color:var(--white);text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22ch;
}
.mq-n{font-size:clamp(34px,6vw,52px);letter-spacing:2px;text-indent:2px}
.mq-sep{font-size:clamp(20px,3vw,28px);color:var(--dim2);flex:0 0 auto}
.mq-reloj{display:flex;justify-content:flex-end}

/* ---------- EL CRONÓMETRO ---------- */
/* El anillo es el que cuenta el partido: grande y grueso, para que el avance se
   lea de reojo sin buscar el número. */
/* Todo el cronómetro se dimensiona desde `--cro`: el anillo, el número y la
   etiqueta. Así basta cambiar una variable por breakpoint y las proporciones se
   mantienen solas. */
.cronos{position:relative;width:var(--cro,96px);height:var(--cro,96px)}
.cro-svg{width:100%;height:100%;display:block;overflow:visible}
.cro-svg path{fill:none;stroke-width:15;stroke-linecap:butt}
.cro-off{stroke:rgba(255,255,255,.10)}
.cro-on{stroke:var(--green)}
.cro-aviso{stroke:var(--gold)}
.cro-final{stroke:var(--red)}
.cro-mid{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:0;pointer-events:none;
}
.cro-min{
  font-family:var(--tit);font-weight:800;line-height:.82;
  /* El hueco interior del anillo mide el 61% del diámetro; el número llena casi
     todo ese espacio. Antes ocupaba poco más de la mitad y el círculo se veía
     vacío en el medio. */
  font-size:calc(var(--cro,96px) * .5);
  color:var(--white);letter-spacing:-2px;
  text-shadow:0 0 14px rgba(255,255,255,.3);
}
.cro-lb{
  font-size:calc(var(--cro,96px) * .085);
  letter-spacing:1.5px;color:var(--dim);margin-top:-1px;
}

/* Las dos últimas jugadas se avisan en el número, no solo en el anillo. */
#m-reloj.urgente .cro-min{color:var(--gold);text-shadow:0 0 16px rgba(245,200,66,.55)}
#m-reloj.ultima .cro-min{color:var(--red);text-shadow:0 0 18px rgba(255,59,82,.6);animation:ultimaj 1s ease-in-out infinite}
#m-reloj.ultima .cro-lb{color:var(--red)}
@keyframes ultimaj{0%,100%{opacity:1}50%{opacity:.45}}

/* ---------- TITILEO ----------
   Un solo latido para todo lo que hay que mirar ya: el último corazón, las
   columnas listas, la posibilidad de gol y el reloj en las dos últimas jugadas.
   Con una animación compartida los cuatro laten al mismo ritmo y se leen como
   la misma señal, en vez de cuatro parpadeos distintos compitiendo. */
@keyframes titilar{
  0%,100%{opacity:1;filter:none}
  50%    {opacity:.45;filter:brightness(1.35)}
}
@keyframes titilarBorde{
  0%,100%{box-shadow:0 0 0 1px currentColor, 0 0 16px rgba(245,200,66,.25)}
  50%    {box-shadow:0 0 0 2px currentColor, 0 0 26px rgba(245,200,66,.6)}
}

/* 1 · el último corazón: cuando queda uno solo, late */
.hearts .med-art.on:only-of-type,
.hearts.ultimo .med-art.on{animation:titilar 1.1s ease-in-out infinite}

/* 4 · el reloj, en las dos últimas jugadas */
#m-reloj.urgente .cro-min,
#m-reloj.ultima .cro-min{animation:titilar 1.15s ease-in-out infinite}
#m-reloj.ultima .cronos{animation:titilar 1.15s ease-in-out infinite}

/* ---------- LAS TRES COLUMNAS ---------- */
.cancha{
  display:grid;
  grid-template-columns:245px minmax(0,1fr) 215px;
  gap:12px;align-items:start;
}
/* El `z-index` acá no es decorativo: `position:sticky` **crea un contexto de
   apilamiento**, así que el `z-index:200` de la ficha del ítem solo competía
   adentro de esta columna, no contra la mesa. Y como `.centro` viene después en
   el DOM, el tablero le pasaba por encima. Elevando la columna, la ficha sale
   por arriba de todo. */
.lado{display:flex;flex-direction:column;gap:12px;position:sticky;top:14px;z-index:5}
.centro{display:flex;flex-direction:column;gap:10px;min-width:0}

.panel{
  /* Con la foto del estadio detrás, los paneles necesitan opacidad y desenfoque
     propios: si no, el texto compite con el césped y las tribunas. */
  background:linear-gradient(180deg,rgba(0,18,58,.93),rgba(0,8,31,.95));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);padding:11px 12px;
  box-shadow:0 6px 24px rgba(0,0,0,.5);
}
.panel-tit{
  font-family:var(--tit);font-weight:700;font-size:11.5px;
  letter-spacing:4px;color:var(--gold);text-transform:uppercase;
  padding-bottom:7px;margin-bottom:9px;border-bottom:1px solid var(--line);
}

/* recursos, uno abajo del otro */
.rec{
  display:flex;flex-direction:column;gap:4px;
  padding:7px 0;border-bottom:1px dashed rgba(30,51,88,.7);
}
.rec:last-child{border-bottom:none;padding-bottom:1px}
.rec-lb{font-size:9.6px;letter-spacing:3px;color:var(--dim);text-transform:uppercase}
.rec-val{font-family:var(--tit);font-weight:800;font-size:23px;letter-spacing:1px;line-height:1}
.rec-val.coin{color:var(--coin)}

/* Aviso de amarilla acumulada. Va en amarillo de tarjeta, no en el rojo del
   resto de las advertencias: es la misma señal que ves en la cancha. */
.amarilla-aviso{border-bottom:none}
.am-caja{
  display:flex;align-items:center;gap:8px;
  border:1px solid var(--gold);background:rgba(245,200,66,.09);
  padding:6px 8px;animation:amviva 1.7s ease-in-out infinite;
}
.am-ico{font-size:20px;line-height:1}
.am-txt{
  font-family:var(--tit);font-weight:800;font-size:13px;
  letter-spacing:1.5px;color:var(--gold);line-height:1.15;
}
.am-txt b{
  display:block;font-family:var(--txt);font-weight:500;
  font-size:9.4px;letter-spacing:0;color:var(--red);margin-top:2px;
}
@keyframes amviva{
  0%,100%{box-shadow:0 0 0 0 rgba(245,200,66,0)}
  50%{box-shadow:0 0 12px 1px rgba(245,200,66,.35)}
}


/* ==========================================================================
   POP-UPS
   Todos comparten la misma caja: fondo azul noche, filo de color según lo que
   pasó, y aparecen con una animación de entrada. Los que esperan un click usan
   `poppin` (termina visible); los que se van solos usan `golpop` (termina en
   opacity 0).
   ========================================================================== */
/* Solo la entrada. Antes esta animación también se desvanecía al final, con una
   duración fija de 1,5s: como el cartel ahora dura 3 segundos, se apagaba a la
   mitad y quedaba la pantalla gris sin nada encima. El cierre lo decide el JS
   —por tiempo o por toque— y el desvanecido va aparte, en `.saliendo`. */
@keyframes golpop{
  0%  {opacity:0;transform:scale(.72)}
  55% {opacity:1;transform:scale(1.07)}
  100%{opacity:1;transform:scale(1)}
}
@keyframes golsale{
  from{opacity:1;transform:scale(1)}
  to  {opacity:0;transform:scale(1.05)}
}
@keyframes poppin{
  0%{opacity:0;transform:scale(.72)}
  55%{opacity:1;transform:scale(1.06)}
  100%{opacity:1;transform:scale(1)}
}
@keyframes blink{0%,60%{opacity:1}61%,100%{opacity:.25}}

.gol-flash,.play-flash,.sit-flash{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  /* abajo se reserva la franja del footer, que va por encima de todo */
  padding:20px 20px 56px;
}
/* `pointer-events:none` para que el cartel de gol —que se va solo— no bloquee
   la mesa mientras corre su animación. Pero el cartel de fallo **espera un
   toque**, así que ese lo vuelve a habilitar: sin esto el click no llegaba
   nunca y la pantalla quedaba gris y trabada. */
.gol-flash{background:rgba(3,7,16,.72);z-index:200;pointer-events:none}
.gol-flash.clickeable{pointer-events:auto}
/* El desvanecido de salida: lo dispara el JS justo antes de sacar el cartel. */
.saliendo .gf, .saliendo .sit{animation:golsale .22s ease-in both}
.saliendo{transition:opacity .22s;opacity:0}
.play-flash{background:rgba(3,7,16,.72);backdrop-filter:blur(3px);z-index:190}
.sit-flash{background:rgba(3,7,16,.9);backdrop-filter:blur(6px);z-index:210}

/* ---------- CARTEL DE GOL ---------- */
.gf{
  font-family:var(--tit);font-weight:800;text-transform:uppercase;
  text-align:center;padding:22px 40px;border:3px solid;
  animation:golpop .42s cubic-bezier(.2,.9,.25,1) both;
}
.gf .t{font-size:clamp(38px,9vw,76px);letter-spacing:2px;text-indent:2px;line-height:.92}
.gf .s{font-family:var(--txt);font-size:12px;letter-spacing:3px;margin-top:9px}
.gf.favor{border-color:var(--green);color:var(--green);box-shadow:0 0 60px rgba(61,220,107,.35)}
.gf.contra{border-color:var(--red);color:var(--red);box-shadow:0 0 60px rgba(255,59,82,.35)}
.gf.favor .s{color:var(--white)}
.gf.contra .s{color:var(--dim)}

/* tiro errado: más chico que el gol, y del color del que sale ganando */
.gf.fallo{padding:18px 30px;max-width:400px}
.gf.fallo .fi{font-size:42px;line-height:1;margin-bottom:4px}
.gf.fallo .t{font-size:clamp(22px,5.2vw,38px);letter-spacing:1px;line-height:1}
.gf.fallo .s{font-size:11.5px;margin-top:8px}
.gf.fallo.favor{border-color:var(--red);color:var(--red);box-shadow:0 0 46px rgba(255,59,82,.3)}
.gf.fallo.contra{border-color:var(--green);color:var(--green);box-shadow:0 0 46px rgba(61,220,107,.28)}
.gf.fallo .s{color:var(--dim)}

/* ---------- POP-UP DE LA JUGADA ---------- */
.play{
  font-family:var(--tit);font-weight:800;text-transform:uppercase;
  text-align:center;padding:20px 24px;border:3px solid var(--line);
  max-width:400px;width:100%;cursor:pointer;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
  animation:poppin .42s cubic-bezier(.2,.9,.25,1) both;
}
.play .p-tag{font-family:var(--txt);font-size:11px;letter-spacing:3px;color:var(--dim);margin-bottom:12px}
.play .p-ico{font-size:56px;line-height:1;margin-bottom:6px}
.play .p-nm{font-size:clamp(26px,6.5vw,40px);letter-spacing:2px;text-indent:2px;line-height:.95}
.play .p-val{font-family:var(--txt);font-size:12.5px;letter-spacing:2px;margin-top:8px;color:var(--dim)}
.play .p-out{
  font-family:var(--txt);font-size:16px;letter-spacing:2px;
  margin-top:14px;padding:9px;border-top:1px solid var(--line);
}
/* El mismo bloque de efectos que en la carta, más grande porque el pop-up
   tiene lugar de sobra. */
.play .p-out .efe{
  display:block;margin-top:8px;padding-top:7px;
  border-top:1px dashed var(--line);
  font-size:12.5px;letter-spacing:1px;color:var(--dim);
}
.play .p-out .efe b{font-weight:700;color:var(--red)}
.play .p-go{
  font-family:var(--txt);font-size:11px;letter-spacing:4px;color:var(--dim);
  margin-top:12px;animation:blink 1.1s steps(2,start) infinite;
}
.play.good{border-color:var(--green)} .play.good .p-out{color:var(--green)}
.play.bad{border-color:var(--red)}    .play.bad .p-out{color:var(--red)}
/* El flash usa la misma clase de tono que la carta, así que el tono nuevo
   necesita su regla acá o el penal y el córner se resuelven sin color. */
.play.gol{border-color:var(--fi-luz)} .play.gol .p-out{color:var(--fi-luz)}
.play.risk{border-color:var(--gold)}  .play.risk .p-out{color:var(--gold)}
.play.hot{border-color:var(--naranja)}  .play.hot .p-out{color:var(--naranja)}
.play.coin{border-color:var(--coin)}  .play.coin .p-out{color:var(--coin)}
.play.neutral .p-out{color:var(--dim)}

/* ---------- SITUACIÓN DE GOL ---------- */
.sit{
  font-family:var(--tit);font-weight:800;text-transform:uppercase;
  text-align:center;padding:26px 34px;border:3px solid var(--red);
  max-width:430px;width:100%;
  box-shadow:0 0 60px rgba(255,59,82,.3);
  animation:poppin .5s cubic-bezier(.2,.9,.25,1) both;
}
.sit .sit-tag{font-family:var(--txt);font-size:11.5px;letter-spacing:4px;text-indent:4px;color:var(--dim);margin-bottom:14px}
.sit .sit-ico{font-size:52px;line-height:1;margin-bottom:8px}
.sit .t{font-size:clamp(30px,7.5vw,52px);letter-spacing:2px;text-indent:2px;line-height:.95;color:var(--red)}
.sit .s{font-family:var(--txt);font-size:13px;letter-spacing:3px;margin-top:10px;color:var(--white)}
.sit .sit-extra{display:block;font-size:12px;letter-spacing:2px;color:var(--gold);margin-top:6px}
.sit.resuelta{animation:none}
.sit.gol{border-color:var(--red)}
.sit.salvado{border-color:var(--green);box-shadow:0 0 60px rgba(61,220,107,.3)}
.sit.salvado .t{color:var(--green)}
/* la versión a favor: misma caja, colores dados vuelta */
.sit.lado-favor{border-color:var(--green);box-shadow:0 0 60px rgba(61,220,107,.3)}
.sit.lado-favor .t{color:var(--green)}
.sit.resuelta.gol.lado-favor{border-color:var(--green);box-shadow:0 0 60px rgba(61,220,107,.3)}
.sit.resuelta.gol.lado-favor .t{color:var(--green)}
.sit.resuelta.salvado.lado-favor{border-color:var(--dim2);box-shadow:none}
.sit.resuelta.salvado.lado-favor .t{color:var(--dim)}

/* ---------- UNO CONTRA UNO ---------- */
/* Misma caja que el penal, pero horizontal: los dos se mueven a un lado o al
   otro sobre una franja de cancha. */
/* ---------- EL MINI JUEGO ----------
   Mismo lenguaje que la carta de la que salió: su tono en el borde, su
   ilustración arriba y la paleta azul del resto del juego. */
.sit.mam{border-width:3px}
.sit.mam.tono-risk{border-color:var(--gold);box-shadow:0 0 60px rgba(245,200,66,.3)}
.sit.mam.tono-risk .t{color:var(--gold)}
.sit.mam.tono-good{border-color:var(--green);box-shadow:0 0 60px rgba(61,220,107,.3)}
.sit.mam.tono-good .t{color:var(--green)}
.sit.mam.tono-hot{border-color:var(--naranja);box-shadow:0 0 60px rgba(232,116,20,.34)}
.sit.mam.tono-hot .t{color:var(--naranja)}

/* Resuelto: el borde pasa a verde o rojo según cómo salió, pisando el tono. */
.sit.mam.resuelta.salvado{border-color:var(--green);box-shadow:0 0 70px rgba(61,220,107,.4)}
.sit.mam.resuelta.salvado .t{color:var(--green)}
.sit.mam.resuelta.gol{border-color:var(--red);box-shadow:0 0 70px rgba(255,59,82,.4)}
.sit.mam.resuelta.gol .t{color:var(--red)}

/* La ilustración de la carta, como cabecera. */
.mam-art{
  position:relative;margin:-8px -12px 12px;border-radius:6px;overflow:hidden;
  border:1px solid var(--line);
}
.mam-art img{display:block;width:100%;height:auto;max-height:120px;object-fit:cover}
.mam-art::after{
  content:'';position:absolute;inset:auto 0 0;height:55%;
  background:linear-gradient(180deg,transparent,rgba(0,8,31,.92));
}

/* El marcador del duelo: tus stats contra los de la carta, con los mismos
   colores que usa la mesa para ataque y defensa. */
.sit .p-emp{
  display:flex;align-items:center;justify-content:center;gap:9px;
  font-family:var(--txt);font-size:11px;letter-spacing:1.5px;
  color:var(--dim);margin-bottom:10px;text-transform:uppercase;
}
.p-emp b{font-family:var(--tit);font-size:17px;margin-left:3px}
.p-emp .pe-atk b{color:var(--red)}
.p-emp .pe-def b{color:var(--blue)}
.p-emp .pe-riv b{color:var(--white)}
.p-emp .pe-vs{color:var(--dim2);font-size:9.5px}

/* La cancha: azul de la paleta, no el verde césped que quedó de antes. */
.mam-cancha{
  position:relative;height:74px;margin:14px 0 4px;
  border:1px solid var(--line);border-radius:6px;overflow:hidden;
  background:
    repeating-linear-gradient(90deg,
      rgba(0,33,118,.55), rgba(0,33,118,.55) 22px,
      rgba(0,20,66,.55) 22px, rgba(0,20,66,.55) 44px);
}
/* La línea del medio, para que se lea como media cancha */
.mam-cancha::before{
  content:'';position:absolute;left:0;right:0;top:50%;height:1px;
  background:rgba(255,255,255,.18);
}
.mam-cancha .mam-rival,.mam-cancha .mam-yo{
  position:absolute;left:50%;transform:translateX(-50%);
  transition:left .5s cubic-bezier(.3,1.3,.5,1),transform .5s cubic-bezier(.3,1.3,.5,1);
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.6));
}
.mam-cancha .mam-rival{top:8px;font-size:30px}
.mam-cancha .mam-yo{bottom:6px;font-size:22px}
.mam-cancha .mam-yo.va-izq{left:22%}
.mam-cancha .mam-yo.va-der{left:78%}
.mam-cancha .mam-rival.va-izq{left:22%;transform:translateX(-50%) rotate(-20deg)}
.mam-cancha .mam-rival.va-der{left:78%;transform:translateX(-50%) rotate(20deg)}

/* Los botones, con el mismo tratamiento que las cartas de la mesa. */
.sit.mam .palo{
  padding:14px 8px;border-width:2px;
  background:linear-gradient(160deg,rgba(0,22,72,.9),rgba(0,8,31,.92));
  transition:border-color .15s,transform .12s,box-shadow .15s;
}
.sit.mam .palo:hover:not(:disabled){transform:translateY(-2px)}
.sit.mam.tono-good .palo:hover:not(:disabled){border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
.sit.mam.tono-hot .palo:hover:not(:disabled){border-color:var(--naranja);box-shadow:0 0 0 1px var(--naranja)}
.sit.mam.tono-risk .palo:hover:not(:disabled){border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.sit.mam .palo .pn{font-size:13px;letter-spacing:.5px}

/* ---------- PENAL DEFINITORIO ---------- */
.sit .p-emp{
  font-family:var(--tit);font-weight:800;text-transform:uppercase;
  font-size:15px;letter-spacing:3px;color:var(--dim);margin-bottom:10px;
}
.sit .p-emp b{font-size:25px;color:var(--white);letter-spacing:1px}
.sit.penal{border-color:var(--gold);box-shadow:0 0 60px rgba(245,200,66,.28)}
.sit.penal .t{color:var(--gold)}
/* `salvado` = te fue bien, `gol` = te fue mal. Estaban al revés: venían del
   penal viejo, donde `gol` significaba "entró la tuya". Ahora el penal sirve
   para patear **y** para atajar, así que el nombre de la clase tiene que
   significar siempre lo mismo — bueno o malo para vos, no quién marcó. */
.sit.penal.resuelta.salvado{border-color:var(--green);box-shadow:0 0 60px rgba(61,220,107,.34)}
.sit.penal.resuelta.salvado .t{color:var(--green)}
.sit.penal.resuelta.salvado .sit-ico{filter:drop-shadow(0 0 12px rgba(61,220,107,.5))}
.sit.penal.resuelta.gol{border-color:var(--red);box-shadow:0 0 60px rgba(255,59,82,.34)}
.sit.penal.resuelta.gol .t{color:var(--red)}

.palos{display:flex;gap:7px;margin-top:13px}
.palo{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:var(--panel2);border:2px solid var(--line);color:var(--white);
  padding:11px 5px;cursor:pointer;font-family:inherit;
  transition:border-color .15s,background .15s,transform .15s;
}
.palo:hover:not(:disabled){border-color:var(--gold);background:#1a2a48;transform:translateY(-3px)}
.palo:disabled{opacity:.3;cursor:not-allowed}
.palo.elegido{opacity:1;border-color:var(--gold);background:#1a2a48}
.palo .pi{font-size:21px;line-height:1}
.palo .pn{font-family:var(--tit);font-weight:700;font-size:12.5px;letter-spacing:1px}

/* ---------- AVISOS (racha llena, descuento, empate) ---------- */
.aviso{
  /* El padding va en variables porque la foto de cabecera tiene que salirse
     exactamente lo que él entra, y cambia por breakpoint. */
  --apx:30px; --apy:24px;
  font-family:var(--tit);font-weight:800;text-transform:uppercase;
  text-align:center;padding:var(--apy) var(--apx);border:3px solid var(--gold);
  max-width:430px;width:100%;
  box-shadow:0 0 60px rgba(245,200,66,.32);
  animation:poppin .45s cubic-bezier(.2,.9,.25,1) both;
}
.aviso .a-ico{font-size:50px;line-height:1}
.aviso .a-t{font-size:clamp(28px,7vw,46px);letter-spacing:2px;text-indent:2px;line-height:.95;color:var(--gold)}
.aviso .a-s{font-family:var(--txt);font-size:12.5px;letter-spacing:2px;text-indent:2px;margin-top:9px;color:var(--dim);line-height:1.6}
.aviso .a-ops{display:flex;gap:9px;margin-top:16px}
.aviso .a-op{flex:1;border:1px solid var(--line);padding:11px 8px;background:var(--panel2)}
.aviso .a-op .oi{font-size:24px;line-height:1.2}
.aviso .a-op .on{font-size:15px;letter-spacing:1px;margin-top:2px}
.aviso .a-op .od{font-family:var(--txt);font-size:10.6px;letter-spacing:0;color:var(--dim);margin-top:5px;line-height:1.45}
.aviso .a-op.gol{border-color:var(--green)} .aviso .a-op.gol .on{color:var(--green)}
/* Cuando va sola, la tarjeta se acomoda: ícono más grande y texto más ancho. */
.aviso .a-op.solo{padding:15px 14px}
.aviso .a-op.solo .oi{font-size:34px}
.aviso .a-op.solo .on{font-size:18px;letter-spacing:1.5px;margin-top:4px}
.aviso .a-op.solo .od{font-size:11.4px;margin-top:7px}
.aviso .a-op.col{border-color:var(--gold)} .aviso .a-op.col .on{color:var(--gold)}
/* en el descuento las dos opciones son botones: ahí sí se elige */
.aviso .a-op.btn{font-family:inherit;color:var(--white);cursor:pointer;transition:background .15s,transform .15s}
.aviso .a-op.btn:hover{transform:translateY(-2px)}
.aviso .a-op.btn.gol:hover{background:#0d2413}
.aviso .a-op.btn.col:hover{background:#2a2410}

/* el empate va solo, con el marcador al tamaño en que se lee de un vistazo */
.aviso.empate{border-color:var(--white);box-shadow:0 0 60px rgba(255,255,255,.18)}
.aviso .e-tit{font-size:clamp(40px,11vw,68px);letter-spacing:4px;text-indent:4px;line-height:.95;color:var(--white);margin-top:2px}
.aviso .e-marc{font-size:clamp(52px,14vw,86px);line-height:1;letter-spacing:3px;text-indent:3px;color:var(--gold);margin-top:6px}
/* En el descuento el marcador acompaña, no encabeza: va más chico. */
.aviso .a-t + .a-s + .e-marc{font-size:clamp(34px,9vw,52px);margin-top:8px}
/* La nota al pie se pone roja cuando la decisión es urgente. */
.aviso .a-s.urge{color:var(--red)}
.aviso .e-marc span{color:var(--dim2);font-size:.6em;vertical-align:middle}
.aviso .e-sub{font-family:var(--txt);text-transform:none;font-size:12.5px;letter-spacing:1px;color:var(--dim);margin-top:7px}
.aviso .e-aviso{font-size:19px;letter-spacing:2px;color:var(--red);margin-top:13px}

@media (max-width:420px){ .aviso .a-ops{flex-direction:column} }

/* ---------- RESALTADO DEL RECURSO QUE CAMBIÓ ---------- */
.pulse-up,.pulse-down,.pulse-coin{animation:pulsehl .95s ease-out;border-radius:3px}
.pulse-up{--hl:var(--green)}
.pulse-down{--hl:var(--red)}
.pulse-coin{--hl:var(--coin)}
@keyframes pulsehl{
  0%{box-shadow:0 0 0 0 var(--hl);transform:scale(1)}
  18%{box-shadow:0 0 22px 5px var(--hl);transform:scale(1.13)}
  55%{box-shadow:0 0 14px 2px var(--hl);transform:scale(1.03)}
  100%{box-shadow:0 0 0 0 transparent;transform:scale(1)}
}

/* la racha llena se queda marcada hasta que la gastes */
#m-racha.lista{
  border:1px solid var(--gold);border-radius:3px;padding:5px 7px;margin:0 -7px;
  animation:rachaviva 1.9s ease-in-out infinite;
}
#m-racha.lista .rec-lb{color:var(--gold)}
/* En un `content:` el HTML no se interpreta, así que acá el ícono va como
   imagen de fondo de un pseudo-elemento, no como etiqueta. */
#m-racha.lista .rec-lb::after{
  content:' LISTA';
}
#m-racha.lista .rec-lb::before{
  content:'';display:inline-block;width:1.2em;height:1.5em;margin:0 .15em -.35em .3em;
  background:var(--ico-racha, none) center/contain no-repeat;
}
@keyframes rachaviva{
  0%,100%{box-shadow:0 0 0 0 rgba(245,200,66,0)}
  50%{box-shadow:0 0 14px 2px rgba(245,200,66,.45)}
}

/* ---------- GRILLA ---------- */

/* indicadores de aguante y racha (viven en el panel derecho) */
.hearts{letter-spacing:2px;font-size:20px;line-height:1.2}
.heart-on{color:var(--red);text-shadow:0 0 9px rgba(255,59,82,.55)}
.heart-off{color:var(--dim2);opacity:.45}
/* La racha se muestra con el mismo rayo que llevan los carteles de la mesa:
   si en la carta dice "+1 rayo" y arriba hay cuatro, se entiende sin
   explicación. Mismo tratamiento que los corazones del aguante. */
.racha-track{display:flex;gap:2px;letter-spacing:2px;font-size:19px;line-height:1.2}
.ray-on{filter:drop-shadow(0 0 5px rgba(245,200,66,.85))}
.ray-off{filter:grayscale(1);opacity:.28}
.board{display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:6px;align-items:stretch}
.row-pick{
  /* Con 'F1' en vez de 'FILA 1' alcanza la mitad de ancho, y ese espacio se lo
     lleva la mesa, que es lo que hay que mirar. */
  width:var(--fpick);flex-shrink:0;
  background:var(--panel);border:1px solid var(--line);
  color:var(--dim);cursor:pointer;
  font-family:var(--txt);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:border-color .15s,background .15s,color .15s;
}
.row-pick .pk{font-family:var(--tit);font-weight:800;font-size:19px;letter-spacing:1px}
/* El porcentaje de la fila va en **blanco**: es un dato neutro —cuántas cartas
   quedan por jugar— y en dorado competía con la racha y el filo de las cartas,
   que sí significan algo. */
.row-pick .pc{font-size:14px;color:var(--white);opacity:.82}
/* El botón de la fila se enciende junto con sus cartas: blanco, con borde y
   fondo propios. Antes solo cambiaba de color la mesa y el botón quedaba
   apagado, como si no fuera parte de lo mismo. */
.row-pick:hover:not(:disabled),
.row-pick.activo:not(:disabled){
  border-color:var(--white);color:var(--white);
  background:rgba(255,255,255,.13);
  box-shadow:0 0 0 1px var(--white), 0 4px 18px rgba(255,255,255,.18);
  transform:translateX(2px);
}
.row-pick:hover:not(:disabled) .pk,
.row-pick.activo:not(:disabled) .pk{color:var(--white)}
/* Apagado como el botón de columna: no se baja la opacidad del bloque entero
   —eso desdibujaba el borde y la fila desaparecía— sino que se atenúan el texto
   y el fondo, dejando el marco visible. Así se ve que la fila está ahí y que no
   se puede jugar. */
.row-pick:disabled{
  opacity:1;cursor:not-allowed;
  background:rgba(8,16,34,.75);
  border-color:var(--line);
  color:var(--dim2);
}
.row-pick:disabled .pk{color:var(--dim2)}
.row-pick:disabled .pc{color:var(--dim2);opacity:.6}
.cells{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:1}

/* Las columnas van pegadas arriba de la mesa, alineadas con sus cartas: el
   botón tiene que estar donde está la columna que va a atacar, no en otra
   parte de la pantalla. */
.board-zona{display:flex;flex-direction:column;gap:5px}
.col-picks{display:flex;gap:6px;padding-left:calc(var(--fpick) + var(--gap))}

/* ---------- POSIBILIDAD DE GOL ---------- */
/* Es la jugada más fuerte que podés tener disponible, así que va arriba de
   todo, ancha, en verde y titilando. Antes era un botón más dentro de la barra
   de columnas y se perdía entre ellos. */
/* El contenedor que ancla la ficha al cartel de gol.
   La ficha usa `top:calc(100% + 9px)`, que se mide contra el ancestro
   posicionado más cercano. Como el cartel no tenía `position` y la ficha
   quedaba como hermana suelta, ese ancestro terminaba siendo `.wrap`: el 100%
   pasaba a ser **el alto de toda la página** y la ficha se desplegaba abajo de
   todo, lejos del cartel que la abrió.

   No alcanza con ponerle `position:relative` al cartel, porque la ficha es su
   hermana y no su hija. Y no se puede meterla adentro: el cartel es un
   `<button>` y anidar botones rompe la interacción. Por eso se lo envuelve. */
.gol-ancla{position:relative;width:100%;display:block}

/* Apagado (racha incompleta): gris y quieto, pero legible — se tiene que ver
   qué es y cuánto falta. Encendido: verde y latiendo. */
.gol-banner{
  display:flex;align-items:center;gap:12px;width:100%;
  background:linear-gradient(180deg,rgba(13,25,48,.92),rgba(8,16,34,.92));
  border:2px solid var(--line);color:var(--white);
  padding:11px 15px;cursor:not-allowed;text-align:left;font-family:inherit;
  transition:transform .15s,background .15s,border-color .2s;
}
.gol-banner .gb-ico{font-size:29px;line-height:1;filter:grayscale(1);opacity:.5}
.gb-txt{flex:1;min-width:0}
.gb-t{
  display:block;font-family:var(--tit);font-weight:800;
  font-size:19px;letter-spacing:2.5px;color:var(--dim2);line-height:1.1;
}
.gb-s{display:block;font-size:10.2px;color:var(--dim2);margin-top:2px;line-height:1.4}
.gb-go{
  font-family:var(--tit);font-weight:800;font-size:14px;letter-spacing:2px;
  color:var(--dim);background:transparent;border:1px solid var(--line);
  padding:5px 12px;white-space:nowrap;
}

/* Encendido */
.gol-banner.lista{
  background:linear-gradient(180deg,rgba(20,58,34,.96),rgba(9,32,18,.96));
  border-color:var(--green);cursor:pointer;
  animation:golvivo 1.25s ease-in-out infinite;
}
.gol-banner.lista .gb-ico{filter:none;opacity:1}
.gol-banner.lista .gb-t{color:var(--green)}
.gol-banner.lista .gb-s{color:var(--dim)}
.gol-banner.lista .gb-go{
  color:var(--black);background:var(--green);border-color:var(--green);
  animation:titilar 1.25s ease-in-out infinite;
}
.gol-banner.lista:hover:not(:disabled){transform:translateY(-2px);background:linear-gradient(180deg,rgba(27,76,44,.98),rgba(13,44,24,.98))}
.gol-banner.lista:disabled{opacity:.45;animation:none}
@keyframes golvivo{
  0%,100%{box-shadow:0 0 0 0 rgba(61,220,107,.0)}
  50%{box-shadow:0 0 22px 3px rgba(61,220,107,.45)}
}
@media (max-width:520px){
  .gb-s{display:none}
  .gb-t{font-size:16px}
}
.col-pick{
  flex:1;background:rgba(8,16,34,.75);border:1px solid var(--line);color:var(--dim2);
  font-family:var(--tit);font-weight:800;font-size:14px;letter-spacing:1px;
  padding:6px;cursor:not-allowed;transition:background .15s,border-color .2s,color .2s;
}
/* Encendidas solo cuando la racha está llena */
.col-picks.lista .col-pick{
  border-color:var(--gold);color:var(--gold);background:var(--panel);cursor:pointer;
  animation:titilarBorde 1.5s ease-in-out infinite;
}
/* al pasar por encima deja de latir: ya la estás mirando */
.col-picks.lista .col-pick:hover,
.col-picks.lista .col-pick.activo{animation:none}
.col-picks.lista .col-pick:hover:not(:disabled),
.col-picks.lista .col-pick.activo:not(:disabled){
  border-color:var(--white);color:var(--white);
  background:rgba(255,255,255,.13);
  box-shadow:0 0 0 1px var(--white), 0 4px 18px rgba(255,255,255,.18);
  transform:translateY(-2px);
}
.col-picks.lista .col-pick:disabled{opacity:.42;cursor:not-allowed}


.cell{
  position:relative;
  background:linear-gradient(160deg,rgba(0,22,72,.95) 0%,rgba(0,8,31,.96) 100%);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border:1px solid var(--line);border-radius:7px;
  min-height:126px;padding:9px 9px 8px;
  display:flex;flex-direction:column;gap:4px;
  transition:transform .15s,border-color .15s,background .15s;
  overflow:hidden;
}

/* ---- arriba: qué es y, si hay duelo, contra qué número ---- */
.cell .c-top{display:flex;align-items:flex-start;gap:5px;min-height:24px}
.cell .c-nm{
  flex:1;min-width:0;                       /* deja que el texto se corte, no que empuje */
  font-family:var(--tit);font-weight:800;text-transform:uppercase;
  font-size:16px;letter-spacing:.2px;line-height:1.03;color:var(--white);
  /* `break-word` y no `anywhere`: el primero parte una palabra **solo si sola
     no entra**; el segundo la corta en cualquier letra aunque haya un espacio
     disponible. Por eso se leía «DELANTE / RO RIVAL» en vez de «DELANTERO /
     RIVAL». Con más cartas diciendo RIVAL, eso pasaba a ser la regla. */
  overflow-wrap:break-word;hyphens:auto;
}
/* Sin duelo el título usa todo el ancho y va centrado. */
.cell.sin-val .c-nm{text-align:center}

/* El valor del duelo: solo el número, con el color del stat contra el que se
   compara. La etiqueta ATAQUE/DEFENSA se sacó — el color ya lo dice y el texto
   robaba el ancho que necesita el nombre. */
.cell .c-val{
  flex:0 0 auto;
  font-family:var(--tit);font-weight:800;font-size:20px;line-height:1;
  border:2px solid;border-radius:5px;padding:2px 7px;
}
.cell .c-val.r{border-color:var(--red);color:var(--red);background:rgba(255,59,82,.1)}
.cell .c-val.b{border-color:var(--blue);color:var(--blue);background:rgba(77,155,240,.1)}

/* ---- medio: el ícono ---- */
.cell .c-ico{
  flex:1;display:flex;align-items:center;justify-content:center;
  font-size:32px;line-height:1;
}

/* ---- abajo: qué te deja ---- */
.cell .c-out{
  /* La escala de la carta, de mayor a menor:
       título 14  ·  resultado 13,5  ·  efecto 12,5
     Antes el efecto (13) era más grande que el resultado (11,5) y el cartel se
     leía al revés de su jerarquía. */
  font-family:var(--tit);font-weight:800;
  font-size:13.5px;line-height:1.2;letter-spacing:.3px;
  border-top:1px solid var(--line);padding-top:5px;text-align:center;
}
/* Los efectos sobre los medidores van en su propia línea, separados del
   porcentaje: el % es lo que puede pasar, esto es lo que te deja. */
.cell .c-out .efe{
  display:block;margin-top:4px;padding-top:4px;
  border-top:1px dashed rgba(30,51,88,.8);
  /* Sube de 10,4 a 13px: es la línea que dice qué te llevás, y competía en
     tamaño con la descripción de arriba en vez de destacarse. */
  font-family:var(--txt);font-weight:600;
  font-size:12.5px;letter-spacing:0;color:var(--dim);line-height:1.35;
}
.cell .c-out .efe b{font-weight:800;color:var(--red);font-size:1.04em}
.cell .c-out .efe .ra{font-weight:800;font-size:1.04em}
/* Cuando en el empate se juega un gol TUYO, va en verde: es lo único bueno que
   puede salir de esa carta. */
.cell .c-out .efe .esgol{
  color:var(--green);font-weight:800;letter-spacing:.5px;
  text-shadow:0 0 10px rgba(61,220,107,.55);
}
.play .p-out .efe .esgol{color:var(--green);font-weight:700}
.cell .c-out .ra,.play .p-out .ra{color:var(--gold);font-weight:700}
.c-out.good{color:var(--green)}
.c-out.bad{color:var(--red)}
/* El amarillo cubría dos cosas distintas: los porcentajes de gol y los empates
   de duelo. Ahora el celeste se queda con los porcentajes —«50% GOL»— y el
   amarillo con la racha, que es lo que se juega en los empates. Es el mismo
   celeste de las fichas, así que la mesa y los pop-ups hablan igual. */
.c-out.gol{color:var(--fi-luz)}
.c-out.risk{color:var(--gold)}
.c-out.hot{color:var(--naranja)}
/* El GOL RIVAL dentro del empate del delantero: el peor resultado posible de
   esa carta, marcado igual que el GOL a favor pero en rojo. */
.c-out.hot .efe b{color:var(--red);text-shadow:0 0 10px rgba(255,59,82,.5)}
.c-out.coin{color:var(--coin)}
.c-out.neutral{color:var(--dim2)}

.cell.empty{background:rgba(5,10,20,.35);border-style:dashed;border-color:#16294a;opacity:.45}

/* Carta trabada: sigue leyéndose, pero esta jugada no puede salir sorteada. */
.cell.lock{
  border-color:var(--dim2);
  background:repeating-linear-gradient(135deg,#0a1424,#0a1424 7px,#0d1b30 7px,#0d1b30 14px);
}
.cell.lock .c-ico,.cell.lock .c-nm,.cell.lock .c-val{opacity:.26}
.cell.lock .c-out{opacity:.5}
/* Una carta trabada no se puede jugar, así que tampoco se resalta: pintarla
   de verde o rojo prometería algo que no va a pasar. */
.row.hl .cell.lock,.cell.colhl.lock{
  transform:none;border-width:1px;border-color:var(--line);box-shadow:none;
}
.cell.lock::after{
  content:'🔒';position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);font-size:22px;opacity:.9;
}
/* Apuntando con el VAR: solo las trabadas responden, y se ven vivas otra vez. */
.cell.destrabable{
  border-color:var(--gold);cursor:pointer;
  animation:destrabable 1.3s ease-in-out infinite;
}
.cell.destrabable .c-ico,.cell.destrabable .c-nm,.cell.destrabable .c-val{opacity:.9}
.cell.destrabable .c-out{opacity:1}
.cell.destrabable::after{content:'🔓';opacity:1}
@keyframes destrabable{
  0%,100%{box-shadow:inset 0 0 0 0 rgba(245,200,66,0)}
  50%{box-shadow:inset 0 0 20px 1px rgba(245,200,66,.32)}
}
/* ---------- RESALTADO POR TONO ----------
   Al pasar por una fila o columna, cada carta se pinta según **lo que te
   hace**, no todas del mismo color:

     verde     te suma — gol, aguante, racha, plata, o el duelo que ganás
     rojo      te resta — gol del rival, castigos, o el duelo que perdés
     amarillo  está en el aire — porcentajes y los duelos que quedan en empate

   El color sale de `predict()`, el mismo que colorea el cartel de la carta,
   así el resaltado nunca puede contradecir lo que dice el texto. */
.row.hl .cell:not(.empty):not(.lock),
.cell.colhl:not(.empty):not(.lock){
  /* Borde de 2px y halo tenue: alcanza para saber qué te hace cada carta sin
     que la mesa se vuelva un semáforo. Antes eran 3px con sombra saturada y
     cuatro colores fuertes juntos tapaban el contenido de las cartas. */
  transform:translateY(-2px);
  border-width:2px;
}
.row.hl .cell.tono-good:not(.empty):not(.lock),
.cell.colhl.tono-good:not(.empty):not(.lock){
  border-color:rgba(61,220,107,.75);
  box-shadow:0 3px 14px rgba(61,220,107,.16);
}
.row.hl .cell.tono-bad:not(.empty):not(.lock),
.cell.colhl.tono-bad:not(.empty):not(.lock){
  border-color:rgba(255,59,82,.75);
  box-shadow:0 3px 14px rgba(255,59,82,.16);
}
/* Celeste: hay un porcentaje de gol en juego. */
.row.hl .cell.tono-gol:not(.empty):not(.lock),
.cell.colhl.tono-gol:not(.empty):not(.lock){
  border-color:rgba(94,205,242,.85);
  box-shadow:0 3px 14px rgba(94,205,242,.2);
}
/* Amarillo: se juega la racha en un empate. */
.row.hl .cell.tono-risk:not(.empty):not(.lock),
.cell.colhl.tono-risk:not(.empty):not(.lock){
  border-color:rgba(245,200,66,.75);
  box-shadow:0 3px 14px rgba(245,200,66,.16);
}
.row.hl .cell.tono-hot:not(.empty):not(.lock),
.cell.colhl.tono-hot:not(.empty):not(.lock){
  border-color:rgba(232,116,20,.75);
  box-shadow:0 3px 14px rgba(232,116,20,.16);
}
.row.hl .cell.tono-neutral:not(.empty):not(.lock),
.cell.colhl.tono-neutral:not(.empty):not(.lock){
  border-color:rgba(147,174,222,.6);
  box-shadow:0 3px 12px rgba(147,174,222,.12);
}
.cell.hit{animation:hit .5s}
@keyframes hit{
  0%{transform:scale(1)}
  35%{transform:scale(1.14);border-color:var(--white)}
  100%{transform:scale(1)}
}
/* Apuntando: hoy solo lo usa el VAR, que devuelve cartas al juego. Por eso va
   en dorado y no en rojo — antes lo compartía con la falta táctica, que borraba. */
.cell.target{cursor:crosshair}
.cell.target:hover:not(.empty){transform:scale(1.05)}


/* ---------- OVERLAY ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(3,7,16,.94);backdrop-filter:blur(7px);
  display:flex;align-items:center;justify-content:center;
  /* el padding de abajo deja libre la franja del footer, que va por encima */
  padding:20px 20px 56px;
  opacity:0;pointer-events:none;transition:opacity .3s;z-index:60;overflow-y:auto;
}
.overlay.open{opacity:1;pointer-events:auto}
.card{
  border:1px solid var(--line);border-top:3px solid var(--gold);padding:30px 26px;
  max-width:520px;width:100%;text-align:center;
  box-shadow:0 20px 70px rgba(0,0,0,.7);
  transform:translateY(12px);transition:transform .3s;margin:auto;
}
.overlay.open .card{transform:translateY(0)}
.card .tag{font-family:var(--tit);font-weight:700;font-size:12px;letter-spacing:5px;color:var(--gold);margin-bottom:10px;text-transform:uppercase}
.card h1{
  font-family:var(--tit);font-weight:800;
  font-size:clamp(33px,7.6vw,51.9px);letter-spacing:1px;line-height:.95;text-transform:uppercase;
}
/* El acento del título en dorado, como `FUTBOLERO` en el logo. */
.card h1{letter-spacing:2px;text-indent:2px}
.card h1 em{font-style:normal;color:var(--gold)}
.card p{font-size:15.2px;color:var(--dim);line-height:1.7;margin-top:12px}
.card input{
  width:100%;background:#000;border:1px solid var(--line);color:var(--white);
  font-family:var(--tit);font-weight:800;font-size:20.1px;letter-spacing:1px;
  text-transform:uppercase;padding:11px;text-align:center;margin-top:16px;outline:none;
}
.card input:focus{border-color:var(--green)}
/* El botón principal, igual que las opciones del menú: azul profundo con filo
   dorado. Antes era verde macizo, que no aparecía en ningún otro lado del
   juego. */
.cta{
  width:100%;
  background:linear-gradient(160deg, rgba(38,32,4,.92), rgba(0,12,40,.96));
  border:2px solid var(--gold);color:var(--gold);border-radius:8px;
  font-family:var(--tit);font-weight:800;font-size:19px;letter-spacing:3px;
  text-indent:3px;text-transform:uppercase;padding:13px;margin-top:12px;cursor:pointer;
  transition:transform .15s, box-shadow .18s, background .18s;
}
.cta:hover{
  transform:translateY(-2px);
  box-shadow:0 0 0 1px var(--gold), 0 8px 26px rgba(245,200,66,.28);
  background:linear-gradient(160deg, rgba(58,48,6,.95), rgba(0,16,52,.96));
}
/* El secundario: mismo molde, sin el dorado. */
.cta.alt{
  background:linear-gradient(160deg, rgba(0,22,72,.95), rgba(0,8,31,.96));
  border-color:var(--line);color:var(--dim);font-size:16px;letter-spacing:2.5px;
}
.cta.alt:hover{
  border-color:var(--white);color:var(--white);
  box-shadow:0 0 0 1px var(--white), 0 6px 20px rgba(255,255,255,.16);
}
.cta.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);font-size:16px;letter-spacing:2px;padding:10px}
.cta.ghost:hover{color:var(--white);border-color:var(--white)}
.rules{text-align:left;margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.rules li{font-size:14px;color:var(--dim);line-height:1.6;list-style:none;margin-bottom:6px;padding-left:13px;position:relative}
.rules li::before{content:'▸';position:absolute;left:0;color:var(--green)}
.rules li b{color:var(--white);font-weight:normal}


/* ---------- PLANTEL (columna derecha) ---------- */
.stat{
  display:flex;align-items:center;gap:9px;
  padding:7px 0;border-bottom:1px dashed rgba(30,51,88,.7);
}
.stat:last-child{border-bottom:none;padding-bottom:1px}
.stat .n{
  font-family:var(--tit);font-weight:800;font-size:29px;line-height:1;
  min-width:31px;text-align:center;border:2px solid;padding:1px 0;
}
.stat.atk .n{color:var(--red);border-color:var(--red)}
.stat.def .n{color:var(--blue);border-color:var(--blue)}
.stat-txt{font-size:9.8px;line-height:1.45;color:var(--dim)}
.stat-txt b{
  display:block;font-family:var(--tit);font-weight:700;font-size:12.5px;
  letter-spacing:2px;color:var(--white);
}

/* ---------- ÍTEMS (columna izquierda) ---------- */
.item-list{display:flex;flex-direction:column;gap:6px}
.item{
  display:flex;align-items:flex-start;gap:8px;width:100%;text-align:left;
  background:var(--panel2);border:1px solid var(--line);color:var(--white);
  padding:8px 9px;cursor:pointer;font-family:inherit;
  transition:border-color .15s,background .15s,transform .15s;
}
/* **El empujoncito del hover va con `left`, no con `transform`.**
   Un `transform` convierte al botón en el bloque contenedor de sus hijos
   `position:fixed` —así lo define la spec— y la ficha de ítem es justo eso en
   mobile. En touch el `:hover` queda pegado al último elemento tocado, o sea
   al ítem que abrió la ficha: el `left:10px;right:10px` de la ficha dejaba de
   medirse contra la pantalla y se medía contra el botón de 86px, saliendo de
   64px de ancho y 238 de alto, angosta y altísima encima del tablero.
   El ítem ya es `position:relative`, así que `left` lo mueve igual sin crear
   ningún bloque contenedor. */
.item:hover:not(:disabled){border-color:var(--gold);background:#16263f;left:2px}
/* Y por las dudas: con la ficha abierta el ítem nunca lleva transform, venga
   de donde venga. */
.item.abierto{transform:none !important}
.item:disabled{opacity:.4;cursor:not-allowed}
/* El ítem que ahora no haría nada: se ve apagado pero sigue clickeable, y al
   tocarlo explica por qué. Apagarlo del todo dejaría al jugador sin saber si
   está roto o si no corresponde. */
/* **El atenuado va en el contenido, no en el botón.** Con `opacity` en el
   `.item`, la ficha quedaba al 50% por ser su hija — y justo la del ítem
   inservible es la que más hay que poder leer, porque es la que explica por qué
   no se puede usar. Encima, un `opacity` menor a 1 crea un contexto de
   apilamiento: otra capa que encerraba a la ficha. */
.item.inutil{border-style:dashed}
.item.inutil > :not(.item-ficha){opacity:.5}
.item.inutil .ief{opacity:.45}
/* Apuntando con este ítem: queda encendido y el click lo cancela. */
.item.apuntando{
  border-color:var(--gold);background:#1e1a0c;
  animation:apuntando 1.2s ease-in-out infinite;
}
.item.apuntando .inm{color:var(--gold)}
@keyframes apuntando{
  0%,100%{box-shadow:0 0 0 0 rgba(245,200,66,0)}
  50%{box-shadow:0 0 14px 1px rgba(245,200,66,.4)}
}
.item .ii{font-size:19px;line-height:1.1}
/* El ícono dibujado se mide en `em`, así que hereda el `font-size` que cada
   breakpoint ya le daba al emoji: el tamaño se sigue ajustando en un solo lugar
   y las dos versiones se mueven juntas. Toma el dorado de la interfaz. */
.ii-svg{
  width:1.15em;height:1.15em;display:inline-block;vertical-align:-.22em;
  color:var(--gold);flex:0 0 auto;
}
.item .itx{min-width:0;flex:1}
.item .inm{
  font-family:var(--tit);font-weight:700;font-size:12.5px;letter-spacing:1.5px;
  display:flex;justify-content:space-between;gap:6px;
}
.item .iq{color:var(--gold)}
.item .idesc{font-size:9.6px;line-height:1.4;color:var(--dim);margin-top:3px}

/* ---------- EFECTO DE LOS ÍTEMS ---------- */
/* Los mismos íconos que los medidores: ❤ aguante, ⚡ racha. Se lee sin pasar
   por la descripción, que es lo que mira alguien apurado en el partido. */
.item .ief{display:block;font-family:var(--tit);font-size:12px;letter-spacing:1px;margin-top:2px}
.shop-ef{display:block;font-family:var(--tit);font-size:13.5px;letter-spacing:1px;margin:3px 0 1px}
.inv-ef{font-family:var(--tit);font-size:10.5px;letter-spacing:.5px;margin-left:5px}
.ef-ag{color:var(--red)}
.ef-ra{color:var(--gold)}
.ef-var{color:var(--blue)}
.ef-mas{font-family:var(--txt);font-weight:400;font-size:9.4px;color:var(--dim);letter-spacing:0}
.shop-ef .ef-mas{font-size:10px}
.no-items{
  display:inline-flex;align-items:center;justify-content:center;
  font-family:var(--txt);font-weight:600;
  font-size:10px;color:var(--dim2);letter-spacing:1.5px;line-height:1;
  padding:6px 9px;border:1px dashed var(--line);border-radius:6px;
  white-space:nowrap;
}

/* ---------- RELATO (columna izquierda, abajo) ---------- */
.panel-log{flex:1;min-height:0;display:flex;flex-direction:column}
.log{
  font-size:10.6px;line-height:1.6;color:var(--dim);
  max-height:min(42vh,340px);overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:var(--line) transparent;
}
.log::-webkit-scrollbar{width:5px}
.log::-webkit-scrollbar-thumb{background:var(--line)}
.log p{padding:4px 0;border-bottom:1px solid rgba(30,51,88,.45)}
.log p:first-child{color:var(--white)}
.log .good{color:var(--green)}
.log .bad{color:var(--red)}
.log .coin{color:var(--coin)}
.log .big{color:var(--white);font-family:var(--tit);font-weight:700;letter-spacing:1.5px;font-size:11.5px}

/* ---------- pistas sobre la mesa ---------- */
.board-hint{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  font-size:11px;color:var(--dim);letter-spacing:.5px;
  background:rgba(8,16,34,.9);border:1px solid var(--line);padding:8px 11px;
}
.board-hint b{color:var(--gold)}
.board-hint em{font-style:normal;color:var(--dim2);font-size:10px}
#cards{color:var(--gold);white-space:nowrap;letter-spacing:1px;font-size:10.5px}

/* ---------- ELECCIÓN DE REFUERZO ---------- *//* ---------- ELECCIÓN DE REFUERZO ---------- */
/* Dos opciones, una sola decisión. No hay precio ni botón de confirmar:
   tocás una y ya está. */
.choice{display:flex;gap:10px;margin-top:18px}
.pick-stat{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;
  background:var(--panel2);border:2px solid var(--line);color:var(--white);
  padding:16px 10px;cursor:pointer;text-align:center;
  transition:border-color .15s,background .15s,transform .15s;
}
.pick-stat:hover{transform:translateY(-3px)}
.pick-stat.atk:hover{border-color:var(--red);background:#1e1113}
.pick-stat.def:hover{border-color:var(--blue);background:#101a26}
.pick-stat .ps-ico{font-size:30px;line-height:1}
.pick-stat .ps-nm{
  font-family:var(--tit);font-weight:800;font-size:21px;letter-spacing:2px;
}
.pick-stat.atk .ps-nm{color:var(--red)}
.pick-stat.def .ps-nm{color:var(--blue)}
.pick-stat .ps-val{
  font-family:var(--tit);font-weight:800;font-size:25px;line-height:1.1;
}
.pick-stat .ps-desc{font-size:12.3px;color:var(--dim);line-height:1.45;margin-top:3px}
@media (max-width:440px){
  .choice{flex-direction:column}
  .pick-stat{flex-direction:row;flex-wrap:wrap;justify-content:flex-start;text-align:left;gap:9px}
  .pick-stat .ps-desc{flex:1 1 100%}
}

.rules{text-align:left;margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.rules li{font-size:14px;color:var(--dim);line-height:1.6;list-style:none;margin-bottom:6px;padding-left:13px;position:relative}
.rules li::before{content:'▸';position:absolute;left:0;color:var(--green)}
.rules li b{color:var(--white);font-weight:normal}

/* ---------- MERCADO ---------- */
.shop{display:flex;flex-direction:column;gap:7px;margin-top:16px;text-align:left}
.shop-item{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--panel2);border:1px solid var(--line);padding:10px 12px;
  cursor:pointer;transition:border-color .15s,transform .15s;
  font-family:var(--txt);color:var(--white);text-align:left;width:100%;
}
.shop-item:hover:not(:disabled){border-color:var(--gold);transform:translateX(3px)}
.shop-item:disabled{opacity:.32;cursor:not-allowed}
.shop-name{font-family:var(--tit);font-weight:800;font-size:17.8px;letter-spacing:1px}
.shop-desc{font-size:12.9px;color:var(--dim);margin-top:3px;line-height:1.4}
.shop-price{font-family:var(--tit);font-weight:800;font-size:20.3px;color:var(--coin);white-space:nowrap}
/* Cuántos de ese ítem ya tenés guardados, en el mismo botón donde decidís. */
.shop-tengo{
  font-family:var(--txt);text-transform:none;
  font-size:10px;letter-spacing:1px;color:var(--gold);
  border:1px solid rgba(245,200,66,.45);padding:1px 5px;margin-left:8px;
  vertical-align:middle;white-space:nowrap;
}
/* ---------- MARCADOR DEL PARTIDO TERMINADO ---------- */
/* Mismo tratamiento que el cartel de empate: el resultado es la noticia y tiene
   que leerse de un vistazo, no ir metido dentro de una frase. */
.marcador{
  font-family:var(--tit);font-weight:800;text-transform:uppercase;
  text-align:center;margin:16px 0 4px;
  border:1px solid var(--line);background:var(--panel2);padding:13px 10px;
}
.marcador .m-fila{
  display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;gap:14px;
}
.marcador .m-eq{
  font-family:var(--txt);font-size:12.5px;letter-spacing:1.5px;
  color:var(--white);line-height:1.25;text-transform:uppercase;
  /* los nombres largos se parten en dos líneas en vez de correr el resultado */
  overflow-wrap:anywhere;hyphens:auto;
}
/* Los dos equipos en blanco: el lado ya lo dice la posición —vos siempre a la
   izquierda— y pintar al rival en gris lo hacía parecer secundario. */
.marcador .m-eq.mio{text-align:right}
.marcador .m-eq.suyo{text-align:left}
.marcador .m-res{
  font-family:var(--tit);font-weight:800;white-space:nowrap;
  font-size:clamp(34px,8vw,50px);line-height:1;letter-spacing:1px;
}
.marcador .m-sep{color:var(--dim2);margin:0 8px;font-size:.72em;vertical-align:.06em}
.marcador .m-num span{color:var(--dim2);font-size:.55em;vertical-align:middle}
.marcador .m-pen{
  font-family:var(--txt);
  font-size:10.5px;letter-spacing:3px;color:var(--gold);margin-top:7px;
}

/* ---------- LO QUE YA TENÉS ---------- */
.inv{
  border:1px solid var(--line);background:var(--panel2);
  padding:10px 12px;margin-top:10px;text-align:left;
}
.inv-lb{
  font-family:var(--txt);font-size:10.2px;
  letter-spacing:2px;color:var(--dim);margin-bottom:7px;
}
.inv-list{display:flex;flex-wrap:wrap;gap:6px}
.inv-it{
  display:inline-flex;align-items:center;gap:5px;
  font-family:var(--txt);font-size:11.5px;
  border:1px solid var(--line);padding:4px 7px;color:var(--white);
}
.inv-it b{color:var(--gold)}
/* Lo comprado en este mercado se marca en verde y trae el botón de devolver. */
.inv-it.nuevo{border-color:var(--green);background:rgba(61,220,107,.07)}
.inv-x{
  font-family:inherit;font-size:12px;line-height:1;
  background:transparent;border:1px solid var(--red);color:var(--red);
  border-radius:3px;padding:1px 5px;cursor:pointer;
  transition:background .15s;
}
.inv-x:hover{background:rgba(255,59,82,.18)}
.inv-nota{
  font-family:var(--txt);font-size:9.6px;color:var(--dim2);
  margin-top:7px;line-height:1.4;
}
.inv.vacio{
  font-family:var(--txt);font-size:11px;letter-spacing:2px;
  color:var(--dim2);text-align:center;
}

.wallet{font-family:var(--tit);font-weight:800;font-size:26px;color:var(--coin);margin-top:14px}
.ver{font-family:var(--txt);font-size:10px;letter-spacing:2px;color:var(--dim2);margin-top:16px}

/* ---------- LA MONEDA ---------- */
.sit.moneda{border-color:var(--gold);box-shadow:0 0 60px rgba(245,200,66,.3)}
.sit.moneda .t{color:var(--gold)}
.mon-arb{font-size:56px;line-height:1;margin-bottom:6px}
.mon-arb.girando{animation:girar 1.1s ease-in-out}
@keyframes girar{
  0%{transform:rotateY(0) scale(1)}
  50%{transform:rotateY(900deg) scale(1.25)}
  100%{transform:rotateY(1800deg) scale(1)}
}
.sit.moneda .palo .pi{display:block;font-size:30px;line-height:1.1}

/* ---------- TANDA DE PENALES ---------- */
/* ---------- REPARTIR PUNTOS ---------- */
.reparto{
  border:1px solid var(--line);background:var(--panel2);
  padding:12px;margin-top:12px;text-align:left;
}
.rep-fila{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.rep-lb{
  font-family:var(--tit);font-weight:800;font-size:13px;letter-spacing:1.5px;
  flex:0 0 96px;
}
.rep-lb.r{color:var(--red)} .rep-lb.b{color:var(--blue)}
.rep-b{
  width:30px;height:30px;flex:0 0 auto;
  font-family:var(--tit);font-weight:800;font-size:19px;line-height:1;
  background:transparent;border:1px solid var(--line);color:var(--white);
  cursor:pointer;transition:border-color .15s,background .15s;
}
.rep-b:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
.rep-b:disabled{opacity:.25;cursor:not-allowed}
.rep-val{
  font-family:var(--tit);font-weight:800;font-size:26px;line-height:1;
  flex:0 0 26px;text-align:center;
}
.rep-val.r{color:var(--red)} .rep-val.b{color:var(--blue)}
.rep-pct{font-family:var(--txt);font-size:10px;color:var(--dim);flex:1;line-height:1.3}
.rep-pct b{color:var(--white)}
.rep-quedan{
  font-family:var(--txt);font-size:11px;color:var(--dim);
  border-top:1px solid var(--line);padding-top:9px;text-align:center;letter-spacing:1px;
}
.rep-quedan b{color:var(--gold);font-size:14px}
.rep-quedan .ok{color:var(--green)}
.chico{font-size:11px !important;color:var(--dim2) !important}

/* ---------- 1v1: PANEL DE CADA JUGADOR ---------- */
.jug-panel{padding:0 !important;border:none !important;background:none !important}
.jp{
  border:1px solid var(--line);background:var(--panel2);
  padding:11px 12px;transition:border-color .2s,background .2s,box-shadow .2s;
}
/* El del turno se enciende entero: es la señal de quién juega. */
.jp.turno{
  border-color:var(--gold);background:rgba(245,200,66,.07);
  box-shadow:0 0 24px rgba(245,200,66,.16);
}
.jp:not(.turno){opacity:.55}

.jp-top{display:flex;align-items:center;gap:8px}
.jp-esc{flex:0 0 auto;line-height:0}
.jp-nm{
  flex:1;min-width:0;font-family:var(--tit);font-weight:800;
  font-size:13px;letter-spacing:1px;color:var(--white);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.jp-gol{font-family:var(--tit);font-weight:800;font-size:26px;line-height:1;color:var(--white)}
.jp.turno .jp-gol{color:var(--gold)}

.jp-turno{
  font-family:var(--txt);font-size:8.5px;letter-spacing:2.5px;color:var(--gold);
  margin-top:5px;animation:blink 1.6s ease-in-out infinite;
}

.jp-med{display:flex;align-items:center;gap:7px;margin-top:7px}
.jp-lb{font-size:11px;flex:0 0 12px;opacity:.55}
.jp-hearts{font-size:14px;letter-spacing:1px;line-height:1}
.jp-hearts .off{opacity:.22}
.jp-racha{font-size:13px;letter-spacing:1px;line-height:1}

.jp-stats{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
.jp-st{
  display:inline-flex;align-items:baseline;gap:4px;
  font-family:var(--txt);font-size:8.5px;letter-spacing:1px;color:var(--dim);
}
.jp-st b{font-family:var(--tit);font-size:17px;line-height:1}
.jp-st.r b{color:var(--red)} .jp-st.b b{color:var(--blue)}
.jp-plata{
  margin-left:auto;font-family:var(--tit);font-weight:800;
  font-size:14px;color:var(--coin);
}

.jp-items{
  display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;
  border-top:1px solid var(--line);padding-top:8px;
}
.jp-it{
  display:inline-flex;align-items:center;gap:3px;
  font-size:14px;line-height:1;
}
.jp-it b{font-family:var(--tit);font-size:11px;color:var(--gold)}
.jp-sinit{font-family:var(--txt);font-size:9.5px;color:var(--dim2)}
.jp-am{
  font-family:var(--txt);font-size:9px;color:var(--gold);
  margin-top:7px;letter-spacing:.5px;
}

/* ---------- 1 vs 1 ---------- */
/* De quién es el turno: se ilumina su lado del marcador. */
.mq-score.turno-0 .mq-lado.mio,
.mq-score.turno-1 .mq-lado.suyo{opacity:1}
.mq-score.turno-0 .mq-lado.suyo,
.mq-score.turno-1 .mq-lado.mio{opacity:.42}
.mq-score.turno-0 .mq-lado.mio .mq-n,
.mq-score.turno-1 .mq-lado.suyo .mq-n{text-shadow:0 0 18px rgba(245,200,66,.5)}

.duel-local{
  display:flex;align-items:center;gap:10px;justify-content:center;
  border:1px solid var(--line);background:var(--panel2);
  padding:10px 12px;margin-top:12px;
}
.dl-esc{flex:0 0 auto;line-height:0}
.dl-nm{font-family:var(--tit);font-weight:800;font-size:17px;letter-spacing:1.5px;color:var(--white)}
.dl-lb{font-family:var(--txt);font-size:9px;letter-spacing:2.5px;color:var(--dim)}

.duel-fmt{display:flex;gap:8px}
.fmt{
  flex:1;font-family:var(--tit);font-weight:800;font-size:13px;letter-spacing:1.5px;
  background:transparent;border:1px solid var(--line);color:var(--dim);
  padding:11px 8px;cursor:pointer;transition:border-color .15s,color .15s,background .15s;
}
.fmt:hover{border-color:var(--dim)}
.fmt.sel{border-color:var(--gold);color:var(--gold);background:rgba(245,200,66,.12)}

.serie{
  border:1px solid var(--gold);background:rgba(245,200,66,.07);
  padding:12px;margin-top:16px;
}
.serie-lb{font-family:var(--txt);font-size:9.5px;letter-spacing:3px;color:var(--dim)}
.serie-n{
  font-family:var(--tit);font-weight:800;font-size:40px;line-height:1.1;
  letter-spacing:3px;text-indent:3px;color:var(--gold);
}
.serie-n span{color:var(--dim2);font-size:.6em;vertical-align:.15em}
.serie-t{font-family:var(--txt);font-size:10.5px;color:var(--dim);letter-spacing:1px}

/* ---------- ESCUDO ---------- */
.escudo{display:block}
.mq-esc{display:inline-flex;flex:0 0 auto}
.mq-esc .escudo{filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
.marcador .m-esc{display:block;margin:0 0 6px auto}
.marcador .m-eq.mio{display:flex;flex-direction:column;align-items:flex-end}

/* ---------- CREAR EL ESCUDO ---------- */
.crear{
  display:flex;gap:16px;align-items:center;
  border:1px solid var(--line);background:var(--panel2);
  padding:14px;margin-top:12px;text-align:left;
}
.crear-prev{flex:0 0 auto}
.crear-prev .escudo{filter:drop-shadow(0 2px 8px rgba(0,0,0,.55))}
.crear-cols{flex:1;min-width:0}
.crear-lb{
  font-family:var(--txt);font-size:9.5px;letter-spacing:2.5px;
  color:var(--dim);margin-bottom:6px;
}
.crear-lb + .crear-ops{margin-bottom:12px}
.crear-ops{display:flex;gap:7px;flex-wrap:wrap}
.op-esc,.op-pal{
  background:transparent;border:1px solid var(--line);border-radius:4px;
  padding:5px;cursor:pointer;line-height:0;transition:border-color .15s,background .15s;
}
.op-esc:hover,.op-pal:hover{border-color:var(--dim)}
.op-esc.sel,.op-pal.sel{border-color:var(--gold);background:rgba(245,200,66,.12)}
/* Dos filas de colores: fondo y detalle, independientes. */
.col-lb{
  font-family:var(--txt);font-size:8.5px;letter-spacing:2px;
  color:var(--dim2);margin:2px 0 5px;
}
.col-lb + .col-fila{margin-bottom:9px}
.col-fila{display:flex;gap:5px;flex-wrap:wrap}
.op-col{
  width:26px;height:26px;padding:2px;
  background:transparent;border:1px solid var(--line);border-radius:4px;
  cursor:pointer;line-height:0;transition:border-color .15s,transform .12s;
}
.op-col span{display:block;width:100%;height:100%;border-radius:2px}
.op-col:hover{border-color:var(--dim);transform:translateY(-1px)}
.op-col.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.op-azar{
  margin-top:12px;width:100%;
  font-family:var(--tit);font-weight:800;font-size:12px;letter-spacing:2px;
  background:transparent;border:1px dashed var(--line);color:var(--dim);
  padding:8px;cursor:pointer;transition:border-color .15s,color .15s;
}
.op-azar:hover{border-color:var(--gold);color:var(--gold)}
@media (max-width:440px){
  .crear{flex-direction:column;align-items:center;text-align:center;gap:12px}
  .crear-cols{width:100%}
  .crear-ops{justify-content:center}
}

/* ---------- COPAS GANADAS ---------- */
.copas{
  border:1px solid var(--gold);background:rgba(245,200,66,.07);
  padding:12px;margin-top:16px;
}
.copas-n{font-size:26px;line-height:1.1;letter-spacing:2px}
.copas-n b{font-family:var(--tit);font-size:22px;color:var(--gold)}
.copas-t{
  font-family:var(--tit);font-weight:800;font-size:15px;letter-spacing:2px;
  text-indent:2px;color:var(--gold);margin-top:4px;
}
.copas-c{
  display:flex;justify-content:space-between;gap:10px;align-items:baseline;
  border-top:1px solid rgba(245,200,66,.2);margin-top:8px;padding-top:7px;
  text-align:left;
}
.copas-c .cc-n{
  font-family:var(--tit);font-weight:700;font-size:11px;letter-spacing:1.5px;color:var(--gold);
}
.copas-c .cc-p{font-family:var(--txt);font-size:11px;color:var(--dim);letter-spacing:.5px}

/* ---------- COMPARTIR ---------- */
.cta-fila{display:flex;gap:8px;margin-top:16px}
.cta.chica{
  flex:1;font-size:14px;padding:11px 8px;letter-spacing:1.5px;margin-top:0;
}
.cta.chica.alt{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.cta.chica.alt:hover{background:rgba(245,200,66,.12)}
.share-txt{
  width:100%;height:120px;margin-top:10px;
  font-family:var(--txt);font-size:11px;line-height:1.5;
  background:var(--panel2);color:var(--white);border:1px solid var(--line);padding:8px;
}

/* ---------- PANTALLAS FINALES ---------- */
/* CAMPEÓN y ELIMINADO son el remate de la corrida: la palabra ocupa todo el
   ancho y el marcador va abajo, grande. Antes iban en un tag chiquito arriba
   con el titular genérico debajo, y lo primero que se leía era "se terminó la
   copa" en vez de qué pasó. */
.card-final{max-width:560px}
.final-tit{
  font-family:var(--tit);font-weight:800;text-transform:uppercase;
  font-size:clamp(48px,13vw,86px);letter-spacing:5px;text-indent:5px;line-height:.92;
}
/* El resultado se pinta según cómo te fue, no con un dorado neutro. */
.final-tit.gano{
  color:var(--green);
  text-shadow:0 0 26px rgba(61,220,107,.5);
}
.final-tit.perdio{
  color:var(--red);
  text-shadow:0 0 26px rgba(255,59,82,.45);
}
.card-final:has(.final-tit.gano){border-top-color:var(--green)}
.card-final:has(.final-tit.perdio){border-top-color:var(--red)}
.final-tit.campeon{
  color:var(--gold);
  text-shadow:0 0 34px rgba(245,200,66,.55);
}
.final-tit.eliminado{
  color:var(--red);
  text-shadow:0 0 34px rgba(255,59,82,.45);
}
.final-sub{
  font-family:var(--txt);font-size:13px;letter-spacing:1px;
  color:var(--dim);margin-top:9px;line-height:1.5;
}
.final-sub b{color:var(--gold)}
.final-pie{
  font-family:var(--txt);font-size:11.5px;color:var(--dim2);
  margin-top:14px;line-height:1.5;
}

/* ---------- EL CAMINO ---------- */
.hist{
  border:1px solid var(--line);background:var(--panel2);
  padding:10px 12px;margin-top:16px;text-align:left;
}
.hist-lb{
  font-family:var(--txt);font-size:10px;letter-spacing:3px;
  color:var(--dim);margin-bottom:8px;
}
.hist-fila{
  display:grid;grid-template-columns:1fr auto;gap:2px 10px;
  align-items:baseline;padding:6px 0;
  border-bottom:1px solid rgba(30,51,88,.5);
}
.hist-fila:last-child{border-bottom:none}
.hist-fila .hr{
  font-family:var(--tit);font-weight:700;font-size:12px;letter-spacing:1.5px;
  text-transform:uppercase;
}
.hist-fila.ok .hr{color:var(--green)}
.hist-fila.no .hr{color:var(--red)}
.hist-fila .hm{
  font-family:var(--tit);font-weight:800;font-size:19px;letter-spacing:1px;
  grid-row:1 / span 2;align-self:center;
}
.hist-fila.ok .hm{color:var(--green)}
.hist-fila.no .hm{color:var(--red)}
.hist-fila .hv{font-family:var(--txt);font-size:10.5px;color:var(--white);opacity:.85}
.hist-fila .hp{
  font-family:var(--txt);font-size:9.6px;color:var(--gold);
  grid-column:1;letter-spacing:.5px;
}

/* Cómo llega el equipo al próximo partido. Ahora que el aguante y la racha
   viajan, esto es lo que mirás antes de decidir qué comprar. */
.estado{
  display:flex;gap:10px;margin-top:16px;
  border:1px solid var(--line);background:var(--panel2);padding:11px 13px;
}
.estado .e-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px}
.estado .e-lb{
  font-family:var(--txt);font-size:10.2px;
  letter-spacing:2px;color:var(--dim);
}
.estado .e-lista{
  font-family:var(--tit);font-weight:800;font-size:12.5px;
  letter-spacing:1px;color:var(--gold);
}

.bracket{display:flex;gap:5px;justify-content:center;margin:14px 0;flex-wrap:wrap}
.bstep{
  font-size:10.9px;letter-spacing:1px;padding:5px 7px;
  border:1px solid var(--line);color:var(--dim2);
}
.bstep.done{border-color:var(--green);color:var(--green)}
.bstep.now{border-color:var(--gold);color:var(--gold);background:rgba(245,200,66,.08)}

/* Las tres columnas necesitan ancho. Debajo de 1120px las laterales se juntan
   abajo de la mesa en dos mitades; debajo de 700px va todo en una sola. */
/* ================= RESPONSIVE =================
   Seis escalones, de más ancho a más angosto:

     ≥1600  large desktop — todo más grande, la mesa respira
     ≥1301  desktop        — el layout de tres columnas, por defecto
     ≤1300  tablet landscape — tres columnas apretadas, mesa completo
     ≤1024  tablet portrait  — la mesa arriba, los paneles abajo en dos
     ≤700   mobile grande    — una sola columna
     ≤440   mobile chico     — todo compacto
     ≤360   mobile mínimo    — lo imprescindible

   La regla de fondo: **la mesa nunca se achica antes que los paneles**. Es lo
   único que no se puede leer a medias. */

/* En pantallas muy anchas la mesa no crece indefinidamente: pasado cierto
   punto, cartas gigantes se leen peor que cartas justas. */


/* ---- LARGE DESKTOP ---- */


/* ---- TABLET LANDSCAPE: las tres columnas todavía entran, más juntas ---- */


/* ---- DESKTOP: la mesa se adapta al alto de la ventana ----
   En vez de convertir el grid en flex —que desarmaba las tres columnas— la
   carta se mide en `vh`: con la ventana baja se achica, con la ventana alta
   crece hasta un tope. El resto del layout queda intacto. */


/* En pantallas grandes la carta no necesita estirarse más allá de lo cómodo. */


/* Las tarjetas de pop-up nunca pasan del alto de la ventana: si el contenido no
   entra, scrollea la tarjeta y no la página. */
.card{max-height:calc(100vh - 40px);overflow-y:auto}
@media (max-width:700px){ .card{max-height:calc(100vh - 20px)} }

/* ---- TABLET PORTRAIT: mesa arriba, paneles abajo en dos columnas ---- */


/* ---- MOBILE GRANDE: una sola columna ---- */


/* ---- MOBILE CHICO ---- */


/* ---- MOBILE MÍNIMO: solo lo imprescindible ---- */


/* ---- TABLET/MOBILE EN HORIZONTAL Y BAJITO ----
   Un celular acostado tiene mucho ancho y poquísimo alto: ahí lo que sobra es
   el alto de las cartas, no el ancho. */



/* ---------- LOS CARTELES DE SITUACIÓN ----------
   Mismo lenguaje que el menú: azul profundo, filo del color que corresponde y
   la tipografía de títulos. Verde lo que te suma, rojo lo que te resta. */
.gf, .gf.fallo{
  text-align:center;padding:22px 34px;
  border:2px solid var(--line);border-radius:10px;
  max-width:400px;width:90vw;
}
.gf .gf-lb, .gf.fallo .s{
  font-family:var(--txt);font-weight:700;
  font-size:10px;letter-spacing:3px;text-indent:3px;
  color:var(--dim);text-transform:uppercase;
}
.gf .t{
  font-family:var(--tit);font-weight:800;
  font-size:clamp(34px,8vw,50px);line-height:1;letter-spacing:3px;text-indent:3px;
  margin:0 0 2px;text-transform:uppercase;
}
/* El cartel de gol respira un poco más que los de fallo. */
.gf.favor,.gf.contra{padding:26px 30px 24px;max-width:430px}
.gf .fi{font-size:44px;line-height:1;margin-bottom:2px}
/* El marcador, en grande. Los nombres van a los costados de su número, con la
   misma lectura que la marquesina: vos a la izquierda, el rival a la derecha. */
.gf-marc{
  display:grid;grid-template-columns:1fr auto auto auto 1fr;
  align-items:center;gap:8px;
  margin-top:14px;padding-top:14px;
  border-top:1px solid rgba(255,255,255,.14);
}
.gm-n{
  font-family:var(--tit);font-weight:800;
  font-size:clamp(38px,10vw,56px);line-height:1;
  color:var(--white);
}
.gm-sep{font-family:var(--tit);font-weight:800;font-size:26px;color:var(--dim2)}
.gm-eq{
  font-family:var(--txt);font-weight:600;
  font-size:11px;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--dim);line-height:1.2;
  overflow:hidden;text-overflow:ellipsis;
}
.gm-eq:first-child{text-align:right}
.gm-eq:last-child{text-align:left}
/* El equipo que acaba de marcar se enciende. */
.gf.favor .gm-eq.marco,.gf.contra .gm-eq.marco{color:var(--white);font-weight:700}
.gf.favor .gm-eq.marco{color:var(--green)}
.gf.contra .gm-eq.marco{color:var(--red)}

/* A favor va verde, en contra rojo. Vale para el gol y para la chance errada:
   errar una tuya es rojo, que el rival erre la suya es verde. */
.gf.favor, .gf.fallo.contra{border-color:var(--green);box-shadow:0 0 50px rgba(61,220,107,.22)}
.gf.favor .t, .gf.fallo.contra .t{color:var(--green)}
.gf.contra, .gf.fallo.favor{border-color:var(--red);box-shadow:0 0 50px rgba(255,59,82,.22)}
.gf.contra .t, .gf.fallo.favor .t{color:var(--red)}

/* ---------- LENGUAJE COMÚN DE LOS POP-UPS ----------
   Todos comparten el mismo fondo, radio y desenfoque que las cartas del
   mesa: si cada cartel tuviera su propio tratamiento, el juego parecería
   cinco interfaces distintas. Lo que cambia entre uno y otro es solo el color
   del borde, que dice de qué se trata. */
.gf, .sit, .aviso, .play, .card{
  background:linear-gradient(160deg, rgba(0,22,72,.96) 0%, rgba(0,8,31,.97) 100%);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-radius:9px;
}

/* La etiqueta de arriba, el título y el pie hablan igual en todos: la misma
   escala tipográfica que usa la carta, solo que más grande. */
.gf .s, .sit .sit-tag, .aviso .a-s, .play .p-tag{
  font-family:var(--txt);font-weight:600;text-transform:uppercase;
}
.sit .sit-tag, .play .p-tag{
  font-size:10.5px;letter-spacing:3px;text-indent:3px;color:var(--dim);
}
/* La etiqueta de las tarjetas va dorada, como en el menú y la pantalla del
   club: es la que dice en qué parte del juego estás. Los pop-ups de jugada la
   usan en gris porque ahí nombra la carta, no la sección. */
.card .tag{
  font-family:var(--tit);font-weight:700;
  font-size:11px;letter-spacing:4px;text-indent:4px;color:var(--gold);
  text-transform:uppercase;
}
.gf .t, .sit .t, .aviso .a-t, .play .p-nm, .card h1{
  font-family:var(--tit);font-weight:800;text-transform:uppercase;
}

/* El bloque de efecto: mismo tratamiento que el cartel de abajo de la carta,
   con su línea punteada separando el resultado de lo que te deja. */
.play .p-out{
  background:rgba(0,0,0,.25);border-radius:5px;
  border-top:1px solid var(--line);
}

/* La ilustración de la carta dentro de su pop-up: apaisada, recortada y con
   un degradado al pie para que el título de abajo no compita con la foto. */
.play .p-art{
  position:relative;margin:-6px -10px 12px;border-radius:6px;overflow:hidden;
  border:1px solid var(--line);
}
.play .p-art img{display:block;width:100%;height:auto;max-height:190px;object-fit:cover}
.play .p-art::after{
  content:'';position:absolute;inset:auto 0 0;height:42%;
  background:linear-gradient(180deg, transparent, rgba(0,8,31,.85));
}

/* El corazón del aguante dentro de un texto. Ocupa lo mismo que ocupaba el
   emoji y se alinea con la línea de base, así ningún cartel cambia de alto. */
.ih,.ir{
  /* Más grandes que el texto que los rodea: en «-2 ❤» el número dice cuánto y
     el ícono dice de qué, así que el ícono tiene que reconocerse primero. */
  display:inline-block;width:1.7em;height:1.7em;
  vertical-align:-.52em;margin:0 .02em;
  background-position:center;background-size:contain;background-repeat:no-repeat;
}
.ih{background-image:var(--ico-aguante, none)}
/* El rayo es bastante más angosto que alto —proporción 0,66— así que va con
   sus medidas propias: con las del corazón quedaba con aire a los costados y
   se veía más chico de lo que es. */
.ir{background-image:var(--ico-racha, none);width:1.22em;height:1.85em;vertical-align:-.6em}
/* Sin la imagen embebida cae al emoji, como el resto del sistema. */
.ih:empty::before{content:'';}

/* El pie que invita a tocar. Late suave para que se note que hay que hacer algo,
   sin robarle atención al resultado que está arriba. */
.seguir{
  margin-top:16px;padding-top:12px;
  border-top:1px solid rgba(255,255,255,.12);
  font-family:var(--txt);font-weight:600;
  font-size:10.5px;letter-spacing:2.5px;text-indent:2.5px;
  color:var(--dim2);
  animation:latir 1.8s ease-in-out infinite;
}
@keyframes latir{0%,100%{opacity:.5}50%{opacity:1}}





/* ---------- LOS MEDIDORES DE LAS TARJETAS ----------
   El aguante y la racha comparten tamaño y **nunca se cortan de línea**: con
   cuatro corazones el último bajaba solo a un renglón nuevo y el bloque quedaba
   torcido al lado de la racha. */
.e-item .hearts, .e-item .racha-track{
  display:flex;flex-wrap:nowrap;gap:3px;align-items:center;justify-content:center;
}
.e-item .med-art{width:23px;height:23px;flex:0 0 auto}
.e-item .racha-track .med-art{width:20px;height:26px}
.e-item{min-width:0}

/* ---------- LA FICHA DEL ÍTEM ----------
   Sale **a la derecha del ítem**, no debajo: así no empuja lo que sigue ni tapa
   la fila entera, y el pico deja claro de qué ítem salió.

   Lleva su propia paleta —violeta grafito con filo lila— para no confundirse
   con las cartas de la mesa (azul con filos de color) ni con los paneles. El
   halo difuminado la despega del fondo. */
/* Los contenedores no recortan lo que sale por fuera. */
#panelItems,.item-list,.fila-accion,.lado{overflow:visible}
.item{position:relative}

.item-ficha{
  position:absolute;top:50%;left:calc(100% + 10px);
  transform:translateY(-50%) translateX(-6px);
  z-index:200;width:250px;
  display:grid;grid-template-columns:minmax(0,1fr);
  gap:9px;padding:11px 13px;
  background:linear-gradient(160deg, var(--fi-fondo-a), var(--fi-fondo-b));
  border:1px solid var(--fi-borde);
  border-left:3px solid var(--fi-luz);
  border-radius:9px;
  box-shadow:
    0 0 0 1px rgba(0,0,0,.5),
