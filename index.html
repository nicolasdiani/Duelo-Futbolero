/* ---------------- pop-up de la jugada ----------------
   El azar ya decidió cuál carta salió: esto no cambia nada de la resolución,
   solo la separa en dos tiempos. Primero ves qué te tocó y qué haría; recién
   con el click se ejecuta. El cartel se cierra antes de resolver para que el
   HUD quede a la vista cuando se resalte el parámetro que cambió. */
function mostrarJugada(cell){
  const T = TYPES[cell.type];
  const p = predict(cell);

  return new Promise(resolve => {
    const wrap = document.createElement('div');
    wrap.className = 'play-flash';
    wrap.innerHTML =
      '<div class="play ' + p.tone + '">' +
        '<div class="p-tag">MINUTO ' + minutoActual() + '\' &nbsp;·&nbsp; TE TOCÓ</div>' +
        (artCarta(cell.type)
          ? '<div class="p-art"><img src="' + artCarta(cell.type) + '" alt=""></div>'
          : '<div class="p-ico">' + T.ico + '</div>') +
        '<div class="p-nm">' + T.nm + '</div>' +
        (cell.val
          ? '<div class="p-val">VALOR ' + cell.val + ' &nbsp;·&nbsp; TU ' +
            (T.stat === 'atk' ? 'ATAQUE ' + ATK() : 'DEFENSA ' + DEF()) + '</div>'
          : '') +
        (p.label ? '<div class="p-out">' + p.label + '</div>' : '') +
        '<div class="p-go">TOCÁ PARA JUGARLA</div>' +
      '</div>';
    document.body.appendChild(wrap);
    wrap.onclick = () => { wrap.remove(); resolve(); };
  });
}

/* Foto de los recursos, para saber después qué se movió. */
function snapshot(){
  return { aguante:G.aguante, fundidas:G.fundidas, dinero:G.dinero,
           racha:G.racha, gU:G.gU, gC:G.gC };
}

/* Resalta en el HUD lo que cambió con la jugada. Verde si te favoreció, rojo
   si te perjudicó — que el jugador no tenga que buscar el número en pantalla. */
function pulseCambios(antes){
  const marcar = (id, cls) => {
    const el = $(id);
    if(!el) return;
    el.classList.remove('pulse-up','pulse-down','pulse-coin');
    void el.offsetWidth;            // reinicia la animación si vuelve a pulsar
    el.classList.add(cls);
    setTimeout(() => el.classList.remove(cls), 1000);
  };

  // ojo: fundirse RELLENA el aguante, así que el número sube. Eso no es algo
  // bueno — lo que manda es si se fundió, no si el número creció.
  if(G.fundidas > antes.fundidas)          marcar('m-aguante', 'pulse-down');
  else if(G.aguante !== antes.aguante)     marcar('m-aguante', G.aguante > antes.aguante ? 'pulse-up' : 'pulse-down');
  if(G.dinero !== antes.dinero) marcar('m-dinero', 'pulse-coin');
  if(G.racha !== antes.racha)   marcar('m-racha', G.racha > antes.racha ? 'pulse-up' : 'pulse-down');
  if(G.gU !== antes.gU)         marcar('m-score', 'pulse-up');
  if(G.gC !== antes.gC)         marcar('m-score', 'pulse-down');
}

/* ---------------- cartas trabadas ----------------
   A lo largo del partido se traban **cuatro cartas: una por fila**, y quedan
   trabadas hasta el pitazo final. Siguen a la vista, con su cartel legible y un
   🔒 encima, pero ya no pueden salir sorteadas.

   Una por fila es la clave: cada fila pierde exactamente una opción, así que
   ninguna se cierra más que las otras y la mesa no termina lleno de candados.
   Lo que cambia es la lectura — la fila que tenía cuatro cartas ahora tiene
   tres, y si te trabaron justo la buena, esa fila dejó de servir.

   No se traban todas juntas ni desde el arranque: aparecen de a una, no en todas
   las jugadas (70%), y nunca sobre la última carta jugable de una fila. */
function trabarUna(){
  const librosDe = r => {
    const out = [];
    G.grid[r].forEach((cell, c) => { if(cell && !cell.lock) out.push(c); });
    return out;
  };
  const trabadas = () => G.grid.flat().filter(cell => cell && cell.lock).length;

  /* Tope duro del partido: cuatro trabadas, una por fila. La quinta existe solo
     como castigo por repetirse de fila, y únicamente si esa fila todavía está
     entera —tres jugables o más—. Sin este tope, repetir podía acumular seis o
     siete y la mesa terminaba cerrado. */
  if(trabadas() >= TRABAS_MAX){ G.marcarFila = null; return; }

  if(G.marcarFila !== null){
    const r = G.marcarFila;
    G.marcarFila = null;
    const libres = librosDe(r);
    /* Se cobra mientras a la fila le quede algo jugable después. Si ya está en
       las últimas, el castigo se pierde: no tiene sentido rematar una fila que
       no da más, ni buscarle otra fila donde caer. */
    if(libres.length > 1){
      G.grid[r][libres[rnd(libres.length)]].lock = true;
      return;
    }
  }

  // sorteo normal: solo filas que todavía no tienen ninguna trabada
  const candidatas = [0,1,2,3]
    .filter(r => !G.grid[r].some(cell => cell && cell.lock))
    .filter(r => librosDe(r).length > 1);
  if(!candidatas.length) return;
  if(!chance(.70)) return;

  const r = candidatas[rnd(candidatas.length)];
  const libres = librosDe(r);
  G.grid[r][libres[rnd(libres.length)]].lock = true;
}

/* Cartas de una línea que pueden salir sorteadas ahora mismo. */
function jugables(kind, idx){
  const out = [];
  if(kind === 'row') G.grid[idx].forEach((cell, c) => { if(cell && !cell.lock) out.push([idx, c]); });
  else               G.grid.forEach((row, r) => { if(row[idx] && !row[idx].lock) out.push([r, idx]); });
  return out;
}

/* ---------------- resolver carta ---------------- */
async function resolveCell(r, c, rowIdx){
  const cell = G.grid[r][c];
  if(!cell) return;
  const T = TYPES[cell.type];

  const el = document.querySelector('.cell[data-r="' + r + '"][data-c="' + c + '"]');
  if(el) el.classList.add('hit');
  await wait(430);

  // dos tiempos: el cartel muestra qué salió, el click la ejecuta
  await mostrarJugada(cell);
  const antes = snapshot();

  G.grid[r][c] = null;   // la carta se consume y sube el % de las que quedan
  const t = cell.type;

  if(t === 'defensor'){
    const r = await resolverDuelo(cell, ATK());
    if(r) await winDuel('🧱 Le ganás el cuerpo al defensor (' + ATK() + ' vs ' + cell.val + ').', premioDuelo(cell));
    else  await hurt('🧱 El defensor te come el mano a mano (' + ATK() + ' vs ' + cell.val + ').', costoDuelo(cell));
  }
  else if(t === 'arquero'){
    const r = await resolverDuelo(cell, ATK());
    if(r) await scoreU('🥅 Le ganás al arquero (' + ATK() + ' vs ' + cell.val + ').', premioDuelo(cell));
    else  await hurt('🥅 Atajadón. Te lo saca abajo (' + ATK() + ' vs ' + cell.val + ').', costoDuelo(cell));
  }
  else if(t === 'medio'){
    const r = await resolverDuelo(cell, DEF());
    if(r) await winDuel('🌀 Le robás la pelota en el medio (' + DEF() + ' vs ' + cell.val + ').', premioDuelo(cell));
    else  await hurt('🌀 Te ganan la mitad de la cancha (' + DEF() + ' vs ' + cell.val + ').', costoDuelo(cell));
  }
  else if(t === 'delantero'){
    const r = await resolverDuelo(cell, DEF());
    if(r) await winDuel('👟 Cortás el ataque antes del área (' + DEF() + ' vs ' + cell.val + ').', premioDuelo(cell));
    else  await scoreC('👟 El delantero te gana la espalda y define (' + DEF() + ' vs ' + cell.val + ').', costoDuelo(cell), true);
  }
  else if(t === 'jugada')  await scoreU('⚽ Jugada de toda la cancha. Entra sola.');
  else if(t === 'autogol') await scoreU('🎁 El zaguero rival se la manda a su propio arco.');
  else if(t === 'contra')   await scoreC('💥 Contraataque letal: te agarran mal parado y definen.');
  else if(t === 'encontra') await scoreC('🙈 Tu zaguero quiso despejar y se la mandó a su propio arco.');
  else if(t === 'penal'){
    if(chance(.50))await scoreU('🎯 Penal. Le cambiás el palo al arquero.');
    else { await flashFallo('penal', true); await hurt('🎯 Penal errado. El equipo se viene abajo.'); }
  }
  else if(t === 'pasegol'){
    if(chance(.40))await scoreU('🤝 Pase gol: se la dejan servida y la empuja.');
    else { await flashFallo('pasegol', true); await hurt('🤝 Le dan el pase gol y la manda afuera. Se le cae la cara.'); }
  }
  else if(t === 'libre'){
    if(chance(.35))await scoreU('🚧 Tiro libre al ángulo. Impecable.');
    else { await flashFallo('libre', true); await hurt('🚧 El tiro libre pega en la barrera y sale el contragolpe.'); }
  }
  else if(t === 'corner'){
    if(chance(.30))await scoreU('🚩 Córner, cabezazo y adentro.');
    else { await flashFallo('corner', true); await hurt('🚩 El córner se pierde y te agarran mal parado.'); }
  }
  else if(t === 'penalC'){
    if(chance(.50)) await scoreC('💀 Penal en contra. No la puede sacar tu arquero.');
    else { await flashFallo('penalC', false); say('💀 ¡PENAL ATAJADO! El equipo se levanta con eso. +1 racha.', 'good'); await sumarRacha(1); }
  }
  else if(t === 'pasegolC'){
    if(chance(.40)) await scoreC('🕳 Pase gol del rival: se la dejan servida y la empujan.');
    else { await flashFallo('pasegolC', false); say('🕳 Se la dejaban servida y la manda a las nubes. Respirás. +1 racha.', 'good'); await sumarRacha(1); }
  }

  else if(t === 'cornerC'){
    if(chance(.30)) await scoreC('🌪 Córner en contra: cabezazo del central y adentro.');
    else { await flashFallo('cornerC', false); say('🌪 Córner despejado y salís jugando. El equipo se prende. +1 racha.', 'good'); await sumarRacha(1); }
  }
  else if(t === 'libreC'){
    if(chance(.35)) await scoreC('🧨 Tiro libre en contra al ángulo. Imposible.');
    else { await flashFallo('libreC', false); say('🧨 Se estrella en tu barrera. La tribuna lo festeja como un gol. +1 racha.', 'good'); await sumarRacha(1); }
  }
  else if(t === 'cano'){
    say('🪄 ¡Caño y a otra cosa! La tribuna se levanta. +2 racha.', 'good');
    await sumarRacha(2);
  }
  else if(t === 'ola'){
    say('🌊 La ola recorre la tribuna y el equipo se enciende. +2 racha.', 'good');
    await sumarRacha(2);
  }
  else if(t === 'noche'){
    say('✨ Racha full: la cancha entera empuja y el equipo se enciende.', 'good');
    await sumarRacha(G.rachaMax);   // la llena venga de donde venga
  }
  else if(t === 'hinchada'){
    G.aguante = clamp(G.aguante + 1, 0, G.aguanteMax);
    say('📣 La hinchada empuja desde la popular. +1 aguante.', 'good');
  }
  else if(t === 'calambre'){
    await hurt('🦵 Calambre. Se queda duro en el círculo central.', cell.dmg || 1);
  }
  else if(t === 'cooling'){
    G.aguante = clamp(G.aguante + 1, 0, G.aguanteMax);
    say('💧 Cooling break: el equipo toma agua y recupera aire. +1 aguante.', 'good');
  }
  else if(t === 'fama'){
    G.dinero += cell.euros;
    say('🌟 El equipo suena en todos lados. Fama: +' + plata(cell.euros) + ' y +1 racha.', 'coin');
    await sumarRacha(1);
  }
  else if(t === 'publicidad'){
    G.dinero += cell.euros;
    say('🪧 Cartel nuevo en la platea. Publicidad: +' + plata(cell.euros) + '.', 'coin');
    await sumarRacha(1);
  }
  else if(t === 'sponsor'){
    G.dinero += cell.euros;
    say('💰 El sponsor afloja la billetera: +' + plata(cell.euros) + '.', 'coin');
  }
  else if(t === 'amarilla'){
    G.amarillas++;
    if(G.amarillas >= 2){
      say('🟨🟨 Segunda amarilla: roja y a las duchas.', 'bad');
      G.amarillas = 0;
      await expulsion();
    } else {
      await hurt('🟨 Amarilla. Ojo con la próxima: la segunda es roja y no hay cómo borrarla.');
    }
  }
  else if(t === 'roja'){
    say('🟥 Roja directa.', 'bad');
    await expulsion();
  }
  else if(t === 'lesion'){
    await hurt('🩹 Se te lesiona un titular y sale en camilla.', cell.dmg || 2);
  }
  else if(t === 'offside') say('🚫 Offside. Jugada anulada, se te fue el tiempo.');

  render();
  pulseCambios(antes);
  await wait(620);   // los goles ya esperaron su cartel dentro de scoreU/scoreC
}

async function winDuel(msg, n){
  const gana = n || 1;
  say(msg + ' +' + gana + ' racha.', 'good');
  await sumarRacha(gana);
}

/* Toda la racha pasa por acá: es el único lugar que puede detectar el momento
   exacto en que se llena. Llena no se cobra sola — habilita las dos salidas
   (columna o situación de gol) y el jugador elige cuál gastar. */
async function sumarRacha(n){
  const antes = G.racha;
  G.racha = clamp(G.racha + n, 0, G.rachaMax);
  if(antes < G.rachaMax && G.racha >= G.rachaMax){
    say('<i class="ir"></i> ¡RACHA LLENA! Se habilita la SITUACIÓN DE GOL.', 'big');
    render();
    await avisoRacha();
  }
}

/* Los cuatro rayos encendidos, para los avisos que hablan de la racha llena.
   Son los mismos del medidor del panel —misma imagen, mismo orden— porque es
   ahí donde el jugador los vio llenarse: repetirlos en el cartel cierra el
   círculo. Laten escalonados, como se encienden las luces de un estadio. */
function rayosLlenos(){
  const art = ARTSRC('ico_racha');
  let h = '<div class="a-rayos">';
  for(let i = 0; i < RACHA_MAX; i++){
    h += art
      ? '<img src="' + art + '" alt="" style="animation-delay:' + (i * 90) + 'ms">'
      : '<i class="ir" style="animation-delay:' + (i * 90) + 'ms"></i>';
  }
  return h + '</div>';
}

/* La cabecera con la ilustración de RACHA FULL. La imagen ya existía en el
   mazo —es la carta `noche`— y no se usaba en ningún otro lado; este es el
   momento que retrata, así que acá gana su lugar. El título va **encima** del
   degradado, igual que en el pop-up del mini juego: es el mismo molde, y con
   eso el aviso no estrena un lenguaje propio. */
function fotoRacha(titulo){
  const art = ARTSRC('noche');
  if(!art) return '<div class="a-t">' + titulo + '</div>';
  return '<div class="a-foto">' +
           '<img src="' + art + '" alt="">' +
           '<div class="a-t">' + titulo + '</div>' +
         '</div>';
}

/* Aviso de racha completa. A diferencia de los otros pop-ups, este no resuelve
   nada: te dice que se te abrieron dos salidas y te devuelve al mesa. La
   racha queda cargada hasta que uses una —recién ahí se vacía—, así que la
   decisión se toma con la mesa delante y no a las apuradas. */
function avisoRacha(){
  /* El promedio se calcula, no se escribe: los dos textos decían **38%**, que
     era el número de cuando la jugada clara salía el 8% y el tiro libre el 25%.
     Desde que las cinco pesan igual son 51, y la ficha de la mesa ya lo decía
     bien — así que el aviso prometía una cosa y la ficha otra. */
  const esperadoFavor = Math.round(
    SIT_FAVOR.reduce((a, x) => a + x.peso * x.p, 0) /
    SIT_FAVOR.reduce((a, x) => a + x.peso, 0) * 100);

  return new Promise(resolve => {
    const wrap = document.createElement('div');
    wrap.className = 'sit-flash';
    wrap.innerHTML =
      /* Solo se anuncia la SITUACIÓN DE GOL: es lo único que aparece recién
         ahora. La columna se habilita antes, a los 3 de racha, así que a esta
         altura el jugador ya la viene usando y repetirla acá sería ruido. */
      '<div class="aviso con-foto">' +
        fotoRacha('RACHA LLENA') +
        rayosLlenos() +
        '<div class="a-s">SE HABILITA LA POSIBILIDAD DE GOL</div>' +
        '<div class="a-ops">' +
          '<div class="a-op gol solo">' +
            '<div class="oi">⚽</div><div class="on">SITUACIÓN DE GOL</div>' +
            '<div class="od">Una llegada clara al ' + esperadoFavor + '%, sin riesgo de que te lastimen. Gasta la racha entera y una jugada.</div>' +
          '</div>' +
        '</div>' +
        '<div class="a-s">No hace falta usarla ahora: queda disponible hasta que la gastes.</div>' +
        '<button class="cta" id="avisoBtn">CONTINUAR PARTIDO</button>' +
      '</div>';
    document.body.appendChild(wrap);
    wrap.querySelector('#avisoBtn').onclick = () => { wrap.remove(); resolve(); };
  });
}

/* `maxYaBajo` lo pasa la expulsión, que ya se cobró su corazón de máximo: sin
   eso, una roja que además te funde bajaba el máximo dos o tres veces por una
   sola carta. */
async function hurt(msg, amount, maxYaBajo){
  const n = amount || 1;
  if(msg) say(msg + ' -' + n + ' aguante.', 'bad');
  let bajoMax = !!maxYaBajo;

  /* Un mismo golpe funde el aguante **una vez como mucho**. Con el máximo ya
     degradado, un -3 podía vaciarlo dos veces y repartir dos situaciones de gol
     seguidas: dos goles posibles por una sola carta, sin que el jugador
     tocara nada en el medio. La primera fundida se cobra normal; si el resto
     del golpe vuelve a vaciarlo, el aguante se rellena igual pero sin repartir
     otra situación. */
  let yaSeFundio = false;
  let cayoMax = false;   // si el máximo ya está en el piso, no baja y hay que decirlo

  for(let i=0;i<n;i++){
    G.aguante--;
    if(G.aguante > 0) continue;

    // el máximo baja una sola vez por golpe, igual que la situación de gol
    if(!bajoMax){
      const antes = G.aguanteMax;
      G.aguanteMax = Math.max(AGUANTE_PISO, G.aguanteMax - 1);
      bajoMax = true;
      cayoMax = G.aguanteMax < antes;
    }
    G.aguante = G.aguanteMax;
    G.fundidas++;

    if(yaSeFundio){
      // el equipo se vuelve a caer dentro del mismo golpe, pero el rival ya
      // tuvo su chance: solo queda el desgaste
      say('😮‍💨 El equipo se cae otra vez: máximo ' + G.aguanteMax + ' <i class="ih"></i>.', 'bad');
      render();
      continue;
    }

    yaSeFundio = true;
    say('😮‍💨 Se te funde el equipo: quedan ' + G.aguanteMax +
        ' <i class="ih"></i> de máximo y el rival se gana una situación.', 'big');
    render();
    /* El cartel muestra el castigo y sortea la llegada a la vista; después se
       juega **esa misma**, que es lo que hace `yaElegida`. */
    const elegida = await fundidaRival(cayoMax);
    await situacionGol('contra', elegida);
  }
}

/* ---------------- CUANDO SE TE FUNDE EL EQUIPO ----------------
   Quedarte sin aguante es el único castigo **permanente** del juego: perdés un
   corazón de máximo para todo lo que queda del campeonato. Hasta ahora eso
   pasaba en una línea de relato, y la llegada del rival aparecía ya sorteada,
   sin decir de dónde salía ni qué otras podían tocarle.

   El cartel junta las dos cosas: **lo que perdiste** —los corazones que te
   quedan, con el que se fue tachado— y **lo que viene** —las cinco cartas del
   rival, con el sorteo corriendo encima—. Recién cuando frena se habilita el
   botón, así el jugador ve de dónde salió la que le tocó.

   Usa el mismo cursor de sorteo que la ficha de la racha llena, y las mismas
   casillas: es el mismo gesto de los dos lados, en rojo. */
function fundidaRival(cayoMax){
  return new Promise(resolve => {
    const wrap = document.createElement('div');
    wrap.className = 'sit-flash';

    const artH = ARTSRC('ico_aguante');
    const corazon = () => artH ? '<img src="' + artH + '" alt="">' : '<i class="ih"></i>';
    let hearts = '<div class="fu-hearts">';
    for(let i = 0; i < G.aguanteMax; i++) hearts += corazon();
    if(cayoMax) hearts += '<span class="fu-ida">' + corazon() + '</span>';
    hearts += '</div>';

    const total = SIT_RIVAL.reduce((a, x) => a + x.peso, 0);
    const esperado = Math.round(SIT_RIVAL.reduce((a, x) => a + x.peso * x.p, 0) / total * 100);

    wrap.innerHTML =
      '<div class="sit fundida">' +
        '<div class="sit-tag">SE TE FUNDE EL EQUIPO</div>' +
        hearts +
        '<div class="t">SE ACABÓ EL AGUANTE</div>' +
        '<div class="s">' + (cayoMax
          ? 'VUELVE ENTERO, PERO CON UN <i class="ih"></i> MENOS DE MÁXIMO'
          : 'VUELVE ENTERO. EL MÁXIMO YA NO BAJA MÁS.') + '</div>' +
        '<div class="fu-linea"></div>' +
        '<div class="fu-ahora">Y EL RIVAL SE GANA UNA LLEGADA ' +
          '<b>' + esperado + '%</b> DE GOL <em>una de las cinco, al azar</em></div>' +
        '<div class="fg-minis">' +
          SIT_RIVAL.map(x => {
            const art = artCarta(x.key);
            return '<div class="fg-mini">' +
              (art
                ? '<span class="fg-art"><img src="' + art + '" alt=""></span>'
                : '<span class="fg-ico">' + x.ico + '</span>') +
              '<span class="fg-cnm">' + x.nm + '</span>' +
              '<span class="fg-pct">' + (x.p === 1 ? 'GOL' : Math.round(x.p * 100) + '% GOL') + '</span>' +
            '</div>';
          }).join('') +
        '</div>' +
        '<button class="cta" id="fuBtn" disabled>SORTEANDO…</button>' +
      '</div>';
    document.body.appendChild(wrap);

    (async () => {
      const elegida = await sorteoGol(wrap, SIT_RIVAL);
      const b = wrap.querySelector('#fuBtn');
      b.disabled = false;
      b.textContent = 'A VER QUÉ PASA';
      b.onclick = () => { wrap.remove(); resolve(elegida); };
    })();
  });
}

/* Pop-up de la situación de gol. Sirve para los dos lados: 'contra' cuando se
   te vacía el aguante, 'favor' cuando se te llena la racha.
   Dos tiempos a propósito: primero ves QUÉ salió y con qué probabilidad,
   después ejecutás. El click no cambia nada del azar — le da el momento. */
/* `yaElegida` llega desde la ficha: ahí la animación ya mostró cuál salió, así
   que hay que resolver **esa misma** y no sortear de nuevo. Sin esto había dos
   sorteos independientes y la carta que se resaltaba no era la que se jugaba. */
function situacionGol(lado, yaElegida){
  const favor = lado === 'favor';
  const S = yaElegida || pick((favor ? SIT_FAVOR : SIT_RIVAL).map(s => [s, s.peso]))[0];

  return new Promise(resolve => {
    const wrap = document.createElement('div');
    wrap.className = 'sit-flash';
    wrap.innerHTML =
      '<div class="sit' + (favor ? ' lado-favor' : '') + '">' +
        '<div class="sit-tag">' + (favor ? '<i class="ir"></i> RACHA LLENA' : 'SE TERMINÓ EL AGUANTE') + '</div>' +
        '<div class="sit-ico">' + S.ico + '</div>' +
        '<div class="t">' + S.nm + '</div>' +
        '<div class="s">' +
          (favor && S.key === 'penal' ? 'LO PATEÁS VOS · ELEGÍ EL PALO'
           : favor && S.key === 'jugada' ? 'ENTRA SOLA'
           : Math.round(S.p * 100) + '% DE GOL ' + (favor ? 'A FAVOR' : 'PARA EL RIVAL')) + '</div>' +
        '<button class="cta" id="sitBtn">' +
          (favor && S.key === 'penal' ? 'IR AL PENAL' : 'EJECUTAR') + '</button>' +
      '</div>';
    document.body.appendChild(wrap);

    wrap.querySelector('#sitBtn').onclick = async () => {
      const box = wrap.querySelector('.sit');

      /* El PENAL a favor no se resuelve al azar: se patea. Es el mismo pop-up de
         la tanda —elegís palo, el arquero vuela— y su probabilidad es la misma
         que tenía la tirada (2 de 3), así que no cambia el balance: cambia que
         ahora lo jugás. */
      if(favor && S.key === 'penal'){
        wrap.remove();
        const eqs = [ { club:G.club, escudo:G.escudo },
                      { club:(RONDAS[G.ronda] || {}).rival || 'EL RIVAL', escudo:G.escudoRival } ];
        const conv = await penalUno(eqs, 0, [[],[]], 0, false, 0, true);
        if(conv){
          G.gU++;
          say(S.gol + ' ¡GOL! ' + G.gU + '-' + G.gC, 'big');
          await flashGol('favor');
        } else {
          say('🎯 Penal atajado. Voló y la sacó.', 'bad');
        }
        render();
        resolve();
        return;
      }

      const esGol = chance(S.p);

      /* Que el rival falle su situación levanta al equipo: **+1 ⚡**. Es la misma
         regla de las cartas de porcentaje en contra —te salvaste, el equipo se
         prende— y cierra el círculo: fundirte el aguante ya no puede terminar en
         nada. La racha se suma recién al cerrar el pop-up, para que su aviso no
         se monte encima de este. */
      const levanta = !favor && !esGol;

      if(esGol){
        if(favor) G.gU++; else G.gC++;
        say(S.gol + (favor ? ' ¡GOL! ' : ' Gol del rival. ') + G.gU + '-' + G.gC, 'big');
      } else {
        say(S.no + (favor ? '' : ' Te salvaste. +1 racha.'), favor ? 'bad' : 'good');
      }

      box.className = 'sit resuelta ' + (esGol ? 'gol' : 'salvado') + (favor ? ' lado-favor' : '');
      box.innerHTML =
        '<div class="sit-tag">' + S.nm + ' &nbsp;·&nbsp; ' + Math.round(S.p * 100) + '%</div>' +
        '<div class="sit-ico">' + icoDesenlace(esGol ? 'golazo' : (favor ? 'afuera' : 'atajada')) + '</div>' +
        '<div class="t">' +
          (esGol ? (favor ? '¡GOL!' : 'GOL RIVAL')
                 : (favor ? 'LA ERRASTE' : '¡TE SALVASTE!')) + '</div>' +
        '<div class="s">' + G.gU + ' - ' + G.gC +
          (levanta ? '<span class="sit-extra">+1 <i class="ir"></i> RACHA</span>' : '') + '</div>';

      render();
      await esperarOClick(wrap, ESPERA_FIN);
      if(levanta) await sumarRacha(1);
      resolve();
    };
  });
}

/* ---------------- cómo se erró ----------------
   Un tiro que no entra no es "no pasó nada": pasó algo, y merece verse. Cada
   situación tiene varios desenlaces posibles y se sortea uno solo por sabor
   —no cambian nada del resultado, que ya se decidió—. El cartel recuerda el
   efecto: errar vos cuesta aguante, que erre el rival te carga la racha. */

   **El dibujo va con la frase, no con la carta.** Antes cada carta tenía un

   Las 32 frases del juego caen en **diez desenlaces**, y cada frase se lleva
   el suyo. Así ya no hay forma de que se contradigan.

   El desenlace es una animación SVG y no un emoji: se dibuja con

    '<path class="fl" d="M6 40V20h36v20"/>' +
    '<path class="fn red" d="M6 30h36M15 20v20M24 20v20M33 20v20"/>' +
    '<path class="fn rd" d="M12 40q12 7 24 0"/>' +
    '<circle class="pe" cx="24" cy="32" r="5.4"/>',

  gambeta:
    '<g class="fg">' +
      '<circle class="fn" cx="19" cy="13" r="4.6"/>' +
      '<path class="fn" d="M12 41V24.5a7 7 0 0 1 14 0V41"/>' +
    '</g>' +
    '<path class="fn ten" d="M4 43h40"/>' +
    '<circle class="pe" cx="40" cy="15" r="5"/>',

  quite:
    '<g class="fg">' +
      '<circle class="fn" cx="33" cy="13" r="4.6"/>' +
      '<path class="fn" d="M26 41V24.5a7 7 0 0 1 14 0V41"/>' +
    '</g>' +
    '<g class="bo">' +
      '<path class="fl" d="M6 19v11a4 4 0 0 0 4 4h9a3 3 0 0 0 0-6h-4a2.5 2.5 0 0 1-2.5-2.5V19"/>' +
    '</g>' +
    '<path class="fn ten" d="M4 43h40"/>' +
    '<circle class="pe" cx="9" cy="37" r="5"/>',

  copa:
    '<g class="cp">' +
      '<path class="fl" d="M15 7h18v10a9 9 0 0 1-18 0z"/>' +
      '<path class="fl" d="M15 10h-6a6 6 0 0 0 6 6"/>' +
      '<path class="fl" d="M33 10h6a6 6 0 0 1-6 6"/>' +
      '<path class="fl" d="M24 26v6"/>' +
      '<path class="fl" d="M14 41h20"/>' +
      '<path class="fl" d="M18 32h12v9"/>' +
    '</g>' +
    '<g class="br2">' +
      '<path class="fn" d="M39 4l3-3"/><path class="fn" d="M43 9h4"/>' +
      '<path class="fn" d="M7 5L4 2"/>' +
    '</g>',

  /* La moneda: llena es CARA, anillo es SECA — los dos discos de 🌕 y 🌑 que
     ya usaba el sorteo, pero girando hasta frenar. */

    '<g class="mo">' +
      '<circle class="fl" cx="24" cy="24" r="13"/>' +
      '<circle class="pe" cx="24" cy="24" r="8.5"/>' +

/* El SVG se dimensiona en `em`, así que hereda el `font-size` que ya tiene
   `.fi` en cada breakpoint —42px en mobile, 58px en desktop— y los tamaños
   que ya venían andando siguen mandando sin tocar una sola regla. */
const icoDesenlace = g =>
  '<svg class="fx fx-' + g + '" viewBox="0 0 48 48" aria-hidden="true">' + (GESTOS[g] || '') + '</svg>';

async function flashFallo(tipo, favor){
  const F = FALLOS[tipo];
  /* Se sortea la frase y el dibujo viene con ella, no del tipo de carta. */
  const D = F[rnd(F.length)];
  const wrap = document.createElement('div');
  wrap.className = 'gol-flash';
  wrap.innerHTML =
    '<div class="gf fallo ' + (favor ? 'favor' : 'contra') + '">' +
      '<div class="fi">' + icoDesenlace(D.g) + '</div>' +
      '<div class="t">' + D.t + '</div>' +
      '<div class="s">NO ENTRÓ</div>' +
      '<div class="ef-fin">' + (favor ? '-1 <i class="ih"></i> AGUANTE'
                                       : '+1 <i class="ir"></i> RACHA') + '</div>' +
    '</div>';
  document.body.appendChild(wrap);
  /* Se va solo cuando el dibujo dio sus tres vueltas, o antes si tocás. */
  await esperarOClick(wrap, ESPERA_FIN);
}

function flashGol(tipo){
  // la animación toma su duración de la constante, no de un número suelto en CSS
  document.documentElement.style.setProperty('--dura-gol', DURA_GOL + 'ms');
  const wrap = document.createElement('div');
  wrap.className = 'gol-flash';
  /* Sin ilustración: el cartel es tipografía sobre el azul del juego, como el
     resto de las pantallas. La foto ocupaba todo y tapaba el marcador, que es
     el dato que importa en ese momento. */
  const favor = tipo === 'favor';
  /* El marcador es lo más grande del cartel: acabás de convertir (o te
     convirtieron) y lo que querés saber es cómo va el partido. Va con los dos
     nombres, como la marquesina, y el lado que acaba de marcar se enciende. */
  const rival = G.modo === 'duelo'
    ? (G.J[1] || {}).club || 'RIVAL'
    : (RONDAS[G.ronda] || {}).rival || 'RIVAL';
  const nomA = G.modo === 'duelo' ? (G.J[0] || {}).club || G.club : G.club;

  wrap.innerHTML =
    '<div class="gf ' + tipo + '">' +
      '<div class="t">' + (favor ? '¡GOL!' : 'GOL RIVAL') + '</div>' +
      '<div class="gf-marc">' +
        '<span class="gm-eq' + (favor ? ' marco' : '') + '">' + nomA + '</span>' +
        '<span class="gm-n">' + G.gU + '</span>' +
        '<span class="gm-sep">-</span>' +
        '<span class="gm-n">' + G.gC + '</span>' +
        '<span class="gm-eq' + (favor ? '' : ' marco') + '">' + rival + '</span>' +
      '</div>' +
    '</div>';
  document.body.appendChild(wrap);
  /* El gol dura más que el resto —es el momento del partido— y también se puede
     adelantar con un toque. */
  return esperarOClick(wrap, ESPERA_GOL_POP);
}

/* Todo gol mueve además un medidor, venga de donde venga: el tuyo levanta al
   equipo (+1 racha), el del rival lo desgasta (-1 aguante). Vale igual para una
   jugada clara, un duelo ganado al arquero, un penal o un autogol — el
   marcador nunca se mueve solo.

   La excepción es el gol que sale de `situacionGol`, que se maneja aparte:
   ahí el aguante ya se acaba de vaciar (ese fue el castigo) y restarle más
   podría encadenar una situación tras otra. */
async function scoreU(msg, racha){
  G.gU++;
  // en el 1v1 el marcador del jugador se actualiza ya: si esperara al fin del
  // turno, la mesa mostraría el resultado de la jugada anterior
  if(G.modo === 'duelo') G.J[G.turno].goles = G.gU;
  const espera = flashGol('favor');
  say(msg + ' ¡GOL! ' + G.gU + '-' + G.gC, 'big');
  render();
  // El cartel de gol no bloquea: se muestra y se va solo. Hay que dejarlo
  // terminar antes de cargar la racha, porque si la racha se llena con este
  // mismo gol su pop-up sale por encima y se come el momento del gol.
  await espera;
  await sumarRacha(racha || 1);
}
/* Todo gol del rival **baja la racha**: te lo hicieron y al equipo se le cae el
   ánimo. Es el espejo exacto del gol propio, que la sube.

   Antes restaba aguante, y eso encadenaba: el -1 podía fundirte, fundirte
   reparte una situación, y la situación metía un segundo gol en la misma
   jugada. La racha no dispara nada al bajar, así que la simetría queda sin el
   efecto colateral.

   `desgaste` agrega además el daño de aguante. Lo usa solo el DELANTERO RIVAL, que
   no cuesta aguante por ser gol sino por ser un **duelo perdido**: esa regla
   vale para defensor, mediocampo y delantero por igual. */
async function scoreC(msg, desgaste, sinRacha){
  G.gC++;
  if(G.modo === 'duelo') G.J[1 - G.turno].goles = G.gC;
  const espera = flashGol('contra');
  say(msg + ' Gol del rival. ' + G.gU + '-' + G.gC, 'big');
  /* `sinRacha` lo usa el DELANTERO RIVAL: ese gol ya se cobra como duelo
     perdido (-❤ según la diferencia), y sumarle además el -1 ⚡ de la regla del
     gol era cobrar tres veces la misma carta. */
  if(!sinRacha) G.racha = clamp(G.racha - 1, 0, G.rachaMax);
  render();
  await espera;
  if(desgaste) await hurt(null, desgaste);
}

/* Quedarte con diez: el golpe de -3 ❤ **y** un corazón menos de máximo el resto
   del partido. Vale igual para la ROJA directa y para la segunda amarilla — son
   la misma expulsión.

   La bajada del máximo estaba escrita solo en la rama de la roja, así que la
   doble amarilla te expulsaba sin ese costo. */
async function expulsion(){
  G.aguanteMax = Math.max(AGUANTE_PISO, G.aguanteMax - 1);
  G.aguante = Math.min(G.aguante, G.aguanteMax);
  render();
  await hurt('Te quedás con uno menos y el equipo se rompe corriendo por el que falta. Máximo ' +
             G.aguanteMax + ' <i class="ih"></i>.', 3, true);
}

/* ---------------- fin del partido ---------------- */
async function endMatch(){
  G.phase = 'result';
  say('📣 Pitazo final: ' + G.gU + '-' + G.gC, 'big');
  render();
  await wait(500);

  if(G.gU === G.gC){ return penalShootout(); }
  if(G.gU > G.gC) return matchWon();
  return matchLost();
}

/* ---------------- el penal definitorio ----------------
   Empate en los 90: un solo penal y se termina la historia. Elegís palo, el
   arquero elige el suyo. Si no coinciden, es gol y pasás; si coinciden, te lo
   ataja y quedaste afuera.

   Es azar y está bien que lo sea: los penales lo son. Un tercio de chance de
   que te lo adivine, dos tercios de que entre. No entran acá ni el ataque ni
   la racha a propósito — el penal es la moneda al aire con la que termina
   cualquier partido de fútbol. */
const PALOS = [
  { key:'izq',   ico:'⬅', nm:'IZQUIERDA', arq:'se tira a su derecha' },
  { key:'medio', ico:'⬆', nm:'AL MEDIO',  arq:'se queda parado en el medio' },
  { key:'der',   ico:'➡', nm:'DERECHA',   arq:'se tira a su izquierda' }
];

async function penalShootout(){
  const R = RONDAS[G.ronda];
  const esFinal = G.ronda === RONDAS.length - 1;

  await wait(300);
  await avisoEmpate();

  /* Tanda completa —cinco cada uno, como en la cancha— en **LA FINAL** y en el
     **partido único**: los dos son el último partido de su modo, así que
     merecen su tanda. En el campeonato una ronda de paso se define con un penal
     suelto, porque todavía queda torneo por delante. */
  if(esFinal || G.formato === 'unico'){
    const eqs = [ { club:G.club,   escudo:G.escudo },
                  { club:R.rival,  escudo:G.escudoRival } ];
    const gana = await serieDePenales(eqs, 1);   // el rival patea solo
    return gana === 0 ? matchWon(true) : matchLost(true);
  }

  say('Empate en los 90. Un penal define el partido.', 'big');
  const gol = await tirarPenal();
  return gol ? matchWon(true) : matchLost(true);
}

/* El empate necesita su propio momento. Si el penal apareciera de golpe, el
   jugador tendría que deducir del marcador chiquito por qué está pateando. */
function avisoEmpate(){
  const R = RONDAS[G.ronda];
  return new Promise(resolve => {
    const wrap = document.createElement('div');
    wrap.className = 'sit-flash';
    wrap.innerHTML =
      '<div class="aviso empate">' +
        '<div class="a-ico">⚖</div>' +
        '<div class="e-tit">EMPATE</div>' +
        '<div class="e-marc">' + G.gU + ' <span>-</span> ' + G.gC + '</div>' +
        '<div class="e-sub">' + G.club + ' &nbsp;vs&nbsp; ' + R.rival + '</div>' +
        '<div class="a-s">NOVENTA MINUTOS Y NO SE SACARON DIFERENCIA</div>' +
        '<div class="e-aviso">' + (G.ronda === RONDAS.length - 1 || G.formato === 'unico' ? 'SE DEFINE POR PENALES' : 'TE QUEDA UNA SOLA PELOTA') + '</div>' +
        '<button class="cta" id="empBtn">' + (G.ronda === RONDAS.length - 1 || G.formato === 'unico' ? 'IR A LOS PENALES' : 'IR AL PENAL DEFINITORIO') + '</button>' +
      '</div>';
    document.body.appendChild(wrap);
    wrap.querySelector('#empBtn').onclick = () => { wrap.remove(); resolve(); };
  });
}

function tirarPenal(){
  return new Promise(resolve => {
    const wrap = document.createElement('div');
    wrap.className = 'sit-flash';
    wrap.innerHTML =
      '<div class="sit penal">' +
        '<div class="p-emp">EMPATE <b>' + G.gU + ' - ' + G.gC + '</b></div>' +
        '<div class="t">PENAL<br>DEFINITORIO</div>' +
        arcoPenalHTML(G.escudoRival) +
        '<div class="s">¿A DÓNDE LA PONÉS?</div>' +
        '<div class="pp-hint">tocá adentro del arco</div>' +
      '</div>';
    document.body.appendChild(wrap);

    let tirado = false;
    wrap.querySelectorAll('.pp-zona').forEach(btn => {
      btn.onclick = async () => {
        if(tirado) return; tirado = true;
        const i = +btn.dataset.z, j = rnd(PALOS.length);
        const elegido = PALOS[i], arquero = PALOS[j];
        const esGol   = i !== j;

        wrap.querySelector('.s').textContent = 'LA PONÉS ' + elegido.nm + '…';
        await animarPenal(wrap, i, j);

        const box = wrap.querySelector('.sit.penal');
        /* `salvado` = te fue bien, `gol` = te fue mal. Estaba al revés: acá el
           gol es **tuyo** y te clasifica, así que va en verde; la atajada te
           elimina y va en rojo. El nombre de la clase viene del penal en
           contra, donde «gol» significaba lo contrario. */
        box.classList.add('resuelta', esGol ? 'salvado' : 'gol');
        box.innerHTML =
          '<div class="sit-tag">LA PONÉS ' + elegido.nm + ' · EL ARQUERO ' + arquero.arq.toUpperCase() + '</div>' +
          '<div class="sit-ico">' + icoDesenlace(esGol ? 'golazo' : 'atajada') + '</div>' +
          '<div class="t">' + (esGol ? '¡GOL!' : 'TE LO ATAJÓ') + '</div>' +
          '<div class="s">' + (esGol ? 'PASÁS DE RONDA' : 'SE TERMINA ACÁ') + '</div>';

        say(esGol ? '⚽ La ponés ' + elegido.nm.toLowerCase() + ', el arquero ' + arquero.arq + '. ¡GOL!'
                  : '🧤 La ponés ' + elegido.nm.toLowerCase() + ' y el arquero ' + arquero.arq + '. Te la saca.', 'big');

        await esperarOClick(wrap, ESPERA_FIN);
        resolve(esGol);
      };
    });
  });
}

function matchWon(byPens){
  const R = RONDAS[G.ronda];
  G.phase = 'won';
  G.historial.push({ ronda:R.name, rival:R.rival, gU:G.gU, gC:G.gC, pens:!!byPens, gano:true });
  const last = G.ronda === RONDAS.length - 1;

  /* Partido único: no hay ronda siguiente ni mercado. Se muestra el resultado y
     se vuelve al menú. */
  if(G.formato === 'unico'){
    openCard(
      '<div class="final-tit gano">GANASTE</div>' +
      '<div class="final-sub">' + R.rival + ' se lo lleva puesto</div>' +
      marcadorFinal(R.rival, byPens) +
      '<button class="cta" id="uOtro">JUGAR OTRO</button>' +
      '<button class="cta alt" id="uMenu">VOLVER AL MENÚ</button>',
      'card-final'
    );
    $('uOtro').onclick = () => { closeCard(); newRun(false); };
    $('uMenu').onclick = () => { closeCard(); showMenu(); };
    return;
  }

  if(last){
    // la copa se guarda entera: sirve para el resumen del final y para compartir
    G.copas++;
    G.campeonatos.push({ n:G.copas, partidos:G.historial.slice() });

    openCard(
      '<div class="final-tit campeon">CAMPEÓN</div>' +
      '<div class="final-sub">' +
        (G.copas > 1 ? '<b>' + G.copas + ' copas seguidas</b> · el equipo no para'
                     : 'Clasificaste y ganaste las cuatro') + '</div>' +
      marcadorFinal(R.rival, byPens) +
      historialHTML() +
      '<div class="wallet">' + plata(G.dinero) + '</div>' +
      /* Avisar el desgaste acá es clave: si el próximo campeonato arrancara con
         menos aguante sin explicación, parecería un bug. */
      '<div class="final-pie">Seguís con la plata y los ítems que te quedan.<br>' +
        (G.copas < AGUANTE_BASE - AGUANTE_PISO + 1
          ? 'Pero el equipo llega gastado: el próximo campeonato arranca con <b class="ef-ag">' +
            Math.max(AGUANTE_PISO, AGUANTE_BASE - G.copas) + ' <i class="ih"></i></b> de máximo. ' +
            'El <b>💪 SEGUNDO AIRE</b> lo recupera.'
          : 'El equipo ya no baja más: <b class="ef-ag">' + AGUANTE_PISO + ' <i class="ih"></i></b> de máximo.') +
      '</div>' +
      botonesFinal(true) +
      '<button class="cta" id="againBtn">JUGAR OTRO CAMPEONATO</button>',
      'card-final'
    );
    engancharCompartir();
    $('againBtn').onclick = () => { closeCard(); newRun(true); };
    return;
  }

  openCard(
    '<div class="tag">' + R.name + '</div>' +
    '<h1>PASASTE<br><em>DE RONDA</em></h1>' +
    bracketHTML(G.ronda + 1) +
    marcadorFinal(R.rival, byPens) +
    '<button class="cta" id="shopBtn">IR AL VESTUARIO</button>'
  );
  $('shopBtn').onclick = () => showRefuerzo();
}

/* ---------------- el refuerzo (entre partidos) ----------------
   Los stats ya no se compran: entre partido y partido elegís uno de los dos y
   listo. La progresión deja de depender de la suerte con las cartas de plata
   —una mala racha de dinero ya no te dejaba fuera del campeonato— y la
   decisión queda limpia: ¿ataque o defensa? La plata es solo para ítems. */
/* El marcador del partido que se acaba de jugar, al tamaño en que se lee de un
   vistazo. Un 2-1 metido en medio de una frase no se registra. */
/* El marcador de los pop-ups, con la misma lectura que la marquesina: tu equipo
   y tu número a la izquierda, el rival a la derecha. Antes los nombres iban en
   dos líneas sueltas arriba y abajo del marcador, y no se sabía cuál era cuál. */
function marcadorFinal(rival, byPens){
  return '<div class="marcador">' +
    /* Tres columnas: nombre · resultado · nombre. El resultado va en la del medio
       y esa columna es `auto`, así queda centrado sin importar cuánto ocupen los
       nombres. Los nombres pueden partirse en dos líneas. */
    '<div class="m-fila">' +
      '<span class="m-eq mio"><span class="m-esc">' + miEscudo(34) + '</span>' + G.club + '</span>' +
      '<span class="m-res">' + G.gU + '<span class="m-sep">-</span>' + G.gC + '</span>' +
      '<span class="m-eq suyo"><span class="m-esc">' + escudoDe(G.escudoRival, 34) + '</span>' + rival + '</span>' +
    '</div>' +
    (byPens ? '<div class="m-pen">DEFINIDO EN LOS PENALES</div>' : '') +
  '</div>';
}

/* Con qué aguante y qué racha vas a arrancar el próximo partido. Ahora que
   viajan entre partidos, es la información que decide qué comprás. */
function estadoEquipo(){
  let corazones = '';
  for(let i=0;i<G.aguanteMax;i++)
    corazones += '<span class="' + (i < G.aguante ? 'heart-on' : 'heart-off') + '"><i class="ih"></i></span>';
  let puntos = '';
  for(let i=0;i<G.rachaMax;i++)
    puntos += '<span class="' + (i < G.racha ? 'ray-on' : 'ray-off') + '"><i class="ir"></i></span>';

  return '<div class="estado">' +
    '<div class="e-item"><span class="e-lb">LLEGÁS CON</span><span class="hearts">' + corazones + '</span></div>' +
    '<div class="e-item"><span class="e-lb">RACHA</span><div class="racha-track">' + puntos + '</div>' +
      (G.racha >= G.rachaMax ? '<span class="e-lista"><i class="ir"></i> LISTA</span>' : '') + '</div>' +
  '</div>';
}

function showRefuerzo(){
  G.phase = 'refuerzo';
  const R = RONDAS[G.ronda + 1];

  openCard(
    '<div class="tag">VESTUARIO</div>' +
    '<h1>SUMÁ UN<br><em>REFUERZO</em></h1>' +
    '<p>Te llega uno solo. Elegí de qué lado reforzás el equipo para ' +
      R.name + ' contra ' + R.rival + '.</p>' +
    estadoEquipo() +
    '<div class="choice">' +
      '<button class="pick-stat atk" data-stat="atk">' +
        '<span class="ps-ico">⚔</span>' +
        '<span class="ps-nm">ATAQUE</span>' +
        '<span class="ps-val">' + G.atk + ' → ' + (G.atk + 1) + '</span>' +
        '<span class="ps-desc">Ganás más duelos contra defensores y arqueros.</span>' +
      '</button>' +
      '<button class="pick-stat def" data-stat="def">' +
        '<span class="ps-ico">🛡</span>' +
        '<span class="ps-nm">DEFENSA</span>' +
        '<span class="ps-val">' + G.def + ' → ' + (G.def + 1) + '</span>' +
        '<span class="ps-desc">Los delanteros rivales dejan de convertirte.</span>' +
      '</button>' +
    '</div>' +
    '<p style="color:var(--gold);font-size:13.5px">Ojo: los rivales se acomodan. Por cada 2 puntos que sumás en un stat, las cartas de ese color suben 1.</p>'
  );

  document.querySelectorAll('.pick-stat').forEach(b => {
    b.onclick = () => {
      const st = b.dataset.stat;
      if(st === 'atk') G.atk++; else G.def++;
      say(st === 'atk' ? '⚔ Refuerzo en ataque: ATAQUE ' + G.atk + '.'
                       : '🛡 Refuerzo en defensa: DEFENSA ' + G.def + '.', 'good');
      showMarket(true);
    };
  });
}

function matchLost(byPens){
  const R = RONDAS[G.ronda];
  G.phase = 'lost';
  G.historial.push({ ronda:R.name, rival:R.rival, gU:G.gU, gC:G.gC, pens:!!byPens, gano:false });

  if(G.formato === 'unico'){
    openCard(
      '<div class="final-tit perdio">PERDISTE</div>' +
      '<div class="final-sub">' + R.rival + ' te ganó' + (byPens ? ' por penales' : '') + '</div>' +
      marcadorFinal(R.rival, byPens) +
      '<button class="cta" id="uOtro2">REVANCHA</button>' +
      '<button class="cta alt" id="uMenu2">VOLVER AL MENÚ</button>',
      'card-final'
    );
    $('uOtro2').onclick = () => { closeCard(); newRun(false); };
    $('uMenu2').onclick = () => { closeCard(); showMenu(); };
    return;
  }

  openCard(
    '<div class="final-tit eliminado">ELIMINADO</div>' +
    '<div class="final-sub">' + R.rival + ' te dejó afuera en ' + R.name +
      (byPens ? ' · <b>por penales</b>' : '') + '</div>' +

/* La dirección del juego, en un solo lugar.
   Estaba escrita a mano adentro del texto que se comparte y quedó con el
   nombre viejo del repo cuando se renombró a Duelo Futbolero: GitHub redirige
   `github.com/…` con un 301, **pero no redirige las páginas**, así que cada
   partido compartido repartía un link muerto. Acá arriba se ve, y si vuelve a
   mudarse se cambia en un lado. */
const URL_JUEGO = 'https://nicolasdiani.github.io/Duelo-Futbolero/';

/* El texto que se comparte: legible en WhatsApp, sin depender de formato. */
function textoCompartir(campeon){
  const L = [];
  L.push(campeon ? '⚽ DUELO FUTBOLERO — ¡CAMPEÓN!' : '⚽ DUELO FUTBOLERO');
  L.push('');
  if(G.copas) L.push('🏆 ' + G.copas + (G.copas === 1 ? ' copa ganada' : ' copas ganadas'));
  G.campeonatos.forEach(c => {
    L.push('');
    L.push('COPA ' + c.n + ':');
    c.partidos.forEach(p => L.push('  ' + p.ronda + '  ' + p.gU + '-' + p.gC +
      (p.pens ? (p.gano ? ' (ganado en penales)' : ' (perdido en penales)') : '')));
  });
  if(!campeon && G.historial.length){
    L.push('');
    L.push('ÚLTIMO INTENTO:');
    G.historial.forEach(p => L.push('  ' + p.ronda + '  ' + p.gU + '-' + p.gC +
      (p.pens ? (p.gano ? ' (ganado en penales)' : ' (perdido en penales)') : '')));
  }
  L.push('');
  L.push('Jugalo vos: ' + URL_JUEGO);
  return L.join('\n');
}

function botonesFinal(campeon){
  return '<div class="cta-fila">' +
    '<button class="cta chica" data-share="wsp">COMPARTIR</button>' +
    '<button class="cta chica alt" data-share="copiar">COPIAR</button>' +
  '</div>';
}

/* Compartir: usa el menú nativo del sistema si existe —en el celular abre
   WhatsApp, Telegram, lo que tengas— y si no, cae al portapapeles. */
function engancharCompartir(){
  const campeon = G.phase === 'won';
  document.querySelectorAll('[data-share]').forEach(btn => {
    btn.onclick = async () => {
      const txt = textoCompartir(campeon);
      const modo = btn.dataset.share;
      try {
        if(modo === 'wsp' && navigator.share){
          await navigator.share({ title:'Duelo Futbolero', text:txt });
          return;
        }
        if(modo === 'wsp'){
          window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank');
          return;
        }
        await navigator.clipboard.writeText(txt);
        btn.textContent = 'COPIADO ✓';
        setTimeout(() => { btn.textContent = 'COPIAR'; }, 1800);
      } catch(e){
        // el navegador puede negar el portapapeles: se muestra para copiar a mano
        const ta = document.createElement('textarea');
        ta.className = 'share-txt';
        ta.value = txt;
        btn.parentNode.parentNode.insertBefore(ta, btn.parentNode.nextSibling);
        ta.select();
      }
    };
  });
}

/* ---------------- mercado de pases ---------------- */
/* ---------------- el vestuario del partido único ----------------
   Antes de un partido suelto no hay campeonato ni plata acumulada, así que en
   vez de comprar se **eligen tres ítems** de los cuatro disponibles. Pueden
   repetirse: tres suplentes es una estrategia tan válida como uno de cada uno.

   Reusa la misma grilla del mercado, pero contando cupos en vez de dinero. */
const ITEMS_UNICO = 3;
/* Los dos ítems fuertes van de a uno: el SEGUNDO AIRE recupera un corazón de
   máximo y el VAR destraba una carta, así que tres de cualquiera de ellos
   desbalancea el partido. Los básicos —suplentes y grito— sí se repiten. */
const TOPE_POR_ITEM = { refuerzo: 1, revision: 1 };

function showElegirItems(){
  G.phase = 'market';
  G.items = {};

  const pintar = () => {
    const usados = Object.values(G.items).reduce((a, n) => a + n, 0);
    const quedan = ITEMS_UNICO - usados;

    openCard(
      '<div class="tag">VESTUARIO</div>' +
      '<h1>ELEGÍ TUS<br><em>ÍTEMS</em></h1>' +
      '<p>Llevás <b>' + ITEMS_UNICO + '</b> al partido. Pueden repetirse.</p>' +
      '<div class="cupos">' +
        Array.from({length: ITEMS_UNICO}, (_, i) =>
          '<span class="cupo' + (i < usados ? ' lleno' : '') + '"></span>').join('') +
        '<span class="cupo-lb">' + (quedan ? 'te quedan ' + quedan : 'listo') + '</span>' +
      '</div>' +
      inventarioHTML() +
      '<div class="shop">' +
        Object.keys(ITEMS).map(k => {
          const I = ITEMS[k];
          const tope = TOPE_POR_ITEM[k] || ITEMS_UNICO;
          const tengo = G.items[k] || 0;
          const lleno = quedan <= 0 || tengo >= tope;
          return '<button class="shop-item' + (lleno ? ' caro' : '') + '" data-elegir="' + k + '"' +
            (lleno ? ' disabled' : '') + '>' +
            '<span class="shop-nm">' + icoItem(k) + ' ' + I.nm +
              (tengo ? '<span class="shop-tengo">x' + tengo + '</span>' : '') +
              (tope < ITEMS_UNICO ? '<span class="shop-tope">máx 1</span>' : '') + '</span>' +
            '<span class="shop-ef">' + I.efecto + '</span>' +
            '<span class="shop-desc">' + I.desc + '</span>' +
          '</button>';
        }).join('') +
      '</div>' +
      '<button class="cta" id="unicoGo"' + (usados ? '' : ' disabled') + '>' +
        (usados ? 'JUGAR EL PARTIDO' : 'ELEGÍ AL MENOS UNO') + '</button>' +
      '<button class="cta alt" id="unicoBack">VOLVER</button>'
    );

    document.querySelectorAll('[data-elegir]').forEach(b => {
      b.onclick = () => {
        const k = b.dataset.elegir;
        if(Object.values(G.items).reduce((a, n) => a + n, 0) >= ITEMS_UNICO) return;
        if((G.items[k] || 0) >= (TOPE_POR_ITEM[k] || ITEMS_UNICO)) return;
        G.items[k] = (G.items[k] || 0) + 1;
        pintar();
      };
    });
    /* La ✕ del inventario devuelve el cupo. */
    document.querySelectorAll('.inv-x').forEach(b => {
      b.onclick = e => {
        e.stopPropagation();
        const k = b.dataset.dev;
        if(G.items[k] > 0){ G.items[k]--; if(!G.items[k]) delete G.items[k]; }
        pintar();
      };
    });
    $('unicoBack').onclick = () => showMenu();
    const go = $('unicoGo');
    if(go && !go.disabled) go.onclick = () => { closeCard(); startMatch(); };
  };
  pintar();
}

function showMarket(primeraVez){
  G.phase = 'market';
  /* Lo comprado en este mercado se puede devolver; lo que traías de antes no.
     Se reinicia al abrirlo, así que al pasar de ronda las compras quedan

function tiendaHTML(){

/* Lo que ya tenés guardado. Sin esto, comprar es a ciegas: no sabés si te
   faltan gritos para la racha o suplentes para aguantar. */
function inventarioHTML(){
  const tengo = Object.keys(ITEMS).filter(k => (G.items[k] || 0) > 0);
  if(!tengo.length){
    return '<div class="inv vacio">NO TENÉS NINGÚN ÍTEM GUARDADO</div>';
  }
  return '<div class="inv">' +
    '<div class="inv-lb">YA TENÉS</div>' +
    '<div class="inv-list">' +
      tengo.map(k => {
        const nuevos = G.compras[k] || 0;
        return '<span class="inv-it' + (nuevos ? ' nuevo' : '') + '" title="' + ITEMS[k].desc + '">' +
          icoItem(k) + ' ' + ITEMS[k].nm + ' <b>x' + G.items[k] + '</b>' +
          '<span class="inv-ef">' + ITEMS[k].efecto + '</span>' +
          // solo se devuelve lo comprado en este mercado
          (nuevos ? '<button class="inv-x" data-dev="' + k + '" ' +
                    'title="Devolver uno y recuperar ' + plata(ITEMS[k].price) + '">✕</button>' : '') +
        '</span>';
      }).join('') +
    '</div>' +
    (Object.keys(G.compras).length
      ? '<div class="inv-nota">Lo que compraste ahora se puede devolver con ✕. Al pasar de ronda queda firme.</div>'
      : '') +
  '</div>';
}

function shopBtn(id, name, desc, price, tengo, efecto){
  const can = G.dinero >= price;
  return '<button class="shop-item" data-buy="' + id + '"' + (can ? '' : ' disabled') + '>' +
    '<span><span class="shop-name">' + name +
      (tengo ? '<span class="shop-tengo">TENÉS x' + tengo + '</span>' : '') + '</span>' +
      (efecto ? '<span class="shop-ef">' + efecto + '</span>' : '') +
      '<span class="shop-desc">' + desc + '</span></span>' +
    '<span class="shop-price">' + plata(price) + '</span></button>';
}

function buy(what){
  if(what.startsWith('item:')){
    const k = what.slice(5);
    if(G.dinero < ITEMS[k].price) return;
    G.dinero -= ITEMS[k].price;
    G.items[k] = (G.items[k] || 0) + 1;
    G.compras[k] = (G.compras[k] || 0) + 1;
  }
  if(G.modo === 'duelo'){ guardarTurno(); return duelRedibujarTienda(); }
  showMarket();   // se redibuja con los precios y el saldo nuevos
}

/* Devuelve un ítem comprado en este mismo mercado y reintegra la plata. Solo
   alcanza a lo comprado ahora: los que traías de rondas anteriores ya están
   jugados y no se pueden vender. */
function devolver(k){
  if(!G.compras[k]) return;
  G.compras[k]--;
  if(G.compras[k] <= 0) delete G.compras[k];
  G.items[k]--;
  if(G.items[k] <= 0) delete G.items[k];
  G.dinero += ITEMS[k].price;
  if(G.modo === 'duelo'){ guardarTurno(); return duelRedibujarTienda(); }
  showMarket();
}

    '</div>' +

    /* El escudo pasa al centro, sobre una peana con luz: es lo único que el
       jugador crea en todo el juego y estaba tratado como un campo más de un
       formulario. Debajo, la tira de formas —cada una dibujada con **los
       colores elegidos**, para verse a sí mismo en cinco siluetas— y una sola
       fila de colores con un interruptor de cuál se está pintando. Antes eran
       dos filas de nueve, dieciocho botones a la vez. */

      '<div class="crear-prev" id="escPrev"></div>' +
      '<div class="club-peana"></div>' +
    '</div>' +

    '<input id="clubInput" maxlength="18" placeholder="NOMBRE DE TU CLUB">' +

    '<div class="crear-lb">FORMA DEL ESCUDO</div>' +
    '<div class="club-tira" id="opsForma"></div>' +

    '<div class="crear-lb">COLORES</div>' +
    '<div class="club-sw" id="opsSw"></div>' +
    '<div class="col-fila" id="opsCol"></div>' +

    '<button class="op-azar" id="azarBtn">🎲 SORPRENDEME</button>' +

    '<div class="club-pie">' +
      '<button class="cta" id="startBtn">' +
        (irAlDuelo ? 'SEGUIR' : G.formato === 'unico' ? 'JUGAR EL PARTIDO' : 'EMPEZAR LA COPA') + '</button>' +
      '<button class="cta alt" id="volverMenu">VOLVER</button>' +
    '</div>',
    'card-club'
  );

  /* El escudo arranca **al azar** cada vez que se abre la pantalla: así el
     jugador ve algo armado en vez de un molde vacío, y si le gusta lo deja.
     Antes siempre empezaba en azul y amarillo. */
  G.escudo = { forma: rnd(ESCUDOS.length), c1: rnd(COLORES.length), c2: rnd(COLORES.length) };
  if(G.escudo.c2 === G.escudo.c1) G.escudo.c2 = (G.escudo.c2 + 1) % COLORES.length;

  /* Cuál de los dos colores está pintando la fila de abajo. */
  let cualColor = 'c1';

  const pintar = () => {
    $('escPrev').innerHTML = escudoSVG(150, G.escudo.forma, G.escudo.c1, G.escudo.c2);
    $('opsForma').innerHTML = ESCUDOS.map((e, i) =>
      '<button class="op-esc' + (i === G.escudo.forma ? ' sel' : '') + '" data-forma="' + i + '" title="' + e.nm + '">' +
        escudoSVG(34, i, G.escudo.c1, G.escudo.c2) + '</button>').join('');
    $('opsSw').innerHTML = ['c1', 'c2'].map((k, i) =>
      '<button class="sw-b' + (cualColor === k ? ' on' : '') + '" data-sw="' + k + '">' +
        '<i style="background:' + COLORES[G.escudo[k]].hex + '"></i>COLOR ' + (i + 1) + '</button>').join('');
    $('opsCol').innerHTML = filaColores(G.escudo[cualColor], 'col');

    document.querySelectorAll('[data-forma]').forEach(b =>
      b.onclick = () => { G.escudo.forma = +b.dataset.forma; pintar(); });
    document.querySelectorAll('[data-sw]').forEach(b =>
      b.onclick = () => { cualColor = b.dataset.sw; pintar(); });
    document.querySelectorAll('[data-col]').forEach(b =>
      b.onclick = () => { G.escudo[cualColor] = +b.dataset.col; pintar(); });
  };
  pintar();
  $('clubInput').addEventListener('input', pintar);
  $('azarBtn').onclick = () => {
    const antes = G.escudo.forma + ':' + G.escudo.c1 + ':' + G.escudo.c2;
    for(let i = 0; i < 12; i++){
      G.escudo = { forma: rnd(ESCUDOS.length), c1: rnd(COLORES.length), c2: rnd(COLORES.length) };
      if(G.escudo.c2 === G.escudo.c1) G.escudo.c2 = (G.escudo.c2 + 1) % COLORES.length;
      if(G.escudo.forma + ':' + G.escudo.c1 + ':' + G.escudo.c2 !== antes) break;
    }
    pintar();
  };

  const tomarClub = () => ($('clubInput').value.trim().toUpperCase() || 'TU CLUB');
  $('volverMenu').onclick = () => showMenu();
  $('startBtn').onclick = () => {
    G.club = tomarClub();
    if(irAlDuelo) avisoBeta();
    else comoSeJuega(true);   // el tutorial decide a dónde sigue
  };
  $('clubInput').addEventListener('keydown', e => { if(e.key === 'Enter') $('startBtn').click(); });
}

/* En pantallas donde todo tiene que entrar sin scroll, el relato va plegado:
   se lee después de la jugada, no antes de decidir. El título lo abre y cierra. */
(function(){
  const t = document.getElementById('logTit');
  const pl = document.getElementById('panelLog');
  if(t) t.onclick = () => pl.classList.remove('abierto');

  /* El relato ocupaba una franja fija arriba de la mesa. Ahora vive detrás de un
     botón flotante: se abre como panel sobre el juego y se cierra tocando el
     título. El punto verde avisa que hay relato sin leer. */
  if(pl && !document.querySelector('.log-fab')){
    const fab = document.createElement('button');
    fab.className = 'log-fab';
    fab.type = 'button';
    fab.innerHTML = '📋';
    fab.title = 'Relato del partido';
    fab.onclick = () => { pl.classList.add('abierto'); fab.classList.remove('hay'); };
    document.body.appendChild(fab);

    /* Cada línea nueva enciende el punto, salvo que el panel esté abierto. */
    new MutationObserver(() => {
      if(!pl.classList.contains('abierto')) fab.classList.add('hay');
    }).observe(document.getElementById('log'), { childList:true });
  }

  /* Los paneles **no se mueven nunca**: quedan donde los pone el HTML y el CSS
     los acomoda con grid en cada tamaño de pantalla.

     Antes se movían con JS al cargar, según el ancho. Eso rompía al rotar la
     tablet: si arrancaba en portrait el DOM quedaba armado para mobile, y al
     girar el CSS pasaba a desktop con los paneles en el lugar equivocado. */
})();

document.addEventListener('keydown', e => {
  if(e.key === 'Escape') cancelarApuntado();
});

/* El "?" de abajo de la mesa: reabre las reglas sin perder la partida. */
document.addEventListener('DOMContentLoaded', () => {
  const b = document.getElementById('ayudaBtn');
  if(b) b.onclick = () => comoSeJuega(false);
});

/* La cancha de fondo se pone como variable CSS: así el CSS la compone con los
   velos sin tener que meter el base64 dentro de la hoja de estilos. */
(function(){
  const c = ARTSRC('cancha');
  if(c) document.documentElement.style.setProperty('--fondo-cancha', 'url(' + c + ')');
  /* El corazón del aguante como variable CSS: así la clase `.ih` lo puede usar
     de fondo en cualquier texto —«-1 ❤», «+2 ❤»— sin tener que tocar los
     strings uno por uno. */
  const co = ARTSRC('ico_aguante');
  if(co) document.documentElement.style.setProperty('--ico-aguante', 'url(' + co + ')');
  const ra = ARTSRC('ico_racha');
  if(ra) document.documentElement.style.setProperty('--ico-racha', 'url(' + ra + ')');
})();

/* ---------------- arranque ---------------- */
/* `encadenar` es lo que pasa después de salir campeón: se juega otro campeonato
   con la **plata acumulada** y los ítems que sobraron, pero con el equipo
   entero de nuevo. Sin él —al perder y volver a empezar— se resetea todo,
   incluidas las copas ganadas. */
/* `sinArrancar` deja todo listo pero **no empieza el partido**: lo usa el modo
   único, que antes de jugar pasa por el vestuario a elegir sus ítems. */
function newRun(encadenar, sinArrancar){
  if(!encadenar){
    G.dinero = 0;
    G.items = Object.assign({}, ITEMS_INICIALES);
    G.copas = 0;
    G.campeonatos = [];
  } else {
    /* Encadenando: se conserva todo lo acumulado y solo se repone el ítem de
       arranque que falte. Si tenés 3 suplentes y ningún grito, seguís con los
       3 y te dan 1 grito. */
    for(const k in ITEMS_INICIALES){
      if(!(G.items[k] > 0)) G.items[k] = ITEMS_INICIALES[k];
    }
  }
  G.ronda = 0;
  G.atk = 2; G.def = 1;
  /* Un corazón menos de techo por cada copa ganada, hasta el piso. La segunda
     corrida arranca en 3, la tercera en 2, y de ahí no baja más. */
  G.maxCampeonato = Math.max(AGUANTE_PISO, AGUANTE_BASE - G.copas);
  G.aguanteMax = G.maxCampeonato;
  G.aguante = G.maxCampeonato;   // el equipo arranca entero en cada campeonato
  G.racha = 0;
  G.historial = [];
  $('log').innerHTML = '';
  if(!sinArrancar) startMatch();
}

function startMatch(){
  const R = RONDAS[G.ronda];
  G.grid = buildGrid(R.lvl);
  // El AGUANTE y la RACHA no se resetean: son el estado del equipo y viajan de
  // un partido al otro. Terminás fundido, arrancás fundido; terminás con la
  // racha cargada, arrancás pudiendo cobrarla. Lo único que se resetea es lo
  // que pertenece al partido: marcador, reloj y amarillas.
  G.gU = 0; G.gC = 0;
  G.reloj = R.reloj;
  G.amarillas = 0;
  G.fundidas = 0;
  G.escudoRival = escudoRivalNuevo();   // cada rival, su escudo
  // El máximo vuelve al techo de la corrida en cada partido —el equipo
  // descansa— pero el aguante con el que llegás es el que traés del anterior.
  G.aguanteMax = G.maxCampeonato;
  G.aguante = clamp(G.aguante, 1, G.aguanteMax);
  G.ultimaFila = null; G.marcarFila = null;
  G.busy = false; G.targeting = false; G.armed = null;
  G.phase = 'match';
  $('hint').textContent = 'Elegí una FILA. El azar decide qué carta te toca.';
  say('— ' + R.name + ' — ' + G.club + ' vs ' + R.rival + ' —', 'big');
  render();
}

render();
showMenu();
