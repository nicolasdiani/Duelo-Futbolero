<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FÚTBOL CESTO — Estrategia y Suerte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --black:#070d09;
  --panel:#0d1712;
  --panel2:#132019;
  --line:#1f3428;
  --white:#eef4f0;
  --dim:#7d9689;
  --dim2:#4c6357;
  --red:#e8394a;
  --blue:#4d9bf0;
  --green:#39ff14;
  --gold:#f5c842;
  --coin:#e0b243;
  --danger:#c31026;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--black);
  color:var(--white);
  font-family:'Share Tech Mono',monospace;
  min-height:100vh;
  display:flex;justify-content:center;
  padding:14px;
}
.wrap{width:100%;max-width:1040px;display:flex;flex-direction:column;gap:12px}

/* ---------- BARRA SUPERIOR ---------- */
.topbar{
  background:var(--panel);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:10px 14px;flex-wrap:wrap;
}
.round-info{display:flex;flex-direction:column;gap:2px;min-width:0}
.round-name{font-family:'Anton',sans-serif;font-style:italic;font-size:17.8px;letter-spacing:1px;color:var(--gold)}
.round-vs{font-size:12.7px;color:var(--dim);letter-spacing:1px}
.scorebox{
  font-family:'Anton',sans-serif;font-style:italic;
  font-size:clamp(28.3px,5.9vw,42.5px);letter-spacing:2px;white-space:nowrap;
}
.scorebox .vs{color:var(--dim2);font-size:.6em;margin:0 4px}
.meters{display:flex;gap:14px;flex-wrap:wrap}
.meter{display:flex;flex-direction:column;gap:3px;min-width:76px}
.meter-label{font-size:10.9px;letter-spacing:2px;color:var(--dim)}
.meter-val{font-family:'Anton',sans-serif;font-style:italic;font-size:20.1px;letter-spacing:1px;line-height:1}
.hearts{letter-spacing:1px;font-size:16.5px;line-height:1.3}
.heart-on{color:var(--red)}
.heart-off{color:var(--dim2)}
.racha-track{display:flex;gap:3px;margin-top:3px}
.rp{width:13px;height:13px;border:1px solid var(--line);background:#000;border-radius:50%}
.rp.on{background:var(--gold);border-color:var(--gold);box-shadow:0 0 7px rgba(245,200,66,.7)}

/* ---------- STATS ---------- */
.statbar{display:flex;gap:8px;flex-wrap:wrap}
.stat{
  flex:1;min-width:142px;
  background:var(--panel);border:1px solid var(--line);
  padding:9px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.stat .n{font-family:'Anton',sans-serif;font-style:italic;font-size:28.3px;line-height:1}
.stat.atk{border-left:3px solid var(--red)}
.stat.def{border-left:3px solid var(--blue)}
.stat.atk .n{color:var(--red)}
.stat.def .n{color:var(--blue)}
.stat-txt{font-size:12.2px;letter-spacing:2px;color:var(--dim);text-align:right;line-height:1.4}
.stat .down{color:var(--danger);font-size:12.7px}

/* ---------- GRILLA ---------- */
.board-hint{
  font-size:12.7px;letter-spacing:2px;color:var(--dim);
  display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
}
.board-hint b{color:var(--gold);font-weight:normal}

.board{display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:6px;align-items:stretch}
.row-pick{
  width:78px;flex-shrink:0;
  background:var(--panel);border:1px solid var(--line);
  color:var(--dim);cursor:pointer;
  font-family:'Share Tech Mono',monospace;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:border-color .15s,background .15s,color .15s;
}
.row-pick .pk{font-family:'Anton',sans-serif;font-style:italic;font-size:15.2px;letter-spacing:1px}
.row-pick .pc{font-size:14px;color:var(--gold)}
.row-pick:hover:not(:disabled){border-color:var(--green);color:var(--white);background:#16281d}
.row-pick:disabled{opacity:.25;cursor:not-allowed}
.cells{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:1}

.col-picks{display:flex;gap:6px;padding-left:84px}
.col-pick{
  flex:1;background:var(--panel);border:1px solid var(--gold);color:var(--gold);
  font-family:'Anton',sans-serif;font-style:italic;font-size:14px;letter-spacing:1px;
  padding:6px;cursor:pointer;transition:background .15s;
}
.col-pick:hover:not(:disabled){background:#2a2410}
.col-pick:disabled{opacity:.25;cursor:not-allowed}

.cell{
  position:relative;
  background:var(--panel2);border:1px solid var(--line);
  min-height:104px;padding:9px 7px 8px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  transition:transform .15s,border-color .15s,background .15s;
  overflow:hidden;
}
.cell.empty{background:#080e0b;border-style:dashed;border-color:#152219;opacity:.55}
.cell .ico{font-size:28.3px;line-height:1}
.cell .nm{font-size:10.2px;letter-spacing:.5px;color:var(--dim);text-align:center;line-height:1.2}
.cell .val{
  position:absolute;top:4px;right:4px;
  font-family:'Anton',sans-serif;font-style:italic;font-size:16.5px;
  padding:0 4px;border-radius:2px;line-height:1.3;
}
.cell .val.r{color:var(--red);border:1px solid var(--red)}
.cell .val.b{color:var(--blue);border:1px solid var(--blue)}
.cell .out{
  position:absolute;top:4px;left:4px;
  font-size:11.6px;padding:1px 4px;border-radius:2px;letter-spacing:.5px;
  background:rgba(0,0,0,.65);border:1px solid;
}
.out.good{color:var(--green);border-color:rgba(57,255,20,.5)}
.out.bad{color:var(--red);border-color:rgba(232,57,74,.5)}
.out.risk{color:var(--gold);border-color:rgba(245,200,66,.5)}
.out.neutral{color:var(--dim);border-color:var(--line)}
.out.coin{color:var(--coin);border-color:rgba(224,178,67,.5)}

.row.hl .cell:not(.empty){border-color:var(--green);transform:translateY(-2px);background:#18291e}
.cell.colhl:not(.empty){border-color:var(--gold);transform:translateY(-2px);background:#251f0e}
.cell.hit{animation:hit .5s}
@keyframes hit{
  0%{transform:scale(1)}
  35%{transform:scale(1.14);border-color:var(--white)}
  100%{transform:scale(1)}
}
.cell.target{cursor:crosshair;border-color:var(--danger)}
.cell.target:hover:not(.empty){background:#2a1013;transform:scale(1.05)}

/* ---------- ÍTEMS ---------- */
.items{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.items-label{font-size:12.2px;letter-spacing:2px;color:var(--dim);margin-right:2px}
.item{
  background:var(--panel);border:1px solid var(--line);color:var(--white);
  font-family:'Share Tech Mono',monospace;font-size:12.7px;
  padding:7px 10px;cursor:pointer;display:flex;align-items:center;gap:6px;
  transition:border-color .15s,transform .15s;
}
.item:hover:not(:disabled){border-color:var(--gold);transform:translateY(-2px)}
.item:disabled{opacity:.3;cursor:not-allowed}
.item .ii{font-size:17.8px}
.item .iq{color:var(--gold)}
.no-items{font-size:12.7px;color:var(--dim2);letter-spacing:1px}

/* ---------- RELATO ---------- */
.log{
  background:var(--panel);border:1px solid var(--line);
  height:136px;overflow-y:auto;padding:10px 14px;font-size:14px;line-height:1.7;
}
.log p{color:var(--dim);padding:2px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.log p.good{color:var(--green)}
.log p.bad{color:var(--red)}
.log p.coin{color:var(--coin)}
.log p.big{font-family:'Anton',sans-serif;font-style:italic;font-size:17.8px;letter-spacing:1px;color:var(--gold)}
.log::-webkit-scrollbar{width:5px}
.log::-webkit-scrollbar-thumb{background:var(--line)}

/* ---------- CARTEL DE GOL ---------- */
/* Se ancla a la franja alta de la pantalla para caer sobre el tablero,
   no sobre el relato que está más abajo. */
.gol-flash{
  position:fixed;top:0;left:0;right:0;height:62vh;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;z-index:200;padding:20px;
}
.gf{
  font-family:'Anton',sans-serif;font-style:italic;text-transform:uppercase;
  text-align:center;padding:22px 40px;border:3px solid;
  background:rgba(4,10,6,.9);
  animation:golpop 1.5s cubic-bezier(.2,.9,.25,1) forwards;
}
.gf .t{font-size:clamp(38px,9vw,76px);letter-spacing:2px;line-height:.92}
.gf .s{
  font-family:'Share Tech Mono',monospace;font-style:normal;
  font-size:13px;letter-spacing:4px;margin-top:10px;
}
.gf.favor{border-color:var(--green);color:var(--green);box-shadow:0 0 60px rgba(57,255,20,.35)}
.gf.contra{border-color:var(--red);color:var(--red);box-shadow:0 0 60px rgba(232,57,74,.35)}
.gf.favor .s{color:var(--white)}
.gf.contra .s{color:var(--dim)}
@keyframes golpop{
  0%{opacity:0;transform:scale(.72)}
  12%{opacity:1;transform:scale(1.07)}
  22%{transform:scale(1)}
  74%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(1.05)}
}

/* ---------- OVERLAY ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(3,8,5,.95);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;padding:20px;
  opacity:0;pointer-events:none;transition:opacity .3s;z-index:60;overflow-y:auto;
}
.overlay.open{opacity:1;pointer-events:auto}
.card{
  background:var(--panel);border:1px solid var(--line);padding:30px 26px;
  max-width:520px;width:100%;text-align:center;
  transform:translateY(12px);transition:transform .3s;margin:auto;
}
.overlay.open .card{transform:translateY(0)}
.card .tag{font-size:12.2px;letter-spacing:5px;color:var(--gold);margin-bottom:10px}
.card h1{
  font-family:'Anton',sans-serif;font-style:italic;
  font-size:clamp(33px,7.6vw,51.9px);letter-spacing:1px;line-height:.95;text-transform:uppercase;
}
.card h1 em{color:var(--green)}
.card p{font-size:15.2px;color:var(--dim);line-height:1.7;margin-top:12px}
.card input{
  width:100%;background:#000;border:1px solid var(--line);color:var(--white);
  font-family:'Anton',sans-serif;font-style:italic;font-size:20.1px;letter-spacing:1px;
  text-transform:uppercase;padding:11px;text-align:center;margin-top:16px;outline:none;
}
.card input:focus{border-color:var(--green)}
.cta{
  width:100%;background:var(--green);border:none;color:#04150a;
  font-family:'Anton',sans-serif;font-style:italic;font-size:21.2px;letter-spacing:3px;
  text-transform:uppercase;padding:13px;margin-top:14px;cursor:pointer;
  transition:filter .15s,transform .15s;
}
.cta:hover{filter:brightness(1.15);transform:translateY(-2px)}
.cta.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);font-size:16.5px;letter-spacing:2px;padding:10px}
.cta.ghost:hover{color:var(--white);border-color:var(--white)}
.rules{text-align:left;margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.rules li{font-size:14px;color:var(--dim);line-height:1.6;list-style:none;margin-bottom:6px;padding-left:13px;position:relative}
.rules li::before{content:'▸';position:absolute;left:0;color:var(--green)}
.rules li b{color:var(--white);font-weight:normal}

/* ---------- MERCADO ---------- */
.shop{display:flex;flex-direction:column;gap:7px;margin-top:16px;text-align:left}
.shop-item{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--panel2);border:1px solid var(--line);padding:10px 12px;
  cursor:pointer;transition:border-color .15s,transform .15s;
  font-family:'Share Tech Mono',monospace;color:var(--white);text-align:left;width:100%;
}
.shop-item:hover:not(:disabled){border-color:var(--gold);transform:translateX(3px)}
.shop-item:disabled{opacity:.32;cursor:not-allowed}
.shop-name{font-family:'Anton',sans-serif;font-style:italic;font-size:17.8px;letter-spacing:1px}
.shop-desc{font-size:12.9px;color:var(--dim);margin-top:3px;line-height:1.4}
.shop-price{font-family:'Anton',sans-serif;font-style:italic;font-size:20.3px;color:var(--coin);white-space:nowrap}
.wallet{font-family:'Anton',sans-serif;font-style:italic;font-size:26px;color:var(--coin);margin-top:14px}

.bracket{display:flex;gap:5px;justify-content:center;margin:14px 0;flex-wrap:wrap}
.bstep{
  font-size:10.9px;letter-spacing:1px;padding:5px 7px;
  border:1px solid var(--line);color:var(--dim2);
}
.bstep.done{border-color:var(--green);color:var(--green)}
.bstep.now{border-color:var(--gold);color:var(--gold);background:rgba(245,200,66,.08)}

@media (max-width:700px){
  body{padding:8px}
  .cell{min-height:90px}
  .cell .ico{font-size:22.4px}
  .cell .nm{font-size:8.8px}
  .row-pick{width:64px}
  .col-picks{padding-left:70px}
  .meters{gap:9px}
  .meter{min-width:52px}
  .scorebox{font-size:26px}
}
@media (max-width:440px){
  .cell{min-height:82px}
  .cell .ico{font-size:20.3px}
  .cell .nm{display:none}
  .cells{gap:4px}
  .row{gap:4px}
}
</style>
</head>
<body>

<div class="wrap">

  <div class="topbar">
    <div class="round-info">
      <div class="round-name" id="roundName">RONDA 1</div>
      <div class="round-vs" id="roundVs">—</div>
    </div>
    <div class="scorebox"><span id="gU">0</span><span class="vs">—</span><span id="gC">0</span></div>
    <div class="meters">
      <div class="meter">
        <div class="meter-label">AGUANTE</div>
        <div class="hearts" id="hearts"></div>
      </div>
      <div class="meter">
        <div class="meter-label">RELOJ</div>
        <div class="meter-val" id="reloj">8</div>
      </div>
      <div class="meter">
        <div class="meter-label">RACHA</div>
        <div class="racha-track" id="racha"></div>
      </div>
      <div class="meter">
        <div class="meter-label">DINERO</div>
        <div class="meter-val" id="dinero" style="color:var(--coin)">0</div>
      </div>
    </div>
  </div>

  <div class="statbar">
    <div class="stat atk">
      <span class="n" id="atk">2</span>
      <span class="stat-txt">ATAQUE<br>vs. DEFENSORES Y ARQUEROS</span>
    </div>
    <div class="stat def">
      <span class="n" id="def">1</span>
      <span class="stat-txt">DEFENSA<br>vs. DELANTEROS RIVALES</span>
    </div>
  </div>

  <div class="board-hint">
    <span id="hint">Elegí una FILA. El azar decide qué casilla te toca.</span>
    <span id="cards"></span>
  </div>

  <div class="board" id="board"></div>
  <div class="col-picks" id="colPicks" style="display:none"></div>

  <div class="items">
    <span class="items-label">ÍTEMS</span>
    <div id="itemBar" style="display:flex;gap:7px;flex-wrap:wrap"></div>
  </div>

  <div class="log" id="log"></div>
</div>

<div class="overlay open" id="overlay"><div class="card" id="card"></div></div>

<script>
/* ==========================================================================
   FÚTBOL CESTO — v1
   Sistema tipo Sol Cesto aplicado a un campeonato de fútbol.
   Elegís una FILA, el azar sortea la casilla, se comparan tus stats.
   ========================================================================== */

/* ---------------- catálogo de casillas ---------------- */
// stat: 'atk' se compara contra tu ataque, 'def' contra tu defensa, null = sin duelo
const TYPES = {
  defensor:  { ico:'🧱', nm:'DEFENSOR',   stat:'atk' },
  arquero:   { ico:'🥅', nm:'ARQUERO',    stat:'atk' },
  medio:     { ico:'🌀', nm:'MEDIOCAMPO', stat:'def' },
  delantero: { ico:'👟', nm:'DELANTERO',  stat:'def' },
  jugada:    { ico:'⚽', nm:'JUGADA CLARA' },
  pasegol:   { ico:'🤝', nm:'PASE GOL' },
  penal:     { ico:'🎯', nm:'PENAL' },
  penalC:    { ico:'💀', nm:'PENAL EN CONTRA' },
  libre:     { ico:'🚧', nm:'TIRO LIBRE' },
  corner:    { ico:'🚩', nm:'CÓRNER' },
  hinchada:  { ico:'📣', nm:'HINCHADA' },
  bidon:     { ico:'💧', nm:'BIDÓN' },
  fama:      { ico:'🌟', nm:'FAMA' },
  publicidad:{ ico:'🪧', nm:'PUBLICIDAD' },
  sponsor:   { ico:'💰', nm:'SPONSOR' },
  banco:     { ico:'🪑', nm:'SUPLENTES' },
  amarilla:  { ico:'🟨', nm:'AMARILLA' },
  roja:      { ico:'🟥', nm:'ROJA' },
  calambre:  { ico:'🦵', nm:'CALAMBRE' },
  lesion:    { ico:'🩹', nm:'LESIÓN' },
  offside:   { ico:'🚫', nm:'OFFSIDE' },
  varCell:   { ico:'📺', nm:'VAR' },
  autogol:   { ico:'🎁', nm:'AUTOGOL RIVAL' }
};


/* ---------------- el campeonato ---------------- */
const RONDAS = [
  { name:'TREINTAIDOSAVOS', rival:'DEPORTIVO BARRIAL', reloj:8, lvl:1, premio:18 },
  { name:'OCTAVOS',         rival:'ATLÉTICO DEL SUR',  reloj:8, lvl:2, premio:24 },
  { name:'CUARTOS',         rival:'RACING DEL PUERTO', reloj:9, lvl:3, premio:32 },
  { name:'SEMIFINAL',       rival:'UNIÓN FERROVIARIA', reloj:9, lvl:4, premio:42 },
  { name:'LA FINAL',        rival:'CLUB IMPERIAL',     reloj:10, lvl:5, premio:60 }
];

// pools por nivel: [tipo, peso, valorMin, valorMax]
const POOLS = {
  1:[['defensor',9,2,3],['arquero',4,3,3],['medio',5,1,2],['delantero',4,1,2],
     ['jugada',3],['pasegol',3],['corner',3],
     ['hinchada',3],['bidon',3],['calambre',3],
     ['fama',5],['publicidad',3],['offside',2]],
  2:[['defensor',9,2,3],['arquero',4,3,4],['medio',5,2,2],['delantero',5,2,3],
     ['jugada',2],['pasegol',3],['corner',3],['libre',3],['penal',2],['penalC',2],
     ['hinchada',3],['bidon',3],['calambre',3],['lesion',2],
     ['fama',5],['publicidad',3],['amarilla',3],['offside',2]],
  3:[['defensor',9,3,4],['arquero',4,4,4],['medio',5,2,3],['delantero',6,2,3],
     ['jugada',2],['pasegol',2],['corner',2],['libre',3],['penal',2],['penalC',3],
     ['hinchada',3],['bidon',3],['calambre',3],['lesion',3],['banco',2],
     ['fama',4],['publicidad',3],['sponsor',2],
     ['amarilla',3],['roja',1],['varCell',2],['offside',2]],
  4:[['defensor',9,3,4],['arquero',4,4,5],['medio',5,3,3],['delantero',7,3,4],
     ['jugada',2],['pasegol',2],['corner',2],['libre',3],['penal',2],['penalC',3],
     ['hinchada',3],['bidon',3],['calambre',4],['lesion',3],['banco',2],
     ['fama',4],['publicidad',3],['sponsor',2],
     ['amarilla',3],['roja',1],['varCell',2],['autogol',1],['offside',2]],
  5:[['defensor',9,4,5],['arquero',4,5,5],['medio',5,3,4],['delantero',8,3,5],
     ['jugada',2],['pasegol',2],['corner',2],['libre',3],['penal',2],['penalC',4],
     ['hinchada',3],['bidon',3],['calambre',4],['lesion',4],['banco',2],
     ['fama',3],['publicidad',3],['sponsor',3],
     ['amarilla',3],['roja',1],['varCell',2],['autogol',1],['offside',2]]
};


/* ---------------- ítems ---------------- */
const ITEMS = {
  bidon:       { ico:'💧', nm:'BIDÓN',         desc:'Recuperás 1 de aguante.',                     price:8 },
  falta:       { ico:'✋', nm:'FALTA TÁCTICA', desc:'Borrás del tablero la casilla que elijas.',   price:14 },
  cambio:      { ico:'🔄', nm:'CAMBIO',        desc:'+2 de aguante y te limpia las amarillas.',    price:16 },
  grito:       { ico:'📢', nm:'GRITO DEL DT',  desc:'Suma 2 de racha al instante.',                price:12 }
};

/* ---------------- estado ---------------- */
const G = {
  club:'TU CLUB',
  ronda:0,
  dinero:0,
  atk:2, def:1,
  aguanteMax:5,
  items:{ bidon:1, falta:1 },
  fichajes:0,
  // partido
  grid:[], aguante:5, gU:0, gC:0, reloj:8, racha:0, rachaMax:4,
  amarillas:0,
  busy:false, targeting:false, armed:null, phase:'menu',
};

/* ---------------- utilidades ---------------- */
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random()*n);
const chance = p => Math.random() < p;
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const wait = ms => new Promise(r => setTimeout(r,ms));
const ATK = () => G.atk;
const DEF = () => G.def;

function say(text, cls){
  const p = document.createElement('p');
  if(cls) p.className = cls;
  p.textContent = text;
  $('log').appendChild(p);
  $('log').scrollTop = $('log').scrollHeight;
}

function pick(pool){
  const total = pool.reduce((s,e) => s + e[1], 0);
  let r = Math.random() * total;
  for(const e of pool){ r -= e[1]; if(r <= 0) return e; }
  return pool[0];
}

/* Los rivales se ajustan a lo que fichaste.
   Si subiste el ataque, los defensores y arqueros suben con vos; si subiste la
   defensa, suben los delanteros y mediocampistas. Pero suben a la MITAD de tu
   ritmo (ESCALA_RIVAL), así que fichar siempre te deja mejor parado que antes:
   te acerca al rival sin volverlo un trámite. */
const BASE_ATK = 2, BASE_DEF = 1;
const ESCALA_RIVAL = 0.5;
const escalada = stat => Math.floor(Math.max(0, stat) * ESCALA_RIVAL);

function makeCell(lvl){
  const e = pick(POOLS[lvl]);
  const cell = { type:e[0] };
  if(e.length > 2){
    let v = e[2] + rnd(e[3] - e[2] + 1);
    const stat = TYPES[e[0]].stat;
    if(stat === 'atk')      v += escalada(G.atk - BASE_ATK);
    else if(stat === 'def') v += escalada(G.def - BASE_DEF);
    cell.val = v;
  }
  return cell;
}

function buildGrid(lvl){
  const grid = [];
  for(let r=0;r<4;r++){
    const row = [];
    for(let c=0;c<4;c++) row.push(makeCell(lvl));
    grid.push(row);
  }
  // como mucho UNA roja por tablero: las de más se convierten en amarillas
  let rojas = 0;
  for(let r=0;r<4;r++) for(let c=0;c<4;c++){
    if(grid[r][c].type !== 'roja') continue;
    if(++rojas > 1) grid[r][c] = { type:'amarilla' };
  }

  // garantía de jugabilidad: al menos 4 casillas que no te lastimen
  const isSafe = cell => predict(cell).tone !== 'bad';
  let safe = grid.flat().filter(isSafe).length;
  let guard = 0;
  while(safe < 4 && guard++ < 60){
    const r = rnd(4), c = rnd(4);
    if(isSafe(grid[r][c])) continue;
    grid[r][c] = { type: chance(.5) ? 'hinchada' : 'fama' };
    safe++;
  }
  return grid;
}

/* ---------------- predicción del resultado ----------------
   Esto es el corazón de la interfaz: el jugador ve QUÉ le haría cada casilla
   antes de elegir la fila. La suerte está en cuál te toca, no en qué hace.  */
function predict(cell){
  if(!cell) return { label:'', tone:'neutral' };
  const t = cell.type;
  if(t === 'defensor')  return ATK() >= cell.val ? { label:'PASA',  tone:'good' } : { label:'-1 ❤', tone:'bad' };
  if(t === 'arquero')   return ATK() >= cell.val ? { label:'GOL',   tone:'good' } : { label:'-1 ❤', tone:'bad' };
  if(t === 'medio')     return DEF() >= cell.val ? { label:'ROBO',  tone:'good' } : { label:'-1 ❤', tone:'bad' };
  if(t === 'delantero') return DEF() >= cell.val ? { label:'CORTE', tone:'good' } : { label:'GOL RIVAL', tone:'bad' };
  if(t === 'jugada')    return { label:'GOL',    tone:'good' };
  if(t === 'autogol')   return { label:'GOL',    tone:'good' };
  if(t === 'penal')     return { label:'50% GOL',tone:'risk' };
  if(t === 'pasegol')   return { label:'35% GOL',tone:'risk' };
  if(t === 'libre')     return { label:'30% GOL',tone:'risk' };
  if(t === 'corner')    return { label:'35% GOL',tone:'risk' };
  if(t === 'penalC')    return { label:'50% RIVAL', tone:'bad' };
  if(t === 'hinchada')  return { label:'+1 ❤',   tone:'good' };
  if(t === 'bidon')     return { label:'+1 ❤',   tone:'good' };
  if(t === 'banco')     return { label:'+2 ❤',   tone:'good' };
  if(t === 'calambre')  return { label:'-1 ❤',   tone:'bad' };
  if(t === 'fama')      return { label:'+ 🪙',   tone:'coin' };
  if(t === 'publicidad')return { label:'++ 🪙',  tone:'coin' };
  if(t === 'sponsor')   return { label:'+++ 🪙', tone:'coin' };
  if(t === 'amarilla')  return G.amarillas >= 1 ? { label:'¡ROJA! -3 ❤', tone:'bad' } : { label:'-1 ❤', tone:'risk' };
  if(t === 'roja')      return { label:'-3 ❤', tone:'bad' };
  if(t === 'lesion')    return { label:'-2 ❤', tone:'bad' };
  if(t === 'offside')   return { label:'NADA',   tone:'neutral' };
  if(t === 'varCell')   return { label:'REPITE', tone:'neutral' };
  return { label:'', tone:'neutral' };
}

/* ---------------- render ---------------- */
function render(){
  const R = RONDAS[G.ronda];
  $('roundName').textContent = R.name;
  $('roundVs').textContent = G.club + '  vs  ' + R.rival;
  $('gU').textContent = G.gU;
  $('gC').textContent = G.gC;
  $('reloj').textContent = G.reloj;
  $('dinero').textContent = G.dinero;

  $('atk').textContent = ATK();
  $('def').textContent = DEF();

  let h = '';
  for(let i=0;i<G.aguanteMax;i++) h += '<span class="' + (i < G.aguante ? 'heart-on' : 'heart-off') + '">❤</span>';
  $('hearts').innerHTML = h;

  let rr = '';
  for(let i=0;i<G.rachaMax;i++) rr += '<div class="rp' + (i < G.racha ? ' on' : '') + '"></div>';
  $('racha').innerHTML = rr;

  $('cards').innerHTML = G.amarillas > 0 ? '🟨'.repeat(G.amarillas) + ' AMARILLA' + (G.amarillas>1?'S':'') : '';

  renderBoard();
  renderItems();
}

function renderBoard(){
  const board = $('board');
  board.innerHTML = '';

  G.grid.forEach((row, r) => {
    const alive = row.filter(Boolean).length;
    const rowEl = document.createElement('div');
    rowEl.className = 'row';
    const usable = alive > 0 && !G.busy && !G.targeting;

    const pickBtn = document.createElement('button');
    pickBtn.className = 'row-pick';
    pickBtn.disabled = !usable;
    pickBtn.innerHTML = '<span class="pk">FILA ' + (r+1) + '</span>' +
                        '<span class="pc">' + (alive ? Math.round(100/alive) + '%' : '—') + '</span>';
    rowEl.appendChild(pickBtn);

    const cells = document.createElement('div');
    cells.className = 'cells';
    row.forEach((cell, c) => cells.appendChild(makeCellEl(cell, r, c)));
    rowEl.appendChild(cells);

    // toda la fila se resalta y se elige: el botón y las casillas por igual
    if(usable){
      rowEl.onmouseenter = () => { if(!G.armed) rowEl.classList.add('hl'); };
      rowEl.onmouseleave = () => { if(!isArmed('row', r)) rowEl.classList.remove('hl'); };
      rowEl.onclick = () => tapLine('row', r);
      rowEl.style.cursor = 'pointer';
    }
    if(isArmed('row', r)) rowEl.classList.add('hl');

    board.appendChild(rowEl);
  });

  // selección por columna: solo con la racha llena
  const colBar = $('colPicks');
  const rachaReady = G.racha >= G.rachaMax;
  colBar.style.display = rachaReady ? 'flex' : 'none';
  if(rachaReady){
    colBar.innerHTML = '';
    for(let c=0;c<4;c++){
      const alive = G.grid.filter(row => row[c]).length;
      const usable = alive > 0 && !G.busy && !G.targeting;
      const b = document.createElement('button');
      b.className = 'col-pick';
      b.disabled = !usable;
      b.textContent = '☀ COLUMNA ' + (c+1) + (alive ? ' · ' + Math.round(100/alive) + '%' : '');
      b.onmouseenter = () => { if(usable && !G.armed) markCol(c, true); };
      b.onmouseleave = () => { if(!isArmed('col', c)) markCol(c, false); };
      b.onclick = () => tapLine('col', c);
      colBar.appendChild(b);
    }
  }
  if(G.armed && G.armed.kind === 'col') markCol(G.armed.idx, true);
}

/* Con el dedo no hay hover, así que la selección es en dos tiempos: el primer
   toque resalta la línea entera, el segundo la confirma. Con mouse el click
   elige directo — obligar a dos clicks ahí sería una molestia.

   No preguntamos "¿es un celular?" sino "¿con qué me acaban de tocar?": el
   media query de hover miente en tablets, en notebooks con pantalla táctil y
   en los emuladores. El pointerType del evento real nunca se equivoca. */
let ULTIMO_PUNTERO = 'mouse';
document.addEventListener('pointerdown', e => {
  ULTIMO_PUNTERO = e.pointerType || 'mouse';
}, true);

function isArmed(kind, idx){
  return !!G.armed && G.armed.kind === kind && G.armed.idx === idx;
}

function tapLine(kind, idx){
  if(G.busy || G.targeting) return;
  const conDedo = ULTIMO_PUNTERO === 'touch' || ULTIMO_PUNTERO === 'pen';
  if(!conDedo || isArmed(kind, idx)){
    G.armed = null;
    return chooseLine(kind, idx);
  }
  G.armed = { kind, idx };
  $('hint').innerHTML = 'Tocá otra vez ' + (kind === 'row' ? 'la fila ' : 'la columna ') +
                        (idx + 1) + ' para <b>confirmar</b>.';
  render();
}

function makeCellEl(cell, r, c){
  const el = document.createElement('div');
  el.className = 'cell';
  el.dataset.r = r; el.dataset.c = c;
  if(!cell){ el.classList.add('empty'); return el; }

  const T = TYPES[cell.type];
  const p = predict(cell);
  el.innerHTML =
    '<div class="out ' + p.tone + '">' + p.label + '</div>' +
    (cell.val ? '<div class="val ' + (T.stat === 'atk' ? 'r' : 'b') + '">' + cell.val + '</div>' : '') +
    '<div class="ico">' + T.ico + '</div>' +
    '<div class="nm">' + T.nm + '</div>';

  if(G.targeting){
    el.classList.add('target');
    el.onclick = () => useFaltaOn(r, c);
  }
  return el;
}

function markCol(c, on){
  document.querySelectorAll('.cell').forEach(el => {
    if(Number(el.dataset.c) === c) el.classList.toggle('colhl', on);
  });
}

function renderItems(){
  const bar = $('itemBar');
  bar.innerHTML = '';
  const owned = Object.keys(G.items).filter(k => G.items[k] > 0);
  if(!owned.length){
    bar.innerHTML = '<span class="no-items">sin ítems — comprá en el mercado de pases</span>';
    return;
  }
  owned.forEach(k => {
    const I = ITEMS[k];
    const b = document.createElement('button');
    b.className = 'item';
    b.disabled = G.busy || G.targeting || G.phase !== 'match';
    b.title = I.desc;
    b.innerHTML = '<span class="ii">' + I.ico + '</span>' + I.nm + ' <span class="iq">x' + G.items[k] + '</span>';
    b.onclick = () => useItem(k);
    bar.appendChild(b);
  });
}

/* ---------------- ítems en partido ---------------- */
function useItem(k){
  if(G.busy || G.targeting) return;
  if(k === 'falta'){
    G.targeting = true;
    $('hint').innerHTML = '<b>FALTA TÁCTICA:</b> tocá la casilla que querés borrar del tablero.';
    render();
    return;
  }
  G.items[k]--;
  if(G.items[k] <= 0) delete G.items[k];

  if(k === 'bidon'){
    G.aguante = clamp(G.aguante + 1, 0, G.aguanteMax);
    say('💧 Bidón: el equipo recupera aire. +1 aguante.', 'good');
  } else if(k === 'cambio'){
    G.aguante = clamp(G.aguante + 2, 0, G.aguanteMax);
    G.amarillas = 0;
    say('🔄 Doble cambio: entran piernas frescas. +2 aguante y se limpian las amarillas.', 'good');
  } else if(k === 'grito'){
    G.racha = clamp(G.racha + 2, 0, G.rachaMax);
    say('📢 El DT grita desde la línea. +2 de racha.', 'good');
  }
  render();
}

function useFaltaOn(r, c){
  if(!G.grid[r][c]) return;
  const nm = TYPES[G.grid[r][c].type].nm;
  G.grid[r][c] = null;
  G.items.falta--;
  if(G.items.falta <= 0) delete G.items.falta;
  G.targeting = false;
  $('hint').textContent = 'Elegí una FILA. El azar decide qué casilla te toca.';
  say('✋ Falta táctica sobre ' + nm + '. Fuera del tablero — suben las chances del resto de la fila.', 'good');
  render();
}

/* ---------------- elegir línea ---------------- */
async function chooseLine(kind, idx){
  if(G.busy || G.targeting) return;
  G.armed = null;
  $('hint').textContent = 'Elegí una FILA. El azar decide qué casilla te toca.';
  G.busy = true;

  let coords = [];
  if(kind === 'row'){
    G.grid[idx].forEach((cell, c) => { if(cell) coords.push([idx, c]); });
  } else {
    G.grid.forEach((row, r) => { if(row[idx]) coords.push([r, idx]); });
    G.racha = 0;   // usar la columna consume la racha entera
    say('☀ Usás la racha para atacar por la columna ' + (idx+1) + '.', 'big');
  }
  if(!coords.length){ G.busy = false; return; }

  const [r, c] = coords[rnd(coords.length)];
  render();
  await resolveCell(r, c, kind === 'row' ? idx : null);

  G.reloj--;
  render();
  await wait(400);

  if(G.reloj <= 0){ G.busy = false; return endMatch(); }
  G.busy = false;
  render();
}

/* ---------------- resolver casilla ---------------- */
async function resolveCell(r, c, rowIdx){
  const cell = G.grid[r][c];
  if(!cell) return;
  const T = TYPES[cell.type];
  const golesAntes = G.gU + G.gC;   // para darle aire al cartel si hubo gol

  const el = document.querySelector('.cell[data-r="' + r + '"][data-c="' + c + '"]');
  if(el) el.classList.add('hit');
  await wait(430);

  G.grid[r][c] = null;   // la casilla se consume y sube el % de las que quedan
  const t = cell.type;

  if(t === 'defensor'){
    if(ATK() >= cell.val){ winDuel('🧱 Le ganás el cuerpo al defensor (' + ATK() + ' vs ' + cell.val + ').'); }
    else { hurt('🧱 El defensor te come el mano a mano (' + ATK() + ' vs ' + cell.val + ').'); }
  }
  else if(t === 'arquero'){
    if(ATK() >= cell.val){ scoreU('🥅 Le ganás al arquero (' + ATK() + ' vs ' + cell.val + ').'); }
    else { hurt('🥅 Atajadón. Te lo saca abajo (' + ATK() + ' vs ' + cell.val + ').'); }
  }
  else if(t === 'medio'){
    if(DEF() >= cell.val){ winDuel('🌀 Le robás la pelota en el medio (' + DEF() + ' vs ' + cell.val + ').'); }
    else { hurt('🌀 Te ganan la mitad de la cancha (' + DEF() + ' vs ' + cell.val + ').'); }
  }
  else if(t === 'delantero'){
    if(DEF() >= cell.val){ winDuel('👟 Cortás el ataque antes del área (' + DEF() + ' vs ' + cell.val + ').'); }
    else { scoreC('👟 El delantero te gana la espalda y define (' + DEF() + ' vs ' + cell.val + ').'); }
  }
  else if(t === 'jugada')  scoreU('⚽ Jugada de toda la cancha. Entra sola.');
  else if(t === 'autogol') scoreU('🎁 El zaguero rival se la manda a su propio arco.');
  else if(t === 'penal'){
    if(chance(.50)) scoreU('🎯 Penal. Le cambiás el palo al arquero.');
    else say('🎯 Penal errado. Se te fue arriba del travesaño.', 'bad');
  }
  else if(t === 'pasegol'){
    if(chance(.35)) scoreU('🤝 Pase gol: se la dejan servida y la empuja.');
    else say('🤝 Le dan el pase gol pero la manda afuera.', 'bad');
  }
  else if(t === 'libre'){
    if(chance(.30)) scoreU('🚧 Tiro libre al ángulo. Impecable.');
    else say('🚧 El tiro libre se estrella en la barrera.', 'bad');
  }
  else if(t === 'corner'){
    if(chance(.35)) scoreU('🚩 Córner, cabezazo y adentro.');
    else { G.racha = clamp(G.racha + 1, 0, G.rachaMax); say('🚩 El córner se pierde, pero el equipo se prende. +1 racha.'); }
  }
  else if(t === 'penalC'){
    if(chance(.50)) scoreC('💀 Penal en contra. No la puede sacar tu arquero.');
    else say('💀 ¡Penal atajado! Tu arquero adivina el palo.', 'good');
  }
  else if(t === 'hinchada'){
    G.aguante = clamp(G.aguante + 1, 0, G.aguanteMax);
    say('📣 La hinchada empuja desde la popular. +1 aguante.', 'good');
  }
  else if(t === 'bidon'){
    G.aguante = clamp(G.aguante + 1, 0, G.aguanteMax);
    say('💧 Pausa de hidratación. +1 aguante.', 'good');
  }
  else if(t === 'calambre'){
    hurt('🦵 Calambre. Se queda duro en el círculo central.');
  }
  else if(t === 'banco'){
    G.aguante = clamp(G.aguante + 2, 0, G.aguanteMax);
    G.amarillas = 0;
    say('🪑 Entran los suplentes. +2 aguante y se limpian las amarillas.', 'good');
  }
  else if(t === 'fama'){
    const m = 4 + rnd(6);
    G.dinero += m;
    say('🌟 El equipo suena en todos lados. Fama: +' + m + '.', 'coin');
  }
  else if(t === 'publicidad'){
    const m = 8 + rnd(7);
    G.dinero += m;
    say('🪧 Cartel nuevo en la platea. Publicidad: +' + m + '.', 'coin');
  }
  else if(t === 'sponsor'){
    const m = 14 + rnd(10);
    G.dinero += m;
    say('💰 El sponsor afloja la billetera: +' + m + '.', 'coin');
  }
  else if(t === 'amarilla'){
    G.amarillas++;
    if(G.amarillas >= 2){
      say('🟨🟨 Segunda amarilla.', 'bad');
      G.amarillas = 0;
      expulsion();
    } else {
      hurt('🟨 Amarilla. Hay que bajar un cambio para no arriesgar la segunda.');
    }
  }
  else if(t === 'roja'){ say('🟥 Roja directa.', 'bad'); expulsion(); }
  else if(t === 'lesion'){
    hurt('🩹 Se te lesiona un titular y sale en camilla.', 2);
  }
  else if(t === 'offside') say('🚫 Offside. Jugada anulada, se te fue el tiempo.');
  else if(t === 'varCell'){
    say('📺 Revisa el VAR... se repite la jugada.');
    await wait(500);
    const pool = [];
    if(rowIdx !== null) G.grid[rowIdx].forEach((cc, ci) => { if(cc) pool.push([rowIdx, ci]); });
    else G.grid.forEach((row, ri) => row.forEach((cc, ci) => { if(cc) pool.push([ri, ci]); }));
    if(pool.length){
      render();
      const [nr, nc] = pool[rnd(pool.length)];
      await resolveCell(nr, nc, rowIdx);
      return;
    }
  }

  render();
  await wait(G.gU + G.gC > golesAntes ? 1150 : 280);
}

function winDuel(msg){
  G.racha = clamp(G.racha + 1, 0, G.rachaMax);
  say(msg + ' +1 racha.', 'good');
  if(G.racha >= G.rachaMax) say('☀ ¡RACHA LLENA! Ya podés atacar por columna.', 'big');
}

function hurt(msg, amount){
  const n = amount || 1;
  if(msg) say(msg + ' -' + n + ' aguante.', 'bad');
  for(let i=0;i<n;i++){
    G.aguante--;
    if(G.aguante <= 0){
      // el aguante no es game over: es cuánto podés resistir antes de que te la metan
      G.aguanteMax = Math.max(1, G.aguanteMax - 1);
      G.aguante = G.aguanteMax;
      G.gC++;
      flashGol('contra');
      say('😮‍💨 Se te termina el aguante y te la meten. GOL EN CONTRA. El equipo se funde: aguante máximo ' + G.aguanteMax + '.', 'big');
    }
  }
}

/* Cartel de gol: los dos casos tienen que ser imposibles de confundir, así que
   cambian el texto, el color y el borde — no solo el marcador. */
function flashGol(tipo){
  const wrap = document.createElement('div');
  wrap.className = 'gol-flash';
  wrap.innerHTML =
    '<div class="gf ' + tipo + '">' +
      '<div class="t">' + (tipo === 'favor' ? '¡GOL!' : 'GOL RIVAL') + '</div>' +
      '<div class="s">' + (tipo === 'favor' ? 'A FAVOR' : 'CONVIRTIÓ EL RIVAL') +
        ' &nbsp;·&nbsp; ' + G.gU + ' - ' + G.gC + '</div>' +
    '</div>';
  document.body.appendChild(wrap);
  setTimeout(() => wrap.remove(), 1500);
}

function scoreU(msg){ G.gU++; flashGol('favor');  say(msg + ' ¡GOL! ' + G.gU + '-' + G.gC, 'big'); }
function scoreC(msg){ G.gC++; flashGol('contra'); say(msg + ' Gol del rival. ' + G.gU + '-' + G.gC, 'big'); }

function expulsion(){
  hurt('Te quedás con uno menos y el equipo se rompe corriendo por el que falta.', 3);
}

/* ---------------- fin del partido ---------------- */
async function endMatch(){
  G.phase = 'result';
  say('📣 Pitazo final: ' + G.gU + '-' + G.gC, 'big');
  render();
  await wait(500);

  if(G.gU === G.gC){ return penalShootout(); }
  if(G.gU > G.gC) return matchWon();
  return matchLost();
}

async function penalShootout(){
  say('Empate. Se define por penales.', 'big');
  let u = 0, c = 0;
  for(let i=0;i<5;i++){
    if(chance(.5)) u++;
    if(chance(.5)) c++;
  }
  while(u === c){
    const a = chance(.5), b = chance(.5);
    if(a) u++;
    if(b) c++;
  }
  say('Tanda de penales: ' + u + '-' + c, 'big');
  await wait(400);
  return u > c ? matchWon(true) : matchLost(true);
}

function matchWon(byPens){
  const R = RONDAS[G.ronda];
  G.dinero += R.premio;
  G.phase = 'won';
  const last = G.ronda === RONDAS.length - 1;

  if(last){
    openCard(
      '<div class="tag">CAMPEÓN</div>' +
      '<h1>GANASTE<br><em>LA COPA</em></h1>' +
      bracketHTML(RONDAS.length) +
      '<p>Le ganaste la final a ' + R.rival + ' por ' + G.gU + '-' + G.gC +
      (byPens ? ' en los penales' : '') + '. Cinco rondas, un solo equipo.</p>' +
      '<div class="wallet">🪙 ' + G.dinero + '</div>' +
      '<button class="cta" id="againBtn">JUGAR OTRO CAMPEONATO</button>'
    );
    $('againBtn').onclick = () => { closeCard(); newRun(); };
    return;
  }

  openCard(
    '<div class="tag">' + R.name + '</div>' +
    '<h1>PASASTE<br><em>DE RONDA</em></h1>' +
    bracketHTML(G.ronda + 1) +
    '<p>Le ganaste a ' + R.rival + ' por ' + G.gU + '-' + G.gC +
    (byPens ? ' en los penales' : '') + '. Premio: <b style="color:var(--coin)">🪙 ' + R.premio + '</b></p>' +
    '<button class="cta" id="shopBtn">IR AL MERCADO DE PASES</button>'
  );
  $('shopBtn').onclick = () => showMarket();
}

function matchLost(byPens){
  const R = RONDAS[G.ronda];
  G.phase = 'lost';
  openCard(
    '<div class="tag">ELIMINADO</div>' +
    '<h1>SE TERMINÓ<br><em>LA COPA</em></h1>' +
    bracketHTML(G.ronda) +
    '<p>' + R.rival + ' te eliminó por ' + G.gC + '-' + G.gU +
    (byPens ? ' en los penales' : '') + ' en ' + R.name + '.</p>' +
    '<p>Llegaste a la ronda ' + (G.ronda + 1) + ' de ' + RONDAS.length +
    ' con ataque ' + G.atk + ' y defensa ' + G.def + '.</p>' +
    '<button class="cta" id="retryBtn">EMPEZAR DE NUEVO</button>'
  );
  $('retryBtn').onclick = () => { closeCard(); newRun(); };
}

function bracketHTML(done){
  return '<div class="bracket">' + RONDAS.map((r,i) =>
    '<span class="bstep ' + (i < done ? 'done' : i === done ? 'now' : '') + '">' + r.name + '</span>'
  ).join('') + '</div>';
}

/* ---------------- mercado de pases ---------------- */
function fichajePrice(){ return 14 + G.fichajes * 9; }

function showMarket(){
  G.phase = 'market';
  const priceF = fichajePrice();
  const curable = G.aguanteMax < 5;

  let html =
    '<div class="tag">MERCADO DE PASES</div>' +
    '<h1>REFUERZOS</h1>' +
    '<p>Gastá ahora o guardá para más adelante. Los fichajes suben de precio cada vez.</p>' +
    '<p style="color:var(--gold)">Ojo: los rivales se acomodan a tu plantel. Por cada 2 puntos que fichás en un stat, las casillas de ese color suben 1. Fichar te deja mejor, pero no te regala el partido.</p>' +
    '<div class="wallet">🪙 ' + G.dinero + '</div>' +
    '<div class="shop">';

  html += shopBtn('atk', '⚔ FICHAR DELANTERO', '+1 ATAQUE permanente. Te vuelve inmune a defensores y arqueros de ese valor.', priceF);
  html += shopBtn('def', '🛡 FICHAR DEFENSOR', '+1 DEFENSA permanente. Los delanteros rivales de ese valor dejan de convertirte.', priceF);
  if(curable) html += shopBtn('pretemp', '🏃 PRETEMPORADA', 'Recuperás 1 de aguante máximo perdido. Ahora tenés ' + G.aguanteMax + '.', 12);
  Object.keys(ITEMS).forEach(k => {
    const I = ITEMS[k];
    html += shopBtn('item:' + k, I.ico + ' ' + I.nm, I.desc, I.price);
  });

  html += '</div><button class="cta" id="nextBtn">JUGAR ' + RONDAS[G.ronda + 1].name + '</button>';
  openCard(html);

  document.querySelectorAll('.shop-item').forEach(b => {
    b.onclick = () => buy(b.dataset.buy);
  });
  $('nextBtn').onclick = () => { closeCard(); G.ronda++; startMatch(); };
}

function shopBtn(id, name, desc, price){
  const can = G.dinero >= price;
  return '<button class="shop-item" data-buy="' + id + '"' + (can ? '' : ' disabled') + '>' +
    '<span><span class="shop-name">' + name + '</span><span class="shop-desc">' + desc + '</span></span>' +
    '<span class="shop-price">🪙 ' + price + '</span></button>';
}

function buy(what){
  if(what === 'atk' || what === 'def'){
    const p = fichajePrice();
    if(G.dinero < p) return;
    G.dinero -= p;
    G.fichajes++;
    if(what === 'atk') G.atk++; else G.def++;
  } else if(what === 'pretemp'){
    if(G.dinero < 12) return;
    G.dinero -= 12;
    G.aguanteMax = Math.min(5, G.aguanteMax + 1);
  } else if(what.startsWith('item:')){
    const k = what.slice(5);
    if(G.dinero < ITEMS[k].price) return;
    G.dinero -= ITEMS[k].price;
    G.items[k] = (G.items[k] || 0) + 1;
  }
  showMarket();   // se redibuja con los precios y el saldo nuevos
}

/* ---------------- pantallas ---------------- */
function openCard(html){ $('card').innerHTML = html; $('overlay').classList.add('open'); }
function closeCard(){ $('overlay').classList.remove('open'); }

function showStart(){
  openCard(
    '<div class="tag">ESTRATEGIA + SUERTE</div>' +
    '<h1>FÚTBOL<br><em>CESTO</em></h1>' +
    '<p>Cinco partidos hasta la copa. No elegís la jugada: elegís la línea, y el azar decide cuál te toca. Pero ves todas las probabilidades antes de decidir.</p>' +
    '<input id="clubInput" maxlength="18" placeholder="NOMBRE DE TU CLUB">' +
    '<button class="cta" id="startBtn">EMPEZAR LA COPA</button>' +
    '<ul class="rules">' +
      '<li>Elegís una <b>FILA</b> y se sortea una de sus casillas. Cada casilla muestra qué te haría.</li>' +
      '<li>Tu <b>ATAQUE</b> (rojo) pelea contra defensores y arqueros. Tu <b>DEFENSA</b> (azul) contra los delanteros rivales.</li>' +
      '<li>La casilla usada <b>desaparece</b>: las que quedan en esa fila suben de probabilidad.</li>' +
      '<li>Cuando el <b>AGUANTE</b> llega a cero te hacen un gol y el equipo se funde un poco más.</li>' +
      '<li>Ganás duelos, cargás la <b>RACHA</b>. Llena, podés atacar por <b>COLUMNA</b>.</li>' +
      '<li>Perder un partido termina la corrida. Ganar te lleva al mercado de pases.</li>' +
    '</ul>'
  );
  $('startBtn').onclick = () => {
    const v = $('clubInput').value.trim().toUpperCase();
    G.club = v || 'TU CLUB';
    closeCard();
    newRun();
  };
  $('clubInput').addEventListener('keydown', e => { if(e.key === 'Enter') $('startBtn').click(); });
}

/* ---------------- arranque ---------------- */
function newRun(){
  G.ronda = 0;
  G.dinero = 0;
  G.atk = 2; G.def = 1;
  G.aguanteMax = 5;
  G.items = { bidon:1, falta:1 };
  G.fichajes = 0;
  $('log').innerHTML = '';
  startMatch();
}

function startMatch(){
  const R = RONDAS[G.ronda];
  G.grid = buildGrid(R.lvl);
  G.aguante = G.aguanteMax;
  G.gU = 0; G.gC = 0;
  G.reloj = R.reloj;
  G.racha = 0;
  G.amarillas = 0;
  G.busy = false; G.targeting = false; G.armed = null;
  G.phase = 'match';
  $('hint').textContent = 'Elegí una FILA. El azar decide qué casilla te toca.';
  say('— ' + R.name + ' — ' + G.club + ' vs ' + R.rival + ' —', 'big');
  render();
}

render();
showStart();
</script>
</body>
</html>
